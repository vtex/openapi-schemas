# This workflow is designed for the vtex/openapi-schemas repository.
# Copy this file to vtex/openapi-schemas/.github/workflows/index-openapi.yml

name: Index OpenAPI Endpoints

on:
  push:
    branches:
      - master
    paths:
      - '*.json'
  workflow_dispatch:
    inputs:
      full_reindex:
        description: 'Reindex all OpenAPI schemas'
        required: false
        default: false
        type: boolean

# One run at a time, in push order, so a delete can never overtake a later re-add.
concurrency:
  group: index-openapi
  cancel-in-progress: false

jobs:
  index-endpoints:
    # This file is a template kept in vtexdocs-mcp-app; only run it from the content repo.
    if: github.repository != 'vtexdocs/vtexdocs-mcp-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Compute changed files
        env:
          BEFORE: ${{ github.event.before }}
          FULL_REINDEX: ${{ inputs.full_reindex }}
        run: |
          set -euo pipefail
          to_json() { jq -R -s -c 'split("\n") | map(select(length > 0))'; }

          if [ "$FULL_REINDEX" = "true" ]; then
            find . -maxdepth 1 -type f -name 'VTEX - *.json' | sed 's|^\./||' | sort | to_json > .index-files.json
            echo '[]' > .index-deleted.json
            exit 0
          fi

          # Diff the whole push, not only its last commit. Fall back to the parent commit
          # when the pre-push commit is unavailable (new branch, force push).
          BASE=HEAD~1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            BASE=$BEFORE
          fi
          echo "Diffing $BASE..HEAD"

          # Root-level specs only: PostmanCollections/*.json are not OpenAPI specs.
          # --no-renames reports a rename as delete(old) + add(new), so the old file's
          # endpoints are removed.
          changed() { git -c core.quotepath=false diff --no-renames --name-only --diff-filter="$1" "$BASE" HEAD -- ':(glob)*.json'; }
          changed d | to_json > .index-files.json
          changed D | to_json > .index-deleted.json
          echo "To index: $(jq length .index-files.json), to delete: $(jq length .index-deleted.json)"

      - name: Update index
        env:
          INDEXING_URL: ${{ secrets.INDEXING_URL }}
          INTERNAL_ACCESS_KEY: ${{ secrets.INTERNAL_ACCESS_KEY }}
        run: |
          set -uo pipefail
          FAILED=0

          # $1 = body key (files|deleted), $2 = JSON array file, $3 = batch size
          run_batches() {
            local key=$1 list=$2 size=$3 total off batch payload resp code body batch_failed
            total=$(jq length "$list")
            [ "$total" = "0" ] && return
            echo "==> $key: $total file(s) in batches of $size"
            for ((off = 0; off < total; off += size)); do
              batch=$(jq -c ".[$off:$off + $size]" "$list")
              payload=$(jq -nc --argjson b "$batch" --arg key "$key" '{($key): $b}')
              resp=$(curl -sS -w '\n%{http_code}' --max-time 300 -X POST "$INDEXING_URL/api/index-openapi" \
                -H "Content-Type: application/json" \
                -H "X-Internal-Access-Key: $INTERNAL_ACCESS_KEY" \
                -d "$payload") || true
              code=$(echo "$resp" | tail -1)
              body=$(echo "$resp" | sed '$d')
              if [ "$code" != "200" ]; then
                echo "::error::$key batch at $off failed with HTTP $code: $body"
                FAILED=$((FAILED + $(echo "$batch" | jq length)))
                continue
              fi
              echo "$key batch at $off: $(echo "$body" | jq -c '{processed, failed, endpoints_indexed, endpoints_skipped, endpoints_deleted, duration_ms}')"
              batch_failed=$(echo "$body" | jq '.failed // 0')
              if [ "$batch_failed" != "0" ]; then
                echo "$body" | jq -r '.errors[] | "::error::\(.file): \(.error[0:500])"'
                FAILED=$((FAILED + batch_failed))
              fi
            done
          }

          run_batches deleted .index-deleted.json 100
          run_batches files .index-files.json 10

          if [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED file(s) failed"
            exit 1
          fi
