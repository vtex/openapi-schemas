info:
  name: Get data entity structure
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/:acronym"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/vnd.vtex.ds.v10+json
  params:
    - name: acronym
      value: SP
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/dataentities/:acronym - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/:acronym - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/:acronym - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/:acronym - Schema is valid", function () {
          const schema = {"title":"Data entity structure","required":["acronym","name","primaryKeyType","allowGetAll","fields"],"type":"object","description":"Data entity structure.","properties":{"acronym":{"title":"acronym","type":"string","description":"Two-letter string that identifies the data entity."},"name":{"title":"name","type":"string","description":"Data entity name."},"primaryKeyType":{"title":"primaryKeyType","type":"string","description":"Primary key type."},"allowGetAll":{"title":"allowGetAll","type":"boolean","description":"Defines if it will be allowed to retrieve all fields from documents from this data entity at once using the [Get document](https://developers.vtex.com/docs/api-reference/masterdata-api#get-/api/dataentities/-acronym-/documents/-id-) endpoint (`true`) or not (`false`)."},"fields":{"title":"fields","type":"array","description":"List of fields that documents from the given data entity have.","items":{"title":"Field","description":"Field information.","required":["name","type","displayName","isNullable","isSearchable","isFilter","isInternal"],"type":"object","properties":{"name":{"type":"string","description":"Field name."},"type":{"type":"string","description":"Field type."},"displayName":{"type":"string","description":"Field display name."},"isNullable":{"type":"boolean","description":"Defines whether the field is nullable (`true`) or not (`false`)."},"isSearchable":{"type":"boolean","description":"Defines whether the field is searchable (`true`) or not (`false`)."},"isFilter":{"type":"boolean","description":"Defines whether the field is a filter (`true`) or not (`false`)."},"isInternal":{"type":"boolean","description":"Defines whether the field is for internal use only (`true`) or not (`false`)."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns the data entity structure with its respective fields and data type. 

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |
  | Dynamic Storage | Data entity | **View data entity details** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `acronym` | path | (Required) Data entity acronym. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

