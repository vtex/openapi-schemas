info:
  name: Pause and resume service
  type: http
  seq: 8

http:
  method: POST
  url: https://:store_endpoint/pause-service
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{token}"
  params:
    - name: your_endpoint
      value: storeapi.com
      type: path
  body:
    type: json
    data: |-
      {
        "serviceId": "apknieot924892jaf-1231",
        "carrierId": "servientrega9234jaf",
        "settings": [
          {
            "label": "Cliente ID",
            "key": "clientId",
            "value": "HUR123"
          },
          {
            "label": "Cliente ID",
            "key": "clientId",
            "value": "HUR123"
          }
        ],
        "reason": "La dirección de entrega esta mal registrada",
        "metaData": {
          "myFieldCustom": "custom value"
        },
        "pause": false
      }

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/pause-service - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/pause-service - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/pause-service - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/pause-service - Schema is valid", function () {
          const schema = {"type":"object","required":["message","data"],"properties":{"message":{"type":"string","description":"Message of successful cancelation."},"data":{"type":"object","description":"Object containing service information.","required":["serviceId","carrierId","reason"],"properties":{"serviceId":{"type":"string","description":"Service ID."},"carrierId":{"type":"string","description":"Carrier ID."},"cancel":{"type":"boolean","description":"Condition that the service is paused (`false`) or not (`true`)."},"reason":{"type":"string","description":"Reason for the cancelation."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Pauses or resumes a paused service.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Authorization` | header | (Required) Authentication JWT. JSON Web Token (JWT) is an open standard (RFC 7519) that defines a compact and self-contained way for securely transmitting information as a JSON object between parties. |

  ## Example response (`200`)

  ```json
  {
    "message": "Service executed successfully",
    "data": {
      "serviceId": "apknieot924892jaf-1231",
      "carrierId": "servientrega9234jaf",
      "reason": "En el lugar de residencia no hay quien reciba el paquete",
      "cancel": false
    }
  }
  ```
