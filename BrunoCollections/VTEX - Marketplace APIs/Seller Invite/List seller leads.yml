info:
  name: List seller leads
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/seller-register/pvt/seller-leads?offset=0&limit=15&isConnected=&search=user email&status=invited&orderBy=id labore"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: offset
      value: "0"
      type: query
    - name: limit
      value: "15"
      type: query
    - name: isConnected
      value: ""
      type: query
    - name: search
      value: user email
      type: query
    - name: status
      value: invited
      type: query
    - name: orderBy
      value: id labore
      type: query
    - name: accountName
      value: apiexamples
      type: path
    - name: environment
      value: vtexcommercestable
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/seller-register/pvt/seller-leads - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This call's response includes a list of all sellers invited by the marketplace operator to join them. Retrieved results can be filtered by adding optional query fields to the request. Each seller listed includes the following information: 

  - `id` 

  - `createdAt` 

  - `status` 

  - `isConnected` 

  - `sellerEmail` 

  - `sellerName` 

  - `salesChannel` 

  - `email`

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Seller Register | Seller Administration | **View Seller** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | Seller manager | View Seller |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users or application keys usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using application keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | (Required) Name of the VTEX account that belongs to the marketplace. The notification will be posted into this account. |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `offset` | query | (Required) This field determines the limit used to retrieve the list of sellers. The response includes objects starting `from` the value inputted here. |
  | `limit` | query | (Required) This field determines the limit used to retrieve the list of sellers. The response includes objects until the value inputted here. |
  | `isConnected` | query | (Required) Query param that enables results to be filter by whether the seller lead is already connected to the marketplace or not. |
  | `search` | query | (Required) Custom search field, that filters sellers invited by specific marketplace operator's  email. |
  | `status` | query | (Required) Seller Lead's status. Includes `accepted`, `connected` or `invited`. |
  | `orderBy` | query | (Required) Query param determining how data will be ordered in the response, ordering by name or ID in descending our ascending order. Includes the following values: `namesort` = desc/asc `idsort` = desc/asc |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
