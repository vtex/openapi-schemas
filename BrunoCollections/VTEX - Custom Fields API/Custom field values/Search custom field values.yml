info:
  name: Search custom field values
  type: http
  seq: 5

http:
  method: GET
  url: '{{baseUrl}}/api/dataentities/customFieldValues/search?_schema=v1&_fields=_all&_where=contractId={{contractId}} AND customFieldId="{{customFieldId}}"'
  headers:
    - name: Accept
      value: application/json
  params:
    - name: _schema
      value: v1
      type: query
    - name: _fields
      value: _all
      type: query
    - name: _where
      value: contractId={{contractId}} AND customFieldId="{{customFieldId}}"
      type: query
    - name: _sort
      value: value ASC
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/dataentities/customFieldValues/search - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/customFieldValues/search - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/customFieldValues/search - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/customFieldValues/search - Schema is valid", function () {
          const schema = {"type":"array","description":"Array of custom field value objects matching the search criteria.","items":{"type":"object","description":"Custom field value search result object.","properties":{"id":{"type":"string","description":"The unique ID of the custom field value document."},"contractId":{"type":"string","description":"The ID of the contract associated with the custom field."},"customFieldId":{"type":"string","description":"The ID of the custom field (from `customFieldSettings`)."},"auxId":{"type":["string","null"],"description":"Optional auxiliary ID (e.g., address ID) used for fields with level `address`."},"value":{"type":"string","description":"The value stored in the custom field."},"description":{"type":["string","null"],"description":"Optional text describing what the value represents."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves custom field values filtered by contract ID, custom field ID, and optionally by specific value. Results can be sorted by value.

  You can use the `_where` query parameter to filter results:
  - To get all values: `_where=contractId={{contractId}} AND customFieldId="{{customFieldId}}"`
  - To get a specific value: `_where=contractId={{contractId}} AND customFieldId="{{customFieldId}}" AND value="{{value}}"`

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Dynamic Storage | Dynamic storage generic resources | **Read only documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Insert or update document (not remove)** |
  | Dynamic Storage | Dynamic storage generic resources | **Full access to all documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `_schema` | query | (Required) Schema version to use for the request. This query string defines which schema version to apply when retrieving data. Learn more about [Master Data schemas](https://developers.vtex.com/docs/guides/master-data-schema-lifecycle). |
  | `_fields` | query | (Required) Comma-separated list of field names to be returned in the response. Use `_all` to return all fields, or specify individual fields like `id,contractId,value`. Learn more about [searching documents in Master Data v2](https://developers.vtex.com/docs/guides/search-documents-in-master-data). |
  | `_where` | query | (Required) Filter expression to search documents using Master Data v2 query syntax. You can combine multiple conditions using `AND`. Examples: - Get all values for a contract: `contractId={{contractId}}` - Filter by contract and custom field: `contractId={{contractId}} AND customFieldId="{{customFieldId}}"` - Filter by specific value: `contractId={{contractId}} AND customFieldId="{{customFieldId}}" AND value="{{value}}"` Learn more about [searching documents in Master Data v2](https://developers.vtex.com/docs/guides/search-documents-in-master-data). |
  | `_sort` | query | Defines the field and order for sorting results. Use the pattern `{fieldName} {ASC\|DESC}`. For example, `value ASC` sorts results by the `value` field in ascending order. Learn more about [searching documents in Master Data v2](https://developers.vtex.com/docs/guides/search-documents-in-master-data). |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "id": "e5130781-32ed-11f0-b37f-942217c27f9b",
      "contractId": "1124b2d8-32eb-11f0-b37f-e2557e6b18d5",
      "customFieldId": "a7f2b3d4-5c6e-7f89-0123-456789abcdef",
      "auxId": null,
      "value": "CC1",
      "description": "Cost Center 1"
    },
    {
      "id": "f6240892-43fe-22f1-c48a-053328d28f0c",
      "contractId": "1124b2d8-32eb-11f0-b37f-e2557e6b18d5",
      "customFieldId": "a7f2b3d4-5c6e-7f89-0123-456789abcdef",
      "auxId": null,
      "value": "CC2",
      "description": "Cost Center 2"
    },
    {
      "id": "a7351903-54ff-33f2-d59b-164439e39g1d",
      "contractId": "1124b2d8-32eb-11f0-b37f-e2557e6b18d5",
      "customFieldId": "a7f2b3d4-5c6e-7f89-0123-456789abcdef",
      "auxId": null,
      "value": "CC3",
      "description": "Cost Center 3"
    }
  ]
  ```
