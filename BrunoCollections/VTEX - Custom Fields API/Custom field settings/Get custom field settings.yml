info:
  name: Get custom field settings
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/customFieldSettings/search?_schema=v1&_fields=_all&_where=contractId={{contractId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: _schema
      value: v1
      type: query
    - name: _fields
      value: _all
      type: query
    - name: _where
      value: contractId={{contractId}}
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/dataentities/customFieldSettings/search - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/customFieldSettings/search - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/customFieldSettings/search - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/customFieldSettings/search - Schema is valid", function () {
          const schema = {"type":"array","description":"Array of custom fields settings objects.","items":{"type":"object","description":"Custom fields settings object.","properties":{"id":{"type":"string","description":"Unique identifier of the custom field instance."},"dataEntityId":{"type":"string","description":"Identifier of the data entity to which the field belongs."},"accountId":{"type":"string","description":"Identifier of the account associated with the field."},"accountName":{"type":"string","description":"Name of the account associated with the field."},"followers":{"type":"array","description":"List of users following this field (usually empty).","items":{"type":"string","description":"User identifier."}},"schemas":{"type":"array","description":"List of applicable schema versions for this field.","items":{"type":"string","description":"Schema version."}},"contractId":{"type":"string","description":"Identifier of the contract associated with the field."},"name":{"type":"string","description":"Name of the custom fields."},"enabled":{"type":"boolean","description":"Indicates whether the field is enabled."},"required":{"type":"boolean","description":"Indicates whether the field is mandatory."},"level":{"type":"string","description":"Level at which the field is applied. Possible values: `item`, `order`, `address`."},"type":{"type":"string","description":"Type of the field. Possible values: `text`, `number`, `option`."},"additionalData":{"type":["string","null"],"description":"Additional field for extra information."},"createdBy":{"type":"string","description":"ID of the user who created the field."},"createdBy_USER":{"type":"object","description":"Details of the user who created the field.","properties":{"Id":{"type":"string","description":"Unique identifier of the user."},"Login":{"type":"string","description":"Login email of the user."},"Name":{"type":["string","null"],"description":"Name of the user."}}},"createdIn":{"type":"string","format":"date-time","description":"Date and time when the field was created (ISO 8601 format)."},"lastInteractionBy":{"type":"string","description":"ID of the user who last interacted with the field."},"lastInteractionBy_USER":{"type":"object","description":"Details of the user who last interacted with the field.","properties":{"Id":{"type":"string","description":"Unique identifier of the user."},"Login":{"type":"string","description":"Login email of the user."},"Name":{"type":["string","null"],"description":"Name of the user."}}},"lastInteractionIn":{"type":"string","format":"date-time","description":"Date and time of the last interaction with the field (ISO 8601 format)."},"tags":{"type":"array","description":"List of tags associated with the field (usually empty).","items":{"type":"string","description":"Tag value."}},"dataInstanceId":{"type":"string","description":"Identifier of the data instance (usually equal to `id`)."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the settings of custom fields for a given contract. The response includes field configuration details such as name, type, level, and whether the field is enabled or required.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Dynamic Storage | Dynamic storage generic resources | **Read only documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Insert or update document (not remove)** |
  | Dynamic Storage | Dynamic storage generic resources | **Full access to all documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `_schema` | query | (Required) Schema version to use for the request. This query string defines which schema version to apply when retrieving data. Learn more about [Master Data schemas](https://developers.vtex.com/docs/guides/master-data-schema-lifecycle). |
  | `_fields` | query | (Required) Comma-separated list of field names to be returned in the response. Use `_all` to return all fields, or specify individual fields like `id,contractId,name`. Learn more about [searching documents in Master Data v2](https://developers.vtex.com/docs/guides/search-documents-in-master-data). |
  | `_where` | query | (Required) Filter expression to search documents using Master Data v2 query syntax. Use `contractId={{contractId}}` to filter custom field settings by contract. Learn more about [searching documents in Master Data v2](https://developers.vtex.com/docs/guides/search-documents-in-master-data). |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

