        "v1"
      ],
      "contractId": "2da4e9ab-050b-11f0-b37f-f4b136dbcce1",
      "name": "PO Number",
      "enabled": true,
      "required": false,
      "level": "item",
      "type": "option",
      "additionalData": "teste",
      "createdBy": "6ce199d2-8a85-4e83-831c-389dcb64c0c1",
      "createdBy_USER": {
        "Id": "6ce199d2-8a85-4e83-831c-389dcb64c0c1",
