opencollection: 1.0.0

info:
  name: VTEX - Custom Fields API

request:
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Custom Fields API allows you to create, manage, and apply custom fields to contracts and orders in VTEX. Custom fields enable you to capture additional business-specific information at different levels: `item`, `order`, or `address`.

    >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

    This API is divided into three main sections:

    ### Custom field settings
    Configure custom field definitions for contracts, including field name, type, level, and validation rules.

    - `GET` [Get custom field settings](https://developers.vtex.com/docs/api-reference/custom-fields-api#get-/api/dataentities/customFieldSettings/search)
    - `POST` [Create custom field setting](https://developers.vtex.com/docs/api-reference/custom-fields-api#post-/api/dataentities/customFieldSettings/documents)
    - `PATCH` [Update custom field setting](https://developers.vtex.com/docs/api-reference/custom-fields-api#patch-/api/dataentities/customFieldSettings/documents/-documentId-)
    - `DELETE` [Delete custom field setting](https://developers.vtex.com/docs/api-reference/custom-fields-api#delete-/api/dataentities/customFieldSettings/documents/-documentId-)

    ### Custom field values
    Manage the actual values assigned to custom fields for specific contracts.
    - `POST` [Create custom field value](https://developers.vtex.com/docs/api-reference/custom-fields-api#post-/api/dataentities/customFieldValues/documents)
    - `GET` [Get custom field value](https://developers.vtex.com/docs/api-reference/custom-fields-api#get-/api/dataentities/customFieldValues/documents/-customFieldValueId-)
    - `PATCH` [Update custom field value](https://developers.vtex.com/docs/api-reference/custom-fields-api#patch-/api/dataentities/customFieldValues/documents/-customFieldValueId-)
    - `DELETE` [Delete custom field value](https://developers.vtex.com/docs/api-reference/custom-fields-api#delete-/api/dataentities/customFieldValues/documents/-customFieldValueId-)
    - `GET` [Search custom field values](https://developers.vtex.com/docs/api-reference/custom-fields-api#get-/api/dataentities/customFieldValues/search)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
