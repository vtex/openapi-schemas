info:
  name: Create a pet
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/pets"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/pets - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | Your VTEX account name |
  | `environment` | path | (This can only be one of vtexcommercestable,myvtex) |
