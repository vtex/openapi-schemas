info:
  name: Get policy by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/policy-engine/policies/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: pa_test_001
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/policy-engine/policies/:id - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/policy-engine/policies/:id - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/policy-engine/policies/:id - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/policy-engine/policies/:id - Schema is valid", function () {
          const schema = {"type":"array","items":{"title":"PolicyGetResponse","description":"Object with policy information.","type":"object","properties":{"id":{"type":"string","title":"id","description":"Policy ID."},"name":{"type":"string","description":"Policy name.","title":"name"},"description":{"type":"string","description":"Policy description, only for internal use.","title":"description"},"statements":{"type":"array","title":"statements","items":{"type":"object","description":"Object with policy conditions.","required":["effect"],"properties":{"effect":{"type":"string","title":"effect","description":"This field is not functional at the moment. To create a correct request, fill the field with `Allow`.","example":"Allow","deprecated":true},"actions":{"type":"array","title":"actions","items":{"properties":{"id":{"type":"string","title":"id","description":"Action ID.","example":"SendSlackMessage","enum":["SendSlackMessage","SendEmail","DeactivatePromotions"]},"metadata":{"type":"object","title":"metadata","description":"Data inside of the actions.","additionalProperties":true}},"type":"object","description":"Array with actions information."},"description":"Actions that the policy will execute."},"resource":{"type":"string","description":"Scope on which this policy must be evaluated.","title":"resource","example":"vrn:vtex.promotions-alert:aws-us-east-1:kamila:master:/_v/promotions_alert"},"condition":{"type":"object","properties":{"conditions":{"type":"array","description":"List of conditions that will activate the policy.","items":{"description":"List of conditions that will activate the policy.","type":"object","properties":{"conditions":{"title":"conditions","type":"array","description":"List of conditions the actions can have. It can be an empty array `[]`.","enum":[[],["stringEquals"],["numericGreaterThan"]],"items":{"type":"string","description":"Condition value.","example":"None"}},"operation":{"type":"string","title":"operation","description":"The action of the condition.","example":"None","enum":["None","stringEquals","stringEqualsIgnoreCase","numericEquals","numericLessThan","numericLessThanEquals","numericGreaterThan","numericGreaterThanEquals","bool","not","or","and","dateTimeUtcGreaterThan","dateTimeUtcLessThan","between"]},"key":{"type":"string","title":"key","description":"The element that will define what the policy will influence.","example":"skuId","enum":["skuId","brandId","discountPercentage"]},"values":{"type":"array","title":"values","items":{"type":"string","description":"Key value.","example":"40.00"},"description":"Array with values of the key."}}}}},"description":"Condition to activate this policy. This object can have a maximum of ten recursive conditions.","title":"condition"},"operation":{"type":"string","title":"operation","description":"This operation will determine if all the conditions need to be valid or at least one of them, if the conditions array is not empty.","example":"None","enum":["None","stringEquals","stringEqualsIgnoreCase","numericEquals","numericLessThan","numericLessThanEquals","numericGreaterThan","numericGreaterThanEquals","bool","not","or","and","dateTimeUtcGreaterThan","dateTimeUtcLessThan","between"]}}},"description":"Requirements for the policy to be applied."}}},"description":"Array of objects with policies infomation."};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves general information of a policy by its ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Promotions Policy Engine | Policies | **Get Policy** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `id` | path | (Required) Policy ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL. |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "id": "pa_test_001",
      "name": "TestAlarmBerenice",
      "description": "TesteMarcosPromotionsAlert",
      "statements": [
        {
          "effect": "Allow",
          "actions": [
            {
              "id": "SendSlackMessage",
              "metadata": {
                "channel": "C01NJFF35R6",
                "relatedUsers": [
                  "URUNDC2NB"
                ],
                "alertDescription": "Avoid selling products from Berenice with a discount greater than 70%."
              }
            }
          ],
          "resource": "vrn:vtex.promotions-alert:aws-us-east-1:kamila:master:/_v/promotions_alert",
          "condition": {
            "conditions": [
              {
                "conditions": [],
                "operation": "stringEquals",
                "key": "brandId",
                "values": [
                  "2000001"
                ]
              },
              {
                "conditions": [],
                "operation": "numericGreaterThan",
                "key": "discountPercentage",
                "values": [
                  "70.00"
                ]
              }
            ],
            "operation": "and"
          }
        }
      ]
    }
  ]
  ```
