runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/rns/pub/cycles - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/rns/pub/cycles - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/rns/pub/cycles - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/rns/pub/cycles - Schema is valid", function () {
          const schema = {"type":"array","description":"List of subscriptions of the VTEX account, limited to 15 results.","items":{"type":"object","description":"Object with information about the subscription cycle.","properties":{"id":{"type":"string","description":"Cycle ID. When the `cycleCount` value is `1`, the `id` value will be the same as the `subscriptionId` value."},"subscriptionId":{"type":"string","description":"[Subscription](https://help.vtex.com/en/tutorial/how-subscriptions-work--frequentlyAskedQuestions_4453) ID."},"workflowId":{"type":"string","description":"Code that identifies the subscription in the [order flow](https://help.vtex.com/en/tutorial/order-flow-and-status--tutorials_196)."},"status":{"type":"string","description":"Subscription cycle execution status. The possible values are:\r\n- `TRIGGERED`: Execution has been triggered. \r\n- `IN_PROCESS`: Execution is being processed by the system.\r\n- `FAILURE`: An internal error occurred during the subscription execution.\r\n- `SUCCESS`: Successful cycle processing.\r\n- `EXPIRED`: The subscription was not renewed, and the period for which it was valid has ended.\r\n- `ORDER_ERROR`: Cycle was not executed due to an error in order placement.\r\n- `PAYMENT_ERROR`: Cycle was not executed due to an error in the payment.\r\n- `SKIPED`: A subscription cycle execution was skipped, and the subscription will be executed in the next cycle.\r\n- `SUCCESS_WITH_NO_ORDER`: Cycle was executed successfully, and the linked order has no items.\r\n- `SUCCESS_WITH_PARTIAL_ORDER`: Cycle was executed successfully, and has a linked partial order.\r\n- `RE_TRIGGERED`: Execution retry was triggered manually.\r\n- `SCHEDULE_UPDATED`: The next subscription cycle execution date has been updated.","enum":["TRIGGERED","IN_PROCESS","FAILURE","SUCCESS","EXPIRED","ORDER_ERROR","PAYMENT_ERROR","SKIPED","SUCCESS_WITH_NO_ORDER","SUCCESS_WITH_PARTIAL_ORDER","RE_TRIGGERED","SCHEDULE_UPDATED"]},"customerEmail":{"type":"string","description":"Customer email."},"customerId":{"type":"string","description":"Customer ID."},"date":{"type":"string","format":"date-time","description":"Current date and time in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."},"lastUpdate":{"type":"string","format":"date-time","description":"Subscription cycle last update date and time in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."},"cycleCount":{"type":"integer","description":"The cycle determines the position of an order counting from when the shopper subscribed. The original order that creates the subscription corresponds to cycle count `0`, the first subscription order corresponds to `1`, the second corresponds to `2`, and so on."},"isInRetry":{"type":"boolean","description":"Defines if the cycle execution is in retry (`true`), or not (`false`)."},"message":{"type":["string","null"],"description":"Cycle execution message."},"friendlyMessage":{"type":["string","null"],"description":"Cycle execution friendly message."},"plan":{"type":"object","description":"[Subscription plan](https://help.vtex.com/en/tutorial/subscription-plans-beta--5kczKRqHEsrs1tYtRcY8wR) object.","required":["frequency","id","purchaseDay","validity"],"properties":{"id":{"type":["string","null"],"description":"Subscription plan ID."},"frequency":{"type":"object","description":"Subscription plan frequency.","required":["interval","periodicity"],"properties":{"periodicity":{"type":["string","null"],"description":"Plan repurchase frequency, defines the subscription recurrence.","enum":["DAILY","WEEKLY","MONTHLY","YEARLY"]},"interval":{"type":"integer","description":"Time interval configured between subscription orders, which depends on the periodicity. For a `DAILY` periodicity, the value will be days, for `MONTHLY` it will be months, and so on."}}},"validity":{"type":"object","description":"Information about the period during which the subscription plan will be valid.","required":["begin"],"properties":{"begin":{"type":"string","description":"Subscription plan beginning date and time in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."},"end":{"type":["string","null"],"description":"Subscription plan ending date and time in [UTC time format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."}}},"purchaseDay":{"type":"string","description":"Time reference in which subscription orders will be created. It will depend on the cycle periodicity, for `WEEKLY` subscriptions, for example, the purchase day could be `Sunday`. For `MONTHLY`, would be `7`, as in the 7th day of the month. When the subscription periodicity is `DAILY`, this field corresponds to `Not_Applicable`."}}},"orderInfo":{"type":"object","description":"Subscription order information.","properties":{"orderId":{"type":"string","description":"Order ID."},"orderGroup":{"type":"string","description":"Order group ID."},"paymentURL":{"type":["string","null"],"description":"Order payment URL."},"value":{"type":"integer","format":"int64","description":"Order value in cents."}}},"context":{"type":"object","description":"Subscription cycle context.","properties":{"items":{"type":["array","null"],"description":"Information about subscription cycle items.","items":{"type":"object","description":"Subscription item information.","properties":{"subscriptionItemId":{"type":["string","null"],"description":"Subscription item ID."},"skuId":{"type":["string","null"],"description":"SKU ID."},"quantity":{"type":["integer","null"],"description":"Quantity of item units."},"status":{"type":["string","null"],"description":"Subscription status.","enum":["ACTIVE","PAUSED","CANCELED","EXPIRED","MISSING"]},"isSkipped":{"type":["boolean","null"],"description":"Defines if the customer asked to skip the item in the next subscription order (`true`), or not (`false`)."},"cycleCount":{"type":["integer","null"],"description":"The cycle determines the position of an order counting from when the shopper subscribed. The original order that creates the subscription corresponds to cycle count `0`, the first subscription order corresponds to `1`, the second corresponds to `2`, and so on."}}}},"paymentSystem":{"type":["string","null"],"description":"Payment system ID."},"paymentSystemName":{"type":["string","null"],"description":"Payment system name."},"paymentSystemGroup":{"type":["string","null"],"description":"Payment system group."},"paymentAccountId":{"type":["string","null"],"description":"Information about the customer profile and their documents, such as a credit card number. You can also retrieve that information using the [Get client profile by email](https://developers.vtex.com/docs/api-reference/checkout-api#get-/api/checkout/pub/profiles) endpoint."},"addressId":{"type":["string","null"],"description":"Shipping address ID."},"addressType":{"type":["string","null"],"description":"Shipping address type."},"catalogAttachment":{"type":["string","null"],"description":"Subscription [attachment](https://help.vtex.com/en/tutorial/what-is-an-attachment--aGICk0RVbqKg6GYmQcWUm) content, when applicable."}}},"simulationItems":{"type":["array","null"],"description":"Subscription simulation items.","items":{"type":"object","description":"Simulation information about an item.","properties":{"id":{"type":["string","null"],"description":"SKU ID."},"quantity":{"type":"integer","description":"Quantity of units for the given SKU."},"unitPrice":{"type":["integer","null"],"format":"int64","description":"Unit price in cents."},"status":{"type":"string","description":"Subscription cycle status in the simulation."},"price":{"type":["integer","null"],"description":"Price in cents."},"sellingPrice":{"type":"integer","description":"Selling price in cents."},"manualPrice":{"type":["number","null"],"description":"[Manual price](https://help.vtex.com/en/tutorial/change-the-price-of-an-item-in-the-shopping-cart--7Cd37aCAmtL1qmoZJJvjNf)."}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

