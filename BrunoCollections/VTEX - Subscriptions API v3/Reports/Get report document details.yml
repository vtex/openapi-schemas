info:
  name: Get report document details
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/rns/pvt/reports/:reportName/documents/:documentId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reportName
      value: subscriptionsWithStatus
      type: path
    - name: documentId
      value: 2804f3ab-5a51-11ef-b37f-f89ffae09a60
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/rns/pvt/reports/:reportName/documents/:documentId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/rns/pvt/reports/:reportName/documents/:documentId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/rns/pvt/reports/:reportName/documents/:documentId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/rns/pvt/reports/:reportName/documents/:documentId - Schema is valid", function () {
          const schema = {"type":"object","description":"Subscription report information.","properties":{"id":{"type":"string","description":"Report document ID."},"finished":{"type":"boolean","description":"Defines if the report is finished (`true`) or not (`false`)."},"recordsProcessed":{"type":"integer","description":"Number of records processed at the moment."},"recordsSum":{"type":["integer","null"],"description":"Total number of records to be processed."},"startDate":{"type":["string","null"],"description":"Report starting date and time in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."},"lastUpdateTime":{"type":["string","null"],"description":"Report last update date and time in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."},"completedDate":{"type":["string","null"],"description":"Report completion date and time in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."},"errorCount":{"type":["integer","null"],"description":"Error counting numbers, when applicable."},"percentageProcessed":{"type":"number","description":"Report processing percentage."},"enqueueDate":{"type":["string","null"],"description":"Request enqueue date and time in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."},"email":{"type":"string","description":"Email of the user that receives the report."},"canceled":{"type":"boolean","description":"Defines if the report is canceled (`true`) or not (`false`)."},"outputType":{"type":["string","null"],"description":"Report file extension."},"zipped":{"type":"boolean","description":"Defines if the report file is zipped (`true`) or not (`false`)."},"linkToDownload":{"type":["string","null"],"description":"Link do download the report."},"lastErrorMessage":{"type":["string","null"],"description":"Error last message, when applicable."},"statusMessage":{"type":"string","description":"Report status message."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves information about a subscription report document, searching by document ID. In the status code `200 OK` response, you get a link to download the report.

  >❗ Before using this endpoint, you must create a report with the [Generate report](https://developers.vtex.com/docs/api-reference/subscriptions-api-v3#post-/api/rns/pvt/reports/-reportName-/documents) endpoint and get the document ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Subscriptions | ApplicationAccess | **Subscription metrics and reports** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `reportName` | path | (Required) Name of the report type, which must be previously created for your store using the [Generate report](https://developers.vtex.com/docs/api-reference/subscriptions-api-v3#post-/api/rns/pvt/reports/-reportName-/documents) endpoint. The possible values are: - `subscriptionsWithStatus` - `subscriptionsScheduledBetweenDate` - `subscriptionsUpdatedBetweenDate` - `subscriptionsCreatedBetweenDate` - `executionsBetweenDate` |
  | `documentId` | path | (Required) Report document ID. You get this value after you create a report template for your store using the [Generate report](https://developers.vtex.com/docs/api-reference/subscriptions-api-v3#post-/api/rns/pvt/reports/-reportName-/documents) endpoint. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "7849df9f-00d4-11ef-8452-1254acca1d85",
    "finished": true,
    "recordsProcessed": 63,
    "recordsSum": 63,
    "startDate": "2024-03-22T18:16:50.7487312Z",
    "lastUpdateTime": "2024-04-22T18:16:50.7487312Z",
    "completedDate": "2024-04-22T18:16:50.7487312Z",
    "errorCount": null,
    "percentageProcessed": 100,
    "enqueueDate": "2024-04-22T18:16:50.7487312Z",
    "email": "receiver@email.com",
    "canceled": false,
    "outputType": "CSV",
    "zipped": false,
    "linkToDownload": "https://s3.amazonaws.com/OMSReport/v3/_finished/accountname/7849df9f-00d4-11ef-8452-1254acca1d85//files/47363271-b655-11ed-83ab-12dbed7de2a7.csv?AWSAccessKeyId=ASIAQYXXCHIYPSJDRNHB&Expires=1724945014&x-amz-security-token=IQoJb3JpZ2luX2VjEMj%2Feq6V1w8z3NGlnfhvSp70Q80qvQUIwP%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FARAAGgwwNTMxMzE0OTE4ODgiDCM0JATV%2FwXQvXyovCqRBW%2F14aC5J3plQR%2BzKbpddyDnoAstfgJo1MfR0yel3uRzixrSRFE033V4%2B8cN7ez5Lr0ymGifnB14ONZ35RtM4PgQvuV0fs8If6cw8%3D%3D&Signature=7yZbA%2BGaYdPUkdxFXqy9W8GGHuo%3D",
