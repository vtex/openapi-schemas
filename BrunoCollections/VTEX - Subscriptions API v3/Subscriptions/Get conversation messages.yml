info:
  name: Get conversation messages
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/rns/pub/subscriptions/:subscriptionId/conversation-message"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: subscriptionId
      value: 123456789abc
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/rns/pub/subscriptions/:subscriptionId/conversation-message - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/rns/pub/subscriptions/:subscriptionId/conversation-message - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/rns/pub/subscriptions/:subscriptionId/conversation-message - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/rns/pub/subscriptions/:subscriptionId/conversation-message - Schema is valid", function () {
          const schema = {"type":"array","items":{"type":"object","description":"Each message exchanged with the customer related to the subscription.","properties":{"id":{"type":"string","description":"Message ID."},"from":{"type":"object","description":"Information regarding the message sender.","properties":{"conversationRelatedTo":{"type":"string","description":"ID of the subscription related to the message."},"conversationSubject":{"type":"string","description":"Subject of the conversation."},"emailAlias":{"type":"string","description":"Email alias."},"aliasMaskType":{"type":"string","description":"Alias [mask type](https://help.vtex.com/en/tutorial/how-communication-with-the-client-is-made-during-the-order-flow--tutorials_195)."},"email":{"type":"string","description":"Sender email address."},"name":{"type":"string","description":"Sender name."},"role":{"type":["string","null"],"description":"Sender [role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc)."}}},"to":{"type":"array","description":"Information regarding the message receiver.","items":{"type":"object","description":"Message receiver details.","properties":{"conversationRelatedTo":{"type":"string","description":"ID of the subscription related to the message."},"conversationSubject":{"type":"string","description":"Subject of the conversation."},"emailAlias":{"type":"string","description":"Email alias."},"aliasMaskType":{"type":"string","description":"Alias [mask type](https://help.vtex.com/en/tutorial/how-communication-with-the-client-is-made-during-the-order-flow--tutorials_195)."},"email":{"type":"string","description":"Customer email address."},"name":{"type":"string","description":"Customer name."},"role":{"type":"string","description":"Role identification."}}}},"subject":{"type":"string","description":"Message subject."},"firstWords":{"type":"string","description":"First words of the message text."},"body":{"type":"string","description":"HTML content of the message's body."},"hasAttachment":{"type":"boolean","description":"Indicates if the message has [attachments](https://help.vtex.com/en/tutorial/what-is-an-attachment--aGICk0RVbqKg6GYmQcWUm) (`true`) or not (`false`)."},"attachmentNames":{"type":["array","null"],"description":"Attachment names.","items":{"type":["string","null"],"description":"Attachment name."}},"date":{"type":"string","description":"Message date and time in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ssZ`."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves all conversation messages sent to a customer regarding a subscription.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Subscriptions | ApplicationAccess | **Subscription view only** |
  | Subscriptions | ApplicationAccess | **Subscription view and edit** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `subscriptionId` | path | (Required) [Subscription](https://help.vtex.com/en/tutorial/how-subscriptions-work--frequentlyAskedQuestions_4453) ID. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

