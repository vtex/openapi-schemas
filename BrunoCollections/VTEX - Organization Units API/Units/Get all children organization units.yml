info:
  name: Get all children organization units
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/organization-units/v1/:organizationUnitId/children"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: shallowSearch
      value: "true"
      type: query
      disabled: true
    - name: organizationUnitId
      value: 8d8b68e2-89e1-4d9f-b7c3-3a7f2c8e9d1a
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/organization-units/v1/:organizationUnitId/children - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/organization-units/v1/:organizationUnitId/children - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/organization-units/v1/:organizationUnitId/children - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/organization-units/v1/:organizationUnitId/children - Schema is valid", function () {
          const schema = {"type":"array","description":"List of child organization units.","items":{"type":"object","description":"Organization unit object.","properties":{"id":{"type":"string","format":"uuid","description":"Unique identifier of the organization unit."},"name":{"type":"string","description":"Name of the organization unit."},"path":{"type":"object","description":"Hierarchical path of the organization unit.","properties":{"ids":{"type":"string","description":"Forward-slash separated path of IDs from tenant root to this unit."}}},"createdAt":{"type":"string","format":"date-time","description":"Timestamp when the organization unit was created."},"updatedAt":{"type":"string","format":"date-time","description":"Timestamp when the organization unit was last updated."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists all children of a specific organization unit. The `shallowSearch` parameter controls whether to retrieve only direct children or all descendants.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Organization Units | units | **View_Organization_Unit** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `organizationUnitId` | path | (Required) Unique identifier (GUID) of the parent organization unit. |
  | `shallowSearch` | query | Indicates whether to retrieve only direct children (`true`) or all descendants (`false`). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "id": "7c9a57d1-78e0-4c8e-a6b2-2a6e1b7d8c0b",
      "name": "Marketing Operations",
      "path": {
        "ids": "apiexamples/8d8b68e2-89e1-4d9f-b7c3-3a7f2c8e9d1a/7c9a57d1-78e0-4c8e-a6b2-2a6e1b7d8c0b"
      },
      "createdAt": "2025-10-21T11:00:00.000Z",
      "updatedAt": "2025-10-21T11:00:00.000Z"
    },
    {
      "id": "5a8b35b9-56c9-3a6c-84a0-0a4c9a5b6a8a",
      "name": "Marketing Communications",
      "path": {
        "ids": "apiexamples/8d8b68e2-89e1-4d9f-b7c3-3a7f2c8e9d1a/5a8b35b9-56c9-3a6c-84a0-0a4c9a5b6a8a"
      },
      "createdAt": "2025-10-21T11:15:00.000Z",
      "updatedAt": "2025-10-21T11:15:00.000Z"
    }
  ]
  ```
