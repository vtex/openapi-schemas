info:
  name: Create organization unit scope
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/organization-units/v1/:organizationUnitId/scopes/:scope"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: organizationUnitId
      value: 8d8b68e2-89e1-4d9f-b7c3-3a7f2c8e9d1a
      type: path
    - name: scope
      value: contractIds
      type: path
  body:
    type: json
    data: |-
      {
        "ids": [
          "contract-123",
          "contract-456"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/organization-units/v1/:organizationUnitId/scopes/:scope - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/organization-units/v1/:organizationUnitId/scopes/:scope - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/organization-units/v1/:organizationUnitId/scopes/:scope - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/organization-units/v1/:organizationUnitId/scopes/:scope - Schema is valid", function () {
          const schema = {"type":"object","description":"Response for scope creation, update, or removal operations.","properties":{"organizationUnitId":{"type":"string","format":"uuid","description":"Unique identifier of the organization unit."},"scope":{"type":"string","description":"Scope type identifier."},"ids":{"type":"array","description":"Current list of values for this scope after the operation.","items":{"type":"string","description":"Scope value."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new scope with specified values for an organization unit. If the scope already exists, this operation will fail.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Organization Units | units | **Edit_Organization_Unit** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `organizationUnitId` | path | (Required) Unique identifier (GUID) of the organization unit. |
  | `scope` | path | (Required) Name of the scope category for which data should be retrieved. Supported values are: `contractIds`, `creditCards`, `installmentOptions`, `collectionIds`, `priceTables`, `paymentSystemIds`, `addresses`, `customFields`. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "organizationUnitId": "8d8b68e2-89e1-4d9f-b7c3-3a7f2c8e9d1a",
    "scope": "contractIds",
    "ids": [
      "contract-123",
      "contract-456"
    ]
  }
  ```
