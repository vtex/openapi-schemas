opencollection: 1.0.0

info:
  name: VTEX - Organization Units API

request:
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Organization Units API enables you to manage B2B functionalities in your VTEX store, focusing on users and organization units. This API provides endpoints for managing users, organization units, and their associated scopes.

    >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

    ## Common parameters

    | Parameter name | Description | Type |
    | - | - | - |
    | `accountName` | Name of the VTEX account. Used as part of the URL. | Server variable. |
    | `environment` | Environment to use. Used as part of the URL. | Server variable. |
    | `VtexIdclientAutCookie` | [User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours. | Authentication header. |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
