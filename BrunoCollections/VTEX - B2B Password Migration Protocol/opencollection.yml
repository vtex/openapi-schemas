opencollection: 1.0.0

info:
  name: VTEX - B2B Password Migration Protocol

docs:
  content: |-
    >ℹ️ The B2B Password Migration Protocol is a set of definitions to help you integrate your legacy authentication system with VTEX's B2B user migration flow.

    This protocol defines the endpoints that your middleware must implement to enable B2B password migration. Your middleware must provide a client registration endpoint and an authentication endpoint that VTEX will call during the migration process.

    To learn more about B2B password migration, check the [B2B password migration guide](https://developers.vtex.com/docs/guides/b2b-password-migration).

    > ⚠️ This feature is only available for stores using [B2B Buyer Portal](https://help.vtex.com/docs/tutorials/b2b-buyer-portal), which is currently available to selected accounts.

    ## General Requirements

    - Must use a standard subdomain/domain name, not an IP address.
    - Must be served over HTTPS on port 443 with TLS 1.3.
    - TLS certificates must be valid and issued by a trusted CA.
    - Must respond in less than 3 seconds (p95 ≤ 1s, p99 ≤ 2.5s recommended).
    - Never log the `Secret`, passwords, or signatures.
    - Do not reuse secrets across environments (staging vs. production).

    ## B2B Password Migration Protocol API Index

    ### Client Registration

    - `POST` [Register client](https://developers.vtex.com/docs/api-reference/b2b-password-migration-protocol#post-/register)

    ### Authentication Flow

    - `POST` [Validate legacy credentials](https://developers.vtex.com/docs/api-reference/b2b-password-migration-protocol#post-/authentication)
