info:
  name: Validate legacy credentials
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/authentication"
  headers:
    - name: Content-Type
      value: application/json; charset=utf-8
    - name: Accept
      value: application/json
    - name: X-VTEX-Client-Id
      value: vtex-b2b-store
    - name: X-VTEX-Timestamp
      value: Tue, 31 Mar 2026 16:11:59 GMT
    - name: X-VTEX-Nonce
      value: a1b2c3d4e5f6
    - name: X-VTEX-Content-SHA256
      value: 47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=
    - name: Authorization
      value: HMAC-SHA256 SignedHeaders=X-VTEX-Client-Id;X-VTEX-Timestamp;X-VTEX-Nonce;X-VTEX-Content-SHA256&Signature=mK8C3gF9xQ7vN2pL5wR8tY6uI4oP1aS3dF7gH9jK2lZ=
  body:
    type: json
    data: |-
      {
        "username": "john.doe",
        "password": "MySecureP@ssw0rd"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/authentication - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Validates a user's legacy credentials against your external authentication system. This endpoint is called by VTEX when a user with the `isLegacyPassword` flag attempts to log in for the first time.

  For more information, see the [B2B password migration guide](https://developers.vtex.com/docs/guides/b2b-password-migration).

  ⚠️ The request to your middleware will always be made from one of the VTEX IPs listed at [http://ips.vtex.com](http://ips.vtex.com). Although VTEX cannot enforce this, we strongly recommend that your middleware checks the IP origin. If the IP is not from VTEX, your middleware should not respond.

  > ℹ️ This request is made from VTEX to your authentication middleware.

  ## Endpoint-specific requirements

  - The endpoint path must end with `/authentication`.
  - Must validate HMAC-SHA256 signatures to authenticate requests from VTEX.
  - Must check that requests originate from VTEX IP addresses.

  ## Middleware verification steps

  Your middleware must perform the following steps in order:

  1. Validate that all required headers are present.
  2. Validate timestamp within ±300 seconds (recommended).
  3. Validate that the nonce has not been seen before for this `ClientId` within the clock skew window.
  4. Reconstruct the canonical string from the incoming request.
  5. Compute the expected HMAC-SHA256 signature and compare using constant-time comparison.
  6. Only then proceed to validate credentials against the legacy system.

  ## HMAC signature validation

  VTEX and your middleware must sign the exact same canonical string. Your middleware must reconstruct it from the incoming request.

  **Canonical string format (with `\n` separators, UTF-8 encoded):**

  ```
  {HTTP_METHOD}\n
  {PATH}\n
  {X-VTEX-Client-Id}\n
  {X-VTEX-Timestamp}\n
  {X-VTEX-Nonce}\n
  {SHA256_OF_BODY}
  ```

  Where:
  - `HTTP_METHOD` is uppercase (e.g., `POST`).
  - `PATH` is `/authentication` and any provided query strings (no scheme or host).
  - `SHA256_OF_BODY` is the base64-encoded SHA-256 digest of the raw request body bytes. Do not parse or re-serialize the JSON.

  **Signature computation:**

  ```
  signature = HMAC-SHA256(UTF8(canonicalString), secret)
  ```

  **Authorization header format:**

  ```
  Authorization: HMAC-SHA256 SignedHeaders=X-VTEX-Client-Id;X-VTEX-Timestamp;X-VTEX-Nonce;X-VTEX-Content-SHA256&Signature={{signature}}
  ```

  ## Response requirements

  Your middleware must return **only** the following HTTP status codes:

  - `200 OK`: Credentials are valid; user is authorized.
  - `401 Unauthorized`: Credentials are invalid (user not found or wrong password).
  - `403 Forbidden`: Request is not authenticated (invalid or missing HMAC).

  Any other HTTP status code is treated by VTEX as a technical error.

  ⚠️ **Important for security:** "User not found" and "wrong password" scenarios must both return `401`, indistinguishably. This prevents user enumeration. Don't include response body content that reveals credential validity, user existence, or internal errors. VTEX ignores response bodies entirely.

  ## Permissions

  Check with your service provider to know what permissions are needed.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `X-VTEX-Client-Id` | header | (Required) Client identifier agreed upon during registration. |
  | `X-VTEX-Timestamp` | header | (Required) Request timestamp in RFC 1123 format. Must be within an acceptable clock skew window (recommended: ±300 seconds). |
  | `X-VTEX-Nonce` | header | (Required) Unique random string for this request. Must be unique per client within the clock skew window. Your middleware must enforce nonce uniqueness to prevent replay attacks. |
  | `X-VTEX-Content-SHA256` | header | (Required) Base64-encoded SHA-256 hash of the request body. |
  | `Authorization` | header | (Required) HMAC-SHA256 signature of the canonical string. Format: `HMAC-SHA256 SignedHeaders=X-VTEX-Client-Id;X-VTEX-Timestamp;X-VTEX-Nonce;X-VTEX-Content-SHA256&Signature={{signature}}` |
