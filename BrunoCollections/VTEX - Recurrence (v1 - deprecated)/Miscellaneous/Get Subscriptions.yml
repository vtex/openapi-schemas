info:
  name: Get Subscriptions
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/subscriptions?email={{email}}&cycleStatus={{cycleStatus}}"
  params:
    - name: email
      value: "{{email}}"
      type: query
    - name: cycleStatus
      value: "{{cycleStatus}}"
      type: query
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/subscriptions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a given Subscription (formerly recurrence). There are three options of filtering your Subscruptions v1. It's possible to get a list of all Subscriptions v1, by not adding any query params to your request, and simply executing a call to the url. It is also possible to list the Subscriptions by email, filtering by the email query param. And finnally, it is possible to list recurrences with failures on the last execution cycle, filtering by the cycleStatus query param.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `email` | query | If you wish to list tasks by email, insert the desired user's email. |
  | `cycleStatus` | query | If you wish to list tasks by Subscriptions with failures on the last execution cycle, insert the desired cycleStatus. |
