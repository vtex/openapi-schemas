info:
  name: Add Subscription item
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/subscriptions/:recurrenceId/items"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: recurrenceId
      value: cupidatat esse proident irure
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      [
        {
          "sku": "20",
          "seller": "1",
          "quantity": 2,
          "frequency": {
            "periodicity": "monthly",
            "interval": 1
          },
          "shippingAddressId": "-1461618656161"
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/subscriptions/:recurrenceId/items - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Adds an item to a Subscription (formerly Recurrence).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `recurrenceId` | path | (Required) |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
