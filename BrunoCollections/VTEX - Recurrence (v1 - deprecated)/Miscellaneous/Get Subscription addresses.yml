info:
  name: Get Subscription addresses
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/subscriptions/:recurrenceId/addresses"
  params:
    - name: recurrenceId
      value: cupidatat esse proident irure
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/subscriptions/:recurrenceId/addresses - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the addresses attached to a given subscription (formerly recurrence) by recurrenceId.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `recurrenceId` | path | (Required) |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
