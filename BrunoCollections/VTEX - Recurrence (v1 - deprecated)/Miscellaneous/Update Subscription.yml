info:
  name: Update Subscription
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/subscriptions"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      {
        "email": "user@vtex.com.br",
        "deliveryDay": 26,
        "deliveryWeekday": "Friday",
        "items": [
          {
            "sku": "18",
            "seller": "1",
            "quantity": 2,
            "frequency": {
              "periodicity": "weekly",
              "interval": 1
            },
            "shippingAddressId": "-1461618656161"
          }
        ],
        "paymentAccountId": "87FE21B06C0D42908D31A5B11E6FC043"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PUT]::/subscriptions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates details of a given Subscription (formerly recurrence).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
