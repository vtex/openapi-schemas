info:
  name: Update partial Subscription
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/subscriptions/:recurrenceId"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: recurrenceId
      value: cupidatat esse proident irure
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      {
        "deliveryDay": 18,
        "deliveryWeekday": "Monday",
        "status": "inactive"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PATCH]::/subscriptions/:recurrenceId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates partial information of a given subscription (formerly Recurrence).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `recurrenceId` | path | (Required) |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
