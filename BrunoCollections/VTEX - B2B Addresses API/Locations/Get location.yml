          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/customFieldValues/documents/:locationId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/customFieldValues/documents/:locationId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/customFieldValues/documents/:locationId - Schema is valid", function () {
