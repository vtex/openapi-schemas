info:
  name: Get location
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/customFieldValues/documents/:locationId?_fields=_all"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: _fields
      value: _all
      type: query
    - name: locationId
      value: a50012d0-c01f-465d-b4bc-e33b38d7437a
      type: path
  auth: inherit

