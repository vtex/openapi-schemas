        });

        test("[GET]::/api/dataentities/contact_information/documents/:recipientId - Schema is valid", function () {
          const schema = {"type":"object","description":"Recipient document object. A recipient can be associated with one or more B2B addresses through the `addressIds` field.","required":["firstName","lastName"],"properties":{"email":{"type":"string","description":"Recipient email."},"firstName":{"type":"string","description":"Recipient first name."},"lastName":{"type":"string","description":"Recipient last name."},"profileId":{"type":"string","format":"uuid","description":"ID of the contract (`CL` data entity) that owns the recipient. This is the `id` returned by the contract creation request."},"phone":{"type":"string","description":"Main phone number."},"phoneExtension":{"type":"string","description":"Internal phone extension, if applicable."},"document":{"type":"string","description":"Identification document."},"documentType":{"type":"string","description":"Type of document."},"addressIds":{"type":"array","description":"References to the B2B addresses associated with the recipient. Each value is the UUID of an address stored in the `AD` data entity.","items":{"type":"string","format":"uuid","description":"B2B address UUID."}}}};
