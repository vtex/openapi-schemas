info:
  name: Get recipient by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/contact_information/documents/:recipientId?_schema=v1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: _fields
      value: firstName,lastName,email
      type: query
      disabled: true
    - name: _schema
      value: v1
      type: query
    - name: recipientId
      value: 123e4567-e89b-12d3-a456-426614174000
      type: path
  auth: inherit

