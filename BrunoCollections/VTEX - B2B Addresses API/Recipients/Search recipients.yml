info:
  name: Search recipients
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/contact_information/search?_where=profileId=878fa807-7c7b-4ad3-aaa6-e3ef4fb22b8f&_schema=v1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: _where
      value: profileId=878fa807-7c7b-4ad3-aaa6-e3ef4fb22b8f
      type: query
    - name: _fields
      value: firstName,lastName,email
      type: query
      disabled: true
    - name: _schema
      value: v1
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/dataentities/contact_information/search - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/contact_information/search - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/contact_information/search - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/contact_information/search - Schema is valid", function () {
          const schema = {"type":"array","description":"Array of recipient objects.","items":{"type":"object","description":"Recipient object.","properties":{"firstName":{"type":"string","description":"Recipient first name."},"lastName":{"type":"string","description":"Recipient last name."},"email":{"type":"string","description":"Recipient email."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Searches for recipients in the `contact_information` data entity based on the query parameters. Recipients returned by this endpoint can be linked to one or more B2B addresses through the `addressIds` field.

  >⚠️ The `_schema` query parameter is required and must be set to `v1`.

  > ℹ️ It is also possible to use pagination and sort as described in the [Master Data v2 Search API](https://developers.vtex.com/docs/api-reference/master-data-api-v2#get-/api/dataentities/-dataEntityName-/search) documentation.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Dynamic Storage | Dynamic storage generic resources | **Read only documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Insert or update document (not remove)** |
  | Dynamic Storage | Dynamic storage generic resources | **Full access to all documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `_where` | query | (Required) Filter for recipient documents. This is a Master Data search condition built from the field names defined on the `contact_information` entity and the values you want to match. Use `fieldName=value` (for example, `email=example@example.com` or `profileId=878fa807-7c7b-4ad3-aaa6-e3ef4fb22b8f`). Combine conditions using the syntax supported for the Master Data v2 [Search Documents endpoint](https://developers.vtex.com/docs/api-reference/master-data-api-v2#get-/api/dataentities/-dataEntityName-/search?endpoint=get-/api/dataentities/-dataEntityName-/search) (for example, `AND` / `OR` where applicable). Which fields you can use depends on your entity schema, not on this API parameter alone. |
  | `_fields` | query | Fields that should be returned by document. Separate fields' names with commas. For example `_fields=firstName,lastName,email`. The default behavior is to return all fields. You can also use `_fields=_all` to fetch all fields. |
  | `_schema` | query | (Required) Master Data version. This field must be `v1`. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "firstName": "Rafael",
      "lastName": "Silva",
      "email": "rafael.silva@example.com"
    },
    {
      "firstName": "Carolina",
      "lastName": "Mendes",
      "email": "carolina.mendes@example.com"
    },
    {
      "firstName": "Lucas",
      "lastName": "Oliveira",
      "email": "lucas.oliveira@example.com"
    }
  ]
  ```
