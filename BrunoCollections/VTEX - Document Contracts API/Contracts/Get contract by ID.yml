info:
  name: Get contract by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/CL/documents/:contractId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: _fields
      value: _all
      type: query
      disabled: true
    - name: contractId
      value: 2da4e9ab-050b-11f0-b37f-f4b136dbcce1
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/dataentities/CL/documents/:contractId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/CL/documents/:contractId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/CL/documents/:contractId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/CL/documents/:contractId - Schema is valid", function () {
          const schema = {"type":"object","description":"Response body for a contract document.","properties":{"cluster":{"type":["string","null"],"description":"Internal or optional analytics or tags fields."},"priceTables":{"type":["string","null"],"description":"Comma-separated list of assigned price table codes."},"isCorporate":{"type":["boolean","null"],"description":"Whether it's a legal entity."},"tradeName":{"type":["string","null"],"description":"The trade name of the contact."},"homePhone":{"type":["string","null"],"description":"Contact phone number."},"phone":{"type":["string","null"],"description":"Contact phone number."},"businessPhone":{"type":["string","null"],"description":"Contact business phone number."},"email":{"type":["string","null"],"description":"The email of the contact."},"firstName":{"type":["string","null"],"description":"The first name of the contact."},"lastName":{"type":["string","null"],"description":"The last name of the contact."},"document":{"type":["string","null"],"description":"The document number of the contact."},"documentType":{"type":["string","null"],"description":"The type of document (e.g., \"EIN\", \"State Business Registration Number\")."},"corporateName":{"type":["string","null"],"description":"Company's registered corporate name."},"stateRegistration":{"type":["string","null"],"description":"State-level registration number."},"isNewsletterOptIn":{"type":["boolean","null"],"description":"Indicates newsletter opt-in status."},"createdIn":{"type":["string","null"],"description":"Timestamp of document creation."},"lastInteractionIn":{"type":["string","null"],"description":"Timestamp of last update."},"id":{"type":["string","null"],"description":"Unique contract ID."},"dataEntityId":{"type":["string","null"],"description":"Fixed entity ID (always \"CL\")."},"accountId":{"type":["string","null"],"description":"ID of the account related to this address."},"accountName":{"type":["string","null"],"description":"Name of the account related to this address."},"followers":{"type":["array","null"],"description":"List of users following this address record.","items":{"type":"string","description":"User ID."}},"tags":{"type":["array","null"],"description":"List of tags associated with this address.","items":{"type":"string","description":"Tag value."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This endpoint retrieves information related to a given contract, by its unique identifier.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |
  | Master Data | Application | **List Applications** |
  | Master Data | Application | **View logs** |
  | Master Data | Form | **List Forms** |
  | Master Data | Comment | **List Comments** |
  | Master Data | Customized Search | **List Custom Search** |
  | Master Data | Generic resources | **Read-only form access** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `contractId` | path | (Required) ID of the contract to retrieve. |
  | `_fields` | query | Specifies that all fields of the document should be included in the response. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

