opencollection: 1.0.0

info:
  name: VTEX - Document Contracts API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Document Contracts API enables you to create and manage contracts (B2B clients) for your store. This API is intended for store management purposes and provides endpoints for creating, retrieving, updating, and deleting contracts, as well as managing associated addresses.

    Contracts in this context refer to B2B clients of your store. The API includes auxiliary endpoints to support contract configuration, particularly for managing the restrictions object that defines commercial and operational limits for each contract.

    ### Restrictions

    In the context of this API, **restrictions** define the specific commercial and operational limits that a merchant configures for a contract. These restrictions determine how the customer can interact with the store across key systems such as catalog access, data management, checkout options, and payment methods.

    While the values configured in the `restrictions` object are not directly passed to the systems, they are used to generate the valid inputs that are. This ensures that the customer's shopping and purchasing experience aligns with their contract terms and business agreements.

    ## Index

    ### Contracts

    - `POST` [Create contract](https://developers.vtex.com/docs/api-reference/document-contracts-api#post-/api/dataentities/cl/documents)
    - `GET` [Get contract by ID](https://developers.vtex.com/docs/api-reference/document-contracts-api#get-/api/dataentities/cl/documents/-contractid-)
    - `PATCH` [Update contract](https://developers.vtex.com/docs/api-reference/document-contracts-api#patch-/api/dataentities/cl/documents/-contractid-)
    - `DELETE` [Delete contract](https://developers.vtex.com/docs/api-reference/document-contracts-api#delete-/api/dataentities/cl/documents/-contractid-)

    ### Addresses

    - `POST` [Create address](https://developers.vtex.com/docs/api-reference/document-contracts-api#post-/api/dataentities/ad/documents)
    - `GET` [Get address by ID](https://developers.vtex.com/docs/api-reference/document-contracts-api#get-/api/dataentities/ad/documents/-addressid-)
    - `PATCH` [Update address](https://developers.vtex.com/docs/api-reference/document-contracts-api#patch-/api/dataentities/ad/documents/-addressid-)
    - `DELETE` [Delete address](https://developers.vtex.com/docs/api-reference/document-contracts-api#delete-/api/dataentities/ad/documents/-addressid-)

    > ⚠️ When creating or updating contracts and addresses, you must send each field according to the specifications provided. Otherwise, the Checkout module will not be able to autofill data during the shopping flow, which can block the purchase. Learn more about [SmartCheckout - Customer information automatic fill-in](https://help.vtex.com/en/tutorial/smartcheckout-preenchimento-automatico-de-dados-do-cliente--2Nuu3xAFzdhIzJIldAdtan#).
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
