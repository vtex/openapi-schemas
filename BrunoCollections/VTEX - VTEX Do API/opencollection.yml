opencollection: 1.0.0

info:
  name: VTEX - VTEX Do API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    [VTEX DO](https://help.vtex.com/en/tutorial/vtex-do--7KMbRL4OslN8DTX9oiuCiu) is a task management system for authorized [users](https://help.vtex.com/en/tutorial/how-to-manage-users--tutorials_512) to process VTEX store orders. The functionality allows you to control notes, and create, update, list, and retrieve tasks. 

    ## VTEX DO API Index

    ### Note

    - `POST` [Create Note](https://developers.vtex.com/docs/api-reference/vtex-do-api#post-/notes)
    - `GET` [Get Notes by orderId](https://developers.vtex.com/docs/api-reference/vtex-do-api#get-/notes)
    - `GET` [Retrieve Note](https://developers.vtex.com/docs/api-reference/vtex-do-api#get-/notes/-noteId-)

    ### Task

    - `POST` [Create Task](https://developers.vtex.com/docs/api-reference/vtex-do-api#post-/tasks)
    - `GET` [List tasks](https://developers.vtex.com/docs/api-reference/vtex-do-api#get-/tasks)
    - `GET` [Retrieve Task](https://developers.vtex.com/docs/api-reference/vtex-do-api#get-/tasks/-taskId-)
    - `PUT` [Update Task](https://developers.vtex.com/docs/api-reference/vtex-do-api#put-/tasks/-taskId-)
    - `POST` [Add Comment on a Task](https://developers.vtex.com/docs/api-reference/vtex-do-api#post-/tasks/-taskId-/comments) 

    ## Common parameters

    | **Parameter name** | **Description** | **Type** |
    | :---: | :--- | :--- |
    | `{{accountName}}` | Name of the VTEX account. Used as part of the URL. | Server variable. |
    | `{{environment}}` | Environment to use. Used as part of the URL. The default value is `vtexcommercestable`. | Server variable. |
    | `X-VTEX-API-AppKey` | Unique identifier of the [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys). | Authentication header. Must be used together with `X-VTEX-API-AppToken`. Not necessary when using `VtexIdclientAutCookie`. |
    | `X-VTEX-API-AppToken` | Secret token of the [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys). | Authentication header. Must be used together with X-VTEX-API-AppKey. Not necessary when using `VtexIdclientAutCookie`. |
    | `VtexIdclientAutCookie` | [User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours. | Authentication header. Not necessary when using `X-VTEX-API-AppKey` and `X-VTEX-API-AppToken`. |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
