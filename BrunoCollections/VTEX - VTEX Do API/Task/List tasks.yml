info:
  name: List tasks
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tasks"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: assignee.email
      value: assigneeName@email.com
      type: query
      disabled: true
    - name: target.id
      value: "{{targetId}}"
      type: query
      disabled: true
    - name: context
      value: page
      type: query
      disabled: true
    - name: page
      value: "{{page}}"
      type: query
      disabled: true
    - name: perPage
      value: "{{desired number per page}}"
      type: query
      disabled: true
    - name: status
      value: open
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/tasks - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/tasks - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/tasks - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/tasks - Schema is valid", function () {
          const schema = {"type":"object","properties":{"piiHidden":{"type":"boolean","description":"If the VTEX account uses [PII data architecture](https://developers.vtex.com/docs/guides/pii-data-architecture-specifications) (`true`), or not (`false`)."},"items":{"type":"array","description":"Task items array.","items":{"type":"object","description":"Task item object.","properties":{"comments":{"type":["array","null"],"description":"Task item comments list.","items":{"type":"string","description":"Task item comment."}},"id":{"type":["string","null"],"description":"Task item ID."},"surrogateKey":{"type":"string","description":"[Surrogate key](https://www.ibm.com/docs/en/ida/9.1?topic=keys-surrogate) unique identifier of the task item."},"domain":{"type":"string","description":"Task item domain in the VTEX environment."},"target":{"type":"array","description":"Task item target array.","items":{"type":"object","description":"Task item target details.","properties":{"id":{"type":"string","description":"Task item target ID."},"type":{"type":"string","description":"Task item target type."},"url":{"type":"string","description":"Task item target URL."}}}},"name":{"type":"string","description":"Task item name."},"translateMapping":{"type":"object","description":"Task item translate mapping.","properties":{"ar":{"type":"string","description":"Task item Arabic translation."},"bg":{"type":"string","description":"Task item Bulgarian translation."},"en":{"type":"string","description":"Task item English translation."},"es":{"type":"string","description":"Task item Spanish translation."},"fr":{"type":"string","description":"Task item French translation."},"it":{"type":"string","description":"Task item Italian translation."},"ja":{"type":"string","description":"Task item Japanese translation."},"ko":{"type":"string","description":"Task item Korean translation."},"nl":{"type":"string","description":"Task item Dutch translation."},"pt":{"type":"string","description":"Task item Portuguese translation."},"ro":{"type":"string","description":"Task item Romanian translation."},"th":{"type":"string","description":"Task item Thai translation."}}},"context":{"type":"string","description":"Task item context."},"priority":{"type":"string","description":"Task item level of priority."},"status":{"type":"string","description":"Task item status."},"creationDate":{"type":"string","description":"Task item creation date and time in  in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DD hh:mm:ss[.nnnnnnn]Z`."},"assignee":{"type":["object","null"],"description":"Task item assignee.","properties":{"id":{"type":["string","null"],"description":"Task item assignee ID."},"name":{"type":"string","description":"Task item assignee name."},"email":{"type":"string","description":"Task item assignee email."},"key":{"type":["string","null"],"description":"Task item assignee key."}}}}}},"paging":{"type":"object","description":"Object with information about pagination.","properties":{"page":{"type":"integer","description":"Task item page number."},"perPage":{"type":"integer","description":"Task items per page."},"total":{"type":"integer","description":"Total task items."},"pages":{"type":"integer","description":"Total task pages."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This endpoint allows you to filter [VTEX DO](https://help.vtex.com/en/tutorial/vtex-do--7KMbRL4OslN8DTX9oiuCiu) tasks. You can choose between the following filtering options:

  - **Assignees:** using `assignee.email` and `status`. Example: `https://{{accountName}}.{{environment}}.com.br/api/do/tasks?assignee.email={{person@email.com}}&status={{open}}`. 

  - **Targets:** using `targetId` and `status`. Example: `https://{{accountName}}.{{environment}}.com.br/api/do/tasks?target.id={{name}}&status={{open}}`. 

  - **Paged tasks:** using `page`, `perPage` and `status`. Example: `https://{{accountName}}.{{environment}}.com.br/api/do/tasks?page={{1}}&perPage={{10}}&status=;{{-Closed}}`. 

  - **Context:** using `context`, `page`, `perPage` and `status`. Example: `https://{{accountName}}.{{environment}}.com.br/api/do/tasks?context={{context}}&page={{1}}&perPage={{10}}&status={{-Closed}}`.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `assignee.email` | query | If you wish to list tasks by assignee, insert the desired assignee's email and status. |
  | `target.id` | query | If you wish to list tasks by target, insert the desired `targetId` and `status`. |
  | `context` | query | If you wish to list tasks by context, insert the desired context, `page`, `perPage` and `status`. |
  | `page` | query | If you wish to list tasks by context, also insert the desired `page`. |
  | `perPage` | query | If you wish to list tasks by context, also insert the desired `perPage` value. |
  | `status` | query | If you wish to list tasks by context, also insert the desired `status`. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

