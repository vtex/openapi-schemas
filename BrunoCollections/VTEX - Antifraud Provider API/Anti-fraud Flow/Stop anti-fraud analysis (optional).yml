runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[DELETE]::/transactions/:transactions.Id - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[DELETE]::/transactions/:transactions.Id - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[DELETE]::/transactions/:transactions.Id - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[DELETE]::/transactions/:transactions.Id - Schema is valid", function () {
          const schema = {"type":"array","items":{"required":["name"],"type":"object","description":"Payment methods information.","properties":{"name":{"type":"string","description":"Payment method name."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Notifies whether the order has been canceled by the store or the buyer before completing the anti-fraud analysis status.

   This endpoint is not mandatory for the antifraud flow to work. Check this [developer guide](https://developers.vtex.com/docs/guides/how-the-integration-protocol-between-vtex-and-antifraud-companies-works) for more details.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `transactions.Id` | path | (Required) VTEX transaction ID. This parameter is the same `id` sent in the request body of the [Send Anti-fraud Data endpoint](https://developers.vtex.com/docs/api-reference/antifraud-provider-protocol#post-/transactions). |
  | `X-PROVIDER-API-AppKey` | header | (Required) Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `X-PROVIDER-API-AppToken` | header | (Required) Unique token created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "name": "CreditCard"
    },
    {
      "name": "DebitCard"
    },
    {
      "name": "GiftCard"
    },
    {
      "name": "BankIssueInvoice"
    },
    {
      "name": "Voucher"
    },
    {
      "name": "Promissory"
    }
  ]
  ```
