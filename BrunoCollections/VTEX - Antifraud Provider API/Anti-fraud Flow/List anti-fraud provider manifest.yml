info:
  name: List anti-fraud provider manifest
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/manifest"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/manifest - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/manifest - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/manifest - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/manifest - Schema is valid", function () {
          const schema = {"required":["customFields"],"type":"object","description":"Custom fields information.","properties":{"cardholderDocument":{"type":"string","description":"Indicates the requirement of cardholder document in card transactions. The field has three possible values: `required`, `optional`, or `unused`."},"allowAntifraudOnGiftCard":{"type":"boolean","description":"Indicates whether the anti-fraud provider can process payment transactions made using [gift cards](https://developers.vtex.com/docs/guides/gift-card-integration-guide)."},"customFields":{"type":"array","description":"Describes the customized fields supported by the connector.","items":{"type":"object","description":"Custom fields information.","properties":{"name":{"type":"string","description":"Custom field name."},"type":{"type":"string","description":"Custom field type. Sensitive or security data should be defined as `password`.","enum":["text","password","select"]},"options":{"type":"array","description":"In case of `select` type, the possible params are `text` and `value`.","items":{"type":"object","description":"Custom field information.","properties":{"text":{"type":"string","description":"Custom field description."},"value":{"type":"string","description":"Custom field value."}}}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns the custom fields of the anti-fraud provider manifest.

  ## Permissions

  This endpoint does not require [authentication](https://developers.vtex.com/docs/guides/authentication) or [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "cardholderDocument": "required",
    "allowAntifraudOnGiftCard": true,
    "customFields": [
      {
        "name": "AnalysisMode",
        "type": "text"
      },
      {
        "name": "Client secret",
        "type": "password"
      },
      {
        "name": "AnalysisLocation",
        "type": "select",
        "options": [
          {
            "text": "MEX",
            "value": "Latin America"
          },
          {
            "text": "USA",
            "value": "United States"
          }
        ]
      }
    ]
  }
  ```
