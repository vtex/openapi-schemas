runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[PUT]::/transactions/:transactionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/transactions/:transactionId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[PUT]::/transactions/:transactionId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[PUT]::/transactions/:transactionId - Schema is valid", function () {
          const schema = {"required":["id","status","fraudRiskPercentage","analysisType","responses"],"type":"object","description":"Anti-fraud transaction data.","properties":{"id":{"type":"string","description":"VTEX transaction ID. The ID of this transaction must be in the response."},"status":{"type":"string","description":"Transaction status from provider. Must be one of the values: `approved`, `denied` or `undefined`."},"fraudRiskPercentage":{"type":"number","description":"Fraud risk percentage."},"analysisType":{"type":"string","description":"Analysis type. Valid values are `automatic` or `manual`."},"responses":{"type":["string","null"],"description":"Value dictionary to add custom responses from analysis."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Receives a new transaction anti-fraud data. This step is performed only if all payments are authorized.

  VTEX expects that your anti-fraud provider process this request and retrieves the process result. After that, the VTEX order flow will check the response status to cancel or approve the transaction.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `transactions.Id` | path | (Required) VTEX transaction ID. This parameter is the same `id` sent in the request body of the [Send Anti-fraud Data endpoint](https://developers.vtex.com/docs/api-reference/antifraud-provider-protocol#post-/transactions). |
  | `X-PROVIDER-API-AppKey` | header | (Required) Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `X-PROVIDER-API-AppToken` | header | (Required) Unique token created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "D3AA1FC8372E430E8236649DB5EBD08E",
    "status": "approved",
    "fraudRiskPercentage": 0,
    "analysisType": "automatic",
    "responses": null
  }
  ```
