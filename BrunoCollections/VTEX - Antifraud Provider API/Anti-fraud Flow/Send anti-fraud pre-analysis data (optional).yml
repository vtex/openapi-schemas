runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/pre-analysis - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/pre-analysis - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/pre-analysis - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/pre-analysis - Schema is valid", function () {
          const schema = {"required":["id","tid","code","message","status","score","analysisType","responses"],"type":"object","description":"Anti-fraud data.","properties":{"id":{"type":"string","description":"VTEX transaction ID. The ID of this transaction must be in the response."},"tid":{"type":"string","description":"Provider transaction ID. The ID of this transaction must be in the response. The anti-fraud provider must generate a unique transaction ID."},"code":{"type":"string","description":"Error code returned from provider. It will be logged in transaction interactions log."},"message":{"type":"string","description":"Error message returned from provider. It will be logged in transaction interactions log."},"status":{"description":"Pre-analysis status from provider. Must be `approved` or `denied`.","enum":["approved","denied"]},"score":{"type":"number","description":"Value of the risk score. The maximum value is `100.00`, which means total fraud."},"analysisType":{"type":"string","description":"Pre-analysis type. Must be `automatic`."},"responses":{"required":["foo","custom"],"type":"object","description":"Responses information.","properties":{"foo":{"type":"string","description":"Any foo information."},"custom":{"type":"string","description":"Any custom value."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Receives a new transaction anti-fraud data for (synchronous) pre-analysis. This step is performed before payments authorization.

  >⚠️ This endpoint can only be used if your anti-fraud provider already has the pre-analysis function configured within VTEX. To check if it is already configured, in the VTEX Admin, go to **Store Settings > Payment > Providers**, click the name of your anti-fraud provider, and verify if the **Enable Risk Pre-Analysis** field is available to be selected. If the **Enable Risk Pre-Analysis** field is not available, check with your anti-fraud provider if this feature is available in their integration and open a ticket in our [VTEX Support](https://help.vtex.com/en/support) to update the connector.

  >⚠️ The pre-analysis does not exclude the need for full analysis after payments authorization.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `X-PROVIDER-API-AppKey` | header | (Required) Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `X-PROVIDER-API-AppToken` | header | (Required) Unique token created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "D3AA1FC8372E430E8236649DB5EBD08E",
    "tid": "4692c1f54d514fe69da0b472a3b2a770",
    "code": "customCode",
    "message": "customMessage",
    "status": "approved",
    "score": 5.01,
    "analysisType": "automatic",
    "responses": {
      "foo": "anyFoo",
      "custom": "customAnyValue"
    }
  }
  ```
