info:
  name: 3. Return to VTEX
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/authorizationCode?providerAuthorizationCode={providerAuthorizationCode}"
  headers:
    - name: X-PROVIDER-API-AppKey
      value: "{{X-PROVIDER-API-AppKey}}"
    - name: X-PROVIDER-API-AppToken
      value: "{{X-PROVIDER-API-AppToken}}"
  params:
    - name: providerAuthorizationCode
      value: "{providerAuthorizationCode}"
      type: query
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/authorizationCode - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Through this endpoint, the provider will redirect the store administrator to the VTEX website using the `returnUrl` passed from VTEX to create token.

  The `returnUrl` must be filled with your query string **authorizationCode**.

  Example:

  If you receive the following URL:

  `https://store.vtex.com/return?authorizationCode=&otherparams...`

  and your **authorizationCode** is `pro2018`. Then, you redirect the store administrator to: `https://store.vtex.com/return?authorizationCode=pro2018&otherparams...`.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `providerAuthorizationCode` | query | (Required) Provider authorization code information. |
  | `X-PROVIDER-API-AppKey` | header | (Required) Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `X-PROVIDER-API-AppToken` | header | (Required) Unique token created by the provider and configured on the provider configuration page (Admin VTEX). |
