info:
  name: 4. Get credentials
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/authorization/credentials?authorizationCode={authorizationCode}&applicationId=vtex"
  headers:
    - name: X-PROVIDER-API-AppKey
      value: "{{X-PROVIDER-API-AppKey}}"
    - name: X-PROVIDER-API-AppToken
      value: "{{X-PROVIDER-API-AppToken}}"
    - name: Accept
      value: application/json
  params:
    - name: authorizationCode
      value: "{authorizationCode}"
      type: query
    - name: applicationId
      value: vtex
      type: query
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/authorization/credentials - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/authorization/credentials - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/authorization/credentials - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/authorization/credentials - Schema is valid", function () {
          const schema = {"required":["applicationId","appKey","appToken"],"type":"object","description":"Credentials information.","properties":{"applicationId":{"type":"string","description":"This value is always identified as `vtex`."},"appKey":{"type":"string","description":"It will be used in all API requests as X-VTEX-API-AppKey."},"appToken":{"type":"string","description":"It will be used in all API requests as X-VTEX-API-AppToken."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves merchant credentials.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `authorizationCode` | query | (Required) Code generate by affiliation that will be used to identify the merchant authorization. |
  | `applicationId` | query | (Required) VTEX application identifier. |
  | `X-PROVIDER-API-AppKey` | header | (Required) Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `X-PROVIDER-API-AppToken` | header | (Required) Unique token created by the provider and configured on the provider configuration page (Admin VTEX). |

  ## Example response (`200`)

  ```json
  {
    "applicationId": "vtex",
    "appKey": "c5a5e3f1-4a77-4a00-8b53-0d1adb3e9628",
    "appToken": "57ea254d-f3d3-488d-88d7-129766037ed1"
  }
  ```
