info:
  name: 2. Redirect
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/redirect?token={token}&applicationId=vtex"
  headers:
    - name: X-PROVIDER-API-AppKey
      value: "{{X-PROVIDER-API-AppKey}}"
    - name: X-PROVIDER-API-AppToken
      value: "{{X-PROVIDER-API-AppToken}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: token
      value: "{token}"
      type: query
    - name: applicationId
      value: vtex
      type: query
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/redirect - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Through this endpoint, VTEX will redirect the store administrator to the Payment provider website using the `token` retrieved in the [previous request](https://developers.vtex.com/docs/api-reference/antifraud-provider-protocol#post-/authorization/token).

  At this point in the flow, the provider shows the login site to the store admin and authorizes VTEX to use its integration as a valid Payment Provider Processor. After that, your server generates an `authorizationCode`.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `token` | query | (Required) Token information. |
  | `applicationId` | query | (Required) VTEX application identifier. |
  | `X-PROVIDER-API-AppKey` | header | (Required) Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `X-PROVIDER-API-AppToken` | header | (Required) Unique token created by the provider and configured on the provider configuration page (Admin VTEX). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
