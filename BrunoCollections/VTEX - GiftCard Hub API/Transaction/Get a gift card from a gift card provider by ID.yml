info:
  name: Get a gift card from a gift card provider by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: giftCardProviderId
      value: GiftCardExample
      type: path
    - name: giftCardId
      value: "5"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"id":{"type":"string","description":"Gift card identification."},"redemptionToken":{"type":"string","description":"Gift card redemption token."},"redemptionCode":{"type":"string","description":"Gift card identification code used at checkout. Minimum of 6 characters."},"balance":{"type":"number","description":"Gift card current balance. For newly created gift cards, the balance will be 0.0."},"emissionDate":{"type":"string","description":"Gift card emission date."},"expiringDate":{"type":"string","description":"Gift card expiration date."},"currencyCode":{"type":"string","description":"Currency code in ISO 4217."},"discount":{"type":"boolean","description":"Deprecated field."},"transactions":{"type":"object","description":"Transactions information.","properties":{"href":{"type":"string","description":"This is one of the fields inside the `_self`. It is exactly the route that identifies this provider on the Hub's API, but it is not the same thing as the `serviceURL`."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns a specific gift card from a gift card provider.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | GiftCard | GiftCard | **View Gift Card providers** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `giftCardProviderId` | path | (Required) Gift card provider identification. |
  | `giftCardId` | path | (Required) Gift card identification. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "5",
    "redemptionToken": "32ScL57220Vapb8pc50HJ3mWH1cl1L8x",
    "redemptionCode": "***********ASDQ",
    "balance": 870,
    "emissionDate": "2014-04-24T20:22:58.163",
    "expiringDate": "2016-01-01T00:00:00",
    "currencyCode": "USD",
    "discount": false,
    "transactions": {
      "href": "cards/954/transactions"
    }
  }
  ```
