info:
  name: Get a gift card from a gift card provider
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/giftcardproviders/:giftCardProviderId/giftcards/_search"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: REST-Range
      value: resources=0-49
      disabled: true
  params:
    - name: giftCardProviderId
      value: GiftCardExample
      type: path
  body:
    type: json
    data: |-
      {
        "client": {
          "id": "3b1abc17-988e-4a14-8b7f-31fc6a5b955c",
          "email": "email@domain.com",
          "document": "42151783120"
        },
        "cart": {
          "grandTotal": 0,
          "relationName": "loyalty-program",
          "redemptionCode": "***********ASDQ",
          "discounts": 20,
          "shipping": 2,
          "taxes": 0,
          "items": [
            {
              "productId": "2000000",
              "id": "2000002",
              "refId": "MEV41",
              "name": "Shoes",
              "price": 200,
              "quantity": 1
            },
            {
              "productId": "2000000",
              "id": "2000002",
              "refId": "MEV41",
