info:
  name: List all gift card transactions cancellations
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId/transactions/:tId/cancellations"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: giftCardProviderId
      value: GiftCardExample
      type: path
    - name: giftCardId
      value: 7d1dfc17-989e-4t21-8b7f-5103c6a5b925c_70
      type: path
    - name: tId
      value: jac68316306453f4b8tr3fdb892dfba1
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId/transactions/:tId/cancellations - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId/transactions/:tId/cancellations - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId/transactions/:tId/cancellations - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/giftcardproviders/:giftCardProviderId/giftcards/:giftCardId/transactions/:tId/cancellations - Schema is valid", function () {
          const schema = {"required":["oid","value","date"],"type":"array","items":{"type":"object","description":"Transaction information.","properties":{"oid":{"type":"string","description":"Operation identification."},"value":{"type":"number","description":"Value information."},"date":{"type":"string","description":"Date of the transaction in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format (`YYYY-MM-DDThh:mm:ss.fff`)."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns all transactions cancelled for a specific gift card.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | GiftCard | GiftCard | **View Gift Card providers** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `giftCardProviderId` | path | (Required) Gift card provider identification. |
  | `giftCardId` | path | (Required) Gift card identification. |
  | `tId` | path | (Required) Transaction ID generated by the provider. It is different from the `transactionId` generated by VTEX. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "oid": "1248f9b9d4564792b64013bba27151f2",
      "value": 30,
      "date": "2023-06-02T18:24:49.252855Z"
    },
    {
      "oid": "8cb71c9e893A67E1b94d9b2ba15d102F",
      "value": 5,
      "date": "2023-06-08T11:30:00.252855Z"
    }
  ]
  ```
