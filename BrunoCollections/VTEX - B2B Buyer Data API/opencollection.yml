opencollection: 1.0.0

info:
  name: VTEX - B2B Buyer Data API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The B2B Buyer Data API allows you to create, retrieve, update, delete, and search buyer documents stored in the `shopper` data entity.

    >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
