info:
  name: Get buyer by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/shopper/documents/:buyerId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: buyerId
      value: buyer-8abea412-4702-46fb-b835-3edb29d8a261
      type: path
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/dataentities/shopper/documents/:buyerId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/shopper/documents/:buyerId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/shopper/documents/:buyerId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/shopper/documents/:buyerId - Schema is valid", function () {
          const schema = {"type":"object","description":"Buyer document. May include additional properties beyond the standard schema if they were previously stored.","properties":{"userId":{"type":"string","format":"uuid","description":"Unique identifier for the buyer created by [VTEX ID API](https://developers.vtex.com/docs/api-reference/vtex-id-api#post-/api/authenticator/v1/storefront/users)."},"email":{"type":"string","description":"Buyer's email."},"firstName":{"type":"string","description":"Buyer's first name."},"lastName":{"type":"string","description":"Buyer's last name."},"document":{"type":"string","description":"Buyer's document number (e.g., CPF number)."},"documentType":{"type":"string","description":"Type of the document provided (e.g., `cpf`)."},"phone":{"type":"string","description":"Buyer's phone number."},"cards":{"type":"array","description":"List of cards associated with the buyer. This field is used by the checkout module.","items":{"type":"object","description":"Credit card information.","properties":{"cardId":{"type":"string","description":"Unique identifier of the saved card."},"paymentSystem":{"type":"string","description":"Code representing the payment system (e.g., `2` for Visa)."},"paymentSystemName":{"type":"string","description":"Name of the payment system (e.g., `Visa`)."},"cardNumber":{"type":"string","description":"Masked credit card number."},"bin":{"type":"string","description":"Bank Identification Number - the first digits of the card."},"expirationDate":{"type":"string","description":"Expiry date of the card in `MM/YYYY` format."},"useCvvForAuthorization":{"type":"boolean","description":"Indicates if CVV is required for authorization."},"cardLabel":{"type":"string","description":"Label or nickname for the card."},"isCardToken":{"type":"boolean","description":"Indicates whether the card data is tokenized."},"availableAddresses":{"type":"array","description":"Array of address IDs the card is associated with.","items":{"type":"string","description":"Address identifier."}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This endpoint retrieves a buyer entity document by User ID.

  > ℹ️ The response may include additional properties beyond the standard schema if they were previously stored (e.g., `phone2`, `marketingOptIn`).

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Dynamic Storage | Dynamic storage generic resources | **Read only documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Insert or update document (not remove)** |
  | Dynamic Storage | Dynamic storage generic resources | **Full access to all documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `buyerId` | path | (Required) Unique identifier for the buyer created by [VTEX ID API](https://developers.vtex.com/docs/api-reference/vtex-id-api#post-/api/authenticator/v1/storefront/users). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "userId": "8abea412-4702-46fb-b835-3edb29d8a261",
    "email": "john@vtex.com",
    "firstName": "John",
    "lastName": "Doe",
    "document": "514.427.690-33",
    "documentType": "cpf",
    "phone": "11917118990",
    "phone2": "11987654321",
    "marketingOptIn": true,
    "cards": [
      {
        "cardId": "D05881AD4F424A6C93D8536C9F7F992E",
        "paymentSystem": "2",
        "paymentSystemName": "Visa",
        "cardNumber": "************3232",
        "bin": "22343333",
        "availableAddresses": [
          "12345"
        ],
        "expirationDate": "02/2029",
        "useCvvForAuthorization": true,
        "isCardToken": false
      }
    ]
  }
  ```
