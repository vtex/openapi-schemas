 data type for the use CVV for authorization field."}},"description":"Indicates the expected data type for the use CVV for authorization field."},"cardLabel":{"type":"object","description":"Card label definition.","properties":{"type":{"type":"string","description":"Indicates the expected data type for the card label field."}}},"isCardToken":{"type":"object","description":"`isCardToken` definition.","properties":{"type":{"type":"string","description":"Indicates the expected data type for the `isCardToken` field."}}},"availableAddresses":{"type":"object","description":"Indicates the expected data type for the available addresses field.","properties":{"type":{"type":"string","description":"Indicates the expected data type for the available addresses field."},"items":{"type":"object","description":"Address identifier.","properties":{"type":{"type":"string","description":"Indicates the expected data type for the address identifier field."}}}}}}},"additionalProperties":{"type":"boolean","description":"When `true`, allows clients to send and persist custom fields beyond the defined schema. This enables storing extra fields like `phone2`, `marketingOptIn`, or any buyer-specific data."}}}}}}},"additionalProperties":{"type":"boolean","description":"When `true`, allows clients to send and persist custom fields beyond the defined schema. This enables storing extra fields like `phone2`, `marketingOptIn`, or any buyer-specific data."},"requiredField":{"title":"required","type":"array","description":"List of required properties.","items":{"type":"string","description":"Name of a required property field."}},"v-indexed":{"type":"array","description":"List of indexed properties.","items":{"type":"string","description":"Name of an indexed property field."}}}}},"required":["name","schema"]}};
