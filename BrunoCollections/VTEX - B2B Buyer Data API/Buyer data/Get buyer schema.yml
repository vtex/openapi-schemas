info:
  name: Get buyer schema
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/shopper/schemas/v1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

