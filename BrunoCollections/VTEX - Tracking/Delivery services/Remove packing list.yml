info:
  name: Remove packing list
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/services"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      [
        {
          "invoice": "string",
          "serie": "string"
        },
        {
          "invoice": "string",
          "serie": "string"
        }
      ]

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PUT]::/services - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Removes Packing List on your VTEX Tracking configuration. Your request body must contain the invoice and serie fields.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
