info:
  name: Get delivery services list
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/services"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: status
      value: Ativo
      type: query
      disabled: true
    - name: dateInit
      value: 2024-05-28
      type: query
      disabled: true
    - name: dateEnd
      value: 2024-05-29
      type: query
      disabled: true
    - name: pageSize
      value: "40"
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{bearerToken}}"

