runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/order-integration/orders - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/order-integration/orders - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/order-integration/orders - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/order-integration/orders - Schema is valid", function () {
          const schema = {"required":["marketplaceOrderId","accountName","code","flow","success","operationId","errors","fields","message"],"type":"object","description":"Object for delivery by seller integration.","properties":{"marketplaceOrderId":{"type":["string","null"],"description":"String that indicates the order's ID in the marketplace."},"accountName":{"type":"string","description":"String that indicates which account made the request."},"code":{"type":"string","description":"String with a internal Channel Order API code that classifies the response. The possible values returned in this field are described in the [Response Codes]() section."},"flow":{"type":"string","description":"String containing the name of the flow responsible for the response. This field can contain the following values: \n\n`PlaceOrder`: when integrating new orders \n\n`ApproveOrder`: when approving existing orders \n\n`Unknown`: when we’re not able to identify the flow."},"success":{"type":"boolean","description":"Boolean that indicates if the response is successful or not."},"operationId":{"type":["string","null"],"description":"String GUID that identifies the operation in our service. This field can be used to help us analyze unexpected errors or behaviors."},"errors":{"type":["array","null"],"description":"List with errors related to the response, if there's any.","items":{"type":"object","description":"Information about an item.","required":["source","code","description"],"properties":{"source":{"type":"string","description":"Includes the following fields pointing out the context of the error: \n\n`Fulfillment` \n\n`Checkout` \n\n`Order Integration`."},"code":{"type":"string","description":"String containing the code returned by the source. Example value: If the source is `Fulfillment`, the code can be FMT005 to indicate that the item(s) in the order are not available.","enum":["FMT001","FMT002","FMT003","FMT004","FMT005"]},"description":{"type":"string","description":"String containing the error message and description returned by the source."}}}},"fields":{"type":["object","null"],"description":"Structure with important fields for the connector. This structure is only returned if the response is successful.","required":["mainOrderId"],"properties":{"mainOrderId":{"type":"string","description":"String with the order’s ID inside the main seller account in VTEX."},"franchiseOrderId":{"type":"string","description":"String with the order's ID inside the franchise seller account in VTEX. Only returned if the order was integrated using the [Multilevel Omnichannel Inventory](https://help.vtex.com/en/tutorial/multilevel-omnichannel-inventory--7M1xyCZWUyCB7PcjNtOyw4) feature, that is: \n\n- `allowFranchises` field set to `true` when integrating the order \r\n- SLA chosen for the order is from a franchise account."}}},"message":{"type":"string","description":"String with a message explaining the code returned in the response."}},"example":{"marketplaceOrderId":null,"accountName":"grocery1","code":"SOI003","flow":"PlaceOrder","success":true,"operationId":null,"errors":null,"fields":{"mainOrderId":"MKP-123456789","franchiseOrderId":"432874921387409182347"},"message":"Order successfully enqueued"}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
