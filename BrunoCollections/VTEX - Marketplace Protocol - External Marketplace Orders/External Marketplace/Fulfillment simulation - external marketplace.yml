docs: |-
  This endpoint can be triggered by marketplaces to simulate the fulfillment of an item in the cart.

  The fulfillment information is useful whenever you need to know the availability of fulfilling an order for a specific cart setting, since the API response will let you know the updated price, inventory and shipping data.
  ## Permissions

  Check with your service provider to know what permissions are needed.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | (Required) Name of the VTEX account. Used as part of the URL. |
  | `environment` | path | (Required) Environment to be used. It is passed as part of the URL. |
  | `affiliateId` | query | The affiliate ID code created by the seller. |
  | `sc` | query | Trade Policy (Sales Channel) identification. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  _Omitted here: 7 KB. See `OK` in PostmanCollections._
