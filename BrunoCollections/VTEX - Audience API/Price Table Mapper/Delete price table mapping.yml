info:
  name: Delete price table mapping
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/price-table-mapper/pvt/mapping/:audienceId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: audienceId
      value: f8cb4d62-b43a-599c-89cc-027fadaa4b18
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[DELETE]::/api/price-table-mapper/pvt/mapping/:audienceId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[DELETE]::/api/price-table-mapper/pvt/mapping/:audienceId - Response has empty Body", function () {
          const data = res.getBody();
          expect(data === undefined || data === null || data === "").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Removes the price table mapping for the provided audience.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `audienceId` | path | (Required) ID that represents an audience. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
