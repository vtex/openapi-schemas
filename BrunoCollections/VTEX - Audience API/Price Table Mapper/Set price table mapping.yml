info:
  name: Set price table mapping
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/price-table-mapper/pvt/mapping/:audienceId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: audienceId
      value: f8cb4d62-b43a-599c-89cc-027fadaa4b18
      type: path
  body:
    type: json
    data: |-
      [
        "myPriceTable",
        "myPriceTable"
      ]
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PUT]::/api/price-table-mapper/pvt/mapping/:audienceId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/api/price-table-mapper/pvt/mapping/:audienceId - Response has empty Body", function () {
          const data = res.getBody();
          expect(data === undefined || data === null || data === "").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Sets one or more price table mappings for the specified audience. Each price table ID in the array defines a distinct price table that applies to the audience.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `audienceId` | path | (Required) ID that represents an audience. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
