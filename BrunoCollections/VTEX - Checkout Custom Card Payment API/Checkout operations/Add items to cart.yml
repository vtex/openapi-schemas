info:
  name: Add items to cart
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/checkout/pub/orderForm/:orderFormId/items"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: orderFormId
      value: B0935AF4429441ABB4161111ED9D1104
      type: path
  body:
    type: json
    data: |-
      {
        "orderItems": [
          {
            "id": 1,
            "seller": "1",
            "quantity": 10
          }
        ]
      }
  auth: inherit

