info:
  name: Place order
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/checkout/pub/orderForm/:orderFormId/transaction"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: orderFormId
      value: B0935AF4429441ABB4161111ED9D1104
      type: path
  body:
    type: json
    data: |-
      {
        "savePersonalData": true,
        "optinNewsLetter": true,
        "value": 20100,
        "referenceValue": 20100,
        "interestValue": 0
      }
  auth: inherit

