info:
  name: Validate client login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/vtexid/pub/authentication/classic/validate?an=apiexamples"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: apiexamples
      type: query
  body:
    type: form-urlencoded
    data:
      - name: login
        value: user@example.com
      - name: password
        value: Password123
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/vtexid/pub/authentication/classic/validate - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/vtexid/pub/authentication/classic/validate - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/vtexid/pub/authentication/classic/validate - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/vtexid/pub/authentication/classic/validate - Schema is valid", function () {
          const schema = {"type":"object","properties":{"authStatus":{"type":"string","description":"Authentication status."},"promptMFA":{"type":"boolean","description":"Indicates if multi-factor authentication should be prompted."},"lastAttemptAvailable":{"type":["string","null"],"description":"Last attempt available."},"clientToken":{"type":["string","null"],"description":"Client token."},"authCookie":{"type":"object","description":"Authentication cookie information.","properties":{"Name":{"type":"string","description":"Cookie name."},"Value":{"type":"string","description":"Cookie value."}}},"accountAuthCookie":{"type":"object","description":"Account authentication cookie information.","properties":{"Name":{"type":"string","description":"Cookie name."},"Value":{"type":"string","description":"Cookie value."}}},"expiresIn":{"type":"integer","description":"Expiration time in seconds."},"userId":{"type":"string","description":"User identifier."},"phoneNumber":{"type":["string","null"],"description":"Phone number."},"scope":{"type":["string","null"],"description":"Scope."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Validates user credentials and returns authentication cookies.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `an` | query | (Required) Account name parameter. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "authStatus": "Success",
    "promptMFA": false,
    "lastAttemptAvailable": null,
    "clientToken": null,
    "authCookie": {
      "Name": "VtexIdclientAutCookie_gatewayqabrmkt",
      "Value": "<auth-cookie-placeholder>"
    },
    "accountAuthCookie": {
      "Name": "VtexIdclientAutCookie_example",
      "Value": "<auth-cookie-placeholder>"
    },
    "expiresIn": 86399,
    "userId": "<user-id-placeholder>",
    "phoneNumber": null,
    "scope": null
  }
  ```
