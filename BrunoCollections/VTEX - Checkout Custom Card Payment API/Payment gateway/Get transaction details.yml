info:
  name: Get transaction details
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/pvt/transactions/:transactionId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: transactionId
      value: 1234567890ABC
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/pvt/transactions/:transactionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/pvt/transactions/:transactionId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/pvt/transactions/:transactionId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/pvt/transactions/:transactionId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"status":{"type":"string","description":"Transaction status.","enum":["Approved"]},"transactionId":{"type":"string","description":"Transaction ID."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves detailed information about a specific transaction.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  >ℹ️ This endpoint must use the `accountAuthCookie` value generated from the [Validate client login](https://developers.vtex.com/docs/api-reference/checkout-custom-card-payment-api#post-/api/vtexid/pub/authentication/classic/validate) endpoint.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `transactionId` | path | (Required) Unique identifier of the transaction. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "status": "Approved",
    "transactionId": "1234567890ABC"
  }
  ```
