info:
  name: List payments
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/pvt/transactions/:transactionId/payments?an=apiexamples"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: apiexamples
      type: query
    - name: transactionId
      value: 1234567890ABC
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/pvt/transactions/:transactionId/payments - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/pvt/transactions/:transactionId/payments - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/pvt/transactions/:transactionId/payments - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/pvt/transactions/:transactionId/payments - Schema is valid", function () {
          const schema = {"type":"array","description":"List of payments.","items":{"type":"object","description":"Payment object with fields.","properties":{"id":{"type":"string","description":"Payment ID."},"fields":{"type":"array","description":"Payment fields.","items":{"type":"object","description":"Payment field name and value.","properties":{"name":{"type":"string","description":"Field name."},"value":{"type":"string","description":"Field value."}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a list of payments associated with a transaction.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  >ℹ️ This endpoint must use the `accountAuthCookie` value generated from the [Validate client login](https://developers.vtex.com/docs/api-reference/checkout-custom-card-payment-api#post-/api/vtexid/pub/authentication/classic/validate) endpoint.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `transactionId` | path | (Required) Unique identifier of the transaction. |
  | `an` | query | (Required) Account name parameter. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "id": "payment-id-123",
      "fields": [
        {
          "name": "accountId",
          "value": "4A660C0DEA2D477C996D88C6D3FFB7C0"
        }
      ]
    }
  ]
  ```
