info:
  name: Get profile cards
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/profile-system/pvt/profiles/:profileId/vcs-checkout"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: profileId
      value: 12345678-1234-1234-1234-123456789012
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/profile-system/pvt/profiles/:profileId/vcs-checkout - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/profile-system/pvt/profiles/:profileId/vcs-checkout - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/profile-system/pvt/profiles/:profileId/vcs-checkout - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/profile-system/pvt/profiles/:profileId/vcs-checkout - Schema is valid", function () {
          const schema = {"type":"object","properties":{"paymentData":{"type":"string","description":"JSON string containing payment data with available accounts."},"orderFormIds":{"type":"string","description":"JSON array string of orderForm IDs."},"lastOrderTimestamp":{"type":"string","description":"Timestamp of the last order."},"lastUserPurchases":{"type":"string","description":"JSON array string of last user purchases."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the list of cards associated with a profile.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  >ℹ️ This endpoint must use the `accountAuthCookie` value generated from the [Validate client login](https://developers.vtex.com/docs/api-reference/checkout-custom-card-payment-api#post-/api/vtexid/pub/authentication/classic/validate) endpoint.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `profileId` | path | (Required) Unique identifier of the profile. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  _Omitted here: 5 KB. See `OK` in PostmanCollections._
