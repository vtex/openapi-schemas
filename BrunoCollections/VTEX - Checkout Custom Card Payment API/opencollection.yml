opencollection: 1.0.0

info:
  name: VTEX - Checkout Custom Card Payment API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Checkout Custom Card Cayment API allows flows for credit card tokenization in VTEX, covering profile management, card token vault operations, checkout processes, payment gateway interactions, and authentication workflows.

    >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
