opencollection: 1.0.0

info:
  name: VTEX - Promotions & Taxes API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    Check the new [Promotions onboarding guide](https://developers.vtex.com/vtex-rest-api/docs/promotions-overview). We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Promotions and is organized by focusing on the developer's journey.

     The Promotions & Taxes API allows you to manage and retrieve all promotions, coupons and tax rules from your VTEX store.

    ## Index

    ### Promotions and taxes
    - `GET` [Get all promotions](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/benefits/calculatorconfiguration)
    - `GET` [Get all taxes](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/taxes/calculatorconfiguration)
    - `GET` [Search promotion by name](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/benefits/calculatorconfiguration/search)
    - `GET` [Get promotion or tax by ID](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/calculatorconfiguration/-idCalculatorConfiguration-)
    - `POST` [Create or Update promotion or tax](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/calculatorconfiguration)
    - `POST` [Create Multiple SKU promotion](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/import/calculatorConfiguration)
    - `PUT` [Update Multiple SKU promotion](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#put-/api/rnb/pvt/import/calculatorConfiguration/-promotionId-)
    - `POST` [Archive promotion or tax](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/archive/calculatorConfiguration/-idCalculatorConfiguration-)
    - `POST` [Unarchive promotion or tax](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/unarchive/calculatorConfiguration/-idCalculatorConfiguration-)
    - `GET` [List archived promotions](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/archive/benefits/calculatorConfiguration)
    - `GET` [List archived taxes](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/archive/taxes/calculatorConfiguration)
    - `POST`[Seller opt-in or opt-out](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api#post-/api/rnb/pvt/calculatorconfiguration/-promotionId-/seller-opt)

    ### Coupons
    - `POST` [Create multiple coupons](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/multiple-coupons)
    - `POST` [Create or update coupon](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/coupon)
    - `GET` [Get coupon by coupon code](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/coupon/-couponCode-)
    - `GET` [Get archived coupon by coupon code](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/archive/coupon/-couponCode-)
    - `POST` [Archive coupon by coupon code](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/archive/coupon/-couponCode-)
    - `GET` [Get all coupons](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/coupon)
    - `POST` [Generate coupons in bulk](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/coupons)
    - `GET` [Get coupon usage](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/coupon/usage/-couponCode-)
    - `POST` [Unarchive coupon by coupon code](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/unarchive/coupon/-couponCode-)

    ### Prices (Legacy - v1)
    - `GET` [Get Price by SKU ID](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/price-sheet/-skuId-)
    - `DELETE` [Delete Price by SKU ID](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#delete-/price-sheet/-skuId-)
    - `GET` [Get all paged prices](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/price-sheet/all/-page-/-pageSize-)
    - `POST` [Get Price by context](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/price-sheet/context)
    - `GET` [Get Price by SKU ID and trade policy](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/price-sheet/-skuId-/-tradePolicy-)
    - `POST` [Save Price](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/price-sheet)

    ### Bundles
    - `POST` [Calculate discounts and taxes (Bundles)](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/pub/bundles)

    ### Campaign Audiences
    - `GET` [Get campaign audience configuration](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/campaignConfiguration/-campaignId-)
    - `GET` [Get all campaign audiences](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#get-/api/rnb/pvt/campaignConfiguration)
    - `POST` [Create campaign audience](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pvt/campaignConfiguration)

    ### Notifications
    - `POST` [Usage notification](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api/#post-/api/rnb/pub/notifications)


    ## Common parameters in the documentation

    | Parameter name | Description |
    | - | - |
    | `{{accountName}}`| Name of the VTEX account. Used as part of the URL. |
    | `{{environment}}`| Name of the VTEX account. Used as part of the URL. |
    | `{{X-VTEX-API-AppKey}}` | Unique identifier of the [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys). |
    | `{{X-VTEX-API-AppToken}}` | Secret token of the [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys).
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
