info:
  name: Calculate discounts and taxes bundles
  type: http
  seq: 1

http:
  method: POST
  url: http://example.com/.{{environment}}.com.br/api/rnb/pub/bundles
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "isShoppingCart": true,
        "origin": "Marketplace",
        "salesChannel": "1",
        "profileId": "aa",
        "items": [
          {
            "index": 0,
            "id": "160",
            "quantity": 3,
            "isGift": false,
            "measurementUnit": "un",
            "unitMultiplier": 1,
            "priceTags": [],
            "params": [
              {
                "name": "Seller@CatalogSystem",
                "value": "1"
              },
              {
                "name": "product@CatalogSystem",
                "value": "94"
              }
            ],
            "priceSheet": [],
            "logisticsInfos": [],
            "sellerId": "1",
            "productSpecifications": []
          }
        ],
        "params": [
          {
            "name": "product@CatalogSystem",
            "value": "2662"
          },
          {
            "name": "couponCode@Marketing",
            "value": "coupon"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Calculate discounts and taxes

  ## Permissions

  This endpoint is usually used internally for backend services and does not require user [permissions]((https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3)).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
