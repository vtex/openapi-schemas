tched items."},"multipleUsePerClient":{"type":"boolean","description":"Defines if the campaign audience can be used multiple times per client."},"useNewProgressiveAlgorithm":{"type":"boolean","description":"Use new progressive algorithm."},"percentualDiscountValueList":{"type":"array","description":"Percentual discount value list.","items":{"type":"number","description":"Percentual discount value."}},"type":{"type":"string","description":"Defines the type of promotion. Possible values are:\r\n- `regular`: Regular promotion\r\n- `combo`: Buy Together promotion\r\n- `forThePriceOf`: More for Less promotion\r\n- `progressive`: Progressive discount promotion\r\n- `buyAndWin`: Buy One Get One promotion\r\n- `campaign`: Campaign promotion\r\n- `tax`: Tax (reverse promotion, increases the price)","enum":["regular","combo","forThePriceOf","progressive","buyAndWin","campaign","tax"]},"idTypeDiscountBuyTogether":{"type":"integer","description":"Defines the ID type related to `type` field. Possible values are:\r\n- `1`: Buy Together promotion\r\n- `2`: Progressive promotion\r\n- `3`: More for Less promotion\r\n- `4`: Buy One Get One promotion\r\n- `5`: Campaign promotion","enum":[1,2,3,4,5]}}}}}};
