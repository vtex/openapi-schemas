info:
  name: Create or update coupon
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/rnb/pvt/coupon"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "utmSource": "email",
        "couponCode": "summersale10",
        "maxItemsPerClient": 10,
        "expirationIntervalPerUse": "00:00:00",
        "utmCampaign": "summer",
        "isArchived": false,
        "maxUsage": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/rnb/pvt/coupon - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/rnb/pvt/coupon - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/rnb/pvt/coupon - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/rnb/pvt/coupon - Schema is valid", function () {
          const schema = {"type":"object","properties":{"lastModifiedUtc":{"type":"string","description":"Date and time of the last update of the coupon in UTC format."},"utmSource":{"type":"string","description":"UTM source code."},"utmCampaign":{"type":"string","description":"UTM campaign code."},"couponCode":{"type":"string","description":"Coupon code."},"isArchived":{"type":"boolean","description":"Defines if the coupon is archived (`true`) or not (`false`)."},"maxItemsPerClient":{"type":"integer","description":"Maximum items per client that the coupon can be applied."},"expirationIntervalPerUse":{"type":"string","description":"Coupon expiration interval per use."},"maxUsage":{"type":"integer","description":"Amount of times the coupon can be used."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new single coupon or updates an existing coupon.

  To update an existing coupon, first make a [Get coupon by coupon code](https://developers.vtex.com/docs/api-reference/promotions-and-taxes-api#get-/api/rnb/pvt/coupon/-couponCode-) request, copy the response body and apply the desired changes. Then, use the complete edited body as a request body in this update call.

  >⚠️ When updating a coupon, don't change the original `couponCode`, or a new coupon will be created instead of the existing coupon being updated.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Rates and Benefits | Promotions | **Manage benefits and rates** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "lastModifiedUtc": "2021-11-10T14:24:39.3683694Z",
    "utmSource": "email",
    "utmCampaign": "summer",
    "couponCode": "summersale10",
    "isArchived": false,
    "maxItemsPerClient": 10,
    "expirationIntervalPerUse": "00:00:00",
    "maxUsage": 1
  }
  ```
