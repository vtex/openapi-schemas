info:
  name: List archived taxes
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/rnb/pvt/archive/taxes/calculatorConfiguration"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/rnb/pvt/archive/taxes/calculatorConfiguration - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/rnb/pvt/archive/taxes/calculatorConfiguration - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/rnb/pvt/archive/taxes/calculatorConfiguration - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/rnb/pvt/archive/taxes/calculatorConfiguration - Schema is valid", function () {
          const schema = {"type":"object","description":"Response object.","properties":{"items":{"type":"array","description":"Array with taxes.","items":{"type":"object","description":"Object with information about a tax.","properties":{"idCalculatorConfiguration":{"type":"string","description":"Tax ID."},"lastModifiedUtc":{"type":"string","description":"Date and time when the tax was last modified (UTC)."},"name":{"type":"string","description":"Tax name."},"beginDate":{"type":"string","description":"Tax start date (UTC)."},"endDate":{"type":"string","description":"Tax end date (UTC)."},"isActive":{"type":"boolean","description":"If set as `true` the tax is activated. If set as `false` the tax is deactivated."},"description":{"type":"string","description":"Tax internal description."},"type":{"description":"Defines the type of tax.","type":"string"},"utmSource":{"type":"string","description":"utmSource code."},"utmCampain":{"type":"string","description":"utmCampaign code."},"utmiCampaign":{"type":"string","description":"utmiCampaign code."},"status":{"type":"string","description":"Status of the tax."},"percentualTax":{"type":"number","description":"Percentual tax applied."},"isArchived":{"type":"boolean","description":"If set as `true` the tax is archived. If set as `false` the tax is not archived."},"hasMaxPricePerItem":{"description":"Defines if there is a maximum price per item.","type":"boolean"},"isTax":{"description":"Defines if it is a tax.","type":"boolean"},"campaigns":{"type":"array","description":"Campaign Audiences that activate this promotion.","items":{"type":"string","description":"Campaign."}},"activateGiftsMultiplier":{"description":"If set as `true`, it activates gifts Multiplier.","type":"boolean"},"scope":{"description":"Scope of the tax.","type":"object","properties":{"allCatalog":{"description":"Determines if the tax applies to all products in the Catalog (`true`) or not (`false`).","type":"boolean"},"skus":{"description":"Quantity of SKUs which activate or deactivate the tax.","type":"number"},"skusAreInclusive":{"description":"If set to `true`, this tax will be applied to any SKU present on the `skus` field. If set to `false`, SKUs present on that field will make this tax not to be applied.","type":"boolean"},"products":{"description":"Quantity of products which activate or deactivate the tax.","type":"number"},"productsAreInclusive":{"description":"If set to `true`, this tax will be applied to any product present on the `products` field. If set to `false`, products present on that field will make this tax not to be applied.","type":"boolean"},"collections":{"description":"Quantity of collections which activate or deactivate the tax.","type":"number"},"collectionsAreInclusive":{"description":"If set to `true`, this tax will be applied to any collection present on the `collections` field. If set to `false`, collections present on that field will make this tax not to be applied.","type":"boolean"},"categories":{"description":"Quantity of categories which activate or deactivate the tax.","type":"number"},"categoriesAreInclusive":{"type":"boolean","description":"If set to `true`, this tax will be applied to any category present on the `categories` field. If set to `false`, categories present on that field will make this tax not to be applied."},"brands":{"description":"Quantity of brands which activate or deactivate the tax.","type":"number"},"brandsAreInclusive":{"description":"If set to `true`, this tax will be applied to any brand present on the `brands` field. If set to `false`, brands present on that field will make this tax not to be applied.","type":"boolean"},"sellers":{"description":"Quantity of sellers which activate or deactivate the tax.","type":"number"},"sellersAreInclusive":{"description":"If set to `true`, this tax will be applied to any seller present on the `sellers` field. If set to `false`, sellers present on that field will make this tax not to be applied.","type":"boolean"}}},"maxUsage":{"type":"number","description":"Defines how many times the tax can be used."},"idsSalesChannel":{"type":"array","description":"List of Trade Policies that activate this tax.","items":{"type":"string","description":"Trade policy ID."}},"areSalesChannelIdsExclusive":{"type":"boolean","description":"If set to `false`, this tax will be applied to any trade policies present on the `idsSalesChannel` field. If set to `true`, trade policies present on that field will make this tax not to be applied."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists all archived taxes.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Rates and Benefits | Manage benefits and rates | **GerenciarPromocoesETarifas** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "items": [
      {
        "idCalculatorConfiguration": "90f4affc-fea0-424c-a7a7-c69aec7bbdc8",
        "lastModifiedUtc": "2022-05-16T19:43:06.1801742Z",
        "name": "Test Tax",
        "beginDate": "2022-05-09T03:00:00Z",
        "endDate": "2022-06-01T02:30:00Z",
        "isActive": false,
        "description": "My description",
        "type": "tax",
        "utmSource": "",
        "utmCampain": "",
        "utmiCampaign": "",
        "status": "inactive",
        "percentualTax": 10,
        "isArchived": true,
        "hasMaxPricePerItem": false,
        "isTax": true,
        "Campaigns": [],
        "activateGiftsMultiplier": false,
        "scope": {
          "allCatalog": false,
          "skus": 1,
          "skusAreInclusive": true,
          "products": 1,
          "productsAreInclusive": true,
          "collections": 1,
          "collectionsAreInclusive": true,
          "categories": 1,
          "categoriesAreInclusive": true,
          "brands": 1,
          "brandsAreInclusive": true,
          "sellers": 0,
          "sellersAreInclusive": false
        },
        "maxUsage": 0,
        "idsSalesChannel": [
          "1"
        ],
        "areSalesChannelIdsExclusive": false
      }
    ]
  }
  ```
