info:
  name: Update multiple SKU promotion
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/api/rnb/pvt/import/calculatorConfiguration/:promotionId"
  headers:
    - name: Content-Type
      value: text/csv
    - name: Accept
      value: application/json
    - name: X-VTEX-calculator-name
      value: Test
    - name: X-VTEX-cumulative
      value: "false"
      disabled: true
    - name: X-VTEX-cluster-operator
      value: any
      disabled: true
    - name: X-VTEX-cluster-expression
      value: cluster_name=true
      disabled: true
    - name: X-VTEX-start-date
      value: 2020-08-18T16:00:00+3:00
    - name: X-VTEX-end-date
      value: 2020-08-18T16:30:00+3:00
    - name: X-VTEX-accumulate-with-manual-prices
      value: "false"
  params:
    - name: promotionId
      value: dc6b6f59-ec2b-4a13-8490-0d1e0c53ddf9
      type: path
  body:
    type: file
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PUT]::/api/rnb/pvt/import/calculatorConfiguration/:promotionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates information from a Multiple SKU promotion. This scenario allows the creation of a single promotion for multiple SKUs with the Percentage Effect.  
  >⚠️ The limit of SKUs on a Multiple Effects promotion is 400.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Rates and Benefits | Manage benefits and rates | **GerenciarPromocoesETarifas** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `promotionId` | path | (Required) Promotion unique identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `X-VTEX-calculator-name` | header | (Required) Promotion Name. |
  | `X-VTEX-cumulative` | header | Defines if the Promotion is cumulative with other promotions. |
  | `X-VTEX-cluster-operator` | header | This header allows implementing the Promotion in multiples client clusters. You can set the value as `all` - the Promotion will be valid to all the clusters - or `any` - the Promotion will be valid to any of the clusters. |
  | `X-VTEX-cluster-expression` | header | Cluster that will be included in the Promotion. To add multiple clusters, create a header for each one of them. |
  | `X-VTEX-start-date` | header | (Required) Promotion start date. |
  | `X-VTEX-end-date` | header | (Required) Promotion end date. |
  | `X-VTEX-accumulate-with-manual-prices` | header | (Required) Condition that will accumulate the Promotion with manual prices or not. |
