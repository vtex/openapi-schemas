tivate the promotion.","items":{"type":"object","description":"Object with information of the brand.","properties":{"id":{"type":"string","description":"Brand ID."},"name":{"type":"string","description":"Brand Name."}}}},"brandsAreInclusive":{"type":"boolean","description":"If set to `true`, this promotion will be applied to any brand present on the `brands` field. If set to `false`, brands present on that field will make this promotion not to be applied."},"products":{"type":"array","description":"Object composed by the products that will activate or deactivate the promotion.","items":{"type":"object","description":"Object with information of the product.","properties":{"id":{"type":"string","description":"Product ID."},"name":{"type":"string","description":"Product Name."}}}},"productsAreInclusive":{"type":"boolean","description":"If set to `true`, this promotion will be applied to any product present on the `products` field. If set to `false`, products present on that field will make this promotion not to be applied."},"skus":{"type":"array","description":"Object composed by the SKUs that will activate or deactivate the promotion.","items":{"type":"object","description":"Object with information of the SKU.","properties":{"id":{"type":"string","description":"SKU ID."},"name":{"type":"string","description":"SKU Name."}}}},"skusAreInclusive":{"type":"boolean","description":"If set to `true`, this promotion will be applied to any SKU present on the `skus` field. If set to `false`, SKUs present on that field will make this promotion not to be applied."},"utmSource":{"type":"string","description":"Coupon utmSource code."},"utmCampaign":{"type":"string","description":"Coupon utmCampaign code."},"collections1BuyTogether":{"type":"array","description":"Collections that will generate the promotion, type **Buy Together**, **More for less**, **Progressive Discount**, **Buy One Get One**.","items":{"type":"object","description":"Object containing the ID and Name of the collec