 be added to the first list of the **Buy Together** promotion."},"name":{"type":"string","description":"Name of the SKU to be added to the first list of the **Buy Together** promotion."}}}},"listSku2BuyTogether":{"type":"array","description":"Array of objects, each containing ID and Name of an SKU to be added to the second list of the **Buy Together** promotion. Learn more about this type of promotion in the [Creating a Buy Together promotion](https://help.vtex.com/en/tutorial/buy-together--tutorials_323) documentation.","items":{"type":"object","description":"Object containing the ID and Name of the SKU to be added to the second list of the **Buy Together** promotion. Learn more about this type of promotion in the [Creating a Buy Together promotion](https://help.vtex.com/en/tutorial/buy-together--tutorials_323) documentation.","properties":{"id":{"type":"string","description":"ID of the SKU to be added to the second list of the **Buy Together** promotion."},"name":{"type":"string","description":"Name of the SKU to be added to the second list of the **Buy Together** promotion."}}}},"coupon":{"type":"array","description":"List of coupons.","items":{"type":"string","description":"Coupon code."}},"totalValueFloor":{"type":"number","description":"Minimum chart value to activate the promotion."},"totalValueCeling":{"type":"number","description":"Maximum chart value to activate the promotion."},"totalValueIncludeAllItems":{"type":"boolean","description":"Total value including all items."},"totalValueMode":{"type":"string","description":"If products that already are receiving a promotion, will be considered on the chart total value. There are three options available: `IncludeMatchedItems`, `ExcludeMatchedItems`, `AllItems`."},"collections":{"type":"array","description":"Array composed by the collections that will be activated or deactivated the promotion.","items":{"type":"object","description":"Object with information of the collection.","properties":{"id":{"type":"string","description":"Collection ID."},"name":{"type":"string","description":"Collection Name."}}}},"collectionsIsInclusive":{"type":"boolean","description":"If set to `true`, this promotion will be applied to any collection present on the `collections` field. If set to `false`, collections present on that field will make this promotion not to be applied."},"restrictionsBins":{"type":"array","description":"The discount will be granted if the card's BIN is given.","items":{"type":"string","description":"Card's BIN."}},"cardIssuers":{"type":"array","description":"List of card issuers.","items":{"type":"string","description":"Card issuer."}},"totalValuePurchase":{"type":"number","description":"Total value a client must have in past orders to active the promotion."},"slasIds":{"type":"array","description":"The discount will be granted if the shipping method is the same as the one given.","items":{"type":"string","description":"Shipping method."}},"isSlaSelected":{"type":"boolean","description":"Applies selected discount only when one of the defined shipping method is selected by the customer."},"isFirstBuy":{"type":"boolean","description":"Applies the discount only if it's a first buy."},"firstBuyIsProfileOptimistic":{"type":"boolean","description":"Applies the discount even if the user is not logged."},"compareListPriceAndPrice":{"type":"boolean","description":"If the **List Price** and **Price** are the same."},"isDifferentListPriceAndPrice":{"type":"boolean","description":"Applies the promotion only if the list price and price is different."},"zipCodeRanges":{"type":"array","description":"Range of the zip code that applies the promotion.","items":{"type":"object","description":"Object with information of the Zip Code","properties":{"zipCodeFrom":{"type":"string","description":"Initial Zip Code."},"zipCodeTo":{"type":"string","description":"Final Zip Code."},"inclusive":{"type":"boolean","description":"Defines if the zip code range is included in the promotion."}}}},"itemMaxPrice":{"type":"number","description":"Maximum price of the item."},"itemMinPrice":{"type":"number","description":"Minimum price of the item."},"installment":{"type":"integer","description":"Installment."},"isMinMaxInstallments":{"type":"boolean","description":"Set if the promotion will be applied considering a minimum and maximum values for installments."},"minInstallment":{"type":"integer","description":"Minimum value for installment."},"maxInstallment":{"type":"integer","description":"Maximum value for installment."},"merchants":{"type":"array","description":"List of merchants.","items":{"type":"string","description":"Merchant."}},"clusterExpressions":{"type":"array","description":"Criteria to select a customer cluster. Each item in this array should follow the format of an equality function (`{propertyname}={value}`) or the format of a contains function (`{propertyname} contains {value}`). In both options, `{propertyname}` must be replaced with the name of the field in the data entity, and `{value}` must be replaced with the value determined in Master Data. Find more information about these criteria in [Filling in the Customer cluster field](https://help.vtex.com/tutorial/creating-promotion-for-a-customer-cluster--tutorials_342#filling-in-the-customer-cluster-field).","items":{"type":"string","description":"Cluster expression."}},"clusterOperator":{"type":"string","description":"Cluster operator."},"paymentsRules":{"type":"array","description":"List of payment rules.","items":{"type":"string","description":"Payment rule."}},"giftListTypes":{"type":"array","description":"Gifts List Type.","items":{"type":"string","description":"Gift List Type."}},"productsSpecifications":{"type":"array","description":"List of product specifications.","items":{"type":"string","description":"Product specification."}},"affiliates":{"type":"array","description":"Marketplace order identifier. The discount will apply to selected affiliates.","items":{"type":"object","description":"Object with information of the affiliate.","properties":{"id":{"type":"string","description":"Affiliate ID."},"name":{"type":"string","description":"Affiliate Name."}}}},"maxUsage":{"type":"integer","description":"Defines how many times the promotion can be used."},"maxUsagePerClient":{"type":"integer","description":"Defines if the promotion can be used multiple times per client."},"shouldDistributeDiscountAmongMatchedItems":{"type":"boolean","description":"Should distribute discount among matched items."},"multipleUsePerClient":{"type":"boolean","description":"Defines if the promotion can be used multiple times per client."},"accumulateWithManualPrice":{"type":"boolean","description":"Allows the promotion to apply to products whose prices have been manually added by a call center operator."},"type":{"type":"string","description":"Defines what is the type of the promotion or indicates if it is a tax. Possible values: `regular` ([Regular Promotion](https://help.vtex.com/tutorial/regular-promotion--tutorials_327)), `combo` ([Buy Together](https://help.vtex.com/en/tutorial/buy-together--tutorials_323)), `forThePriceOf` ([More for Less](https://help.vtex.com/en/tutorial/creating-a-more-for-less-promotion--tutorials_325)), `progressive` ([Progressive Discount](https://help.vtex.com/en/tutorial/progressive-discount--tutorials_324)), `buyAndWin` ([Buy One Get One](https://help.vtex.com/en/tutorial/buy-one-get-one--tutorials_322)), `maxPricePerItem` (Deprecated), `campaign` ([Campaign Promotion](https://help.vtex.com/en/tutorial/campaign-promotion--1ChYXhK2AQGuS6wAqS8Ume)), `tax` (Tax), `multipleEffects` (Multiple Effects)."},"useNewProgressiveAlgorithm":{"type":"boolean","description":"Use new progressive algorithm."},"percentualDiscountValueList":{"type":"array","description":"Percentual discount value list.","items":{"type":"number","description":"Percentual discount value."}}}}};
