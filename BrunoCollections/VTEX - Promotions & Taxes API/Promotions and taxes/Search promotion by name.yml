info:
  name: Search promotion by name
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/rnb/pvt/benefits/calculatorconfiguration/search?byName=shirt"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: byName
      value: shirt
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration/search - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration/search - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration/search - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration/search - Schema is valid", function () {
