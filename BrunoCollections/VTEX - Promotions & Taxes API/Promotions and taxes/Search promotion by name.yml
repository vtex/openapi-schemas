ne. (`true`) or not (`false`)."},"effectType":{"type":"string","description":"The type of effect that will apply to the promotion."},"discountType":{"type":"string","description":"The type of discount that will apply to the promotion."},"nominalShippingDiscountValue":{"type":"number","description":"Exact discount to be applied for the shipping value."},"absoluteShippingDiscountValue":{"type":"number","description":"Maximum value for the shipping."},"nominalDiscountValue":{"type":"number","description":"Exact discount to be applied for the total purchase value."},"nominalDiscountType":{"type":"string","description":"Controls the behavior of the `NominalDiscount` effect. This field only accepts two string values:\r\n-`item`: applies the intended nominal discount on every item present on the cart. \r\n-`cart`: keeps the behavior as it currently is: the whole order/cart receives a nominal discount that is distributed among the items."},"maximumUnitPriceDiscount":{"type":"number","description":"The maximum price for each item of the purchase will be the price set up."},"percentualDiscountValue":{"type":"number","description":"Percentage discount to be applied for total purchase value."},"rebatePercentualDiscountValue":{"type":"number","description":"Percentual Shipping Discount Value."},"percentualShippingDiscountValue":{"type":"number","description":"Percentage discount to be applied for shipping value."},"percentualTax":{"type":"number","description":"Percentual tax over purchase total value."},"shippingPercentualTax":{"type":"number","description":"Shipping Percentual tax over purchase total value."},"percentualDiscountValueList1":{"type":"number","description":"Valid discounts for the SKUs in `listSku1BuyTogether`, discount list used for Buy Together Promotions."},"percentualDiscountValueList2":{"type":"number","description":"Equivalent to `percentualDiscountValueList1`."},"skusGift":{"type":"object","description":"SKU Gift Object. Total discount on the product value