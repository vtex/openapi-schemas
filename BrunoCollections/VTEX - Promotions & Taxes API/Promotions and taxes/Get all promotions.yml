info:
  name: Get all promotions
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/rnb/pvt/benefits/calculatorconfiguration"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/rnb/pvt/benefits/calculatorconfiguration - Schema is valid", function () {
          const schema = {"type":"object","properties":{"limitConfigurationMaxPrice":{"type":"object","description":"Limit configuration max price.","properties":{"activesCount":{"type":"integer","description":"Actives count."},"limit":{"type":"integer","description":"Limit."}}},"limitConfiguration":{"type":"object","description":"Limit configuration.","properties":{"activesCount":{"type":"integer","description":"Actives count."},"limit":{"type":"integer","description":"Limit."}}},"items":{"type":"array","description":"Array with information about a promotion.","items":{"type":"object","description":"Object with information about a promotion.","properties":{"idCalculatorConfiguration":{"type":"string","description":"Promotion ID."},"lastModifiedUtc":{"type":"string","description":"Date and time when the promotion was last modified (UTC)."},"name":{"type":"string","description":"Promotion Name."},"beginDate":{"type":"string","description":"Promotion Begin Date (UTC)."},"endDate":{"type":"string","description":"Promotion End Date (UTC)."},"isActive":{"type":"boolean","description":"If set as `true` the promotion is activated. If set as `false` the promotion is deactivated."},"description":{"type":"string","description":"Promotion internal description."},"type":{"description":"Defines the type of promotion.","type":"string"},"utmSource":{"type":"string","description":"utmSource code."},"utmCampain":{"type":"string","description":"utmCampaign code."},"utmiCampaign":{"type":"string","description":"utmiCampaign code."},"status":{"type":"string","description":"Status of the promotion."},"percentualTax":{"type":"number","description":"Percentual tax applied."},"isArchived":{"type":"boolean","description":"If set as `true` the Promotion is archived. If set as `false` the Promotion is not archived."},"hasMaxPricePerItem":{"description":"Defines if there is a maximum price per item.","type":"boolean"},"isTax":{"description":"Defines if it is a tax.","type":"boolean"},"campaigns":{"description":"Campaign Audiences that activate this promotion.","type":"array","items":{"type":"string","description":"Campaign Audience."}},"activateGiftsMultiplier":{"description":"If set as `true`, it activates gifts Multiplier.","type":"boolean"},"scope":{"description":"Scope of the promotion.","type":"object","properties":{"allCatalog":{"description":"Determines if the promotion applies to all products in the Catalog (`true`) or not (`false`).","type":"boolean"},"skus":{"description":"Quantity of SKUs which activate or deactivate the promotion.","type":"number"},"skusAreInclusive":{"description":"If set to `true`, this promotion will be applied to any SKU present on the `skus` field. If set to `false`, SKUs present on that field will make this promotion not to be applied.","type":"boolean"},"products":{"description":"Quantity of products which activate or deactivate the promotion.","type":"number"},"productsAreInclusive":{"description":"If set to `true`, this promotion will be applied to any product present on the `products` field. If set to `false`, products present on that field will make this promotion not to be applied.","type":"boolean"},"collections":{"description":"Quantity of collections which activate or deactivate the promotion.","type":"number"},"collectionsAreInclusive":{"description":"If set to `true`, this promotion will be applied to any collection present on the `collections` field. If set to `false`, collections present on that field will make this promotion not to be applied.","type":"boolean"},"categories":{"description":"Quantity of categories which activate or deactivate the promotion.","type":"number"},"categoriesAreInclusive":{"type":"boolean","description":"If set to `true`, this promotion will be applied to any category present on the `categories` field. If set to `false`, categories present on that field will make this promotion not to be applied."},"brands":{"description":"Quantity of brands which activate or deactivate the promotion.","type":"number"},"brandsAreInclusive":{"description":"If set to `true`, this promotion will be applied to any brand present on the `brands` field. If set to `false`, brands present on that field will make this promotion not to be applied.","type":"boolean"},"sellers":{"description":"Quantity of sellers which activate or deactivate the promotion.","type":"number"},"sellersAreInclusive":{"description":"If set to `true`, this promotion will be applied to any seller present on the `sellers` field. If set to `false`, sellers present on that field will make this promotion not to be applied.","type":"boolean"}}},"maxUsage":{"type":"number","description":"Defines how many times the promotion can be used."},"idsSalesChannel":{"type":"array","description":"List of Trade Policies that activate this promotion.","items":{"type":"string","description":"Trade policy ID."}},"areSalesChannelIdsExclusive":{"type":"boolean","description":"If set to `false`, this promotion will be applied to any trade policies present on the `idsSalesChannel` field. If set to `true`, trade policies present on that field will make this promotion not to be applied."}}}},"disabledItems":{"type":"array","description":"Disabled items.","items":{"type":"string","description":"Disabled item."}},"archivedItems":{"type":"array","description":"Archived items.","items":{"type":"string","description":"Archived item."}},"nominalDiscountType":{"type":"string","description":"Controls the behavior of the `NominalDiscount` effect. This field only accepts two string values:\n\n -`item`: applies the intended nominal discount on every item present on the cart. \n\n -`cart`: keeps the behavior as it currently is: the whole order/cart receives a nominal discount that is distributed among the items."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves all promotions from an account. 

  > 📘 Onboarding guide 
  >
  > Check the new [Promotions onboarding guide](https://developers.vtex.com/vtex-rest-api/docs/promotions-overview). We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about the Promotions and is organized by focusing on the developer's journey.



  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Rates and Benefits | Manage benefits and rates | **GerenciarPromocoesETarifas** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

