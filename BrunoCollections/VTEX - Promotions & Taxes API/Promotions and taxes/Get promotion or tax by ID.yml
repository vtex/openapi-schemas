info:
  name: Get promotion or tax by ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/rnb/pvt/calculatorconfiguration/:idCalculatorConfiguration"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: idCalculatorConfiguration
      value: d8a1cd2e-b667-4054-b3ae-b79124c7218e
      type: path
  auth: inherit

