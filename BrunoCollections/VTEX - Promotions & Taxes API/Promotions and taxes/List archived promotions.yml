        "name": "Promoção Progressiva",
        "beginDate": "2021-04-15T03:00:00Z",
        "endDate": "2021-04-16T02:30:00Z",
        "isActive": false,
        "description": "Progressive discount promotion.",
        "type": "progressive",
        "utmSource": "",
        "utmCampain": "",
        "utmiCampaign": "",
        "nominalDiscountType": "item",
        "status": "inactive",
        "percentualTax": 0,
        "isArchived": true,
        "hasMaxPricePerItem": false,
        "isTax": false,
        "Campaigns": [],
        "activateGiftsMultiplier": false,
        "scope": {
          "allCatalog": true,
          "skus": 0,
          "skusAreInclusive": true,
          "products": 0,
          "productsAreInclusive": true,
          "collections": 0,
