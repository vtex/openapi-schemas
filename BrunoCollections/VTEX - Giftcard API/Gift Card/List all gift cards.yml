info:
  name: List all gift cards
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/giftcards/_search"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: REST-Range
      value: resources=0-49
      disabled: true
  params:
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      {
        "cart": {
          "grandTotal": 182,
          "relationName": null,
          "redemptionCode": "BAHD-ASDB-ADQW-ASDQ",
          "discounts": 20,
          "shipping": 2,
          "taxes": 0,
          "items": [
            {
              "productId": "2000000",
              "id": "2000002",
              "refId": "MEV41",
              "name": "Shoes",
              "price": 200,
              "quantity": 1
            },
            {
              "productId": "2000000",
              "id": "2000002",
              "refId": "MEV41",
              "name": "Shoes",
              "price": 200,
              "quantity": 1
