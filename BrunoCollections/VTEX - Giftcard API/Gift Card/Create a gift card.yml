info:
  name: Create a gift card
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/giftcards"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      {
        "relationName": "loyalty-program",
        "expiringDate": "2020-09-01T13:15:30Z",
        "caption": "rewards program",
        "profileId": "92de2449-0e02-4ca9-a4aa-a09cc9d8f7ff",
        "currencyCode": "USD",
        "restrictedToOwner": false,
        "multipleCredits": false,
        "multipleRedemptions": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/giftcards - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/giftcards - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/giftcards - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/giftcards - Schema is valid", function () {
          const schema = {"type":"object","description":"Gift card information.","required":["id","redemptionToken","redemptionCode","balance","relationName","emissionDate","expiringDate","caption","transactions"],"properties":{"id":{"type":"string","description":"Gift card identification."},"redemptionToken":{"type":"string","description":"Gift card redemption token."},"redemptionCode":{"type":"string","description":"Gift card identification code used at checkout. Minimum of 6 characters."},"balance":{"type":"number","description":"Gift card current balance. For newly created gift cards, the balance will be 0.0."},"relationName":{"type":"string","description":"Field to be filled in when it is not necessary to use a loyalty program for the gift card. Note that a new `relationNamevalue` is required for each new gift card to be created."},"emissionDate":{"type":"string","description":"Gift card creation date."},"expiringDate":{"type":"string","description":"Gift card expiration date."},"caption":{"type":"string","description":"Field to be filled in if a loyalty program must be created for the Gift Card."},"currencyCode":{"type":"string","description":"Currency code in ISO 4217."},"transactions":{"type":"object","description":"Transactions information.","required":["href"],"properties":{"href":{"type":"string","description":"Gift card resource URL. The number described in the URL refers to the gift card identification."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a gift card for a specific user.

  >⚠️ The `redemptionCode` field is auto-generated during gift card creation and cannot be set to an arbitrary value.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | GiftCard | GiftCard | **Gift card full access** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL. |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "954",
    "redemptionToken": "32ScL57220Vapb8pc50HJ3mWH1cl1L8x",
    "redemptionCode": "***********ASDQ",
    "balance": 0,
    "relationName": "cardName",
    "emissionDate": "2014-04-24T20:22:58.163",
    "expiringDate": "2016-01-01T00:00:00",
    "caption": "Programa Vtex Fidelidade",
    "currencyCode": "USD",
    "transactions": {
      "href": "cards/954/transactions"
    }
  }
  ```
