info:
  name: Get a gift card transaction by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/giftcards/:giftCardId/transactions/:transactionId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: giftCardId
      value: "6"
      type: path
    - name: transactionId
      value: b47690
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/giftcards/:giftCardId/transactions/:transactionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/giftcards/:giftCardId/transactions/:transactionId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/giftcards/:giftCardId/transactions/:transactionId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/giftcards/:giftCardId/transactions/:transactionId - Schema is valid", function () {
          const schema = {"type":"object","description":"Transaction information.","properties":{"value":{"type":"number","description":"Transaction value."},"description":{"type":"string","description":"Transaction description."},"date":{"type":"string","description":"Date of the transaction in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format (`YYYY-MM-DDThh:mm:ss.fff`)."},"requestId":{"type":"string","description":"VTEX request identifier."},"settlement":{"type":"object","description":"Settlement transaction information.","properties":{"href":{"type":"string","description":"Gift card resource URL. The first number described in the URL refers to the gift card identification. The second number, refers to the transaction identification."}}},"cancellation":{"type":"object","description":"Cancellation transaction information.","properties":{"href":{"type":"string","description":"Gift card resource URL. The first number described in the URL refers to the gift card identification. The second number, refers to the transaction identification."}}},"authorization":{"type":"object","description":"Authorization transaction information.","properties":{"href":{"type":"string","description":"Gift card resource URL. The first number described in the URL refers to the gift card identification. The second number, refers to the transaction identification."}}},"operation":{"type":"string","description":"Operation information (`credit` or `debit`)."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns a specific transaction for a gift card.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | GiftCard | GiftCard | **Gift card full access** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `giftCardId` | path | (Required) Gift card identification. |
  | `transactionId` | path | (Required) Transaction identification. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL. |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "value": 140,
    "description": "GiftCardHub",
    "date": "2023-06-02T18:24:49.252855Z",
    "requestId": "3",
    "settlement": {
      "href": "/cosmetics2/giftcards/3b1abc17-988e-4a14-8b7f-31fc6a5b955c_70/transactions/faa6831230634c4b8fb897e02ba9c5a1/settlements"
    },
    "cancellation": {
      "href": "/cosmetics2/giftcards/3b1abc17-988e-4a14-8b7f-31fc6a5b955c_70/transactions/faa6831230634c4b8fb897e02ba9c5a1/cancellations"
    },
    "authorization": {
      "href": "/cosmetics2/giftcards/3b1abc17-988e-4a14-8b7f-31fc6a5b955c_70/transactions/faa6831230634c4b8fb897e02ba9c5a1/authorization"
    },
    "operation": "Credit"
  }
  ```
