opencollection: 1.0.0

info:
  name: VTEX - Bulk Pricing API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Bulk Pricing API addresses the performance limitations of per-item API calls by implementing an asynchronous, fault-tolerant processing model optimized to maintain data consistency while maximizing throughput.

    This API enables high-throughput, asynchronous processing of large-scale pricing updates via CSV file uploads. The workflow involves three main steps:

    1. **Start a batch import** by sending a `POST` request specifying the import type (`base-prices` or `fixed-prices`). The API returns a pre-signed upload URL and a batch ID.
    2. **Upload the CSV file** directly to the pre-signed URL using the `PUT` method and headers provided in the response.
    3. **Check batch status** to monitor processing progress and retrieve error details if needed.

    ## Index

    ### Batch imports

    - `POST` [Import prices](https://developers.vtex.com/docs/api-reference/bulk-pricing-api#post-/api/price-importer/pvt/import/-importType-)

    ### Batch status

    - `GET` [Get batch status](https://developers.vtex.com/docs/api-reference/bulk-pricing-api#get-/api/price-importer/pvt/batches/-batchId-)
    - `GET` [Get batch errors](https://developers.vtex.com/docs/api-reference/bulk-pricing-api#get-/api/price-importer/pvt/batches/-batchId-/errors)

    ## Common parameters in the documentation

    | Parameter name | Description | Type |
    | - | - | - |
    | `{{accountName}}` | Name of the VTEX account. Used as part of the URL. | Server variable. |
    | `{{environment}}` | Environment to use. The default value is `vtexcommercestable`. Used in the URL. | Server variable. |
    | `X-VTEX-API-AppKey` | Unique identifier of the API key. Must be used together with `X-VTEX-API-AppToken`. | Authentication header |
    | `X-VTEX-API-AppToken` | Secret token of the API key. Must be used together with `X-VTEX-API-AppKey`. | Authentication header |
    | `VtexIdclientAutCookie` | User token valid for 24 hours. Alternative to `appKey` + `appToken`. | Authentication header |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
