cription":"Shipping location information.","properties":{"zipCode":{"type":"string","description":"Shipping adress postal code."},"country":{"type":"string","description":"Three-digit country code of the shipping address, in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format."},"point":{"type":["array","null"],"description":"Shipping address coordinates, first longitude then latitude.","items":{"type":"number","description":"Longitude or latitude."}},"inStore":{"type":"object","description":"Information related to [VTEX Sales App](https://help.vtex.com/en/tracks/instore-getting-started-and-setting-up--zav76TFEZlAjnyBVL5tRc).","properties":{"isCheckedIn":{"type":"boolean","description":"This field is set as `true` when the order is placed via [VTEX Sales App](https://help.vtex.com/en/tracks/instore-getting-started-and-setting-up--zav76TFEZlAjnyBVL5tRc) and `false` when it is not."},"storeId":{"type":["string","null"],"description":"ID of purchases made in the GoCommerce context."}}}}},"deliveryOnWeekends":{"type":"boolean","description":"Defines if the delivery on weekends configuration is active (`true`) or inactive (`false`)."},"weekendAndHolidays":{"type":["object","null"],"description":"Delivery on weekends and holidays information.","properties":{"saturday":{"type":"boolean","description":"Defines if the delivery on Saturday configuration is active (`true`) or inactive (`false`)."},"sunday":{"type":"boolean","description":"Defines if the delivery on Sunday configuration is active (`true`) or inactive (`false`)."},"holiday":{"type":"boolean","description":"Defines if the delivery on [holiday](https://help.vtex.com/en/tutorial/registering-holidays--2ItOthSEAoyAmcwsuiO6Yk) configuration is active (`true`) or inactive (`false`)."}}},"carrierSchedule":{"type":"array","description":"Schedule sent by the carrier.","items":{"type":"object","description":"Carrier schedule object.","properties":{"dayOfWeek":{"type":"integer","description":"Day of the week, from