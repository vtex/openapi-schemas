evel."},"accountCarrier":{"type":"string","description":"Account carrier."},"carrierBusinessHours":{"type":"array","description":"Carrier business hours configurations for the week.","items":{"type":"object","description":"Carrier business hours configurations for a day of the week.","properties":{"openingTime":{"type":"string","description":"Carrier opening time in `HH:MM:SS` format."},"closingTime":{"type":"string","description":"Carrier closing time in `HH:MM:SS` format."},"dayOfWeek":{"type":"integer","description":"Day of the week, from `0` (Sunday) to `6` (Saturday).","enum":[0,1,2,3,4,5,6]}}}},"provider":{"type":["string","null"],"description":"Provider system."},"dateOfSupplyUtc":{"type":["string","null"],"description":"Supply date and time in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ss.ssZ`."},"estimateDate":{"type":"string","description":"Delivery estimate date and time in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ss.ssZ`."},"supplyLotId":{"type":["string","null"],"description":"Supply lot ID."},"isExternal":{"type":"boolean","description":"Defines if the SLA request is external (`true`) or not (`false`)."}}}}};
