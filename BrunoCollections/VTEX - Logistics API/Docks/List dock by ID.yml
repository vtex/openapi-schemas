info:
  name: List dock by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/logistics/pvt/configuration/docks/:dockId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: dockId
      value: dock_1f95
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/logistics/pvt/configuration/docks/:dockId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/logistics/pvt/configuration/docks/:dockId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/logistics/pvt/configuration/docks/:dockId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/logistics/pvt/configuration/docks/:dockId - Schema is valid", function () {
          const schema = {"type":"object","description":"Loading dock information.","properties":{"pickupStoreInfo":{"type":"object","description":"Information about a loading dock that was transformed into a [pickup point](https://help.vtex.com/en/tutorial/pickup-points--2fljn6wLjn8M4lJHA6HP3R).","properties":{"isPickupStore":{"type":["boolean","null"],"description":"Defines if the shipping type was pickup (`true`) or not (`false`)."},"storeId":{"type":["string","null"],"description":"Store ID for stores that acted as pickup points."},"friendlyName":{"type":["string","null"],"description":"Name of the pickup point displayed at checkout."},"address":{"type":["object","null"],"description":"Pickup point address information.","properties":{"postalCode":{"type":"string","description":"Pickup point address postal code."},"country":{"type":"object","description":"Information about the pickup point address country.","properties":{"acronym":{"type":"string","description":"Three-digit country code of the pickup point address, in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format."},"name":{"type":"string","description":"Country name of the pickup point address."}}},"city":{"type":"string","description":"Pickup point address city."},"state":{"type":"string","description":"Pickup point address state."},"neighborhood":{"type":"string","description":"Pickup point address neighborhood."},"street":{"type":"string","description":"Pickup point address street."},"number":{"type":"string","description":"Pickup point address number."},"complement":{"type":["string","null"],"description":"Pickup point address complement."},"reference":{"type":["string","null"],"description":"Pickup point address reference point."},"location":{"type":"object","description":"Pickup point address geolocation coordinates.","properties":{"latitude":{"type":"number","description":"Latitude coordinate."},"longitude":{"type":"number","description":"Longitude coordinate."}}}}},"additionalInfo":{"type":["string","null"],"description":"Additional information about the delivery or the pickup point."},"dockId":{"type":["string","null"],"description":"ID of the [loading dock](https://help.vtex.com/en/tutorial/loading-dock--5DY8xHEjOLYDVL41Urd5qj related to the delivery or the pickup point ID."},"distance":{"type":["number","null"],"description":"Distance in kilometers between the pickup point and the customer's address, measured as a straight line."},"businessHours":{"type":["string","null"],"description":"Pickup point business hours configurations."},"pickupHolidays":{"type":["string","null"],"description":"Holiday's configurations applicable to the pickup point."},"sellerId":{"type":["string","null"],"description":"Seller ID."},"isThirdPartyPickup":{"type":"boolean","description":"Defines if the pickup was third party (`true`) or not (`false`)."}}},"storeId":{"type":["string","null"],"description":"Store ID."},"pickupInStoreInfo":{"type":"object","description":"Information about the physical store as a pickup point.","properties":{"isActice":{"type":"boolean","description":"Defines if the physical store is a pickup point (`true`) or not (`false`)."},"additionalInfo":{"type":["string","null"],"description":"Additional information of the store as a pickup point."}}},"deliveryFromStoreInfo":{"type":"object","description":"Settings for delivery from a physical store.","properties":{"isActice":{"type":"boolean","description":"Defines if the settings for delivery from physical stores are active (`true`) or inactive (`false`)."},"deliveryRadius":{"type":"number","description":"Delivery radius."},"deliveryFee":{"type":"number","description":"Delivery fee."},"deliveryTime":{"type":"string","description":"Delivery time in the format `DD.HH:MM:SS`."},"maximumWeight":{"type":"number","description":"Delivery maximum weight."}}},"address":{"type":"object","description":"Loading dock address.","properties":{"postalCode":{"type":"string","description":"Loading dock address postal code."},"country":{"type":"object","description":"Information about the loading dock address country.","properties":{"acronym":{"type":"string","description":"Three-digit country code of the loading dock address, in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format."},"name":{"type":"string","description":"Country name of the loading dock address."}}},"city":{"type":"string","description":"Loading dock address city."},"state":{"type":"string","description":"Loading dock address state."},"neighborhood":{"type":"string","description":"Loading dock address neighborhood."},"street":{"type":"string","description":"Loading dock address street."},"number":{"type":"string","description":"Loading dock address number."},"complement":{"type":["string","null"],"description":"Loading dock address complement."},"reference":{"type":["string","null"],"description":"Loading dock address reference point."},"location":{"type":"object","description":"Loading dock address geolocation coordinates.","properties":{"latitude":{"type":"number","description":"Latitude coordinate."},"longitude":{"type":"number","description":"Longitude coordinate."}}}}},"location":{"type":["object","null"],"description":"Loading dock location details.","properties":{"zipCode":{"type":"string","description":"Loading dock address postal code."},"country":{"type":"string","description":"Three-digit country code of the loading dock address, in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format."},"inStore":{"type":"object","description":"Information related to orders made via [VTEX Sales App](https://help.vtex.com/en/tracks/instore-getting-started-and-setting-up--zav76TFEZlAjnyBVL5tRc).","properties":{"IsCheckedIn":{"type":"boolean","description":"Defines if orders can be placed via [VTEX Sales App](https://help.vtex.com/en/tracks/instore-getting-started-and-setting-up--zav76TFEZlAjnyBVL5tRc) (`true`) or not (`false`)."},"StoreId":{"type":["string","null"],"description":"ID of purchases made in the GoCommerce context."}}}}},"shippingRatesProviders":{"type":["array","null"],"description":"Shipping rates providers information.","items":{"type":"string","description":"Shipping rates."}},"deliveryAgreementsIds":{"type":["array","null"],"description":"Delivery agreements IDs information.","items":{"type":"string","description":"Delivery agreements IDs."}},"id":{"type":"string","description":"[Loading dock](https://help.vtex.com/en/tutorial/loading-dock--5DY8xHEjOLYDVL41Urd5qj) ID."},"name":{"type":"string","description":"Loading dock name."},"priority":{"type":"integer","description":"Value from `0` to `10` used as a tie-breaking rule for loading dock selecting. The greater the priority, the greater the possibility of the loading dock being chosen in [shipping calculation](https://help.vtex.com/en/tutorial/how-shipping-calculation-works--tutorials_116). When no priority was set, it corresponds to `0`."},"dockTimeFake":{"type":"string","description":"[Loading dock](https://help.vtex.com/en/tutorial/loading-dock--5DY8xHEjOLYDVL41Urd5qj) processing time in the format `D.HH:MM:SS`. When not configured, it returns `00:00:00`."},"timeFakeOverhead":{"type":"string","description":"Time frame used to choose a loading dock when there is more than one loading dock with the same processing time. The lower the value entered in this field, the greater the possibility of the loading dock being chosen. \r\n>ℹ️ This field is not considered when calculating the delivery time."},"salesChannels":{"type":"array","description":"Sales channels ([trade policies](https://help.vtex.com/en/tutorial/how-trade-policies-work--6Xef8PZiFm40kg2STrMkMV)) associated with the loading dock.","items":{"type":"string","description":"Sales channel ID."}},"salesChannel":{"type":"string","description":"Main sales channel ([trade policy](https://help.vtex.com/en/tutorial/how-trade-policies-work--6Xef8PZiFm40kg2STrMkMV)) associated with the loading dock."},"freightTableIds":{"type":"array","description":"List with freight table IDs associated with the loading dock.","items":{"type":"string","description":"Freight table ID."}},"wmsEndPoint":{"type":["string","null"],"description":"Endpoint for integrating an external Warehouse Management System (WMS)."},"isActive":{"type":"boolean","description":"Defines if the loading dock is active (`true`) or inactive (`false`)."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves information about a [loading dock](https://help.vtex.com/en/tutorial/loading-dock--5DY8xHEjOLYDVL41Urd5qj) of your store's [shipping strategy](https://help.vtex.com/en/tutorial/shipping-strategy--58vLBDbjYVQzJ6rRc5QNz3), searching by dock ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Logistics | Logistics access | **Logistics full access** |
  | Logistics | Logistics access | **Logistics viewer** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | Logistics - Full access | Logistics full access |
  | OMS - Full access | Logistics full access |
  | Logistics - Full access | Logistics viewer |
  | Logistics - Read only | Logistics viewer |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users or application keys usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using application keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm). To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `dockId` | path | (Required) [Loading dock](https://help.vtex.com/en/tutorial/loading-dock--5DY8xHEjOLYDVL41Urd5qj) ID. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

