info:
  name: List polygon by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/logistics/pvt/configuration/geoshape/:polygonName"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: polygonName
      value: ipanema_leblon
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/logistics/pvt/configuration/geoshape/:polygonName - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/logistics/pvt/configuration/geoshape/:polygonName - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/logistics/pvt/configuration/geoshape/:polygonName - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/logistics/pvt/configuration/geoshape/:polygonName - Schema is valid", function () {
          const schema = {"type":"object","properties":{"isActive":{"type":"boolean","description":"Defines if the polygon is active (`true`) or inactive (`false`)."},"name":{"type":"string","description":"[Polygon](https://help.vtex.com/en/tutorial/registering-geolocation--tutorials_138) ID, which is the same as the polygon name."},"geoShape":{"type":"object","description":"Polygon geolocation coordinates.","properties":{"coordinates":{"type":"array","description":"List of geolocation coordinates that make part of the polygon.","items":{"type":"array","description":"Polygon geolocation coordinates. The first and the last pair of coordinates must be equal.","items":{"type":"array","description":"Polygon geolocation coordinates, first longitude then latitude.","items":{"type":"number","description":"Longitude or latitude."}}}},"type":{"type":"string","description":"Polygon identification."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves information about a [polygon](https://help.vtex.com/en/tutorial/registering-geolocation--tutorials_138) of your store, searching by polygon ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Logistics | Logistics access | **Logistics full access** |
  | Logistics | Logistics access | **Logistics viewer** |
  | Logistics | Logistics access | **Logistics shipping full access** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | Logistics - Full access | Logistics full access |
  | OMS - Full access | Logistics full access |
  | Logistics - Full access | Logistics viewer |
  | Logistics - Read only | Logistics viewer |
  | Logistics - Full access | Logistics shipping full access |
  | OMS - Full access | Logistics shipping full access |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users or application keys usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using application keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm). To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `polygonName` | path | (Required) [Polygon](https://help.vtex.com/en/tutorial/registering-geolocation--tutorials_138) ID (same as the polygon name). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "isActive": true,
    "name": "ipanema_leblon",
    "geoShape": {
      "coordinates": [
        [
          [
            -43.23171615600586,
            -22.990713500405295
          ],
          [
            -43.182621002197266,
            -22.990713500405295
          ],
          [
            -43.182621002197266,
            -22.977043559707305
          ],
          [
            -43.23171615600586,
            -22.977043559707305
          ],
          [
            -43.23171615600586,
            -22.990713500405295
          ]
        ]
      ],
      "type": "polygon"
    }
  }
  ```
