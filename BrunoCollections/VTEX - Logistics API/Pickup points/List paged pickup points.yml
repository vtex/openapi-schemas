info:
  name: List paged pickup points
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/logistics/pvt/configuration/pickuppoints/_search"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "2"
      type: query
      disabled: true
    - name: pageSize
      value: "15"
      type: query
      disabled: true
    - name: keyword
      value: Rio
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/logistics/pvt/configuration/pickuppoints/_search - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/logistics/pvt/configuration/pickuppoints/_search - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/logistics/pvt/configuration/pickuppoints/_search - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/logistics/pvt/configuration/pickuppoints/_search - Schema is valid", function () {
          const schema = {"type":"object","description":"Paged pickup points list.","properties":{"items":{"type":"array","description":"List of pickup points.","items":{"type":"object","description":"Pickup point information.","properties":{"id":{"type":"string","description":"[Pickup point](https://help.vtex.com/en/tutorial/pickup-points--2fljn6wLjn8M4lJHA6HP3R) ID."},"name":{"type":"string","description":"Pickup point name displayed to customers at checkout."},"description":{"type":"string","description":"Pickup point description displayed to customers at checkout."},"instructions":{"type":"string","description":"Instructions for customers when collecting their package."},"formatted_address":{"type":["string","null"],"description":"Formatted address."},"address":{"type":"object","description":"Pickup point address information.","properties":{"postalCode":{"type":"string","description":"Pickup point address postal code."},"country":{"type":"object","description":"Information about the pickup point address country.","properties":{"acronym":{"type":"string","description":"Three-digit country code of the pickup point address, in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format."},"name":{"type":"string","description":"Country name of the pickup point address."}}},"city":{"type":"string","description":"Pickup point address city."},"state":{"type":"string","description":"Pickup point address state."},"neighborhood":{"type":"string","description":"Pickup point address neighborhood."},"street":{"type":"string","description":"Pickup point address street."},"number":{"type":"string","description":"Pickup point address number."},"complement":{"type":"string","description":"Pickup point address complement."},"reference":{"type":"string","description":"Reference point to help the customer find the pickup point."},"location":{"type":"object","description":"Pickup point address geolocation coordinates.","properties":{"latitude":{"type":"number","description":"Latitude coordinate."},"longitude":{"type":"number","description":"Longitude coordinate."}}}}},"isActive":{"type":"boolean","description":"Defines if the pickup point is active (`true`) or inactive (`false`)."},"distance":{"type":"number","description":"Pickup point configured distance."},"seller":{"type":"string","description":"Seller that corresponds to the pickup point."},"_sort":{"type":"array","description":"Sort array.","items":{"type":"number","description":"Pickup point sort information."}},"businessHours":{"type":"array","description":"Pickup point business hours configurations.","items":{"type":"object","description":"Business hours configurations from Monday to Friday.","properties":{"dayOfWeek":{"type":"integer","description":"Day of the week identification, as in `1` = Monday, `2` = Tuesday, `3` = Wednesday, `4` = Thursday, and `5` = Friday."},"openingTime":{"type":"string","description":"Opening time in `HH:MM:SS` format."},"closingTime":{"type":"string","description":"Closing time in `HH:MM:SS` format."}}}},"tagsLabel":{"type":"array","description":"Tags that identify a group of pickup points.","items":{"type":"string","description":"Pickup point tag label."}},"pickupHolidays":{"type":"array","description":"[Holidays](https://help.vtex.com/en/tutorial/registering-holidays--2ItOthSEAoyAmcwsuiO6Yk) configured for the pickup point.","items":{"type":"object","description":"Holiday information.","properties":{"date":{"type":"string","description":"Holiday date and time, in [ISO 8601 time zone offset format](https://learn.microsoft.com/en-us/rest/api/storageservices/formatting-datetime-values), as in `YYYY-MM-DDThh:mm:ss.ssZ`."},"hourBegin":{"type":"string","description":"Holiday beginning time in `HH:MM` format."},"hourEnd":{"type":"string","description":"Holiday ending time in `HH:MM` format."}}}},"isThirdPartyPickup":{"type":"boolean","description":"Defines if the pickup point is third-party (`true`) or not (`false`)."},"accountOwnerName":{"type":"string","description":"Account owner name."},"accountOwnerId":{"type":"string","description":"Account owner ID."},"parentAccountName":{"type":"string","description":"Parent account name."},"originalId":{"type":["string","null"],"description":"Original ID."}}}},"paging":{"type":"object","description":"Pagination information.","properties":{"page":{"type":"integer","description":"Number of the current page of the response. By default, it returns page `1`, unless a different value is informed in the `page` query parameter."},"perPage":{"type":"integer","description":"Number of pickup points per page."},"total":{"type":"integer","description":"Total number of existing pickup points."},"pages":{"type":"integer","description":"Total number of pages, considering the total number of pickup points. Even though there might be other results, the maximum value of this field will be `100`, because the response is limited to 100 pages."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
