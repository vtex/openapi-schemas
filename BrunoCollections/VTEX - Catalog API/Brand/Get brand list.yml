info:
  name: Get brand list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pvt/brand/list"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pvt/brand/list - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pvt/brand/list - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pvt/brand/list - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pvt/brand/list - Schema is valid", function () {
          const schema = {"type":"array","description":"An array with all brands registered in the store.","items":{"type":"object","description":"Object containing brand information.","required":["id","name","isActive","imageUrl","title","metaTagDescription"],"properties":{"id":{"type":"integer","description":"Brand's unique numerical identifier."},"name":{"type":"string","description":"Brand name."},"isActive":{"type":"boolean","description":"Defines if the brand is active (`true`) or not (`false`)."},"title":{"type":"string","description":"Meta title for the brand page."},"metaTagDescription":{"type":"string","description":"Meta Description for the brand page. A brief description of the brand, displayed by search engines. Since search engines can only display less than 150 characters, we recommend not exceeding this character limit when creating the description."},"imageUrl":{"type":["string","null"],"description":"URL of the brand's image."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves all brands registered in the store's Catalog. 
  >⚠️ This route's response is limited to 20k results. If you need to obtain more results, please use the [Get paginated brand list](https://developers.vtex.com/vtex-rest-api/reference/catalog-api-get-brand-list) endpoint instead to get a paginated response.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Brands** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "id": 9280,
      "name": "Brand",
      "isActive": true,
      "title": "Vertical brand",
      "metaTagDescription": "Brand",
      "imageUrl": null
    },
    {
      "id": 2000000,
      "name": "Orma Carbon",
      "isActive": true,
      "title": "Orma Carbon S.A.",
      "metaTagDescription": "Orma Carbon",
      "imageUrl": null
    },
    {
      "id": 2000001,
      "name": "Pedigree",
      "isActive": true,
      "title": "Pedrigree brand",
      "metaTagDescription": "pedigree",
      "imageUrl": null
    }
  ]
  ```
