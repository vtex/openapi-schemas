info:
  name: Create brand
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/catalog/pvt/brand"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "Id": 2000003,
        "Name": "Adidas",
        "Text": "Adidas",
        "Keywords": "adidas",
        "SiteTitle": "Adidas",
        "AdWordsRemarketingCode": null,
        "LomadeeCampaignCode": null,
        "Score": 10,
        "MenuHome": true,
        "Active": true,
        "LinkId": "adidas-sports"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog/pvt/brand - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog/pvt/brand - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog/pvt/brand - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog/pvt/brand - Schema is valid", function () {
          const schema = {"type":"object","description":"Object containing brand information.","required":["Id","Name"],"properties":{"Id":{"type":"integer","description":"Brand's unique numerical identifier."},"Name":{"type":"string","description":"Brand name."},"Text":{"type":"string","description":"Meta description for the brand page. A brief description of the brand, displayed by search engines. Since search engines can only display less than 150 characters, we recommend not exceeding this character limit when creating the description."},"Keywords":{"type":"string","description":"Store Framework - Deprecated.\r\nLegacy CMS Portal - Alternative search terms that will lead to the specific brand. The user can find the desired brand even when misspelling it. Used especially when words are of foreign origin and have a distinct spelling that is transcribed into a generic one, or when small spelling mistakes occur."},"SiteTitle":{"type":"string","description":"Meta title for the brand page."},"AdWordsRemarketingCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"LomadeeCampaignCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"Score":{"type":["integer","null"],"description":"Store Framework - Deprecated\r\nLegacy CMS Portal - Value used to set the priority on the search result page."},"MenuHome":{"type":"boolean","description":"Store Framework - Deprecated.\r\nLegacy CMS Portal - Defines if the brand appears in the Department Menu control (`<vtex.cmc:departmentNavigator/>`)."},"Active":{"type":"boolean","description":"Defines if the brand is active (`true`) or not (`false`)."},"LinkId":{"type":["string","null"],"description":"Brand page slug. Only lowercase letters and hyphens (`-`) are allowed."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new brand.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Brands Management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 2000013,
    "Name": "Orma Carbon",
    "Text": "Orma Carbon",
    "Keywords": "orma",
    "SiteTitle": "Orma Carbon",
    "Active": true,
    "MenuHome": true,
    "AdWordsRemarketingCode": "",
    "LomadeeCampaignCode": "",
    "Score": null,
    "LinkId": "orma-carbon"
  }
  ```
