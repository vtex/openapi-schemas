info:
  name: Get specification values by subcollection ID
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/subcollection/:subCollectionId/specificationvalue"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: subCollectionId
      value: "80"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/subcollection/:subCollectionId/specificationvalue - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/subcollection/:subCollectionId/specificationvalue - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/subcollection/:subCollectionId/specificationvalue - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/subcollection/:subCollectionId/specificationvalue - Schema is valid", function () {
          const schema = {"type":"object","description":"Object with the response.","properties":{"Page":{"type":"integer","description":"Current page number of the result set."},"Size":{"type":"integer","description":"Number of records per page."},"TotalRows":{"type":"integer","description":"Total number of records returned."},"TotalPage":{"type":"integer","description":"Total number of pages available."},"Data":{"type":"array","description":"Array of SubCollection Specification Value records.","items":{"type":"object","description":"SubCollection Specification Value records details.","properties":{"SubCollectionId":{"type":"integer","description":"Subcollection unique identifier."},"SpecificationValueId":{"type":"integer","description":"Subcollection specification value ID."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves specification values searching by subcollection ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog API | General | View Category |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `subCollectionId` | path | (Required) Subcollection unique numerical identifier, which can be obtained by placing a request to [Get subcollection by collection ID](https://developers.vtex.com/vtex-rest-api/reference/catalog-api-get-subcollection-collectionid). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Page": 1,
    "Size": 3,
    "TotalRows": 3,
    "TotalPage": 1,
    "Data": [
      {
        "SubCollectionId": 80,
        "SpecificationValueId": 2461
      },
      {
        "SubCollectionId": 80,
        "SpecificationValueId": 2463
      },
      {
        "SubCollectionId": 80,
        "SpecificationValueId": 2464
      }
    ]
  }
  ```
