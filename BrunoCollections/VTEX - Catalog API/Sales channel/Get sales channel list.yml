info:
  name: Get sales channel list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pvt/saleschannel/list"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pvt/saleschannel/list - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pvt/saleschannel/list - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pvt/saleschannel/list - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pvt/saleschannel/list - Schema is valid", function () {
          const schema = {"type":"array","items":{"type":"object","description":"Object with the sales channel details.","properties":{"Id":{"type":"integer","description":"Sales channel unique identifier."},"Name":{"type":"string","description":"Sales channel name."},"IsActive":{"type":"boolean","description":"Defines if the Sales channel is active (`true`) or not (`false`)."},"ProductClusterId":{"type":["integer","null"],"description":"Product cluster ID, if the sales channel has releated product cluster."},"CountryCode":{"type":"string","description":"Country code in ISO 3166-1 alfa-3 standard."},"CultureInfo":{"type":"string","description":"Language country code in LCID string standard."},"TimeZone":{"type":"string","description":"Name of time zone."},"CurrencyCode":{"type":"string","description":"Currency code in ISO 4217 standard."},"CurrencySymbol":{"type":"string","description":"Currency symbol."},"CurrencyLocale":{"type":"integer","description":"Currency locale code in LCID standard."},"CurrencyFormatInfo":{"type":"object","description":"Object with currency format.","properties":{"CurrencyDecimalDigits":{"type":"integer","description":"Quantity of currency decimal digits."},"CurrencyDecimalSeparator":{"type":"string","description":"Defines which currency decimal separator will be applied."},"CurrencyGroupSeparator":{"type":"string","description":"Defines which currency group separator will be applied."},"CurrencyGroupSize":{"type":"integer","description":"Define how many characters will be grouped."},"StartsWithCurrencySymbol":{"type":"boolean","description":"Defines if all prices will be initiated with currency symbol (`true`) or not (`false`)."}}},"Origin":{"type":["string","null"],"description":"Origin of products in the sales channel."},"Position":{"type":["integer","null"],"description":"Defines the position on index."},"ConditionRule":{"type":["string","null"],"description":"Defines what is the conditional rule to activate de sales channel."},"CurrencyDecimalDigits":{"type":["integer","null"],"description":"Quantity of currency decimal digits."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a list with details about the store's sales channels.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog API | General | View Product |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "Id": 1,
      "Name": "Main store",
      "IsActive": true,
      "ProductClusterId": null,
      "CountryCode": "BRA",
      "CultureInfo": "pt-BR",
      "TimeZone": "E. South America Standard Time",
      "CurrencyCode": "BRL",
      "CurrencySymbol": "R$",
      "CurrencyLocale": 1046,
      "CurrencyFormatInfo": {
        "CurrencyDecimalDigits": 1,
        "CurrencyDecimalSeparator": ",",
        "CurrencyGroupSeparator": ".",
        "CurrencyGroupSize": 3,
        "StartsWithCurrencySymbol": true
      },
      "Origin": null,
      "Position": 8,
      "ConditionRule": "approved=true",
      "CurrencyDecimalDigits": 1
    },
    {
      "Id": 2,
      "Name": "Markeplace Fashion",
      "IsActive": true,
      "ProductClusterId": null,
      "CountryCode": "BRA",
      "CultureInfo": "pt-BR",
      "TimeZone": "E. South America Standard Time",
      "CurrencyCode": "BRL",
      "CurrencySymbol": "R$",
      "CurrencyLocale": 1046,
      "CurrencyFormatInfo": {
        "CurrencyDecimalDigits": 2,
        "CurrencyDecimalSeparator": ",",
        "CurrencyGroupSeparator": ".",
        "CurrencyGroupSize": 3,
        "StartsWithCurrencySymbol": true
      },
      "Origin": null,
      "Position": 9,
      "ConditionRule": "approved=true",
      "CurrencyDecimalDigits": 1
    }
  ]
  ```
