info:
  name: Get category tree
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/category/tree/:categoryLevels"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: categoryLevels
      value: "1"
      type: path
  auth: inherit

