info:
  name: Update category
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/catalog/pvt/category/:categoryId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: categoryId
      value: "9289"
      type: path
  body:
    type: json
    data: |-
      {
        "Name": "Home Appliances",
        "Keywords": "Kitchen, Laundry, Appliances",
        "Title": "Home Appliances",
        "Description": "Discover our range of home appliances. Find smart vacuums, kitchen and laundry appliances to suit your needs. Order online now.",
        "AdWordsRemarketingCode": "Sale",
        "LomadeeCampaignCode": "Sale",
        "FatherCategoryId": 2,
        "GlobalCategoryId": 222,
        "ShowInStoreFront": true,
        "IsActive": true,
        "ActiveStoreFrontLink": true,
        "ShowBrandFilter": true,
        "Score": 3,
        "StockKeepingUnitSelectionMode": "SPECIFICATION"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[PUT]::/api/catalog/pvt/category/:categoryId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/api/catalog/pvt/category/:categoryId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[PUT]::/api/catalog/pvt/category/:categoryId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[PUT]::/api/catalog/pvt/category/:categoryId - Schema is valid", function () {
          const schema = {"required":["Id","Name","FatherCategoryId","Title","Description","Keywords","IsActive","LomadeeCampaignCode","AdWordsRemarketingCode","ShowInStoreFront","ShowBrandFilter","ActiveStoreFrontLink","GlobalCategoryId","StockKeepingUnitSelectionMode","Score","LinkId","HasChildren","TreePath","TreePathIds","TreePathLinkIds"],"type":"object","description":"Object with the category details.","properties":{"Id":{"type":"integer","description":"Category ID."},"Name":{"type":"string","description":"Category name."},"FatherCategoryId":{"type":["integer","null"],"description":"ID of the father category, apply in case of category and subcategory."},"Title":{"type":"string","description":"Category page title."},"Description":{"type":"string","description":"Describes details about the category."},"Keywords":{"type":"string","description":"Substitutes words for the category."},"IsActive":{"type":"boolean","description":"Shows if the category is active (`true`) or not (`false`)."},"LomadeeCampaignCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"AdWordsRemarketingCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"ShowInStoreFront":{"type":"boolean","description":"Defines if the category is shown on side and upper menu (`true`) or not (`false`)."},"ShowBrandFilter":{"type":"boolean","description":"Defines if the category has brand filter (`true`) or not (`false`)."},"ActiveStoreFrontLink":{"type":"boolean","description":"Defines if the category has an active link on the website (`true`) or not (`false`)."},"GlobalCategoryId":{"type":"integer","description":"Google global category ID."},"StockKeepingUnitSelectionMode":{"type":"string","description":"Defines how the SKU will be exhibited."},"Score":{"type":["integer","null"],"description":"Score for search ordination."},"LinkId":{"type":"string","description":"Category text link ID. This field value is automatically generated when you create or update a category, and it corresponds to the category `name`. Once the category `linkId` is generated, it cannot be modified directly, but you can change it by updating the category with a new `name`."},"HasChildren":{"type":"boolean","description":"Defines if the category has child categories (`true`) or not (`false`)."},"TreePath":{"type":["array","null"],"description":"Category tree path, which corresponds to the category name as it is.\r\n\r\nUnless your request includes the query param `includeTreePath` set as `true`, this field will return `null`.","items":{"type":"string","description":"Category tree path."}},"TreePathIds":{"type":["array","null"],"description":"All of the category tree path IDs. Every nested category would correspond to a path ID.\r\n\r\nUnless your request includes the query param `includeTreePath` set as `true`, this field will return `null`.","items":{"type":"integer","description":"Category tree path ID."}},"TreePathLinkIds":{"type":["array","null"],"description":"List of category tree path link IDs. A link ID is the identifier that forms the last part of the category URL, normalizing special characters.\r\n\r\nUnless your request includes the query param `includeTreePath` set as `true`, this field will return `null`.","items":{"type":"string","description":"Category tree path link ID."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates a previously existing category.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Categories Management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `categoryId` | path | (Required) Category's unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 100055,
    "Name": "Accessories",
    "FatherCategoryId": 100003,
    "Title": "Fashion",
    "Description": "Discover our range of amazing clothes and accessories.",
    "Keywords": "Fashion, Women, Accessories",
    "IsActive": true,
    "LomadeeCampaignCode": "",
    "AdWordsRemarketingCode": "",
    "ShowInStoreFront": true,
    "ShowBrandFilter": true,
    "ActiveStoreFrontLink": true,
    "GlobalCategoryId": 166,
    "StockKeepingUnitSelectionMode": "LIST",
    "Score": null,
    "LinkId": "Accessories",
    "HasChildren": true,
    "TreePath": [
      "Women Fashion",
      "Accessories"
    ],
    "TreePathIds": [
      100003,
      100055
    ],
    "TreePathLinkIds": [
      "Women-Fashion",
      "Accessories"
    ]
  }
  ```
