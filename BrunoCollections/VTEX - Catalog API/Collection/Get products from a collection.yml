      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/collection/:collectionId/products - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/collection/:collectionId/products - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/collection/:collectionId/products - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/collection/:collectionId/products - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Page":{"description":"Page number.","type":"integer"},"Size":{"description":"Page list size.","type":"integer"},"TotalRows":{"description":"Total rows.","type":"integer"},"TotalPage":{"description":"Total pages.","type":"integer"},"Data":{"description":"Array of object with information about the products of the collection.","type":"array","items":{"description":"Product information.","type":"object","properties":{"ProductId":{"description":"Product ID.","type":"integer"},"SkuId":{"description":"SKU ID.","type":"integer"},"SubCollectionId":{"description":"Subcollection ID.","type":"integer"},"Position":{"description":"Position of the product in the collection.","type":"integer"},"ProductName":{"description":"Product name.","type":"string"},"SkuImageUrl":{"description":"SKU image URL.","type":"string"}}}}}};
          const validate = ajv.compile(schema);
