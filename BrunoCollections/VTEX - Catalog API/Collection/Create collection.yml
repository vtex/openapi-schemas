info:
  name: Create collection
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/catalog/pvt/collection"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "Name": "Halloween costumes",
        "Description": "HomeHalloween",
        "Searchable": false,
        "Highlight": false,
        "DateFrom": "2025-11-26T15:23:00",
        "DateTo": "2069-11-26T15:23:00",
        "TotalProducts": 21711792,
        "Type": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog/pvt/collection - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog/pvt/collection - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog/pvt/collection - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog/pvt/collection - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Id":{"type":"integer","description":"Collection's ID."},"Name":{"type":"string","description":"Collection's name."},"Description":{"type":"string","description":"Collection's description for internal use, with the collection's details. It will not be used for search engines."},"Searchable":{"type":"boolean","description":"Option making the collection searchable in the store."},"Highlight":{"type":"boolean","description":"Option if you want the collection to highlight specific products using a tag."},"DateFrom":{"type":"string","description":"Collection start date and time. If a future date and time are set, the collection will have a scheduled status."},"DateTo":{"type":"string","description":"Collection end date and time."},"TotalProducts":{"type":"integer","description":"Number of products contained in the collection."},"Type":{"type":"string","description":"[Type of the collection](https://help.vtex.com/en/tutorial/collection-types--5tKnhh8tMGIrVL7Fqirq7n)."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new collection.

  >⚠️ This endpoint is compatible with [collections configured through the Legacy CMS Portal](https://help.vtex.com/en/tutorial/adding-collections-cms--2YBy6P6X0NFRpkD2ZBxF6L).

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Collection | **Write Collections** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 160,
    "Name": "Halloween costumes",
    "Description": "HomeHalloween",
    "Searchable": true,
    "Highlight": false,
    "DateFrom": "2025-11-26T15:23:00",
    "DateTo": "2069-11-26T15:23:00",
    "TotalProducts": 0,
    "Type": "Manual"
  }
  ```
