info:
  name: Create seller
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/catalog_system/pvt/seller"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "SellerId": "pedrostore",
        "Name": "My pedrostore",
        "Email": "breno@breno.com",
        "Description": "Brief description",
        "ExchangeReturnPolicy": "Exchange return policy text",
        "DeliveryPolicy": "Delivery policy text",
        "UseHybridPaymentOptions": false,
        "UserName": "myseller",
        "Password": "passoword",
        "SecutityPrivacyPolicy": "Secutity privacy policy text",
        "CNPJ": "12035072751",
        "CSCIdentification": "pedrostore",
        "ArchiveId": 1,
        "UrlLogo": "/myseller",
        "ProductCommissionPercentage": 0,
        "FreightCommissionPercentage": 0,
        "FulfillmentEndpoint": "http://pedrostore.vtexcommercestable.com.br/api/fulfillment?affiliateid=LDB&sc=1",
        "CatalogSystemEndpoint": "http://pedrostore.vtexcommercestable.com.br/api/catalog_system/",
        "IsActive": true,
        "FulfillmentSellerId": 1,
        "SellerType": 1,
        "IsBetterScope": false,
        "CategoryCommissionPercentage": "[{\"CategoryId\":14,\"ProductCommission\":15.0,\"FreightCommission\":0.0}]",
        "MerchantName": "pedrostore",
        "TrustPolicy": "Default"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog_system/pvt/seller - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog_system/pvt/seller - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog_system/pvt/seller - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog_system/pvt/seller - Schema is valid", function () {
          const schema = {"type":"object","properties":{"SellerId":{"type":"string","description":"Code used to identify the seller. It is assigned by the marketplace. We recommend filling it in with the seller's account name."},"Name":{"type":"string","description":"Name of the account in the seller's environment. You can find it on **Account settings > Account > Account Name**). Applicable only if the seller uses their own payment method."},"Email":{"type":"string","description":"Email of the administrator responsible for the seller."},"Description":{"type":"string","description":"Text describing the seller with a marketing tone. You can display this text in the marketplace window display by [customizing the CMS](https://help.vtex.com/en/tutorial/list-of-controls-for-templates--tutorials_563)."},"ExchangeReturnPolicy":{"type":"string","description":"Text describing the exchange and return policy previously agreed between the marketplace and the seller."},"DeliveryPolicy":{"type":"string","description":"Text describing the delivery policy previously agreed between the marketplace and the seller."},"UseHybridPaymentOptions":{"type":"boolean","description":"Allows customers to use gift cards from the seller to buy their products on the marketplace. It identifies purchases made with a gift card so that only the final price (with discounts applied) is paid to the seller."},"UserName":{"type":["string","null"],"description":"Seller username."},"Password":{"type":["string","null"],"description":"Seller password."},"SecutityPrivacyPolicy":{"type":"string","description":"Text describing the security policy previously agreed between the marketplace and the seller."},"CNPJ":{"type":"string","description":"Company registration number."},"CSCIdentification":{"type":"string","description":"CSC identification."},"ArchiveId":{"type":["integer","null"],"description":"Seller archive ID."},"UrlLogo":{"type":["string","null"],"description":"Seller URL logo."},"ProductCommissionPercentage":{"type":"number","description":"The percentage that must be filled in as agreed between the marketplace and the seller. If there is no such commission, please fill in the field with the value: `0.00`."},"FreightCommissionPercentage":{"type":"number","description":"The percentage that must be filled in as agreed between the marketplace and the seller. If there is no such commission, please fill in the field with the value: `0.00`."},"CategoryCommissionPercentage":{"type":"string","description":"The percentage that must be filled in as agreed between the marketplace and the seller. If there is no such commission, please fill in the field with the value: `0.00`."},"FulfillmentEndpoint":{"type":["string","null"],"description":"URL of the endpoint for fulfillment of seller's orders, which the marketplace will use to communicate with the seller. This field applies to all sellers, regardless of their type. However, for `VTEX Stores`, you don't need to fill it in because the system will do that automatically. You can edit this field once the seller has been successfully added."},"CatalogSystemEndpoint":{"type":"string","description":"URL of the endpoint of the seller's catalog. This field will only be displayed if the seller type is VTEX Store. The field format will be as follows: `http://{sellerName}.vtexcommercestable.com.br/api/catalog_system/`."},"IsActive":{"type":"boolean","description":"If the selle is active (`true`) or not (`false`)."},"MerchantName":{"type":"string","description":"Name of the marketplace, used to guide payments. This field should be nulled if the marketplace is responsible for processing payments. Check out our [Split Payment](https://help.vtex.com/en/tutorial/split-de-pagamento--6k5JidhYRUxileNolY2VLx) article to know more."},"FulfillmentSellerId":{"type":["integer","null"],"description":"Identification code of the seller responsible for fulfilling the order. This is an optional field used when a seller sells SKUs from another seller. If the seller sells their own SKUs, it must be left blank."},"SellerType":{"type":"integer","description":"Seller type."},"IsBetterScope":{"type":"boolean","description":"Indicates whether it is a [comprehensive seller](https://help.vtex.com/en/tutorial/comprehensive-seller--5Qn4O2GpjUIzWTPpvLUfkI)."},"TrustPolicy":{"type":"string","description":"Seller trust policy. The default value is `'Default'`, but if your store is a B2B marketplace and you want to share the customers'emails with the sellers you need to set this field as `'AllowEmailSharing'`."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new seller.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "SellerId": "pedrostore",
    "Name": "pedrostore",
    "Email": "breno@breno.com",
    "Description": "",
    "ExchangeReturnPolicy": "",
    "DeliveryPolicy": "",
    "UseHybridPaymentOptions": false,
    "UserName": null,
    "Password": null,
    "SecutityPrivacyPolicy": "",
    "CNPJ": "12035072751",
    "CSCIdentification": "pedrostore",
    "ArchiveId": null,
    "UrlLogo": null,
    "ProductCommissionPercentage": 0,
    "FreightCommissionPercentage": 0,
    "CategoryCommissionPercentage": "[{\"CategoryId\":14,\"ProductCommission\":15.0,\"FreightCommission\":0.0}]",
    "FulfillmentEndpoint": "http://pedrostore.vtexcommercestable.com.br/api/fulfillment?affiliateid=LDB&sc=1",
    "CatalogSystemEndpoint": "http://pedrostore.vtexcommercestable.com.br/api/catalog_system/",
    "IsActive": true,
    "MerchantName": "",
    "FulfillmentSellerId": null,
    "SellerType": 1,
    "IsBetterScope": false,
    "TrustPolicy": "Default"
  }
  ```
