info:
  name: Create SKU service type
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/catalog/pvt/skuservicetype"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "Name": "Engraving",
        "IsActive": true,
        "ShowOnProductFront": false,
        "ShowOnCartFront": false,
        "ShowOnAttachmentFront": false,
        "ShowOnFileUpload": false,
        "IsGiftCard": false,
        "IsRequired": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog/pvt/skuservicetype - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog/pvt/skuservicetype - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog/pvt/skuservicetype - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog/pvt/skuservicetype - Schema is valid", function () {
          const schema = {"type":"object","description":"Object with the response.","properties":{"Id":{"type":"integer","description":"SKU service type ID."},"Name":{"type":"string","description":"SKU service type name. Maximum of 100 characters."},"IsActive":{"type":"boolean","description":"Defines if the SKU service type is active or not."},"ShowOnProductFront":{"type":"boolean","description":"Deprecated field."},"ShowOnCartFront":{"type":"boolean","description":"Defines if the SKU service type is displayed on the cart screen."},"ShowOnAttachmentFront":{"type":"boolean","description":"Defines if the SKU service type has an attachment.","default":false},"ShowOnFileUpload":{"type":"boolean","description":"Defines if the SKU service type can be associated with an attachment or not.","default":false},"IsGiftCard":{"type":"boolean","description":"Defines if the SKU service type is displayed as a Gift Card.","default":false},"IsRequired":{"type":"boolean","description":"Defines if the SKU service type is mandatory.","default":false}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new SKU service type.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Commercial | **SKU type management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 2,
    "Name": "Engraving",
    "IsActive": true,
    "ShowOnProductFront": true,
    "ShowOnCartFront": true,
    "ShowOnAttachmentFront": true,
    "ShowOnFileUpload": true,
    "IsGiftCard": true,
    "IsRequired": true
  }
  ```
