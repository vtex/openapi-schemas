info:
  name: Add excluded collection to product assortment
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/catalog/pvt/assortment/:productAssortmentID/excluded-collections/:collectionID"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: productAssortmentID
      value: "1"
      type: path
    - name: collectionID
      value: "149"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog/pvt/assortment/:productAssortmentID/excluded-collections/:collectionID - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog/pvt/assortment/:productAssortmentID/excluded-collections/:collectionID - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog/pvt/assortment/:productAssortmentID/excluded-collections/:collectionID - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog/pvt/assortment/:productAssortmentID/excluded-collections/:collectionID - Schema is valid", function () {
          const schema = {"type":"object","description":"Object with information about the association between an assortment and a collection.","properties":{"assortmentId":{"type":"integer","description":"Assortment's unique identifier."},"collectionId":{"type":"integer","description":"Collection's unique identifier associated with the assortment."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Associates a collection as an excluded collection of the specified product assortment. Excluded collections define the SKUs that must be hidden when the exclusion model is applied to the catalog segmentation.

  The same collection cannot be associated twice with the same assortment. In that case, the request will return a status code `409` error.

  >⚠️ This feature is only available for stores using the B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --- | ----- | ----- |
  | Catalog | Content | **Product and SKU Management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productAssortmentID` | path | (Required) Product assortment's unique numerical identifier. |
  | `collectionID` | path | (Required) Collection's unique numerical identifier. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "assortmentId": 13,
    "collectionId": 149
  }
  ```
