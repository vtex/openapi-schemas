info:
  name: Get all product assortments
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/assortment"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: name
      value: Stationery
      type: query
      disabled: true
    - name: after
      value: "20"
      type: query
      disabled: true
    - name: size
      value: "20"
      type: query
      disabled: true
    - name: collectionId
      value: "158"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/assortment - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/assortment - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/assortment - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/assortment - Schema is valid", function () {
          const schema = {"type":"object","properties":{"TotalRows":{"type":"integer","description":"Total number of assortments available at the merchant level."},"Data":{"type":"array","description":"List of assortments returned in the current page.","items":{"type":"object","description":"Object with information about an assortment.","properties":{"Id":{"type":"integer","description":"Assortment's unique numerical identifier."},"Name":{"type":"string","description":"Assortment's unique name."},"CreatedAt":{"type":"string","format":"date-time","description":"Date and time when the assortment was created, in UTC format."},"UpdatedAt":{"type":"string","format":"date-time","description":"Date and time when the assortment was last updated, in UTC format."},"IncludedCollections":{"type":"array","description":"List of collection IDs explicitly allowed by the assortment.","items":{"type":"integer","description":"Included collection's unique numerical identifier."}},"ExcludedCollections":{"type":"array","description":"List of collection IDs explicitly restricted by the assortment.","items":{"type":"integer","description":"Excluded collection's unique numerical identifier."}}}}},"Size":{"type":"integer","description":"Number of assortments returned in the current page."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the list of product assortments registered at the merchant level.

  Assortments are used to segment the catalog for specific business contexts (for example, B2B contracts or Organization Units) based on the inclusion and exclusion of collection IDs:

  - **Inclusion model:** All products are restricted by default, and only SKUs that belong to the included collections are visible.
  - **Exclusion model:** All products are available by default, and SKUs that belong to the excluded collections are hidden.

  The list returned contains both the included and excluded collections associated with an assortment.

  >⚠️ This feature is only available for stores using the B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --- | ----- | ----- |
  | Catalog | Content | **Product and SKU Management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `name` | query | Assortment name. |
  | `after` | query | Cursor indicating the assortment ID after which the next page of results must start. Useful for cursor-based pagination. |
  | `size` | query | Maximum number of assortments returned in the response when using cursor-based pagination. |
  | `collectionId` | query | Filters the result to return only assortments that reference the specified collection ID, either as an included or as an excluded collection. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "TotalRows": 23,
    "Data": [
      {
        "Id": 1,
        "Name": "Stationery",
        "CreatedAt": "2026-03-17T13:50:12.853",
        "UpdatedAt": "2026-03-19T17:16:27.652",
        "IncludedCollections": [
          157
        ],
        "ExcludedCollections": [
          158
        ]
      },
      {
        "Id": 2,
        "Name": "Electronics",
        "CreatedAt": "2026-03-17T13:51:09.817",
        "UpdatedAt": "2026-03-17T13:51:09.817",
        "IncludedCollections": [
          158
        ],
        "ExcludedCollections": []
      },
      {
        "Id": 3,
        "Name": "Furniture",
        "CreatedAt": "2026-03-17T14:28:46.503",
        "UpdatedAt": "2026-03-17T14:28:46.503",
        "IncludedCollections": [],
        "ExcludedCollections": []
      }
    ],
    "Size": 20
  }
  ```
