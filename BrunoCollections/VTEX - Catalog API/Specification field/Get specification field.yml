info:
  name: Get specification field
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/specification/fieldGet/:fieldId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: fieldId
      value: "88"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pub/specification/fieldGet/:fieldId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pub/specification/fieldGet/:fieldId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pub/specification/fieldGet/:fieldId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pub/specification/fieldGet/:fieldId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Name":{"type":"string","description":"Specification field name."},"FieldId":{"type":"integer","description":"Specification field ID."},"IsActive":{"type":"boolean","description":"Enable (`true`) or disable (`false`) specification."},"IsRequired":{"type":"boolean","description":"Makes the specification mandatory (`true`) or optional (`false`)."},"FieldTypeId":{"type":"integer","description":"Field type ID can be `1 - Text`, `2 - Multi-Line Text`, `4 - Number`, `5 - Combo`, `6 - Radio`, `7 - Checkbox`, `8 - Indexed Text`, `9 - Indexed Multi-Line Text`."},"FieldTypeName":{"type":"string","description":"Field type name, which can be `Text`, `Multi-Line Text`, `Number`, `Combo`, `Radio`, `Checkbox`, `Indexed Text` or `Indexed Multi-Line Text`."},"FieldValueId":{"type":["integer","null"],"description":"Specification value ID."},"Description":{"type":["string","null"],"description":"Deprecated field."},"IsStockKeepingUnit":{"type":"boolean","description":"If `true`, it will be added as a SKU specification. If `false`, it will be added as a product specification field."},"IsFilter":{"type":"boolean","description":"Store Framework - Deprecated.\r\nLegacy CMS Portal - To allow the specification to be used as a facet (filter) on the search navigation bar."},"IsOnProductDetails":{"type":"boolean","description":"Store Framework - Deprecated.\r\nLegacy CMS Portal -If specification is visible on the product page."},"Position":{"type":"integer","description":"Store Framework - Deprecated.\r\nLegacy CMS Portal - This position number is used in ordering the specifications both in the navigation menu and in the specification listing on the product page."},"IsWizard":{"type":["boolean","null"],"description":"Deprecated field."},"IsTopMenuLinkActive":{"type":"boolean","description":"Store Framework - Deprecated.\r\nLegacy CMS Portal - To make the specification visible in the store's upper menu."},"IsSideMenuLinkActive":{"type":"boolean","description":"Store Framework - Deprecated.\r\nLegacy CMS Portal - To make the specification field clickable in the search navigation bar."},"DefaultValue":{"type":["string","null"],"description":"Specification default value."},"FieldGroupId":{"type":"integer","description":"ID of the group of specifications that contains the new specification."},"FieldGroupName":{"type":"string","description":"Specification field group name."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves details from a specification field by this field's ID. 
  >⚠️ This is a legacy endpoint. We recommend using [Get specification](https://developers.vtex.com/vtex-rest-api/reference/get_api-catalog-pvt-specification-specificationid) instead.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Commercial | **SKU management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `fieldId` | path | (Required) Specification field ID. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Name": "Material",
    "CategoryId": 4,
    "FieldId": 88,
    "IsActive": true,
    "IsRequired": true,
    "FieldTypeId": 1,
    "FieldTypeName": "Texto",
    "FieldValueId": null,
    "Description": "Composition of the product.",
    "IsStockKeepingUnit": false,
    "IsFilter": true,
    "IsOnProductDetails": false,
    "Position": 1,
    "IsWizard": false,
    "IsTopMenuLinkActive": false,
    "IsSideMenuLinkActive": true,
    "DefaultValue": null,
    "FieldGroupId": 20,
    "FieldGroupName": "Clothes specifications"
  }
  ```
