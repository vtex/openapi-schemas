info:
  name: Get category translation
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/category/:categoryId/language/:locale"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: categoryId
      value: "10"
      type: path
    - name: locale
      value: en-US
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/category/:categoryId/language/:locale - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/category/:categoryId/language/:locale - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/category/:categoryId/language/:locale - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/category/:categoryId/language/:locale - Schema is valid", function () {
          const schema = {"type":"array","items":{"type":"object","description":"Object containing language-specific information for a category.","properties":{"Id":{"type":"integer","description":"Unique identifier of the category."},"Locale":{"type":"string","description":"The locale code for this translation. It follows the IETF BCP 47 standard, such as 'en-US' for English (United States), 'en-ES' for Spanish (Spain), or 'pt-BR' for Portuguese (Brazil)."},"Name":{"type":"string","description":"Translated name of the category."},"Title":{"type":["string","null"],"description":"Translated title of the category for SEO purposes."},"Description":{"type":["string","null"],"description":"Translated description of the category."},"Keywords":{"type":["string","null"],"description":"Category translated keywords for SEO."},"LinkId":{"type":["string","null"],"description":"Translated URL-friendly identifier for the category."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves language-specific information for a given category.

  > ℹ️ Learn more in the [Catalog multi-language integration guide](https://developers.vtex.com/docs/guides/catalog-multi-language-integration-guide).

  ## Permissions

  Any user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | - | - | - |
  | Catalog | Content | Categories Management |

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `categoryId` | path | (Required) Unique identifier of the category. |
  | `locale` | path | (Required) Code used to filter translations by a given language. The format follows the IETF BCP 47 standard, such as 'en-US' for English (United States), 'en-ES' for Spanish (Spain), or 'pt-BR' for Portuguese (Brazil). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "Id": 12,
      "Locale": "en-US",
      "Name": "Men's Clothing",
      "Title": "Men's Clothing Fashion Store",
      "Description": "Discover our collection of men's clothing",
      "Keywords": "men, clothing, fashion, apparel",
      "LinkId": "mens-clothing"
    }
  ]
  ```
