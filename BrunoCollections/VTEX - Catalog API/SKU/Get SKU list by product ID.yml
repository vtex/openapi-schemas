info:
  name: Get SKU list by product ID
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pvt/sku/stockkeepingunitByProductId/:productId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: productId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pvt/sku/stockkeepingunitByProductId/:productId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pvt/sku/stockkeepingunitByProductId/:productId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pvt/sku/stockkeepingunitByProductId/:productId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pvt/sku/stockkeepingunitByProductId/:productId - Schema is valid", function () {
          const schema = {"type":"array","description":"Array with information of all SKUs with the same product ID.","items":{"type":"object","description":"Object with the response.","properties":{"IsPersisted":{"type":"boolean","description":"Defines if the SKU is persisted."},"IsRemoved":{"type":"boolean","description":"Defines if the SKU is removed."},"Id":{"type":"integer","format":"int32","description":"SKU ID."},"ProductId":{"type":"integer","format":"int32","description":"Product ID."},"IsActive":{"type":"boolean","description":"Defines if the SKU is active or not."},"Name":{"type":"string","description":"SKU name."},"Height":{"type":"number","description":"SKU height."},"RealHeight":{"type":["number","null"],"description":"Real SKU height."},"Width":{"type":"number","description":"SKU width."},"RealWidth":{"type":["number","null"],"description":"Real SKU width."},"Length":{"type":"number","description":"SKU length."},"RealLength":{"type":["number","null"],"description":"Real SKU length."},"WeightKg":{"type":["number","null"],"description":"Weight of the SKU in the measurement [configured in the store](https://help.vtex.com/en/tutorial/filling-in-system-settings--tutorials_269), which by default is in grams."},"RealWeightKg":{"type":["number","null"],"description":"Real weight of the SKU in the measurement unit [configured in the store](https://help.vtex.com/en/tutorial/filling-in-system-settings--tutorials_269), which by default is in grams."},"ModalId":{"type":"integer","format":"int32","description":"Delivery method (modal type) ID."},"RefId":{"type":"string","description":"Product reference ID."},"CubicWeight":{"type":"number","description":"[Cubic weight](https://help.vtex.com/en/tutorial/understanding-the-cubic-weight-factor--tutorials_128)."},"IsKit":{"type":"boolean","description":"Defines whether the SKU is made up of one or more SKUs (part of a kit) (`true`) or not (`false`). Must be enabled if you are adding a kit. Once activated, this definition cannot be reverted."},"IsDynamicKit":{"type":["string","null"],"description":"Deprecated field."},"InternalNote":{"type":["string","null"],"description":"Internal note."},"DateUpdated":{"type":"string","description":"Date when the product was updated for the most recent time."},"RewardValue":{"type":["number","null"],"description":"Credit that the customer receives when finalizing an order that includes the SKU. By filling this field out with `1`, the customer receives credit on the site in the selected currency, e.g. U$ 1."},"CommercialConditionId":{"type":"integer","format":"int32","description":"Commercial condition ID, used to define SKU specific promotions or installment rules. In case of no specific condition, use `1` (default value). This field does not accept `0`. Learn more at [Registering a commercial condition](https://help.vtex.com/tutorial/registering-a-commercial-condition--tutorials_445).","default":1},"EstimatedDateArrival":{"type":["string","null"],"description":"SKU estimated arrival date in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format, when the product is on pre-sale. You must take into consideration both the launch date and the freight calculation for the arrival date."},"FlagKitItensSellApart":{"type":"boolean","description":"Defines if the SKU bundle items can be sold separately."},"ManufacturerCode":{"type":"string","description":"Identifier provided by the manufacturers to identify their product. This field should be filled in if the product has a specific manufacturer's code."},"ReferenceStockKeepingUnitId":{"type":["string","null"],"description":"SKU reference ID."},"Position":{"type":"integer","format":"int32","description":"SKU position."},"ActivateIfPossible":{"type":"boolean","description":"When set to `true`, this attribute will automatically update the SKU as active once associated with an image or an active component."},"MeasurementUnit":{"type":"string","description":"Measurement unit. This field should only be used when it is necessary to convert the unit of measure for sale. For example, if a product is sold in boxes, but customers want to buy per square meter (m²). In common cases, use `\"un\"`."},"UnitMultiplier":{"type":"number","description":"Multiple number of SKU. If the multiplier is 5.0000, the product can be added in multiple quantities of 5, 10, 15, 20, onward."},"IsInventoried":{"type":["boolean","null"],"description":"Deprecated field."},"IsTransported":{"type":["boolean","null"],"description":"Deprecated field."},"IsGiftCardRecharge":{"type":["boolean","null"],"description":"Defines if the purchase of the SKU will generate reward value for the customer."},"ModalType":{"type":["string","null"],"description":"Links an unusual type of SKU that needs special transportation, such as meat, glass, or a mattress, to a carrier specialized in delivering it. This field should be filled in with the name of the modal (e.g. \"Chemicals\" or \"Refrigerated products\"). To learn more about this feature, read our articles [How the modal works](https://help.vtex.com/en/tutorial/how-does-the-modal-work--tutorials_125) and [Setting up modal for carriers](https://help.vtex.com/en/tutorial/configure-modal--3jhLqxuPhuiq24UoykCcqy)."},"isKitOptimized":{"type":"boolean","description":"Defines if the SKU is an optimized bundle."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a list with the SKUs related to a product by the product's ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **SKUs** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Product's unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "IsPersisted": true,
      "IsRemoved": false,
      "Id": 2000035,
      "ProductId": 2000024,
      "IsActive": true,
      "Name": "33 - Preto",
      "Height": 8,
      "RealHeight": null,
      "Width": 15,
      "RealWidth": null,
      "Length": 8,
      "RealLength": null,
      "WeightKg": 340,
      "RealWeightKg": null,
      "ModalId": 1,
      "RefId": "",
      "CubicWeight": 0.2,
      "IsKit": false,
      "IsDynamicKit": null,
      "InternalNote": null,
      "DateUpdated": "2015-11-06T19:10:00",
      "RewardValue": 0.01,
      "CommercialConditionId": 1,
      "EstimatedDateArrival": null,
      "FlagKitItensSellApart": false,
      "ManufacturerCode": "",
      "ReferenceStockKeepingUnitId": null,
      "Position": 0,
      "EditionSkuId": null,
      "ApprovedAdminId": 123,
      "EditionAdminId": 123,
      "ActivateIfPossible": true,
      "SupplierCode": null,
      "MeasurementUnit": "un",
      "UnitMultiplier": 2,
      "IsInventoried": null,
      "IsTransported": null,
      "IsGiftCardRecharge": null,
      "ModalType": null
    }
  ]
  ```
