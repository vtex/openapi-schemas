info:
  name: Get SKU and context
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pvt/sku/stockkeepingunitbyid/:skuId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: sc
      value: "1"
      type: query
      disabled: true
    - name: skuId
      value: "2001773"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pvt/sku/stockkeepingunitbyid/:skuId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pvt/sku/stockkeepingunitbyid/:skuId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pvt/sku/stockkeepingunitbyid/:skuId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

