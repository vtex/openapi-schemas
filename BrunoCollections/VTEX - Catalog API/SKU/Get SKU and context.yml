Id":{"type":"string","description":"Product brand ID."},"BrandName":{"type":"string","description":"Product brand Name."},"Dimension":{"required":["cubicweight","height","length","weight","width"],"type":"object","description":"Object containing the SKU dimensions to be used on the shipping calculation.","properties":{"cubicweight":{"type":"number","description":"SKU [cubic weight](https://help.vtex.com/en/tutorial/understanding-the-cubic-weight-factor--tutorials_128)."},"height":{"type":"number","description":"SKU height."},"length":{"type":"number","description":"SKU length."},"weight":{"type":"number","description":"SKU weight."},"width":{"type":"number","description":"SKU width."}}},"RealDimension":{"required":["realCubicWeight","realHeight","realLength","realWeight","realWidth"],"type":"object","description":"Object containing the real SKU dimensions, which appear in the product page.","properties":{"realCubicWeight":{"type":"number","description":"Real SKU [cubic weight](https://help.vtex.com/en/tutorial/understanding-the-cubic-weight-factor--tutorials_128)."},"realHeight":{"type":"number","description":"Real SKU height."},"realLength":{"type":"number","description":"Real SKU length."},"realWeight":{"type":"number","description":"Real SKU weight."},"realWidth":{"type":"number","description":"Real SKU width."}}},"ManufacturerCode":{"type":"string","description":"Product Supplier ID."},"IsKit":{"type":"boolean","description":"Defines whether the SKU is made up of one or more SKUs (part of a kit) (`true`) or not (`false`). Must be enabled if you are adding a kit. Once activated, this definition cannot be reverted."},"KitItems":{"type":"array","items":{"type":"string","description":"SKU ID."},"description":"Array with SKU IDs of bundle components."},"Services":{"type":"array","items":{"type":"string","description":"Service ID."},"description":"Array with Service IDs that are related to the SKU."},"Categories":{"type":"array","items":{"type":"string","description":"Category ID."},"description":"Array with Categories from the related product."},"Attachments":{"type":"array","items":{"required":["Id","Name","Keys","Fields","IsActive","IsRequired"],"type":"object","description":"Object containing information about SKU attachments.","properties":{"Id":{"type":"integer","description":"Attachment ID."},"Name":{"type":"string","description":"Attachment name."},"Keys":{"type":"array","items":{"type":"string","description":"Each attachment key."},"description":"Attachment Keys."},"Fields":{"type":"array","items":{"required":["FieldName","MaxCaracters","DomainValues"],"type":"object","description":"Object with field details.","properties":{"FieldName":{"type":"string","description":"Attachment field name."},"MaxCaracters":{"type":"string","description":"Maximum number of characters accepted in the attachment field."},"DomainValues":{"type":["string","null"],"description":"Allowed key values."}}},"description":"Array containing attachment fields."},"IsActive":{"type":"boolean","description":"Defines if the attachment is active or not."},"IsRequired":{"type":"boolean","description":"Defines if the attachment is required or not."}}},"description":"Array with Attachments ID that are related to the SKU."},"Collections":{"type":"array","items":{"type":"string","description":"Collection ID."},"description":"Array with Collection IDs that are related to the product."},"SkuSellers":{"type":"array","items":{"required":["SellerId","StockKeepingUnitId","SellerStockKeepingUnitId","IsActive","FreightCommissionPercentage","ProductCommissionPercentage"],"type":"object","description":"Object containing related SKU sellers data.","properties":{"SellerId":{"type":"string","description":"SKU seller ID. This is the ID that identifies the seller in the marketplace. It can be the same as the seller name or a unique number. Check the **Sellers management** section in the Admin to get the correct ID."},"StockKeepingUnitId":{"type":"integer","description":"SKU ID."},"SellerStockKeepingUnitId":{"type":"string","description":"SKU ID for the SKU seller."},"IsActive":{"type":"boolean","description":"Defines if the SKU is active."},"FreightCommissionPercentage":{"type":"number","description":"Registered value for Seller Freight Commission."},"ProductCommissionPercentage":{"type":"number","description":"Registered value for Seller product Commission."}}},"description":"Array with SKU sellers data."},"SalesChannels":{"type":"array","items":{"type":"integer","description":"Sales channel ID."},"description":"Array with the ID of all the sales channels that are related to the product."},"Images":{"type":"array","items":{"required":["ImageUrl","ImageName","FileId"],"type":"object","description":"Object containing SKU images details.","properties":{"ImageUrl":{"type":"string","description":"Image URL."},"ImageName":{"type":["string","null"],"description":"Image label."},"FileId":{"type":"integer","format":"int32","description":"SKU image ID."}}},"description":"Array with SKU images."},"SkuSpecifications":{"type":"array","items":{"required":["FieldId","FieldName","FieldValueIds","FieldValues"],"type":"object","description":"Object containing related SKU specifications.","properties":{"FieldId":{"type":"integer","format":"int32","description":"Specification field ID."},"FieldName":{"type":"string","description":"Specification field Name."},"FieldValueIds":{"type":"array","items":{"type":"integer","format":"int32","description":"Specification value ID."},"description":"Array with related specification values IDs."},"FieldValues":{"type":"array","items":{"type":"string","description":"Each field value."},"description":"Array with related specification values."}}},"description":"Array with related SKU specifications."},"ProductSpecifications":{"type":"array","items":{"required":["FieldId","FieldName","FieldValueIds","FieldValues"],"type":"object","description":"Object with product specification details.","properties":{"FieldId":{"type":"integer","format":"int32","description":"Specification field ID."},"FieldName":{"type":"string","description":"Specification name. Limited to 100 characters."},"FieldValueIds":{"type":"array","items":{"type":"integer","format":"int32","description":"Specification value ID."},"description":"Array with related specification values IDs."},"FieldValues":{"type":"array","items":{"type":"string","description":"Each field value."},"description":"Array with related specification values."}}},"description":"Array with related product specifications."},"ProductClustersIds":{"type":"string","description":"Product clusters IDs."},"ProductCategoryIds":{"type":"string","description":"Category hierarchy with category IDs."},"ProductGlobalCategoryId":{"type":["integer","null"],"description":"Global category ID."},"ProductCategories":{"type":"object","description":"Object containing product categories. Structure: \"{CategoryID}\": \"{CategoryName}\".","additionalProperties":{"type":"string","description":"Category ID.","additionalProperties":{"type":"string","description":"Category name."}}},"CommercialConditionId":{"type":"integer","format":"int32","description":"Commercial condition ID, used to define SKU specific promotions or installment rules. In case of no specific condition, use `1` (default value). This field does not accept `0`. Learn more at [Registering a commercial condition](https://help.vtex.com/tutorial/registering-a-commercial-condition--tutorials_445).","default":1},"RewardValue":{"type":"number","description":"Credit that the customer receives when finalizing an order that includes the SKU. By filling this field out with `1`, the customer receives credit on the site in the selected currency, e.g. U$ 1."},"AlternateIds":{"type":"object","description":"Array with alternate SKU IDs, such as EAN and `RefId`.","properties":{"Ean":{"type":"string","description":"SKU EAN."},"RefId":{"type":"string","description":"SKU reference ID."}}},"AlternateIdValues":{"type":"array","items":{"type":"string","description":"Alternative SKU ID."},"description":"Array with values of alternative SKU IDs."},"EstimatedDateArrival":{"type":["string","null"],"description":"To add the product as pre-sale, enter the product estimated arrival date in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format. You must take into consideration both the launch date and the freight calculation for the arrival date."},"MeasurementUnit":{"type":"string","description":"Measurement unit. This field should only be used when it is necessary to convert the unit of measure for sale. For example, if a product is sold in boxes, but customers want to buy per square meter (m²). In common cases, use `\"un\"`."},"UnitMultiplier":{"type":"number","description":"Multiple number of SKU. If the multiplier is 5.0000, the product can be added in multiple quantities of 5, 10, 15, 20, onward."},"InformationSource":{"type":["string","null"],"description":"Information source."},"ModalType":{"type":["string","null"],"description":"Links an unusual type of SKU that needs special transportation, such as meat, glass, or a mattress, to a carrier specialized in delivering it. This field should be filled in with the name of the modal (e.g. \"Chemicals\" or \"Refrigerated products\"). To learn more about this feature, read our articles [How the modal works](https://help.vtex.com/en/tutorial/how-does-the-modal-work--tutorials_125) and [Setting up modal for carriers](https://help.vtex.com/en/tutorial/configure-modal--3jhLqxuPhuiq24UoykCcqy)."},"KeyWords":{"type":["string","null"],"description":"Keywords related to the product."},"ReleaseDate":{"type":["string","null"],"description":"Release date of the product."},"ProductIsVisible":{"type":"boolean","description":"Defines if the product is visible or not."},"ShowIfNotAvailable":{"type":"boolean","description":"Defines if the product will be shown if it is not available."},"IsProductActive":{"type":"boolean","description":"Defines if the product is active or not."},"ProductFinalScore":{"type":"integer","description":"Product final score."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

