info:
  name: Get SKU
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/stockkeepingunit/:skuId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: skuId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Id":{"type":"integer","description":"SKU unique identifier."},"ProductId":{"type":"integer","description":"ID of the product associated with this SKU."},"IsActive":{"type":"boolean","description":"Shows if the SKU is active (`true`) or not (`false`)."},"ActivateIfPossible":{"type":"boolean","description":"When set to `true`, this attribute will automatically update the SKU as active once associated with an image or an active component."},"Name":{"type":"string","description":"SKU name, meaning the variation of the previously added product. For example: **Product** - _Fridge_, **SKU** - _110V_."},"RefId":{"type":"string","description":"Reference code used internally for organizational purposes. Must be unique. It is not required only if EAN code already exists. If not, this field must be provided."},"PackagedHeight":{"type":"number","description":"Height used for shipping calculation."},"PackagedLength":{"type":"number","description":"Length used for shipping calculation."},"PackagedWidth":{"type":"number","description":"Width used for shipping calculation."},"PackagedWeightKg":{"type":"integer","description":"Weight used for shipping calculation, in the measurement unit [configured in the store](https://help.vtex.com/en/tutorial/filling-in-system-settings--tutorials_269), which by default is in grams."},"Height":{"type":"number","description":"SKU real height."},"Length":{"type":"number","description":"SKU real length."},"Width":{"type":"number","description":"SKU real width."},"WeightKg":{"type":"number","description":"Weight of the SKU in the measurement [configured in the store](https://help.vtex.com/en/tutorial/filling-in-system-settings--tutorials_269), which by default is in grams."},"CubicWeight":{"type":"number","description":"[Cubic weight](https://help.vtex.com/en/tutorial/understanding-the-cubic-weight-factor--tutorials_128)."},"IsKit":{"type":"boolean","description":"Defines whether the SKU is made up of one or more SKUs (part of a kit) (`true`) or not (`false`). Must be enabled if you are adding a kit. Once activated, this definition cannot be reverted."},"CreationDate":{"type":"string","description":"Date and time of the SKU's creation."},"RewardValue":{"type":"number","description":"Credit that the customer receives when finalizing an order that includes the SKU. By filling this field out with `1`, the customer receives credit on the site in the selected currency, e.g. U$ 1."},"EstimatedDateArrival":{"type":["string","null"],"description":"SKU estimated arrival date in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format, when the product is on pre-sale. You must take into consideration both the launch date and the freight calculation for the arrival date."},"ManufacturerCode":{"type":"string","description":"Identifier provided by the manufacturers to identify their product. This field should be filled in if the product has a specific manufacturer's code."},"CommercialConditionId":{"type":"integer","description":"Commercial condition ID, used to define SKU specific promotions or installment rules. In case of no specific condition, use `1` (default value). This field does not accept `0`. Learn more at [Registering a commercial condition](https://help.vtex.com/tutorial/registering-a-commercial-condition--tutorials_445)."},"MeasurementUnit":{"type":"string","description":"Measurement unit. This field should only be used when it is necessary to convert the unit of measure for sale. For example, if a product is sold in boxes, but customers want to buy per square meter (m²). In common cases, use `\"un\"`."},"UnitMultiplier":{"type":"number","description":"Multiple number of SKU. If the multiplier is 5.0000, the product can be added in multiple quantities of 5, 10, 15, 20, onward."},"ModalType":{"type":["string","null"],"description":"Links an unusual type of SKU that needs special transportation, such as meat, glass, or a mattress, to a carrier specialized in delivering it. This field should be filled in with the name of the modal (e.g. \"Chemicals\" or \"Refrigerated products\"). To learn more about this feature, read our articles [How the modal works](https://help.vtex.com/en/tutorial/how-does-the-modal-work--tutorials_125) and [Setting up modal for carriers](https://help.vtex.com/en/tutorial/configure-modal--3jhLqxuPhuiq24UoykCcqy)."},"KitItensSellApart":{"type":"boolean","description":"Defines if kit components can be sold apart."},"Videos":{"type":"array","description":"Videos URLs.","items":{"type":"string","description":"Video URL."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a specific SKU by its ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **SKUs** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `skuId` | path | (Required) SKU unique identifier number. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 70,
    "ProductId": 42,
    "IsActive": false,
    "ActivateIfPossible": false,
    "Name": "Size 10",
    "RefId": "B096QW8Y8Z",
    "PackagedHeight": 10,
    "PackagedLength": 10,
    "PackagedWidth": 10,
    "PackagedWeightKg": 10,
    "Height": 1,
    "Length": 1,
    "Width": 1,
    "WeightKg": 1,
    "CubicWeight": 0.1667,
    "IsKit": false,
    "CreationDate": "2020-01-25T15:51:29.2614605",
    "RewardValue": 0,
    "EstimatedDateArrival": null,
    "ManufacturerCode": "",
    "CommercialConditionId": 1,
    "MeasurementUnit": "un",
    "UnitMultiplier": 2,
    "ModalType": null,
    "KitItensSellApart": false,
    "Videos": [
      "https://www.youtube.com/"
    ]
  }
  ```
