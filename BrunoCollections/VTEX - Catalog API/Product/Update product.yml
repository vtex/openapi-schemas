info:
  name: Update product
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/catalog/pvt/product/:productId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: productId
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "Name": "Zoom Stefan Janoski Canvas RM SB Varsity Red",
        "CategoryId": 2000090,
        "BrandId": 12121219,
        "DepartmentId": 2000089,
        "LinkId": "stefan-janoski-canvas-varsity-red",
        "RefId": "sr_1_90",
        "IsVisible": true,
        "Description": "The Nike Zoom Stefan Janoski Men's Shoe is made with a premium leather upper for superior durability and a flexible midsole for all-day comfort. A tacky gum rubber outsole delivers outstanding traction.",
        "DescriptionShort": "The Nike Zoom Stefan Janoski is made with a premium leather.",
        "ReleaseDate": "2019-01-01T00:00:00",
        "KeyWords": "Zoom,Stefan,Janoski",
        "Title": "Zoom Stefan Janoski Canvas RM SB Varsity Red",
        "IsActive": true,
        "TaxCode": "12345",
        "MetaTagDescription": "The Nike Zoom Stefan Janoski Men's Shoe is made with a premium leather upper for superior durability and a flexible midsole for all-day comfort. A tacky gum rubber outsole delivers outstanding traction.",
        "SupplierId": null,
        "ShowWithoutStock": true,
        "AdWordsRemarketingCode": null,
        "LomadeeCampaignCode": null,
        "Score": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[PUT]::/api/catalog/pvt/product/:productId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/api/catalog/pvt/product/:productId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[PUT]::/api/catalog/pvt/product/:productId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[PUT]::/api/catalog/pvt/product/:productId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Id":{"type":"integer","description":"Product's unique numerical identifier."},"Name":{"type":"string","description":"Product's name. Limited to 150 characters."},"DepartmentId":{"type":"integer","description":"Department ID according to the product's category."},"CategoryId":{"type":"integer","description":"Category ID associated with this product."},"BrandId":{"type":"integer","description":"Brand ID associated with this product."},"LinkId":{"type":"string","description":"Slug that will be used to build the product page URL. If not informed, it will be generated according to the product's name replacing spaces and special characters by hyphens (`-`)."},"RefId":{"type":"string","description":"Product reference code."},"IsVisible":{"type":"boolean","description":"Shows (`true`) or hides (`false`) the product in search result and product pages, but the product can still be added to the shopping cart. Usually applicable for gifts."},"Description":{"type":"string","description":"Product description."},"DescriptionShort":{"type":"string","description":"Short product description. This information can be displayed on both the product page and the shelf, using the following controls:\r\n Store Framework: `$product.DescriptionShort`.\r\n Legacy CMS Portal: `<vtex.cmc:productDescriptionShort/>`."},"ReleaseDate":{"type":"string","description":"Used to assist in the ordering of the search result of the site. Using the `O=OrderByReleaseDateDESC` query string, you can pull this value and show the display order by release date. This attribute is also used as a condition for dynamic collections."},"KeyWords":{"type":"string","description":"Store Framework: Deprecated. \r\nLegacy CMS Portal:  Keywords or synonyms related to the product, separated by comma (`,`). \"Television\", for example, can have a substitute word like \"TV\". This field is important to make your searches more comprehensive."},"Title":{"type":"string","description":"Product's Title tag. Limited to 150 characters. It is presented in the browser tab and corresponds to the title of the product page. This field is important for SEO."},"IsActive":{"type":"boolean","description":"Activate (`true`) or inactivate (`false`) product."},"TaxCode":{"type":"string","description":"Product tax code, used for tax calculation."},"MetaTagDescription":{"type":"string","description":"Brief description of the product for SEO. It's recommended that you don't exceed 150 characters."},"SupplierId":{"type":["integer","null"],"description":"Deprecated field."},"ShowWithoutStock":{"type":"boolean","description":"If `true`, activates the [Notify Me](https://help.vtex.com/en/tutorial/setting-up-the-notify-me-option--2VqVifQuf6Co2KG048Yu6e) option when the product is out of stock."},"AdWordsRemarketingCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"LomadeeCampaignCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"Score":{"type":"integer","description":"Value used to set the priority on the search result page."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates an existing product.

  >❗ Although some fields are not required to get a response `200 OK`, if you don't send a field or send its value as empty or `null`, all previously configured information will be deleted, and boolean fields will turn to `false`. So, to update a product, you should get its data using the [Get product by ID](https://developers.vtex.com/docs/api-reference/catalog-api#get-/api/catalog/pvt/product/-productId-) endpoint and use it as a template for the current request body.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Product and SKU Management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Product's unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 42,
    "Name": "Zoom Stefan Janoski Canvas RM SB Varsity Red",
    "DepartmentId": 2000089,
    "CategoryId": 2000090,
    "BrandId": 12121219,
    "LinkId": "stefan-janoski-canvas-varsity-red",
    "RefId": "sr_1_90",
    "IsVisible": true,
    "Description": "The Nike Zoom Stefan Janoski Men's Shoe is made with a premium leather upper for superior durability and a flexible midsole for all-day comfort. A tacky gum rubber outsole delivers outstanding traction.",
    "DescriptionShort": "The Nike Zoom Stefan Janoski is made with a premium leather.",
    "ReleaseDate": "2020-01-01T00:00:00",
    "KeyWords": "Zoom,Stefan,Janoski",
    "Title": "Zoom Stefan Janoski Canvas RM SB Varsity Re",
    "IsActive": true,
    "TaxCode": "",
    "MetaTagDescription": "The Nike Zoom Stefan Janoski Men's Shoe is made with a premium leather upper for superior durability and a flexible midsole for all-day comfort. A tacky gum rubber outsole delivers outstanding traction.",
    "SupplierId": 1,
    "ShowWithoutStock": true,
    "AdWordsRemarketingCode": "",
    "LomadeeCampaignCode": "",
    "Score": 1
  }
  ```
