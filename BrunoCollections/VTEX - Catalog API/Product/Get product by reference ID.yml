info:
  name: Get product by reference ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pvt/products/productgetbyrefid/:refId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: refId
      value: "12345"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pvt/products/productgetbyrefid/:refId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pvt/products/productgetbyrefid/:refId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pvt/products/productgetbyrefid/:refId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pvt/products/productgetbyrefid/:refId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Id":{"type":"integer","description":"ID of the product."},"Name":{"type":"string","description":"Name of the product."},"DepartmentId":{"type":"integer","description":"ID of product department."},"CategoryId":{"type":"integer","description":"ID of product category."},"BrandId":{"type":"integer","description":"ID of the product brand."},"LinkId":{"type":"string","description":"Category URL."},"RefId":{"type":"string","description":"Product Reference ID. The limit for the product `RefId` is 100 characters."},"IsVisible":{"type":"boolean","description":"If the product are visible in search and list pages."},"Description":{"type":"string","description":"Product Description, HTML is allowed."},"DescriptionShort":{"type":"string","description":"Product Short Description."},"ReleaseDate":{"type":"string","description":"Product Release Date, for list ordering and product cluster highlight."},"KeyWords":{"type":"string","description":"Alternatives Keywords to improve the product findability."},"Title":{"type":"string","description":"Product's Title tag. Limited to 150 characters. It is presented in the browser tab and corresponds to the title of the product page. This field is important for SEO."},"IsActive":{"type":"boolean","description":"If the product is Active."},"TaxCode":{"type":"string","description":"SKU Tax Code."},"MetaTagDescription":{"type":"string","description":"Meta Description for the product page."},"SupplierId":{"type":"integer","description":"Product Supplier ID."},"ShowWithoutStock":{"type":"boolean","description":"If the product can be visible without stock."},"ListStoreId":{"type":"array","description":"Array with the ID of all the sales channels that are related to the product.","items":{"type":"integer","description":"Sales channel ID."}},"AdWordsRemarketingCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"LomadeeCampaignCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a specific product by its Reference ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Product management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `refId` | path | (Required) Product reference code. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

