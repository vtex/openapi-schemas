info:
  name: Create product with category and brand
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/catalog/pvt/product"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "Id": 42,
        "Name": "Black T-Shirt",
        "CategoryPath": "Mens/Clothing/T-Shirts",
        "DepartmentId": 1,
        "BrandName": "Acme",
        "RefId": "31011706925",
        "Title": "Black T-Shirt",
        "LinkId": "tshirt-black",
        "Description": "A classic black t-shirt made from soft, breathable cotton",
        "ReleaseDate": "2025-07-01T00:00:00",
        "IsVisible": true,
        "IsActive": true,
        "TaxCode": "12345",
        "MetaTagDescription": "tshirt black",
        "ShowWithoutStock": true,
        "LomadeeCampaignCode": null,
        "Score": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog/pvt/product - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog/pvt/product - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog/pvt/product - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog/pvt/product - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Id":{"type":"integer","description":"Product's unique numerical identifier."},"Name":{"type":"string","description":"Product's name. Limited to 150 characters."},"DepartmentId":{"type":"integer","description":"Department ID according to the product's category."},"CategoryId":{"type":"integer","description":"Category ID associated with this product."},"BrandId":{"type":"integer","description":"Brand ID associated with this product."},"LinkId":{"type":"string","description":"Slug that will be used to build the product page URL. If it not informed, it will be generated according to the product's name replacing spaces and special characters by hyphens (`-`)."},"RefId":{"type":"string","description":"Product Reference Code."},"IsVisible":{"type":"boolean","description":"Shows (`true`) or hides (`false`) the product in search result and product pages, but the product can still be added to the shopping cart. Usually applicable for gifts."},"Description":{"type":"string","description":"Product description."},"DescriptionShort":{"type":"string","description":"Short product description. This information can be displayed on both the product page and the shelf, using the following controls:\r\n Store Framework: `$product.DescriptionShort`.\r\n Legacy CMS Portal: `<vtex.cmc:productDescriptionShort/>`."},"ReleaseDate":{"type":"string","description":"Used to assist in the ordering of the search result of the site. Using the `O=OrderByReleaseDateDESC` query string, you can pull this value and show the display order by release date. This attribute is also used as a condition for dynamic collections."},"KeyWords":{"type":"string","description":"Store Framework: Deprecated. \r\nLegacy CMS Portal:  Keywords or synonyms related to the product, separated by comma (`,`). \"Television\", for example, can have a substitute word like \"TV\". This field is important to make your searches more comprehensive."},"Title":{"type":"string","description":"Product's title tag, which corresponds to the title of the product page, presented in the browser tab. This field is important for SEO. Limited to 150 characters."},"IsActive":{"type":"boolean","description":"Activate (`true`) or inactivate (`false`) product."},"TaxCode":{"type":"string","description":"Product tax code, used for tax calculation."},"MetaTagDescription":{"type":"string","description":"Brief description of the product for SEO. It's recommended that you don't exceed 150 characters."},"SupplierId":{"type":["integer","null"],"description":"Supplier unique identifier."},"ShowWithoutStock":{"type":"boolean","description":"If `true`, activates the [Notify Me](https://help.vtex.com/en/tutorial/setting-up-the-notify-me-option--2VqVifQuf6Co2KG048Yu6e) option when the product is out of stock."},"AdWordsRemarketingCode":{"type":["string","null"],"description":"This is a legacy field. Do not take this information into consideration."},"LomadeeCampaignCode":{"type":["string","null"],"description":"This is a legacy field. Do not take this information into consideration."},"Score":{"type":"integer","description":"Value used to set the priority on the search result page."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This endpoint allows two types of request:

  **Type 1:** Creating a new product as well as a new category path (including subcategories) and a new brand by using `CategoryPath` and `BrandName` parameters.

  **Type 2:** Creating a new product given an existing `BrandId` and an existing `CategoryId`.

  When creating a product, regardless of the type of request, if there is a need to create a new product with a specific custom product ID, specify the `Id` (integer) in the request body. Otherwise, VTEX will generate the ID automatically.
  > 📘 Onboarding guide 
  >
  > Check the new [Catalog onboarding guide](https://developers.vtex.com/vtex-rest-api/docs/catalog-overview). We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Catalog and is organized by focusing on the developer's journey.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Product and SKU Management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 42,
    "Name": "Black T-Shirt",
    "DepartmentId": 1,
    "CategoryId": 2,
    "BrandId": 2000000,
    "LinkId": "premium-tshirt-cotton",
    "RefId": "310117869",
    "IsVisible": true,
    "Description": "A classic black t-shirt made from soft, breathable cotton",
    "DescriptionShort": "Great premium cotton t-shirt",
    "ReleaseDate": "2025-07-01T00:00:00",
    "KeyWords": "Blouse",
    "Title": "Premium black t-shirt",
    "IsActive": true,
    "TaxCode": "12345",
    "MetaTagDescription": "Very cool t-shirt for sports",
    "SupplierId": 1,
    "ShowWithoutStock": true,
    "AdWordsRemarketingCode": null,
    "LomadeeCampaignCode": null,
    "Score": 1
  }
  ```
