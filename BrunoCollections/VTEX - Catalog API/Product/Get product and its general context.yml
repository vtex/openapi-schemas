info:
  name: Get product and its general context
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pvt/products/productget/:productId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: productId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pvt/products/productget/:productId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pvt/products/productget/:productId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pvt/products/productget/:productId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pvt/products/productget/:productId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Id":{"type":"integer","description":"Product ID."},"Name":{"type":"string","description":"Product's name. Limited to 150 characters."},"DepartmentId":{"type":"integer","description":"Product department ID."},"CategoryId":{"type":"integer","description":"Product category ID."},"BrandId":{"type":"integer","description":"Product brand ID."},"LinkId":{"type":"string","description":"Product text link."},"RefId":{"type":"string","description":"Product reference code."},"IsVisible":{"type":"boolean","description":"If the product is visible on the store."},"Description":{"type":"string","description":"Product description."},"DescriptionShort":{"type":"string","description":"Product complement name."},"ReleaseDate":{"type":"string","description":"Product release date."},"KeyWords":{"type":"string","description":"Substitutes words for the product."},"Title":{"type":"string","description":"Product's Title tag. Limited to 150 characters. It is presented in the browser tab and corresponds to the title of the product page. This field is important for SEO."},"IsActive":{"type":"boolean","description":"If the product is active (`true`) or not (`false`) at the store."},"TaxCode":{"type":"string","description":"Product fiscal code."},"MetaTagDescription":{"type":"string","description":"Product meta tag description."},"SupplierId":{"type":"integer","description":"Product supplier ID."},"ShowWithoutStock":{"type":"boolean","description":"Defines if the product will be shown in the store even if it's out of stock (`true`) or not (`false`)."},"ListStoreId":{"type":"array","description":"List with the IDs of sales channels where the product is included.","items":{"type":"integer","description":"Sales channel ID."}},"AdWordsRemarketingCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."},"LomadeeCampaignCode":{"type":"string","description":"This is a legacy field. Do not take this information into consideration."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a specific product's general information as name, description and the sales channels where it is included.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Product Form** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Product's unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 1,
    "Name": "Ração Royal Canin Feline Urinary",
    "DepartmentId": 1,
    "CategoryId": 10,
    "BrandId": 2000000,
    "LinkId": "racao-royal-canin-feline-urinary",
    "RefId": "",
    "IsVisible": true,
    "Description": "Descrição.",
    "DescriptionShort": "",
    "ReleaseDate": "2020-01-06T00:00:00",
    "KeyWords": "bbbbbbbbbbbb*, a@",
    "Title": "Ração Royal Canin Feline Urinary",
    "IsActive": true,
    "TaxCode": "",
    "MetaTagDescription": "Descrição.",
    "SupplierId": 1,
    "ShowWithoutStock": true,
    "ListStoreId": [
      1,
      2,
      3
    ],
    "AdWordsRemarketingCode": "",
    "LomadeeCampaignCode": ""
  }
  ```
