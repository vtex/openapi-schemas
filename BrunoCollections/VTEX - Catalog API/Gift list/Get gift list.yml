info:
  name: Get gift list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/addon/pvt/giftlist/get/:listId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: listId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/addon/pvt/giftlist/get/:listId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/addon/pvt/giftlist/get/:listId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/addon/pvt/giftlist/get/:listId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/addon/pvt/giftlist/get/:listId - Schema is valid", function () {
          const schema = {"type":"object","description":"Object with information about the gift list.","properties":{"giftListId":{"type":"integer","description":"Gift list ID."},"name":{"type":"string","description":"Gift list name."},"userId":{"type":"string","description":"User ID."},"fileId":{"type":["integer","null"],"description":"File ID."},"giftListTypeId":{"type":"integer","description":"Gift list Type ID."},"giftListTypeName":{"type":"string","description":"Gift list Type name."},"giftCardId":{"type":"integer","description":"Gift card ID."},"message":{"type":"string","description":"Gift list message."},"urlFolder":{"type":"string","description":"Slug of the gift list that will be part of its URL."},"dateCreated":{"type":"string","description":"Date when the gift list was created."},"profileSystemUserAddressName":{"type":"string","description":"Name of the user's address."},"profileSystemUserId":{"type":"string","description":"User ID on Profile System."},"eventDate":{"type":"string","description":"Date of the event associated with the Gift list."},"eventLocation":{"type":"string","description":"Location of the event associated with the Gift list."},"eventCity":{"type":"string","description":"City of the event associated with the Gift list."},"eventState":{"type":"string","description":"State of the event associated with the Gift list."},"telemarketingId":{"type":["integer","null"],"description":"Telemarketing ID."},"telemarketingObservation":{"type":["string","null"],"description":"Telemarketing observation."},"IsPublic":{"type":"boolean","description":"Defines if the gift list is public."},"isActive":{"type":"boolean","description":"Defines if the gift list is active."},"shipsToOwner":{"type":"boolean","description":"Defines if items purchased from the gift list will be shipped to the owner of the gift list."},"isAddressOk":{"type":"boolean","description":"Validates the address of the gift list."},"version":{"type":"integer","description":"Version of the gift list."},"giftCardRechargeSkuId":{"type":["integer","null"],"description":"ID of the SKU that recharges the gift card."},"memberNames":{"type":"string","description":"Name of the members of the gift list."},"giftListMembers":{"type":"array","description":"Array of members of the gift list.","items":{"type":"object","description":"Object with information about each gift list member.","properties":{"giftListMemberId":{"type":"integer","description":"Gift list member ID."},"giftListId":{"type":"integer","description":"Gift list ID."},"userId":{"type":"string","description":"User ID."},"clientId":{"type":["string","null"],"description":"Client ID."},"title":{"type":["string","null"],"description":"Title of the Gift list member."},"name":{"type":"string","description":"Name of the Gift list member."},"surname":{"type":"string","description":"Surname of the Gift list member."},"isAdmin":{"type":"boolean","description":"Defines if the Gift list member is an administrator of the Gift list or not."},"isActive":{"type":"boolean","description":"Defines if the Gift list user is active or not."},"text1":{"type":["string","null"],"description":"Complementary text."},"text2":{"type":["string","null"],"description":"Complementary text."}}}},"giftListSkuIds":{"type":["array","null"],"description":"Array with the IDs of SKUs that are part of the gift list.","items":{"type":"string","description":"SKU ID."}},"address":{"type":["string","null"],"description":"Address of the gift list."},"fileUrl":{"type":["string","null"],"description":"File URL."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves information about a gift list by its ID.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `listId` | path | (Required) Gift list unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
