info:
  name: Get SKU by EAN
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pvt/sku/stockkeepingunitbyean/:ean"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: ean
      value: "1234567890123"
      type: path
  auth: inherit

