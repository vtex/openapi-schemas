info:
  name: Get specification by specification ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/specification/:specificationId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: specificationId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/specification/:specificationId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/specification/:specificationId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/specification/:specificationId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/specification/:specificationId - Schema is valid", function () {
          const schema = {"type":"object","required":["Id","FieldTypeId","CategoryId","FieldGroupId","Name","Description","Position","IsFilter","IsRequired","IsOnProductDetails","IsStockKeepingUnit","IsWizard","IsActive","IsTopMenuLinkActive","IsSideMenuLinkActive","DefaultValue"],"properties":{"Id":{"type":"integer","description":"Created specification's ID."},"FieldTypeId":{"type":"integer","description":"Field type can be `1 - Text`, `2 - Multi-Line Text`, `4 - Number`, `5 - Combo`, `6 - Radio`, `7 - Checkbox`, `8 - Indexed Text`, `9 - Indexed Multi-Line Text`.","enum":[1,2,4,5,6,7,8,9]},"CategoryId":{"type":"integer","description":"Specification category ID."},"FieldGroupId":{"type":"integer","description":"Numerical ID of the specification group that contains the new specification."},"Name":{"type":"string","description":"Specification name.  Limited to 100 characters."},"Description":{"type":"string","description":"Specification description."},"Position":{"type":"integer","description":"The current specification's position in comparison to the other specifications."},"IsFilter":{"type":"boolean","description":"Defines if the specification can be used as a filter."},"IsRequired":{"type":"boolean","description":"Defines if the specification is required or not."},"IsOnProductDetails":{"type":"boolean","description":"Defines if the specification will be shown on the product screen in the specification area."},"IsStockKeepingUnit":{"type":"boolean","description":"Defines if the specification is applied to a specific SKU."},"IsWizard":{"type":"boolean","description":"Deprecated field."},"IsActive":{"type":"boolean","description":"Defines if the specification is active or not."},"IsTopMenuLinkActive":{"type":"boolean","description":"Defines if the specification is shown in the main menu of the site."},"IsSideMenuLinkActive":{"type":"boolean","description":"Defines if the specification is shown in the side menu."},"DefaultValue":{"type":["string","null"],"description":"Specification default value."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves information of a product or SKU specification.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Commercial | **SKU management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `specificationId` | path | (Required) Specification's unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 32,
    "FieldTypeId": 6,
    "CategoryId": 10,
    "FieldGroupId": 11,
    "Name": "Peso",
    "Description": "Peso",
    "Position": 1,
    "IsFilter": false,
    "IsRequired": true,
    "IsOnProductDetails": false,
    "IsStockKeepingUnit": true,
    "IsWizard": false,
    "IsActive": true,
    "IsTopMenuLinkActive": false,
    "IsSideMenuLinkActive": false,
    "DefaultValue": null
  }
  ```
