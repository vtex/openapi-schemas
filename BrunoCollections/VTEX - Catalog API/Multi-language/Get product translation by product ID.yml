info:
  name: Get product translation by product ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/product/:productId/language/:locale"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: productId
      value: "18"
      type: path
    - name: locale
      value: en-US
      type: path
  auth: inherit

