info:
  name: Get product specification translation by product ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/products/:productId/specification/:specificationId/language/:locale"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: productId
      value: "18"
      type: path
    - name: specificationId
      value: "7"
      type: path
    - name: locale
      value: en-US
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/products/:productId/specification/:specificationId/language/:locale - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/products/:productId/specification/:specificationId/language/:locale - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/products/:productId/specification/:specificationId/language/:locale - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/products/:productId/specification/:specificationId/language/:locale - Schema is valid", function () {
          const schema = {"type":"array","items":{"type":"object","description":"Object containing language-specific information for a product specification.","properties":{"Id":{"type":"integer","description":"Unique identifier of the association between the specification and the product."},"ProductId":{"type":"integer","description":"Product unique identifier."},"SpecificationId":{"type":"integer","description":"Specification unique identifier."},"Locale":{"type":"string","description":"The locale code for this translation. It follows the IETF BCP 47 standard, such as 'en-US' for English (United States), 'en-ES' for Spanish (Spain), or 'pt-BR' for Portuguese (Brazil)."},"Value":{"type":"string","description":"Translated value of the product specification."},"Values":{"type":["array","null"],"description":"List of the translated product specification values. Valid for combo, radio and checkbox specification types; nullable for text, multi-line text, number, indexed text and indexed multi-line text specification types.","items":{"type":"string","description":"Translated product specification value."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves language-specific information for a product specification searching by product ID.

  > ℹ️ Learn more in the [Catalog multi-language integration guide](https://developers.vtex.com/docs/guides/catalog-multi-language-integration-guide).

  ## Permissions

  Any user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | - | - | - |
  | Catalog | Content | Categories Management |

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Unique identifier of the product. |
  | `specificationId` | path | (Required) Unique identifier of the specification. |
  | `locale` | path | (Required) Code used to filter translations by a given language. The format follows the IETF BCP 47 standard, such as 'en-US' for English (United States), 'en-ES' for Spanish (Spain), or 'pt-BR' for Portuguese (Brazil). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "Id": 349,
      "ProductId": 10,
      "SpecificationId": 23,
      "Locale": "en-US",
      "Value": "100% Cotton",
      "Values": null
    }
  ]
  ```
