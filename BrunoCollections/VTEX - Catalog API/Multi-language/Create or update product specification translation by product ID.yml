info:
  name: Create or update product specification translation by product ID
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/catalog/pvt/products/:productId/specification/:specificationId/language"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: productId
      value: "18"
      type: path
    - name: specificationId
      value: "7"
      type: path
  body:
    type: json
    data: |-
      {
        "ProductId": 2,
        "SpecificationId": 23,
        "Locale": "pt-BR",
        "Value": "100% Algodão",
        "Values": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PUT]::/api/catalog/pvt/products/:productId/specification/:specificationId/language - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Inserts or updates language-specific information for a given product specification searching by product ID.

  > ℹ️ Learn more in the [Catalog multi-language integration guide](https://developers.vtex.com/docs/guides/catalog-multi-language-integration-guide).

  ## Permissions

  Any user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | - | - | - |
  | Catalog | Content | Categories Management |

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Unique identifier of the product. |
  | `specificationId` | path | (Required) Unique identifier of the specification. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
