info:
  name: Create SKU file
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/catalog/pvt/stockkeepingunit/:skuId/file"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: skuId
      value: "123456"
      type: path
  body:
    type: json
    data: |-
      {
        "Name": "Nike-Red-Janoski-1",
        "Url": "https://m.media-amazon.com/images/I/610G2-sJx5L._AC_UX695_.jpg",
        "IsMain": true,
        "Label": "Main",
        "Text": "Nike-Red-Janoski",
        "Position": 0
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog/pvt/stockkeepingunit/:skuId/file - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog/pvt/stockkeepingunit/:skuId/file - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog/pvt/stockkeepingunit/:skuId/file - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog/pvt/stockkeepingunit/:skuId/file - Schema is valid", function () {
          const schema = {"type":"array","description":"Array with objects containing SKU files information.","items":{"type":"object","description":"Object containing a SKU file information.","properties":{"Id":{"type":"integer","description":"Unique identifier of the association of the image to the SKU."},"ArchiveId":{"type":"integer","description":"Unique identifier of the image."},"SkuId":{"type":"integer","description":"SKU unique identifier."},"Name":{"type":"string","description":"Image name."},"IsMain":{"type":"boolean","description":"Defines if the image is the SKU main image (`true`) or not (`false`). This field will always be `true` when the image `Position` is `0`, and `false` otherwise."},"Text":{"type":"string","description":"SKU image text."},"Label":{"type":["string","null"],"description":"Image label."},"Url":{"type":"string","description":"SKU image URL."},"FileLocation":{"type":"string","description":"Location where the file is stored."},"Position":{"type":"integer","description":"Position of the SKU image as displayed in the storefront, where `0` corresponds to the first position, `1` to the second position, and so on. The position `0` will always make the `isMain` value `true`."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new image for an SKU based on its URL or on a form-data request body.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **SKUs** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `skuId` | path | (Required) SKU's unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "Id": 549,
      "ArchiveId": 155485,
      "SkuId": 310118490,
      "Name": "White tshirt front",
      "IsMain": true,
      "Label": "fashion",
      "Text": "image-b6175322abda4b73bbb57c46ae2f3900",
      "Url": "https://sandboxintegracao.vteximg.com.br/files/ids/155485/B5C34F72E355BB325D07E56A2CBBD6FF",
      "FileLocation": "vteximg.com.br/files/ids/168266/B5C34F72E355BB325D07E56A2CBBD6FF",
      "Position": 0
    }
  ]
  ```
