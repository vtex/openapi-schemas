info:
  name: Update SKU attribute
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/catalog/pvt/stockkeepingunit/:skuId/attribute/:skuAttributeId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: skuId
      value: "1"
      type: path
    - name: skuAttributeId
      value: "1171"
      type: path
  body:
    type: json
    data: |-
      {
        "SpecificationName": "Ingredients",
        "SpecificationValue": "beeswax, coconut oil, natural pigment",
        "IsVisible": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[PUT]::/api/catalog/pvt/stockkeepingunit/:skuId/attribute/:skuAttributeId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/api/catalog/pvt/stockkeepingunit/:skuId/attribute/:skuAttributeId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[PUT]::/api/catalog/pvt/stockkeepingunit/:skuId/attribute/:skuAttributeId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[PUT]::/api/catalog/pvt/stockkeepingunit/:skuId/attribute/:skuAttributeId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Id":{"type":"integer","description":"SKU attribute unique numerical identifier."},"SkuId":{"type":"integer","description":"SKU's unique numerical identifier."},"SpecificationName":{"type":"string","description":"Name of the SKU attribute."},"SpecificationValue":{"type":"string","description":"Value of the SKU attribute with a maximum length of 3,500 characters."},"IsVisible":{"type":"boolean","description":"Defines if the attribute is visible on the store (`true`) or not (`false`)."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates an existing attribute of an SKU.

  >⚠️ SKU attributes only accept open-text values. The maximum length for `SpecificationValue` is 3,500 characters. If the request body contains characters that break the JSON string (for example, unescaped backslashes), the request will fail with a status code `400` error.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog API | General | **Edit Product** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `skuId` | path | (Required) SKU's unique numerical identifier. |
  | `skuAttributeId` | path | (Required) SKU attribute unique numerical identifier. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Id": 1171,
    "SkuId": 1,
    "SpecificationName": "Ingredients",
    "SpecificationValue": "beeswax, coconut oil, natural pigment",
    "IsVisible": true
  }
  ```
