info:
  name: Get specification values by specification field ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/specification/fieldvalue/:fieldId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: fieldId
      value: "34"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pub/specification/fieldvalue/:fieldId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pub/specification/fieldvalue/:fieldId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pub/specification/fieldvalue/:fieldId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pub/specification/fieldvalue/:fieldId - Schema is valid", function () {
          const schema = {"type":"array","items":{"required":["FieldValueId","Value","IsActive","Position"],"type":"object","description":"Object with specification field value details.","properties":{"FieldValueId":{"type":"integer","format":"int32","description":"Specification field value ID."},"Value":{"type":"string","description":"Specification field value."},"IsActive":{"type":"boolean","description":"Defines if the specification field is active (`true`) or inactive (`false`)."},"Position":{"type":"integer","format":"int32","description":"Specification field value position."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Gets a list of all specification values from a specification field by this field's ID.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Commercial | **SKU management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `fieldId` | path | (Required) Specification field ID. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "FieldValueId": 52,
      "Value": "0 a 6 meses",
      "IsActive": true,
      "Position": 1
    },
    {
      "FieldValueId": 53,
      "Value": "1 a 2 anos",
      "IsActive": true,
      "Position": 4
    },
    {
      "FieldValueId": 54,
      "Value": "3 a 4 anos",
      "IsActive": true,
      "Position": 3
    },
    {
      "FieldValueId": 55,
      "Value": "5 a 6 anos",
      "IsActive": true,
      "Position": 2
    },
    {
      "FieldValueId": 56,
      "Value": "7 a 8 anos",
      "IsActive": true,
      "Position": 5
    },
    {
      "FieldValueId": 57,
      "Value": "9 a 10 anos",
      "IsActive": true,
      "Position": 6
    },
    {
      "FieldValueId": 58,
      "Value": "Acima de 10 anos",
      "IsActive": true,
      "Position": 7
    }
  ]
  ```
