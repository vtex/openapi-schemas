info:
  name: Get SKU translation by SKU ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog/pvt/stockkeepingunit/:skuId/language/:locale"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: skuId
      value: "35"
      type: path
    - name: locale
      value: en-US
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId/language/:locale - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId/language/:locale - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId/language/:locale - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog/pvt/stockkeepingunit/:skuId/language/:locale - Schema is valid", function () {
          const schema = {"type":"array","items":{"type":"object","description":"Object containing language-specific information for a SKU.","properties":{"Id":{"type":"integer","description":"Unique identifier of the SKU."},"Locale":{"type":"string","description":"The locale code for this translation. It follows the IETF BCP 47 standard, such as 'en-US' for English (United States), 'en-ES' for Spanish (Spain), or 'pt-BR' for Portuguese (Brazil)."},"Name":{"type":"string","description":"Translated name of the SKU."},"MeasurementUnit":{"type":"string","description":"Measurement unit for the SKU. The acceptables values are:\n\r- `un`: Unit\n\r- `kg`: Kilogram\n\r- `g`: Gram\n\r- `mg`: Milligram\n\r- `m`: Meter\n\r- `m²`: Square meter\n\r- `m³`: Cubic meter\n\r- `cm`: Centimeter\n\r- `cm²`: Square centimeter\n\r- `cm³`: Cubic centimeter\n\r- `mm`: Millimeter\n\r- `mm²`: Square millimeter\n\r- `mm³`: Cubic millimeter\n\r- `oz`: Ounce\n\r- `lb`: Pound\n\r- `ft`: Foot\n\r- `ft²`: Square foot\n\r- `ft³`: Cubic foot\n\r- `in`: Inch\n\r- `in²`: Square inch\n\r- `in³`: Cubic inch"},"Attributes":{"type":["array","null"],"description":"Array of SKU attributes translations.","items":{"type":["object","null"],"description":"Object containing language-specific information for a SKU attribute.","properties":{"Id":{"type":"integer","description":"SKU attribute ID."},"Locale":{"type":"string","description":"Locale code."},"AttributeName":{"type":"string","description":"SKU attribute name."},"AttributeValue":{"type":"string","description":"SKU attribute value."}}}},"Attachments":{"type":["array","null"],"description":"Array of SKU attachments translations.","items":{"type":["object","null"],"description":"Object containing language-specific information for a SKU attachment.","properties":{"Id":{"type":"integer","description":"SKU attachment ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"SKU attachment name."},"Domains":{"type":"array","description":"Array with SKU attachment domains translations.","items":{"type":"object","description":"Object containing language-specific information for a SKU attachment domain.","properties":{"OriginalFieldName":{"type":"string","description":"Domain original field name."},"FieldName":{"type":"string","description":"Domain field name."},"DomainValues":{"type":"string","description":"Domain values."}}}}}}},"Services":{"type":["array","null"],"description":"Array with SKU services translations.","items":{"type":"object","description":"Object containing language-specific information for a SKU service.","properties":{"Id":{"type":"integer","description":"SKU service ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"SKU service name."},"Text":{"type":"string","description":"SKU service text."},"SkuServiceType":{"type":"object","description":"Object with SKU service type translations.","properties":{"Id":{"type":"integer","description":"SKU service type ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"SKU service type name."},"Values":{"type":"array","description":"Array with the SKU service type values translations.","items":{"type":"object","description":"Object containing language-specific information for a SKU service type value.","properties":{"Id":{"type":"integer","description":"Service type value ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"Service type value name."}}}},"Attachments":{"type":"array","description":"Array with the translations of the SKU service type attachments.","items":{"type":"object","description":"Object containing language-specific information for a SKU service type attachment.","properties":{"Id":{"type":"integer","description":"Attachment ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"Attachment name."},"Domains":{"type":"array","description":"Array with the domains translations of the SKU service type attachment.","items":{"type":"object","description":"Object containing language-specific information for a domain of the SKU service type attachment.","properties":{"OriginalFieldName":{"type":"string","description":"Original field name."},"FieldName":{"type":"string","description":"Translated field name."},"DomainValues":{"type":"string","description":"Domain value."}}}}}}}}}}}},"SpecificationGroups":{"type":["array","null"],"description":"Array of the SKU specification groups translations.","items":{"type":"object","description":"Object containing language-specific information for a SKU specification group.","properties":{"Id":{"type":"integer","description":"SKU specification group ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"SKU specification group name."},"Specifications":{"type":"array","description":"Array of specifications translations of the SKU specification group.","items":{"type":"object","description":"Object containing language-specific information for specifications of the SKU specification group.","properties":{"Id":{"type":"integer","description":"Specification ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"Specification name."},"Description":{"type":"string","description":"Specification description."},"Value":{"type":"array","description":"Array of specification values translations of the SKU specification group.","items":{"type":"object","description":"Object containing language-specific information for a SKU specification group value.","properties":{"Id":{"type":"integer","description":"Specification value ID."},"Locale":{"type":"string","description":"Locale code."},"Name":{"type":"string","description":"Specification value name."},"IsCustomValue":{"type":"boolean","description":"Defines whether the specification value is custom (`true`) or not (`false`)."}}}}}}}}}},"Files":{"type":["array","null"],"description":"Array with SKU files translations.","items":{"type":"object","description":"Object containing language-specific information for a SKU file.","properties":{"Id":{"type":"integer","description":"Unique identifier of the association between the SKU and the file."},"FileId":{"type":"integer","description":"File ID."},"Locale":{"type":"string","description":"Locale code."},"Label":{"type":"string","description":"File label."},"Name":{"type":"string","description":"File name."},"Text":{"type":["string","null"],"description":"File text."}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves language-specific information for a SKU by its ID.

  > ℹ️ Learn more in the [Catalog multi-language integration guide](https://developers.vtex.com/docs/guides/catalog-multi-language-integration-guide).

  ## Permissions

  Any user or [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | - | - | - |
  | Catalog | Content | Categories Management |

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `skuId` | path | (Required) Unique identifier of the SKU. |
  | `locale` | path | (Required) Code used to filter translations by a given language. The format follows the IETF BCP 47 standard, such as 'en-US' for English (United States), 'en-ES' for Spanish (Spain), or 'pt-BR' for Portuguese (Brazil). |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

