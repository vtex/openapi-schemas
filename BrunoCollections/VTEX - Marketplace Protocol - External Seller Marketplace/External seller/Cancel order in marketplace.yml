info:
  name: Cancel order in marketplace
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/pvt/orders/:marketplaceOrderId/cancel"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: marketplaceOrderId
      value: 1138342255777-01
      type: path
    - name: marketplaceServicesEndpoint
      value: marketplaceservicesendpoint.myvtex.com
      type: path
  body:
    type: json
    data: |-
      {
        "reason": "Product is unavailable."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/pvt/orders/:marketplaceOrderId/cancel - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/pvt/orders/:marketplaceOrderId/cancel - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/pvt/orders/:marketplaceOrderId/cancel - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/pvt/orders/:marketplaceOrderId/cancel - Schema is valid", function () {
          const schema = {"properties":{"date":{"type":"string","description":"Request processing date and time."},"orderId":{"type":"string","description":"Order ID referring to the Invoice number sent."},"receipt":{"type":"string","description":"Requisition receipt code."}},"example":{"date":"2021-06-09T15:22:56.7612218-02:00","orderId":"1138342255777-01","receipt":"527b1ae251264ef1b7a9b597cd8f16b9"}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This request is sent by the external seller to the VTEX marketplace to cancel an order.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Checkout | CheckoutResources | **Order Cancellation** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | Cancel Orders | Order Cancellation |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users or application keys usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using application keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm).

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `marketplaceOrderId` | path | (Required) Identifies the order in the marketplace. |
  | `marketplaceServicesEndpoint` | path | (Required) This is an endpoint sent from VTEX to the external seller in the [Order placement request](https://developers.vtex.com/docs/api-reference/marketplace-protocol-external-seller-fulfillment#post-/pvt/orders). |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "date": "2021-06-09T15:22:56.7612218-02:00",
    "orderId": "1138342255777-01",
    "receipt": "527b1ae251264ef1b7a9b597cd8f16b9"
  }
  ```
