info:
  name: Save events
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/event"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: accountName
      value: apiexamples
      type: path
  body:
    type: json
    data: |-
      {
        "session": "df66a4d239864d2e8497c89aea14a3ad",
        "anonymous": "eed429ecf04a4a23ae7f4429033b48cd",
        "url": "https://example.com/search/?query=zapatilha",
        "agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:83.0) Gecko/20100101 Firefox/83.0",
        "type": "session.ping"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/event - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/event - Response has empty Body", function () {
          const data = res.getBody();
          expect(data === undefined || data === null || data === "").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates search events to integrate with VTEX Intelligent Search using a headless implementation. 

  Read [VTEX Intelligent Search Events API - Headless - Overview](https://developers.vtex.com/docs/api-reference/intelligent-search-events-api-headless) for more information on event types and user identification.

  >⚠️ **This API applies only to Headless scenarios**. It doesn't apply to stores using VTEX's storefront solution, since they are natively integrated with Intelligent Search.

  ## Permissions

  This endpoint does not require [authentication](https://developers.vtex.com/docs/guides/authentication) or [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | (Required) Name of the VTEX account. Used as part of the URL. |
