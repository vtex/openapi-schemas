opencollection: 1.0.0

info:
  name: VTEX - SSL Certificates API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The SSL Certificates API allows VTEX users to programmatically manage SSL certificates for their store domains. It enables users to list all installed certificates and install or renew certificates using JSON or multipart form data.

    The API provides detailed metadata about each certificate, including issuer, subject, validity period, installation status, and more. This helps ensure secure HTTPS connections for custom domains, automating certificate lifecycle management and supporting integration with external certificate authorities or automation tools.

    >ℹ️ Learn more about [Custom SSL certificates](https://help.vtex.com/en/tutorial/custom-ssl-certificates--1hoaDEbU50PDZSe6AYep9q).

    >ℹ️ This feature is part of [VTEX Shield](https://help.vtex.com/en/tutorial/vtex-shield--2CVk6H9eY2CBtHjtDI7BFh). If you are already a VTEX customer and want to adopt VTEX Shield for your business, please contact [Commercial Support](https://help.vtex.com/en/tracks/support-at-vtex--4AXsGdGHqExp9ZkiNq9eMy/3KQWGgkPOwbFTPfBxL7YwZ). Additional fees may apply. If you are not yet a customer but are interested in this solution, please complete our [contact form](https://vtex.com/br-pt/contato/).

    ## Common parameters

    | Parameter name | Description | Type |
    |-|-|-|
    | `{{accountName}}` | Name of the VTEX account. Used as part of the URL. | Server variable |
    | `{{environment}}` | Environment to use. Used as part of the URL. The default value is `vtexcommercestable`. | Server variable     |
    | `X-VTEX-API-AppKey` | Unique identifier of the [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys). | Authentication header |
    | `X-VTEX-API-AppToken` | Secret token of the [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys). | Authentication header |
    | `VtexIdclientAutCookie` | [User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours. | Authentication header |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
