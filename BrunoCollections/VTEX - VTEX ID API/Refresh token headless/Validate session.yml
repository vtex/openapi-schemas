info:
  name: Validate session
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/vtexid/pub/authentication/accesskey/validate"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: accessKey
        type: text
        value: id sit Lorem sed
      - name: login
        type: text
        value: dolore in id Duis
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/vtexid/pub/authentication/accesskey/validate - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/vtexid/pub/authentication/accesskey/validate - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/vtexid/pub/authentication/accesskey/validate - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/vtexid/pub/authentication/accesskey/validate - Schema is valid", function () {
          const schema = {"type":"object","description":"Validate session response object.","properties":{"authStatus":{"type":"string","description":"Authentication status of the user, which can be: \n\n* `Success`: when authentication is completed successfully.\n* `InvalidEmail`: When the email informed is not valid.\n* `InvalidToken`: When the token is malformed, expired, or has an invalid signature.\n* `WrongCredentials`: When the informed credentials are not valid.","enum":["Success","InvalidEmail","InvalidToken","WrongCredentials"]},"promptMFA":{"type":"boolean","description":"Indicates whether multi-factor authentication is required."},"lastAttemptAvailable":{"type":["integer","null"],"description":"Last authentication attempt available."},"clientToken":{"type":["string","null"],"description":"Client token."},"authCookie":{"type":["object","null"],"description":"Authentication cookie.","properties":{"Name":{"type":"string","description":"Name of the cookie."},"Value":{"type":"string","description":"Value of the cookie."}}},"accountAuthCookie":{"type":["object","null"],"description":"Cookie specific to account authentication.","properties":{"Name":{"type":"string","description":"Name of the cookie."},"Value":{"type":"string","description":"Value of the cookie."}}},"expiresIn":{"type":"integer","description":"Time in seconds until authentication expires."},"userId":{"type":["string","null"],"description":"Unique identifier for the authenticated user."},"phoneNumber":{"type":["string","null"],"description":"User's phone number associated with the account."},"scope":{"type":["string","null"],"description":"Authentication scope granted."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Validates the user session using the access key sent to the user through the [Send access key](https://developers.vtex.com/docs/api-reference/vtex-id-api#post-/api/vtexid/pub/authentication/accesskey/send) endpoint.

  The refresh token (`vid_rt`) is returned in the `Set-Cookie` header. This token is required for the [Refresh token](https://developers.vtex.com/docs/api-reference/vtex-id-api#post-/api/vtexid/refreshtoken/webstore) request.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "authStatus": "Success",
    "promptMFA": false,
    "lastAttemptAvailable": null,
    "clientToken": null,
    "authCookie": {
      "Name": "VtexIdclientAutCookie_apiexamples",
      "Value": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
    },
    "accountAuthCookie": {
      "Name": "VtexIdclientAutCookie_a8b27fb4-6516-4cc0-82b6-a5f2b011e6e2",
      "Value": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
    },
    "expiresIn": 86399,
    "userId": "1f6c17e5-06f9-44a9-a459-b3686e03fa9d",
