info:
  name: Send access key
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/vtexid/pub/authentication/accesskey/send?email=jane@mail.com"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: email
      value: jane@mail.com
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/api/vtexid/pub/authentication/accesskey/send - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Sends an access key to the user's email address, if the response is empty with 200 OK. The access key is used to authenticate the user in your store.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `email` | query | (Required) User email. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
