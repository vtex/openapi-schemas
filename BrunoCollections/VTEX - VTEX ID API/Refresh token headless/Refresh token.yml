info:
  name: Refresh token
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/vtexid/refreshtoken/webstore"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Host
      value: apiexamples.myvtex.com
  body:
    type: json
    data: |-
      {
        "fingerprint": "12345"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/vtexid/refreshtoken/webstore - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/vtexid/refreshtoken/webstore - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/vtexid/refreshtoken/webstore - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/vtexid/refreshtoken/webstore - Schema is valid", function () {
          const schema = {"type":"object","description":"Refresh token response object.","properties":{"status":{"type":"string","description":"Status of the operation. Possible values: \r\n- `Success`: Token refresh was successful. \r\n- `InvalidSession`: The session is invalid or expired. \r\n- `InvalidToken`: The token is invalid. \r\n- `InvalidEmail`: The email associated with the token is invalid. \r\n- `InvalidScope`: The scope is invalid.","enum":["Success","InvalidSession","InvalidToken","InvalidEmail","InvalidScope"]},"userId":{"type":"string","description":"Unique identifier assigned to the authenticated user."},"refreshAfter":{"type":"string","format":"date-time","description":"The timestamp indicating when the session should be refreshed, in ISO 8601 format (`YYYY-MM-DDTHH:mm:ss±HH:MM`)."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns a valid refresh token and authentication token (`VtexIdclientAutCookie`) as cookies.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Host` | header | (Required) Host address. |

  ## Example response (`200`)

  ```json
  {
    "status": "Success",
    "userId": "1f6c17e5-06f9-44a9-a459-b3686e03fa9d",
    "refreshAfter": "2025-03-27T02:36:30+00:00"
  }
  ```
