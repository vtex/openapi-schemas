info:
  name: Enable or disable password migration
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/authenticator/v1/tenants/features/:name"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: name
      value: PasswordMigration
      type: path
  body:
    type: json
    data: |-
      {
        "enabled": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PATCH]::/api/authenticator/v1/tenants/features/:name - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Enables or disables the B2B password migration feature for your account without removing the configuration. When disabled, legacy password validation will not be performed, even for users with `isLegacyPassword=true`.

  For more information, see the [B2B password migration guide](https://developers.vtex.com/docs/guides/b2b-password-migration).

  > ⚠️ This feature is only available for stores using [B2B Buyer Portal](https://help.vtex.com/docs/tutorials/b2b-buyer-portal), which is currently available to selected accounts.

  ## Permissions

  This endpoint does not require [authentication](https://developers.vtex.com/docs/guides/authentication) or [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `name` | path | (Required) Feature name for password migration. Must be `PasswordMigration`. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
