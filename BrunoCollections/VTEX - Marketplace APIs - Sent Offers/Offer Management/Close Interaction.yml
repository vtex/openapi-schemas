info:
  name: Close Interaction
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId/close?an={{accountName}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: "{{accountName}}"
      type: query
    - name: feedId
      value: vtex.amazon
      type: path
    - name: skuId
      value: "1234"
      type: path
    - name: interactionId
      value: d3rdjjf094ma0do
      type: path
    - name: environment
      value: vtexcommercestable
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId/close - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId/close - Response has empty Body", function () {
          const data = res.getBody();
          expect(data === undefined || data === null || data === "").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >❗The Offer Management module has been discontinued and is no longer supported. The module has been replaced by Offer Status.
  To learn more, visit the [announcement](https://help.vtex.com/pt/announcements/modulo-status-dos-anuncios-para-integracoes-com-marketplaces-vtex--1EeGgit1Brq3mmm8qhv2m3).

   In [Offer Management](https://developers.vtex.com/vtex-rest-api/docs/sent-offers-integration-guide-connectors), VTEX platform and marketplaces interact with offers through a medium called [interaction](https://developers.vtex.com/docs/api-reference/marketplace-apis-offer-management#post-/api/sent-offers/feeds/-feedId-/skus/-skuId-/interactions). 

  Once an interaction has fulfilled its initial goal and there are no more actions (or [logs](https://developers.vtex.com/docs/api-reference/marketplace-apis-offer-management#post-/api/sent-offers/feeds/-feedId-/skus/-skuId-/interactions/-interactionId-/logs)) taking place within it, this endpoint closes an interaction.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `feedId` | path | (Required) The `feedId` attribute that identifies a feed between a seller and a channel, follows a standardized pattern that will be used by connectors when establishing the connection between the two. It follows the pattern `vendor.channel`. |
  | `skuId` | path | (Required) This attribute is the SKU ID in the seller's perspective, registered in their VTEX Catalog. |
  | `interactionId` | path | (Required) This attribute is the code used to identify an existing interaction. |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `an` | query | (Required) Name of the VTEX account. Used as query param. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
