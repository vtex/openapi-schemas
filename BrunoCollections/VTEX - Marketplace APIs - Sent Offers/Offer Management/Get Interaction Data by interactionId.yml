info:
  name: Get Interaction Data by interactionId
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId?an={{accountName}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: "{{accountName}}"
      type: query
    - name: feedId
      value: vtex.amazon
      type: path
    - name: skuId
      value: "1234"
      type: path
    - name: interactionId
      value: d3rdjjf094ma0do
      type: path
    - name: environment
      value: vtexcommercestable
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions/:interactionId - Schema is valid", function () {
          const schema = {"title":"RetrieveInteraction","type":"object","example":{"account":"grocery1","feedId":"vtex.madeiramadeira","skuId":"1","id":"7FC112C52F8F43E6A096E29B04AC63F6","startDate":"2022-03-07T09:15:00Z","result":"processing","state":"open","source":"seller","origin":"inventory","context":"setup","logs":[]},"properties":{"account":{"type":"string","description":"Seller's account name."},"feedId":{"type":"string","description":"Attribute that identifies a feed between a seller and a channel. It follows a standardized pattern that will be used by connectors when establishing the connection between the two."},"skuId":{"type":"string","description":"SKU's unique identifier number."},"id":{"type":"string","description":"Connectors must extend the Sent Offers' codes by adding their own code IDs for mapping specific scenarios that apply to their own system. They can send those codes through a suffix ID added in an existing code."},"startDate":{"type":"string","description":"The day the interaction was created."},"result":{"type":"string","description":"Search interactions, filtering by result. Results can have the following values: \n\nSuccess: When events close their lifecycle successfully, and generate updates on an offer in terms of price, inventory, or catalog. \n\nFailure: When the connector has detected processes that have failed to be made  due to an error. \n\nNotification: When there are processes with the connector that are worth mentioning, but there are no actual updates. Ex: discarded updates or sendings of an offer. \n\nProcessing: When an open interaction has not been concluded, and should still receive more steps."},"state":{"type":"string","description":"State, from the seller's address."},"source":{"type":"string","description":"This attribute defines the entity responsible for the interaction."},"origin":{"type":"string","description":"where the interaction originated from. Possible values include `catalog`, `price` or `inventory`."},"context":{"type":"string","description":"This field informs Sent Offers about an offer's lifecycle."},"logs":{"type":"array","description":"History of events related to interactions.","items":{"type":"string"},"properties":{"type":{"type":"string","title":"type","description":"Type of logs."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >❗The Offer Management module has been discontinued and is no longer supported. The module has been replaced by Offer Status.
  To learn more, visit the [announcement](https://help.vtex.com/pt/announcements/modulo-status-dos-anuncios-para-integracoes-com-marketplaces-vtex--1EeGgit1Brq3mmm8qhv2m3).

   In [Offer Management](https://developers.vtex.com/vtex-rest-api/docs/sent-offers-integration-guide-connectors), VTEX platform and marketplaces interact with offers through a medium called [interaction](https://developers.vtex.com/docs/api-reference/marketplace-apis-offer-management#post-/api/sent-offers/feeds/-feedId-/skus/-skuId-/interactions). 

  A unique code called `interactionId` is used to identify each interaction. This endpoint retrieves information about an interaction, searching by its `interactionId`. 

  It also retrieves existing logs through the `log` field.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `feedId` | path | (Required) The `feedId` attribute that identifies a feed between a seller and a channel, follows a standardized pattern that will be used by connectors when establishing the connection between the two. It follows the pattern `vendor.channel`. |
  | `skuId` | path | (Required) This attribute is the SKU ID in the seller's perspective, registered in their VTEX Catalog. |
  | `interactionId` | path | (Required) This attribute is the code used to identify an existing interaction. |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `an` | query | (Required) Name of the VTEX account. Used as query param. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "account": "grocery1",
    "feedId": "vtex.madeiramadeira",
    "skuId": "1",
    "id": "7FC112C52F8F43E6A096E29B04AC63F6",
    "startDate": "2022-03-07T09:15:00Z",
    "result": "processing",
    "state": "open",
    "source": "seller",
    "origin": "inventory",
    "context": "setup",
    "logs": []
  }
  ```
