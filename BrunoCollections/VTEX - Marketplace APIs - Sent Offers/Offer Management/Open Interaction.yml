info:
  name: Open Interaction
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/sent-offers/feeds/:feedId/skus/:skuId/interactions?an={{accountName}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: "{{accountName}}"
      type: query
    - name: feedId
      value: vtex.amazon
      type: path
    - name: skuId
      value: "1234"
      type: path
    - name: environment
      value: vtexcommercestable
      type: path
  body:
    type: json
    data: |-
      {
        "startDate": "2020-10-29",
        "source": "seller",
        "origin": "catalog",
        "context": "setup"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/sent-offers/feeds/:feedId/skus/:skuId/interactions - Schema is valid", function () {
          const schema = {"title":"CreateInteraction","type":"object","example":{"account":"grocery1","feedId":"vtex.madeiramadeira","skuId":"1","id":"3D585672B15A418EBDFC4BC0E85120A5","startDate":"2022-03-07T09:15:00Z","result":"processing","state":"open","source":"seller","origin":"inventory","context":"setup","logs":[]},"properties":{"account":{"type":"string","description":"Seller's account name."},"feedId":{"type":"string","description":"Attribute that identifies a feed between a seller and a channel. It follows a standardized pattern that will be used by connectors when establishing the connection between the two."},"skuId":{"type":"string","description":"SKU's unique identifier number."},"id":{"type":"string","description":"Connectors must extend the Sent Offers' codes by adding their own code IDs for mapping specific scenarios that apply to their own system. They can send those codes through a suffix ID added in an existing code."},"startDate":{"type":"string","description":"The day the interaction was created."},"result":{"type":"string","description":"Search interactions, filtering by result. Results can have the following values: \n\nSuccess: When events close their lifecycle successfully, and generate updates on an offer in terms of price, inventory, or catalog. \n\nFailure: When the connector has detected processes that have failed to be made  due to an error. \n\nNotification: When there are processes with the connector that are worth mentioning, but there are no actual updates. Ex: discarded updates or sendings of an offer. \n\nProcessing: When an open interaction has not been concluded, and should still receive more steps."},"state":{"type":"string","description":"State, from the seller's address."},"source":{"type":"string","description":"This attribute defines the entity responsible for the interaction."},"origin":{"type":"string","description":"where the interaction originated from. Possible values include `catalog`, `price` or `inventory`."},"context":{"type":"string","description":"This field informs Sent Offers about an offer's lifecycle."},"logs":{"type":"array","description":"History of events related to interactions.","items":{"type":"string"},"properties":{"type":{"type":"string","title":"type","description":"Type of logs."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >❗The Offer Management module has been discontinued and is no longer supported. The module has been replaced by Offer Status.
  To learn more, visit the [announcement](https://help.vtex.com/pt/announcements/modulo-status-dos-anuncios-para-integracoes-com-marketplaces-vtex--1EeGgit1Brq3mmm8qhv2m3).

   In [Offer Management](https://developers.vtex.com/vtex-rest-api/docs/sent-offers-integration-guide-connectors), VTEX platform and marketplaces interact with offers through a medium called Interaction. For every action that happens to an offer, whether it is a status notification or a price update, the connector creates an Interaction about it. 

  This endpoint creates a new interaction for an SKU so that changes can be applied to an offer. The changes informed by interactions are related to: price, inventory, catalog and status. 

  Usually, interactions process a single type of change at a time, but it is possible to add data about catalog, price, and inventory simultaneously in the same interaction.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `feedId` | path | (Required) The `feedId` attribute that identifies a feed between a seller and a channel, follows a standardized pattern that will be used by connectors when establishing the connection between the two. It follows the pattern `vendor.channel`. |
  | `skuId` | path | (Required) This attribute is the SKU ID in the seller's perspective, registered in their VTEX Catalog. |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `an` | query | (Required) Name of the VTEX account. Used as query param. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`201`)

  ```json
  {
    "account": "grocery1",
    "feedId": "vtex.madeiramadeira",
    "skuId": "1",
    "id": "3D585672B15A418EBDFC4BC0E85120A5",
    "startDate": "2022-03-07T09:15:00Z",
    "result": "processing",
    "state": "open",
    "source": "seller",
    "origin": "inventory",
    "context": "setup",
    "logs": []
  }
  ```
