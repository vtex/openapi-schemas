info:
  name: Get Error Code data by errorCodeId
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/sent-offers/error-codes/:errorCodeId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: errorCodeId
      value: errorId
      type: path
    - name: environment
      value: vtexcommercestable
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/sent-offers/error-codes/:errorCodeId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/sent-offers/error-codes/:errorCodeId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/sent-offers/error-codes/:errorCodeId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/sent-offers/error-codes/:errorCodeId - Schema is valid", function () {
          const schema = {"type":"array","items":{"title":"Listallerrorcode","type":"object","properties":{"id":{"type":"string"},"type":{"type":"string"},"description":{"type":"string"},"solutionText":{"type":"string"},"solutionLink":{"type":"string"}}},"description":"Error description.","example":[{"id":"AUTH-001","type":"Authorization","description":"Authorization errors where the user can solve by himself just fixing something on the settings. For example, when the user/password is invalid, or a register field is missing...","solutionText":"Check connector settings","solutionLink":"http://{accountName}.myvtex.com/admin/bridge/#/settings"},{"id":"AUTH-002","type":"Authorization","description":"Authorization errors where the user can't solve by himself and depends on someone else to solve. For example, when the user has no access to a specific resource"},{"id":"CTLG-001","type":"Generic mapping","description":"Catalog mapping errors different from variation, attribute or category errors. For example, brand mapping or a specific field of that channel.","solutionText":"Check mapping spreadsheet","solutionLink":"http://{accountName}.myvtex.com/admin/bridge/#/settings"},{"id":"CTLG-002","type":"Variation mapping","description":"Errors of variation mapping (SKU specifications). For example, when a color field/value is not mapped correctly.","solutionText":"Check mapping spreadsheet","solutionLink":"http://{accountName}.myvtex.com/admin/bridge/#/settings"},{"id":"CTLG-003","type":"Attribute mapping","description":"Errors of attribute mapping (product specifications). For example, when product specifications are not mapped correctly.","solutionText":"Check mapping spreadsheet","solutionLink":"http://{accountName}.myvtex.com/admin/bridge/#/settings"},{"id":"CTLG-004","type":"Category mapping","description":"Errors of category mapping. For example, when a category ID is not correct; when the user has mapped the parent-category instead of the child-category.","solutionText":"Check mapping spreadsheet","solutionLink":"http://{accountName}.myvtex.com/admin/bridge/#/settings"},{"id":"CTLG-005","type":"Product info","description":"Generic errors of product information sending. For any case different that the other product information error codes don't support","solutionText":"Check item on catalog","solutionLink":"http://{accountName}.myvtex.com/admin/Site/ProdutoForm.aspx"},{"id":"CTLG-006","type":"Description","description":"Description is not according as expected by the channel. For example, when the description is too long; when has HTML; when there is no description and is a mandatory field...","solutionText":"Fix description","solutionLink":"http://{accountName}.myvtex.com/admin/Site/ProdutoForm.aspx?id={productId}"},{"id":"CTLG-007","type":"Images","description":"Images are not according as expected by the channel. For example, when the image must have white background; when has no images and is mandatory to have at least one...","solutionText":"Fix images","solutionLink":"http://{accountName}.myvtex.com/admin/Site/SkuForm.aspx?idSku={skuId}"},{"id":"CTLG-008","type":"Dimensions","description":"Dimensions are not according as expected by the channel. For example, when the weight is below the minimum required; when the dimensions are not filled and is a mandatory field...","solutionText":"Check dimensions","solutionLink":"http://{accountName}.myvtex.com/admin/Site/SkuForm.aspx?idSku={skuId}"},{"id":"CTLG-009","type":"Title","description":"Title is not according as expected by the channel. For example, when the title is too long; when the title doesn't meet the channel taxonomy...","solutionText":"Check title","solutionLink":"http://{accountName}.myvtex.com/admin/Site/ProdutoForm.aspx?id={productId}"},{"id":"CTLG-010","type":"Identifiers","description":"Identifier is not according as expected by the channel. For example, when a EAN, ISBN or UPC is invalid; when a identifier is required but is not filled...","solutionText":"Fix item's identifier","solutionLink":"http://{accountName}.myvtex.com/admin/Site/SkuForm.aspx?idSku={skuId}"},{"id":"CTLG-011","type":"Channels' rules","description":"Errors due channel's business rules that cannot be solved by the user. For example, when the product category is not supported by the channel; when a currency is not supported by the channel..."},{"id":"CTLG-012","type":"Moderation","description":"Ad moderated, it does not comply with Mercado Livre policies","solutionText":"Apply the actions in the moderation section"},{"id":"CTLG-XXX","type":"Variation mapping","description":"Errors of variation mapping (SKU specifications)","solutionText":"Download mapping spreadsheet","solutionLink":"http://{accountName}.myvtex.com/admin/dummy-invalid-link/catalog/skus/{skuId}"},{"id":"CTLG-YYY","type":"Variation mapping YYY","description":"Errors of variation mapping (SKU specifications) YYY","solutionText":"Download mapping spreadsheet YYY","solutionLink":"http://{accountName}.myvtex.com/admin/dummyyy-invalid-link/catalog/skus/{skuId}"},{"id":"INVNT-001","type":"Inventory","description":"Errors directly related to all inventory scenarios. This scenarios are for every issue that blocks an inventory from being updated. For example, when the channel has a rule of minimum quantity of inventory for all SKUs of a product.","solutionText":"Check inventory levels","solutionLink":"http://{accountName}.myvtex.com/admin/inventory/?skuId={skuId}"},{"id":"NTMAP-001","type":"Not mapped","description":"Errors not mapped by the connector. Commonly, it occurs when the channel's API starts to validate new things without communicating to the connector."},{"id":"PRICE-001","type":"Price","description":"Errors directly related to all price scenarios. This scenarios are for every issue that blocks a price from being updated. For example, when a price changes on rate that is not allowed by the marketplace.","solutionText":"Fix price","solutionLink":"http://{accountName}.myvtex.com/admin/pricing/#/prices/?page=1&qtd=10&productId={productId}&productName=%22%22"}]};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >❗The Offer Management module has been discontinued and is no longer supported. The module has been replaced by Offer Status.
  To learn more, visit the [announcement](https://help.vtex.com/pt/announcements/modulo-status-dos-anuncios-para-integracoes-com-marketplaces-vtex--1EeGgit1Brq3mmm8qhv2m3).

   This endpoint retrieves specific information about an error code in [Offer Management's](https://developers.vtex.com/vtex-rest-api/docs/sent-offers-integration-guide-connectors) configuration. It provides the single source of truth of updated information about an error code through the `errorCodeId`. 

  The connector will retrieve all the error codes available directly on this API and use the codes that apply the most to their error scenarios. Then, the connector will implement these codes into every validation error inside their system.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `errorCodeId` | path | (Required) Id for the error code chosen. |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

