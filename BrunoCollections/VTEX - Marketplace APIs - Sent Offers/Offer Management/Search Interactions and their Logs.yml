info:
  name: Search Interactions and their Logs
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/sent-offers/search/interactions?an={{accountName}}&q={{query}}&sort={{sort}}&from={{from}}&to={{to}}&fromDate={{fromDate}}&toDate={{toDate}}"
  params:
    - name: an
      value: "{{accountName}}"
      type: query
    - name: q
      value: "{{query}}"
      type: query
    - name: channels
      value: "{{channelName}}"
      type: query
      disabled: true
    - name: brand
      value: "{{brand}}"
      type: query
      disabled: true
    - name: category
      value: "{{category}}"
      type: query
      disabled: true
    - name: scope
      value: "{{scope}}"
      type: query
      disabled: true
    - name: result
      value: "{{result}}"
      type: query
      disabled: true
    - name: sort
      value: "{{sort}}"
      type: query
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
    - name: fromDate
      value: "{{fromDate}}"
      type: query
    - name: toDate
      value: "{{toDate}}"
      type: query
    - name: environment
      value: vtexcommercestable
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/api/sent-offers/search/interactions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >❗The Offer Management module has been discontinued and is no longer supported. The module has been replaced by Offer Status.
  To learn more, visit the [announcement](https://help.vtex.com/pt/announcements/modulo-status-dos-anuncios-para-integracoes-com-marketplaces-vtex--1EeGgit1Brq3mmm8qhv2m3).

   In [Offer Management](https://developers.vtex.com/vtex-rest-api/docs/sent-offers-integration-guide-connectors), VTEX platform and marketplaces interact with offers through a medium called [interaction](https://developers.vtex.com/docs/api-reference/marketplace-apis-offer-management#post-/api/sent-offers/feeds/-feedId-/skus/-skuId-/interactions). The granular details of actions and micro-steps that happen within an interaction's are called [logs](https://developers.vtex.com/docs/api-reference/marketplace-apis-offer-management#post-/api/sent-offers/feeds/-feedId-/skus/-skuId-/interactions/-interactionId-/logs). 

  This endpoint retrieves information about interactions and all logs within it. It allows filtering interactions by using the following query params: `channel`, `brand`, `category`, `scope`, `result`, `fromDate`, `toDate`. This endpoint also counts with the following pagination query params: `sort`, `from`, `to`.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `an` | query | (Required) Name of the VTEX account. Used as a query param. |
  | `q` | query | (Required) Customizable field for searching interactions. |
  | `channels` | query | Search interactions, filtering by channel. |
  | `brand` | query | Search interactions, filtering by brand. |
  | `category` | query | Search interactions, filtering by category. |
  | `scope` | query | Search interactions, filtering by scope. |
  | `result` | query | Search interactions, filtering by result. Results can have the following values: Success: When events close their lifecycle successfully, and generate updates on an offer in terms of price, inventory, or catalog. Failure: When the connector has detected processes that have failed to be made  due to an error. Notification: When there are processes with the connector that are worth mentioning, but there are no actual updates. Ex: discarded updates or sendings of an offer. Processing:  When an open interaction has not been concluded, and should still receive more steps. This is a transitory state, considering that when an interaction is closed, it can only end with `success`, `failure` or `notification` as its result. |
  | `sort` | query | (Required) Search interactions filtering by sort. |
  | `from` | query | (Required) Search interactions from a given point. |
  | `to` | query | (Required) Search interactions until a given point. |
  | `fromDate` | query | (Required) Search interactions from a specific date. |
  | `toDate` | query | (Required) Search interactions until a given date. |
