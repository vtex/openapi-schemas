info:
  name: Search Errors
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/sent-offers/search/errors?an={{accountName}}&q={{query}}&channels={{channels}}&brand={{brand}}&category={{category}}&errorCategory={{errorCategory}}&sort={{sort}}&from={{from}}&to={{to}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: "{{accountName}}"
      type: query
    - name: q
      value: "{{query}}"
      type: query
    - name: channels
      value: "{{channels}}"
      type: query
    - name: brand
      value: "{{brand}}"
      type: query
    - name: category
      value: "{{category}}"
      type: query
    - name: errorCategory
      value: "{{errorCategory}}"
      type: query
    - name: sort
      value: "{{sort}}"
      type: query
    - name: from
      value: "{{from}}"
      type: query
    - name: to
      value: "{{to}}"
      type: query
    - name: environment
      value: vtexcommercestable
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/api/sent-offers/search/errors - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >❗The Offer Management module has been discontinued and is no longer supported. The module has been replaced by Offer Status.
  To learn more, visit the [announcement](https://help.vtex.com/pt/announcements/modulo-status-dos-anuncios-para-integracoes-com-marketplaces-vtex--1EeGgit1Brq3mmm8qhv2m3).

   This endpoint provides the single source of truth of updated error codes in [Offer Management's](https://developers.vtex.com/vtex-rest-api/docs/sent-offers-integration-guide-connectors) configuration. It retrieves a list of all the error codes available at that moment. 

  The connector will retrieve all the error codes available directly on this API and use the codes that apply the most to their error scenarios. Then, the connector will implement these codes into every validation error inside their system. 

  This endpoint allows filtering errors by using the following query params: `channel`, `brand`, `category`, `errorCategory`. It also counts with the following pagination query params: `sort`, `from`, `to`, `q`.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `an` | query | (Required) Name of the VTEX account. Used as query param. |
  | `q` | query | (Required) Customizable field for searching error codes. |
  | `channels` | query | (Required) Search errors filtering by channels. |
  | `brand` | query | (Required) Search errors filtering by brand. |
  | `category` | query | (Required) Search errors filtering by category. |
  | `errorCategory` | query | (Required) Search errors filtering by error category. |
  | `sort` | query | (Required) Pagination that returns a range of ordered error codes. |
  | `from` | query | (Required) Pagination that returns error codes from a given point. |
  | `to` | query | (Required) Pagination that returns error codes until a given point. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
