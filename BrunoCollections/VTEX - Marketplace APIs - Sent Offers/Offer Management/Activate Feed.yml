info:
  name: Activate Feed
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/sent-offers/feeds?an={{accountName}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: "{{accountName}}"
      type: query
    - name: environment
      value: vtexcommercestable
      type: path
  body:
    type: json
    data: |-
      {
        "id": "{{feedId}}",
        "affiliateId": "MKP",
        "salesChannels": "5"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/sent-offers/feeds - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/sent-offers/feeds - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/sent-offers/feeds - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/sent-offers/feeds - Schema is valid", function () {
          const schema = {"type":"object","title":"CreateFeed","example":{"account":"grocery1","id":"vtex.meli-classic","affiliateId":"MDC","salesChannel":"4"},"properties":{"account":{"type":"string","description":"Seller's account name."},"id":{"type":"string","description":"Channel's ID."},"affiliateId":{"type":"string","description":"Corresponds to the 3-digit [affiliate](https://help.vtex.com/en/tutorial/configuring-affiliates--tutorials_187) identification code created by the seller.","default":"MKP"},"salesChannel":{"type":"string","description":"Sales channel (or [trade policy](https://help.vtex.com/en/tutorial/como-funciona-uma-politica-comercial--6Xef8PZiFm40kg2STrMkMV)) associated to the seller account created."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >❗The Offer Management module has been discontinued and is no longer supported. The module has been replaced by Offer Status.
  To learn more, visit the [announcement](https://help.vtex.com/pt/announcements/modulo-status-dos-anuncios-para-integracoes-com-marketplaces-vtex--1EeGgit1Brq3mmm8qhv2m3).

  In [Offer Management](https://developers.vtex.com/docs/guides/sent-offers-integration-guide-connectors), after [creating the channel](https://developers.vtex.com/docs/api-reference/marketplace-apis-offer-management#post-/api/sent-offers/channels), the next step is to create a feed, which is a list updated nearly in real time with information about the seller's offers sent to the marketplace. 

  This endpoint allows the creation of a feed so that the seller's sales channel (or [trade policy](https://help.vtex.com/en/tutorial/how-trade-policies-work--6Xef8PZiFm40kg2STrMkMV)) is connected to the marketplace. Feeds are nearly real time updated with content provided by the marketplace and VTEX modules. 

  This endpoint should only be used once, to activate the channel and establish the connection. However, after a [feed is deactivated](https://developers.vtex.com/docs/api-reference/marketplace-apis-offer-management#delete-/api/sent-offers/feeds/-feedId-), in order to activate it again it will be necessary another call to this endpoint.The integration starts with the creation of the Feed. This endpoint is used to establish the connection between connector and seller through the Sent Offers. 

  The `feedId` attribute that identifies a feed between a seller and a channel, follows a standardized pattern that will be used by connectors when calling this endpoint. It follows the pattern `vendor.channel`.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | (Required) Environment to use. Used as part of the URL. |
  | `an` | query | (Required) Name of the VTEX account. Used as query param. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`201`)

  ```json
  {
    "account": "grocery1",
    "id": "vtex.meli-classic",
    "affiliateId": "MDC",
    "salesChannel": "4"
  }
  ```
