opencollection: 1.0.0

info:
  name: VTEX - Storefront Permissions API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Storefront Permissions API allows you to manage user roles and resource access within the VTEX License Manager for storefront users. You can assign storefront roles to existing users, or create new users with assigned roles in a single request. The API also allows you to revoke storefront roles, check user access to resources, remove users, and fetch user roles and details.

    > ⚠️ This feature is in closed beta, meaning only specific customers can access it now. If you want to implement it in the future, please contact [our Support](https://support.vtex.com/hc/en-us/).

    >⚠️ All endpoints require the Storefront Permissions feature to be enabled for your account. Requests to accounts without this feature enabled will receive a 403 Forbidden response.

    >ℹ️ Learn more about the available storefront roles and resources at the [Storefront Permissions](https://developers.vtex.com/docs/guides/storefront-permissions) guide.

    ## Index

    ### Storefront Permissions

    - `POST` [Assign one storefront role](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#post-/api/license-manager/storefront/roles/assign): Assigns a specific storefront role to an existing user.
    - `POST` [Assign storefront roles](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#post-/api/license-manager/storefront/user/roles): Fully updates the user's role list based on the provided role IDs. Creates the user if they do not exist.
    - `DELETE` [Revoke storefront roles](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#delete-/api/license-manager/storefront/user/roles): Removes the specified storefront roles from a user.
    - `GET` [Check storefront user resource access](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#get-/api/license-manager/storefront/users/{userId}/resources/{resourceKey}/granted): Verifies if a storefront user has access to a resource.
    - `DELETE` [Remove storefront user](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#delete-/api/license-manager/storefront/remove/users/{userId}): Removes a user from the Storefront system.
    - `GET` [Get storefront user roles](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#get-/api/license-manager/storefront/users/{userId}/roles): Retrieves the list of storefront roles assigned to a specific user.
    - `GET` [Fetch storefront user roles by email](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#get-/api/license-manager/storefront/users/{email}/roles): Retrieves all storefront roles assigned to a user by email.
    - `GET` [Fetch storefront user details](https://developers.vtex.com/docs/api-reference/storefront-permissions-api#get-/api/license-manager/storefront/users/{userId}): Retrieves storefront user details by ID.

    ## Common parameters

    | Parameter name | Description | Type |
    | - | - | - |
    | `X-VTEX-API-AppKey` | Unique identifier of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys). | Authentication header. |
    | `X-VTEX-API-AppToken` | Secret token of the [application key](https://developers.vtex.com/docs/guides/api-authentication-using-application-keys). | Authentication header. |
    | `VtexIdclientAutCookie` | [User token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens), valid for 24 hours. | Authentication header. |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
