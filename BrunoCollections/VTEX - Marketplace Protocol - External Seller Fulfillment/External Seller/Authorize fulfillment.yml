runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/pvt/orders/:sellerOrderId/fulfill - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/pvt/orders/:sellerOrderId/fulfill - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/pvt/orders/:sellerOrderId/fulfill - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/pvt/orders/:sellerOrderId/fulfill - Schema is valid", function () {
          const schema = {"type":"object","description":"Details related to an order, including the order approval date, marketplace order ID, order number, and order receipt code.","properties":{"date":{"type":"string","title":"Date","description":"Order approval date."},"marketplaceOrderId":{"type":"string","title":"Marketplace Order Id","description":"Identifies the order. The seller should use this ID to trigger the fulfillment process of the corresponding order."},"orderId":{"type":"string","title":"Order Id","description":"Order number."},"receipt":{"type":"string","description":"Order receipt code.","title":"Receipt"}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This request is sent from VTEX to the seller after the payment is approved, to notify them that the fulfillment process can start.

  ## Permissions

  Check with your service provider to know what permissions are needed.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `sellerOrderId` | path | (Required) Seller's order ID of the order ready for fulfillment. The seller can be a VTEX seller or an external one. |
  | `fulfillmentEndpoint` | path | (Required) This is the fulfillment endpoint registered for each specific external seller in the **seller management** section of VTEX's admin panel. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "date": "2014-10-06 18:52:00",
    "marketplaceOrderId": "1138342255777-01",
    "orderId": "959311095",
    "receipt": "e39d05f9-0c54-4469-a626-8bb5cff169f8"
  }
  ```
