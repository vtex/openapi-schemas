s a legal entity."},"stateInscription":{"type":["string","null"],"description":"State inscription, if the customer is a legal entity."},"corporatePhone":{"type":["string","null"],"description":"Corporate phone number, if the customer is a legal entity."},"isCorporate":{"type":["boolean","null"],"description":"`true` if the customer is a legal entity.","default":false}}},"shippingData":{"description":"Shipping information.","type":"object","properties":{"address":{"type":"object","description":"Shipping address.","required":["addressType","receiverName","postalCode","city","state","country","street","neighborhood","number"],"properties":{"addressType":{"type":"string","description":"Type of address. For example, `Residential` or `Pickup`, among others."},"receiverName":{"type":"string","description":"Name of the person who is going to receive the order."},"addressId":{"type":"string","description":"Address ID."},"postalCode":{"type":"string","description":"Postal Code."},"city":{"type":"string","description":"City of the shipping address."},"state":{"type":"string","description":"State of the shipping address."},"country":{"type":"string","description":"Three letter ISO code of the country of the shipping address."},"street":{"type":"string","description":"Street of the shipping address."},"number":{"type":"string","description":"Number of the building, house or apartment in the shipping address."},"neighborhood":{"type":"string","description":"Neighborhood of the shipping address."},"complement":{"type":"string","description":"Complement to the shipping address in case it applies."},"reference":{"type":"string","description":"Complement that might help locate the shipping address more precisely in case of delivery."},"geoCoordinates":{"type":"array","description":"Geographic coordinates of the delivery address. This may be used instead of the postalCode, in case the marketplace is configured to accept geolocation. Example of value: `[-22.9443504,-43.1825635]`.","ite