  url: "{{baseUrl}}/suggestions/:sellerId/:sellerSkuId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: sellerId
      value: seller123
      type: path
    - name: sellerSkuId
      value: "1234"
      type: path
    - name: accountName
