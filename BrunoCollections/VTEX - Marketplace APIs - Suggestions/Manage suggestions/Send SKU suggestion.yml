        "Images": [
          {
            "imageName": "Principal",
            "imageUrl": "https://i.pinimg.com/originals/2d/96/4a/2d964a6bf37d9224d0615dc85fccdd62.jpg"
          }
        ],
        "ProductSpecifications": [
          {
            "fieldName": "Fabric",
