info:
  name: Match received SKUs individually
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/suggestions/:sellerId/:sellerskuid/versions/:version/matches/:matchid"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: sellerId
      value: seller123
      type: path
    - name: sellerskuid
      value: "1234"
      type: path
    - name: version
      value: "09072021142808277"
      type: path
    - name: matchid
      value: et ex cupid
      type: path
    - name: accountName
      value: apiexamples
      type: path
  body:
    type: json
    data: |-
      {
        "matcherId": "{{matcherid}}",
        "matchType": "itemMatch",
        "score": "{{score}} (must be decimal)",
        "skuRef": "{{skuid}}(should be specifed when match is a sku match)",
        "productRef": "{{productRef}}(should be specified when match is a product match)",
        "product": {
          "name": "Book A",
          "description": "Book description",
          "categoryId": 12,
          "brandId": 1234567,
          "matchType": "itemMatch",
          "specifications": null
        },
        "sku": {
          "name": "Sku exemplo",
          "eans": [
            "12345678901213"
          ],
          "refId": null,
          "height": 1,
          "width": 1,
          "length": 1,
          "weight": 1,
          "images": {
            "imagem1.jpg": "https://imageurl.example"
          },
          "unitMultiplier": 1,
          "measurementUnit": "un",
          "specifications": {
            "Packaging": "3kg"
          }
        }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[PUT]::/suggestions/:sellerId/:sellerskuid/versions/:version/matches/:matchid - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/suggestions/:sellerId/:sellerskuid/versions/:version/matches/:matchid - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[PUT]::/suggestions/:sellerId/:sellerskuid/versions/:version/matches/:matchid - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[PUT]::/suggestions/:sellerId/:sellerskuid/versions/:version/matches/:matchid - Schema is valid", function () {
          const schema = {"type":"array","description":"An array containing the results of multiple match operations. Each object in the array represents the outcome of a single match attempt.","items":{"type":"object","description":"Represents the result of a single match operation, including details such as match ID, matcher ID, seller ID, item ID, and whether the operation was successful.","properties":{"matchId":{"type":"string","description":"Unique identifier for the match operation, which can be used for tracking and auditing purposes."},"matcherId":{"type":"string","description":"Identifier for the matcher entity that performed the match. It can represent VTEX's internal matcher or an external matcher service."},"sellerId":{"type":"string","description":"Unique identifier of the seller who owns the SKU being matched."},"itemId":{"type":"string","description":"Unique identifier of the item (SKU) that was processed during the match operation."},"isSuccess":{"type":"boolean","description":"Indicates whether the match operation was successful. A value of `true` means the operation succeeded, while `false` indicates a failure."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  All SKUs sent from a seller to a marketplace must be reviewed and matched. Actions in the matching process are added in the request body through the [matchType] object. Match type actions include: 

  1. `newproduct`: Match the SKU as a new product. 

  2. `itemMatch`: Associate the received SKU to an existing SKU. 

  3. `productMatch`: Associate the received SKU to an existing product. 

  4. `deny`: Deny the received SKU. 

  5. `pending`: The received SKU requires attention. 

  6. `incomplete`: The received SKU is lacking information to be matched. 

  7. `insufficientScore`: The Score given by the Matcher to this received SKU doesn't qualify it to be matched. 

  Note that  if the autoApprove setting is enabled, the SKUs will be approved, regardless of the Score.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | ---------- | ------------ | ------------ |
  | Channels | UI resources | **Save suggestion rules** |
  | Suggestion | Suggestion resources | **Main** |


  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `sellerId` | path | (Required) A string that identifies the seller in the marketplace. This ID must be created by the marketplace and informed to the seller before the integration is built. |
  | `sellerskuid` | path | (Required) A string that identifies the SKU in the marketplace. This is the ID that the marketplace will use for future references to this SKU, such as price and inventory notifications. |
  | `version` | path | (Required) Whenever an SKU Suggestion is updated or changed, a new version of the original one is created. All versions are logged, so you can search for previous our current states of SKU suggestions. This field is the versionId associated to the version you choose to search for. You can get this field's value through the[Get SKU Suggestion by ID](https://developers.vtex.com/vtex-rest-api/reference/getsuggestion). through the `latestVersionId` field. |
  | `matchid` | path | (Required) Whenever an SKU suggestion is matched, it is associated to a unique ID. Fill in this field with the matchId you wish to filter by. The `matchId`'s value can be obtained through the *[Get SKU Suggestion by ID](https://developers.vtex.com/vtex-rest-api/reference/getsuggestion) endpoint. |
  | `accountName` | path | (Required) Name of the VTEX account. Used as part of the URL |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand |

  ## Example response (`200`)

  ```json
  [
    {
      "matchId": "06272023010821403",
      "matcherId": "vtex-matcher",
      "sellerId": "test858",
      "itemID": "81",
      "isSuccess": false
    }
  ]
  ```
