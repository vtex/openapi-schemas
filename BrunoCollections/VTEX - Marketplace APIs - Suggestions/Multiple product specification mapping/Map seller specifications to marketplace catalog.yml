info:
  name: Map seller specifications to marketplace catalog
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/suggestions/configuration/:sellerID/specifications"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: sellerID
      value: seller123
      type: path
    - name: accountName
      value: marketplaceexample
      type: path
  body:
    type: json
    data: |-
      {
        "43": "41",
        "Tamanho": "TAM",
        "Cor": "Color",
        "BROWN": "Marrom",
        "Brand": "Marca"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PUT]::/suggestions/configuration/:sellerID/specifications - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This endpoint allows the seller to perform a bulk mapping of product specifications to the marketplace catalog.

  Specifications are additional properties that can be registered on products. To ensure this information is correctly interpreted, the marketplace must map the seller’s specifications to the corresponding fields in its own catalog.

  This process ensures that products sent by the seller contain data that matches the marketplace's catalog. Sending a new item without prior mapping does not override existing values. Adding new specifications must follow the instructions in the Mapping categories, brands, and specifications for the marketplace guide.
  The mapping must be done based on specifications that already exist in the marketplace's catalog.

  🔹 All differing specifications must be mapped, even if the only difference is the capitalization of the word.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog | Content | **Product and SKU Management** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `sellerID` | path | (Required) Marketplace seller ID whose specifications will be mapped |
  | `accountName` | path | (Required) Name of the VTEX account. Used as part of the URL |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand |
