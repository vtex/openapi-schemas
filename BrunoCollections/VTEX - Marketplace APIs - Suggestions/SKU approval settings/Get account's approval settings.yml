info:
  name: Get account's approval settings
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/suggestions/configuration"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: accountName
      value: apiexamples
      type: path

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/suggestions/configuration - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/suggestions/configuration - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/suggestions/configuration - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/suggestions/configuration - Schema is valid", function () {
          const schema = {"type":"object","properties":{"Score":{"type":"object","description":"Matcher scores for approving and rejecting SKUs received from sellers."},"Matchers":{"type":"array","description":"All Matchers configured on the marketplace, and their respective details.","items":{"type":"object","description":"Details of a single matcher configured in the marketplace.","properties":{"MatcherId":{"type":"string","description":"Identifies the matching entity, either VTEX's matcher or an external matcher."},"hook-base-address":{"type":"string","description":"The base address for the Matcher's API endpoint."},"IsActive":{"type":"boolean","description":"Indicates whether the matcher is active (`true`) or inactive (`false`)."},"UpdatesNotificationEndpoint":{"type":"string","description":"Endpoint for receiving notifications about updates from the matcher."},"Description":{"type":"string","description":"Description or notes about the matcher."}}}},"Rules":{"type":"object","description":"Items and products."},"SpecificationsMapping":{"type":"array","description":"Mapping of product and SKU specifications between the marketplace and the seller.","items":{"type":"object","description":"Mapping details for a single specification.","properties":{"fieldName":{"type":"string","description":"Name of the specification field in the seller's catalog."},"marketplaceField":{"type":"string","description":"Corresponding name of the specification field in the marketplace's catalog."}}}},"MatchFlux":{"type":"string","description":"This field determines the type of approval configuration applied to SKUs received from a seller."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This endpoint retrieves the current approval settings of a marketplace's Received SKUs module. Its response includes: 

  - `Score`: Matcher scores for approving and rejecting SKUs received from sellers. 

  - `Matchers`: All Matchers configured on the marketplace, and their respective details. 

  - `SpecificationsMapping`: Mapping of product and SKU specifications, per seller. 

  - `MatchFlux`: This field determines the type of approval configuration applied to SKUs received from a seller. 

  The possible values include: 

  -`default`, where the Matcher reviews the SKU, and approves it based on its score. 

  -`manual`, for manual approvals through the Received SKU UI, or Match API. 

  -`autoApprove`, for every SKU received from a given seller to be approved automatically, regardless of their Matcher Score.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | ---------- | ------------ | ------------ |
  | Channels | UI resources | **Save suggestion rules** |
  | Suggestion| Suggestion resources | **Main access** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | (Required) Name of the VTEX account that belongs to the marketplace. All data extracted, and changes added will be posted into this account. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand |

  ## Example response (`200`)

  ```json
  {
    "Score": {
      "Approve": 80,
      "Reject": 30
    },
    "Matchers": [
      {
        "MatcherId": "vtex-matcher",
        "hook-base-address": "http://portal.vtexinternal.com/api/ssm/hooks",
        "IsActive": true,
        "UpdatesNotificationEndpoint": "https://example.com/updates/notifications",
        "Description": "This matcher is configured to handle specific product categories and has been optimized for high accuracy."
      }
    ],
    "Rules": {
      "Item": [],
      "Product": []
    },
    "SpecificationsMapping": [],
    "MatchFlux": "Default"
  }
  ```
