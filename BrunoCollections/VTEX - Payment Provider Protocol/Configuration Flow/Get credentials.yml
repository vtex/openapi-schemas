info:
  name: Get credentials
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/authorization/credentials?applicationId=vtex&authorizationCode={{authorizationCode}}"
  headers:
    - name: X-PROVIDER-API-AppKey
      value: "{{X-PROVIDER-API-AppKey}}"
    - name: X-PROVIDER-API-AppToken
      value: "{{X-PROVIDER-API-AppToken}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: applicationId
      value: vtex
      type: query
    - name: authorizationCode
      value: "{{authorizationCode}}"
      type: query
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/authorization/credentials - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/authorization/credentials - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/authorization/credentials - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/authorization/credentials - Schema is valid", function () {
          const schema = {"required":["applicationId","appKey","appToken"],"type":"object","description":"Get credentials response body information.","properties":{"applicationId":{"type":"string","description":"The same `applicationId` sent in the request."},"appKey":{"type":"string","description":"The value we will send in the header `X-VTEX-API-AppKey` for the payment flow."},"appToken":{"type":"string","description":"The value we will send in the header `X-VTEX-API-AppToken` for the payment flow."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the merchant credentials (applicationId, appKey and appToken) registered with the payment provider. These credentials will be saved in the VTEX system and activated when the retailer decides to enable the connector.

   For more information about the Payment Provider Protocol (PPP) merchant authentication procedure, visit [Configuration Flow](https://developers.vtex.com/docs/guides/payments-integration-implementing-a-payment-provider#configuration-flow).

  > ℹ️ This request is made from VTEX to the payment provider.

  ## Permissions

  Check with your service provider to know what permissions are needed.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `applicationId` | query | (Required) VTEX application identifier. |
  | `authorizationCode` | query | (Required) Code generate by affiliation that will be used to identify the merchant authorization. |
  | `X-PROVIDER-API-AppKey` | header | (Required) Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX). To use this header as authorization, check that the `usesProviderHeadersName` field is set to `true` in the payment provider's `configuration.json`. To check the `configuration.json` file, access the route {{connector}}/paymentProvider/configuration.json. |
  | `X-PROVIDER-API-AppToken` | header | (Required) Unique token created by the provider and configured on the provider configuration page (Admin VTEX). To use this header as authorization, check that the `usesProviderHeadersName` field is set to `true` in the payment provider's `configuration.json`. To check the `configuration.json` file, access the route {{connector}}/paymentProvider/configuration.json |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "applicationId": "vtex",
    "appKey": "c5a5e3f1-4a77-4a00-8b53-0d1adb3e9628",
    "appToken": "57ea254d-f3d3-488d-88d7-129766037ed1"
  }
  ```
