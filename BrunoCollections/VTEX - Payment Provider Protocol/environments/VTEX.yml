name: VTEX
variables:
  - name: providerApiEndpoint
    value: "{providerApiEndpoint}"
  - name: baseUrl
    value: https://{{providerApiEndpoint}}
  - name: originalRequestBody
    value: ""
  - secret: true
    name: X-PROVIDER-API-AppKey
  - secret: true
    name: X-PROVIDER-API-AppToken
  - secret: true
    name: apiKey
  - secret: true
    name: authorizationCode
  - secret: true
    name: token
