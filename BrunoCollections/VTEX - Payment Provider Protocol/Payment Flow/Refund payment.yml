        test("[POST]::/payments/:paymentId/refunds - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/payments/:paymentId/refunds - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/payments/:paymentId/refunds - Schema is valid", function () {
          const schema = {"required":["paymentId","refundId","value","code","message","requestId"],"type":"object","description":"Refund payment response body information.","properties":{"paymentId":{"type":"string","description":"The same `paymentId` sent in the request."},"refundId":{"type":"string","description":"Provider's refund identifier. If the operation has failed you **MUST** return `null`."},"value":{"type":"number","description":"The amount that was refunded. If the operation has failed you **MUST** return `0`."},"code":{"type":["string","null"],"description":"Provider's operation/error code to be logged. Return `refund-manually` if you do not support this operation, so we can send a notification to the merchant."},"message":{"type":"string","description":"Provider's operation/error message to be logged."},"requestId":{"type":"string","description":"The same `requestId` sent in the request."},"connectorMetadata":{"type":"array","description":"Array containing metadata fields sent from the provider to the payment gateway.","items":{"type":"object","description":"Metadata fields information.","required":["name","value"],"properties":{"name":{"type":"string","description":"The name of the metadata to be stored in the gateway (limited to 20 characters)."},"value":{"type":"string","description":"The value of the metadata stored (limited to 200 characters)."}}}}}};
