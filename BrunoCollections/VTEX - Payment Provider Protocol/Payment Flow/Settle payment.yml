runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/payments/:paymentId/settlements - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/payments/:paymentId/settlements - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/payments/:paymentId/settlements - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/payments/:paymentId/settlements - Schema is valid", function () {
          const schema = {"required":["paymentId","settleId","value","code","message","requestId"],"type":"object","description":"Settle payment response body information.","properties":{"paymentId":{"type":"string","description":"The same `paymentId` sent in the request."},"settleId":{"type":"string","description":"VTEX identifier for this settlement."},"value":{"type":"number","description":"The amount to be settled."},"code":{"type":["string","null"],"description":"Provider's operation/error code to be logged."},"message":{"type":"string","description":"Provider's operation/error message to be logged."},"requestId":{"type":"string","description":"The same `requestId` sent in the request."},"connectorMetadata":{"type":"array","description":"Array containing metadata fields sent from the provider to the payment gateway.","items":{"type":"object","description":"Metadata fields information.","required":["name","value"],"properties":{"name":{"type":"string","description":"The name of the metadata to be stored in the gateway (limited to 20 characters)."},"value":{"type":"string","description":"The value of the metadata stored (limited to 200 characters)."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
