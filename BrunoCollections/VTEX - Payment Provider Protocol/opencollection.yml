info:
  name: VTEX - Payment Provider Protocol

docs:
  content: |-
    >ℹ️ The Payment Provider Protocol is a set of definitions to help you integrate your payment processing API into the VTEX platform, including sub-acquirers, acquirers, gateways, and custom payment services. 

    To achieve this, you must implement a web API (REST) following the specifications described in this documentation.

    To learn more about the Payment Provider Protocol, check our [Help Center article](https://help.vtex.com/en/tutorial/payment-provider-protocol--RdsT2spdq80MMwwOeEq0m).

    ## Endpoint requirements

      * Must use a standard subdomain/domain name, not an IP address.
      * Must be served over HTTPS on port 443 with TLS 1.2 support.
      * Must respond in less than 5 seconds when running the tests.
      * Must respond in less than 20 seconds when in production.
      * Must be [PCI-DSS compliant](https://developers.vtex.com/docs/guides/payments-integration-pci-dss-compliance) or use [Secure Proxy](https://developers.vtex.com/docs/guides/payments-integration-secure-proxy) to accept branded cards like Visa, Mastercard, Amex, etc.

    ## Testing

    You can perform tests on your payment provider using our [VTEX - Payment Provider Test Suite](https://apps.vtex.com/vtex-payment-provider-test-suite/p).

    >ℹ An extra header `X-VTEX-API-Is-TestSuite` = `true` will be sent for every test suite request, to help you easily identify it and mock any required scenarios.

    For more details about testing a Payment Provider, check our [Payment Provider Homologation](https://developers.vtex.com/docs/guides/payments-integration-payment-provider-homologation) article.

    ## Common parameters in the documentation

    <table>
      <tr>
        <td><code>{{providerApiEndpoint}}</code></td>
        <td>Provider's endpoint for the implementation.</td>
      </tr>
      <tr>
        <td><code>{{X-PROVIDER-API-AppKey}}</code></td>
        <td>Unique identifier created by the provider and configured on the provider configuration page (Admin VTEX).</td>
      </tr>
      <tr>
        <td><code>{{X-PROVIDER-API-AppToken}}</code></td>
        <td>Unique token created by the provider and configured on the provider configuration page (Admin VTEX).</td>
      </tr>
    </table> 

    ## Payment Provider Protocol API Index

    ### Payment Flow

    - `GET` [List Payment Provider Manifest](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#get-/manifest)
    - `POST` [Create payment](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#post-/payments)
    - `POST` [Cancel payment](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#post-/payments/-paymentId-/cancellations)
    - `POST` [Settle payment](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#post-/payments/-paymentId-/settlements)
    - `POST` [Refund payment](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#post-/payments/-paymentId-/refunds)
    - `POST` [Inbound request (BETA)](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#post-/payments/-paymentId-/inbound/-action-)

    ### Configuration Flow

    - `POST` [Create authorization token](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#post-/authorization/token)
    - `GET` [Provider authentication](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#get-/authorization/redirect)
    - `GET` [Get credentials](https://developers.vtex.com/docs/api-reference/payment-provider-protocol#get-/authorization/credentials)
