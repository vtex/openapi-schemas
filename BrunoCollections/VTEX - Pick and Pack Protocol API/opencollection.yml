opencollection: 1.0.0

info:
  name: VTEX - Pick and Pack Protocol API

docs:
  content: |-
    The Pick and Pack Protocol API facilitates integration between the [Pick and Pack](https://help.vtex.com/en/tutorial/vtex-pick-and-pack--1OOops3WrUyz7e0bnhkfXU) app and delivery services. This API streamlines the process of managing orders, updating shipping statuses, and handling various service-related tasks. 

    >ℹ️ Blank fields are included as `null` instead of being omitted.
    ## Authentication
    - [`POST` Create an access token](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#post-/token)

    ## Service integration
    -  [`POST` Create a service](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#post-/)

    ## Shipping updates
    -  [`GET` Get a service](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#get-/carrierId/serviceId)
    -  [`PATCH` Update service](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#patch-/carrierId/serviceId)
    -  [`POST` Create notes](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#post-/notes/carrierId/serviceId)
    -  [`POST` Create evidence](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#post-/evidences/carrierId/serviceId)
    -  [`POST` Create labels](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#post-/labels/carrierId/serviceId)
    -  [`POST` Cancel service](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#post-/cancel/carrierId/serviceId)
    -  [`POST` Create on hold service](https://developers.vtex.com/docs/api-reference/pick-and-pack-protocol-api#post-/on-hold/carrierId/serviceId)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
