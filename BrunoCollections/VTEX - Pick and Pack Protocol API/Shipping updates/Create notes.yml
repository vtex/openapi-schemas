info:
  name: Create notes
  type: http
  seq: 3

http:
  method: POST
  url: https://api.pickingnpacking.com/:environment/v1/tracking/hook/notes/:carrierId/:serviceId
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{token}"
  params:
    - name: carrierId
      value: MTEyMjMtQWZ0ZXJTaGlwLWRldmVsb3BtZW50
      type: path
    - name: serviceId
      value: 78c83922-d658-48bf-89d5-0658a6a94e27
      type: path
    - name: environment
      value: DefaultParameterValue
      type: path
  body:
    type: json
    data: |-
      [
        {
          "type": "ERROR",
          "note": "The package takes time to be shipped",
          "author": "Oscar Rojas"
        },
        {
          "type": "COMMENT",
          "note": "The package was picked up",
          "author": "Oscar Rojas"
        }
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Allows carriers to add notes and information on existing services.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `carrierId` | path | (Required) Carrier ID. |
  | `serviceId` | path | (Required) Service ID. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Authorization` | header | (Required) Authentication JWT. |

  ## Example response (`200`)

  ```json
  {
    "message": "Notes saved successfully",
    "data": [
      {
        "type": "ERROR",
        "note": "The package takes time to be shipped",
        "author": "Oscar Rojas"
      },
      {
        "type": "COMMENT",
        "note": "The package was picked up",
        "author": "Oscar Rojas"
      }
    ]
  }
  ```
