info:
  name: Create label
  type: http
  seq: 5

http:
  method: POST
  url: https://api.pickingnpacking.com/:environment/v1/tracking/hook/labels/:carrierId/:serviceId
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{token}"
  params:
    - name: carrierId
      value: MTEyMjMtQWZ0ZXJTaGlwLWRldmVsb3BtZW50
      type: path
    - name: serviceId
      value: 78c83922-d658-48bf-89d5-0658a6a94e27
      type: path
    - name: environment
      value: DefaultParameterValue
      type: path
  body:
    type: json
    data: |-
      {
        "id": "JADF8ADF89-7AD7AF-78ADFASDF",
        "url": "http://s3://mybucket-alpha/orc/2013-10-04-custdata/label-pickup.pdf",
        "name": "Delivery label",
        "type": "PDF"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Allows the carrier to create and add a shipping label to an order. 

  It is important that the tag ID is a unique value, if this value is repeated it will throw an exception. 

  > ⚠️ If the label is type `BASE64` or `TXT`, the max size that allowed is 180kb. 

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `carrierId` | path | (Required) Carrier ID. |
  | `serviceId` | path | (Required) Service ID. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Authorization` | header | (Required) Authentication JWT. |

  ## Example response (`200`)

  ```json
  {
    "message": "Label saved successfully",
    "data": {
      "id": "JADF8ADF89-7AD7AF-78ADFASDF",
      "url": "http://s3://mybucket-alpha/orc/2013-10-04-custdata/label-pickup.pdf",
      "name": "Delivery label",
      "type": "PDF"
    }
  }
  ```
