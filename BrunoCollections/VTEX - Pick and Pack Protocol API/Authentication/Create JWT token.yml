info:
  name: Create JWT token
  type: http
  seq: 1

http:
  method: POST
  url: https://auth.pickingnpacking.com/:environment/token
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: environment
      value: DefaultParameterValue
      type: path
  body:
    type: json
    data: |-
      {
        "apiKey": "{pnpApiKey}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a `JWT` (JSON Web Token) necessary to access the Pick and Pack Protocol API information.

  >ℹ️ To generate the `JWT` it is necessary to have the `API KEY` previously generated by the Pick and Pack team.

  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | Server to access the authentication necessary to make a request in the Pick and Pack Protocol API. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  "{token}"
  ```
