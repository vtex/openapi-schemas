info:
  name: Retrieve customer's subscriptions
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/subscriptions?customerId=user@vtex.com.br"
  params:
    - name: customerId
      value: user@vtex.com.br
      type: query
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/subscriptions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves details of a given customer's subscriptions, searching by that customer's `customerId`.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `customerId` | query | (Required) Customer ID. |
