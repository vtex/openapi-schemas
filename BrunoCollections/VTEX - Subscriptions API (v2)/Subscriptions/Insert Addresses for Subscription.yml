info:
  name: Insert Addresses for Subscription
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/subscriptions/:subscriptionId/addresses"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: subscriptionId
      value: "1"
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      [
        {
          "addressId": "1234567890",
          "street": "Avenida do Estado",
          "number": "1",
          "complement": null,
          "neighborhood": "Barra da Tijuca",
          "city": "Rio de Janeiro",
          "state": "RJ",
          "country": "BRA",
          "postalCode": "22204-004",
          "reference": null,
          "formattedAddress": null,
          "additionalComponents": null,
          "geoCoordinate": null,
          "receiverName": "Fulano",
          "addressType": "residential",
          "addressName": "xt5353818181nhshs"
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/subscriptions/:subscriptionId/addresses - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Inserts address's information to complement the Subscription details.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `subscriptionId` | path | (Required) Subscription ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
