info:
  name: Get frequency options by subscriptionId
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/subscriptions/:subscriptionId/frequency-options"
  params:
    - name: subscriptionId
      value: "1"
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/subscriptions/:subscriptionId/frequency-options - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists frequency options for the Subscription, filtering by `subscriptionId`.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `subscriptionId` | path | (Required) Subscription ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
