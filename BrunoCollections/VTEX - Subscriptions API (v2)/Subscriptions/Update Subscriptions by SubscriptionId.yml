runtime:
  scripts:
    - type: tests
      code: |-
        test("[PATCH]::/subscriptions/:subscriptionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Update, add or alter information of a given Subscription, filtering by `subscriptionId`.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `subscriptionId` | path | (Required) Subscription ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
