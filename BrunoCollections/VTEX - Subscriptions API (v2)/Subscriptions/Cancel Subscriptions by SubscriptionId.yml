info:
  name: Cancel Subscriptions by SubscriptionId
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/subscriptions/:subscriptionId/cancel"
  params:
    - name: subscriptionId
      value: "1"
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[PATCH]::/subscriptions/:subscriptionId/cancel - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cancels all Subscriptions of a subscription group. This operation does not have a rollback. Once canceled, it cannot be reactivated.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `subscriptionId` | path | (Required) Subscription ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
