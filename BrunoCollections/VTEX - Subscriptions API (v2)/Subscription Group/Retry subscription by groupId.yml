info:
  name: Retry subscription by groupId
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/subscriptions-group/:groupid/instances/:instanceId/retry"
  params:
    - name: groupid
      value: "1"
      type: path
    - name: instanceId
      value: cillum
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/subscriptions-group/:groupid/instances/:instanceId/retry - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Permits the retry of a Subscription group, via API, filtering by groupId and instanceId.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `groupid` | path | (Required) Group ID. |
  | `instanceId` | path | (Required) Instance ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
