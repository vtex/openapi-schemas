info:
  name: Insert Addresses by groupId
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/subscriptions-group/:groupId/addresses"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: groupId
      value: "1"
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      {
        "addressId": "string",
        "street": "string",
        "number": "string",
        "complement": "string",
        "neighborhood": "string",
        "city": "string",
        "state": "string",
        "country": "string",
        "postalCode": "string",
        "reference": "string",
        "formattedAddress": "string",
        "additionalComponents": [
          {
            "longName": "string",
            "shortName": "string",
            "types": [
              "string"
            ]
          }
        ],
        "geoCoordinate": [
          0
        ],
        "receiverName": "string",
        "addressType": "string",
        "addressName": "string"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/subscriptions-group/:groupId/addresses - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Insert address information of a given Subscription group, filtering by groupId.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `groupId` | path | (Required) Group ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
