info:
  name: Get Subscription by groupId
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/subscriptions-group/:groupId"
  params:
    - name: groupId
      value: "1"
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/subscriptions-group/:groupId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists Subscription details, filtering by `groupId`.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `groupId` | path | (Required) Group ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
