info:
  name: Get Next purchase
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/subscriptions-group/nextPurchase/:dateStr"
  params:
    - name: dateStr
      value: cillum
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/subscriptions-group/nextPurchase/:dateStr - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists details of a given subscription group's next purchase, filtering by dateStr.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `dateStr` | path | (Required) Reference date that retrieves all next purchases, starting from the dateStr inserted. Must be in the format of {{yyyyMMdd}} |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
