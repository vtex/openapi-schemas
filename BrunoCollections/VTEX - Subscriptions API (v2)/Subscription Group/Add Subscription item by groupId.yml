info:
  name: Add Subscription item by groupId
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/subscriptions-group/:groupId/additem"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: groupId
      value: "1"
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  body:
    type: json
    data: |-
      {
        "sku": {
          "id": "string",
          "name": "string",
          "productName": "string",
          "imageUrl": "string",
          "detailUrl": "string",
          "nameComplete": "string"
        },
        "quantity": 0,
        "priceAtSubscriptionDate": 0,
        "sellingPrice": 0,
        "endpoint": "string"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/subscriptions-group/:groupId/additem - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Adds an SKU to a given Subscription, filtering by groupId.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `groupId` | path | (Required) Group ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
