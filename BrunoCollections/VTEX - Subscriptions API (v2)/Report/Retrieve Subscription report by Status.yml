info:
  name: Retrieve Subscription report by Status
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/report/subscriptionsByStatus?requesterEmail=user@vtex.com.br&status=1"
  params:
    - name: requesterEmail
      value: user@vtex.com.br
      type: query
    - name: status
      value: "1"
      type: query
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/report/subscriptionsByStatus - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves Subscriptions' reports, filtering by status. The report will be sent by email, to the address inserted in the API's path.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `requesterEmail` | query | (Required) Email that the report will be sent to |
  | `status` | query | (Required) Binary OR of the following status: 1 - ACTIVE; 2 - PAUSED; 4 - CANCELED; 8 - EXPIRED |
