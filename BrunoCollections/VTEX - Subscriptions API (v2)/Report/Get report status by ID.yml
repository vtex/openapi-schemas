info:
  name: Get report status by ID
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/report/reportStatus/:reportId"
  params:
    - name: reportId
      value: cillum
      type: path
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/report/reportStatus/:reportId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the Subscription's report status, filtering by its reportId.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `reportId` | path | (Required) Report ID. |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
