info:
  name: Retrieve Subscription report by order date
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/report/subscriptionsOrderByDate?requesterEmail=user@vtex.com.br&beginDate=20190101&endDate=20190701"
  params:
    - name: requesterEmail
      value: user@vtex.com.br
      type: query
    - name: beginDate
      value: "20190101"
      type: query
    - name: endDate
      value: "20190701"
      type: query
    - name: accountName
      value: "{{accountName}}"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/report/subscriptionsOrderByDate - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a report regarding the Subscriptions created during the date interval of orders.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | Name of the VTEX account. Used as part of the URL |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `requesterEmail` | query | (Required) Email that the report will be sent to |
  | `beginDate` | query | (Required) begin date of report interval, use format yyyyMMdd |
  | `endDate` | query | (Required) end date of report interval, use format yyyyMMdd |
