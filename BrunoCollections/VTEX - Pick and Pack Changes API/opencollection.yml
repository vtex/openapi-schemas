opencollection: 1.0.0

info:
  name: VTEX - Pick and Pack Changes API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Pick and Pack Order Changes API manages order modifications in a Pick an Pack order. This API supports actions like updating deadlines, adding items, modifying quantities, rejecting or replacing items, and updating item details.

    >ℹ️ This API is currently in beta and subject to changes. Use with caution in production environments.

    ## Index

    - `PUT` [Update order deadline](https://developers.vtex.com/docs/api-reference/pick-and-pack-order-changes-api#put-/orders/-orderId-/deadline?endpoint=put-/orders/-orderId-/deadline)
    - `POST`[Update items of the order](https://developers.vtex.com/docs/api-reference/pick-and-pack-order-changes-api#post-/order/changes?endpoint=post/order/changes)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
