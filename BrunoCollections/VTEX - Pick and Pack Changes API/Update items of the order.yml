info:
  name: Update items of the order
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/order/changes"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "ADD_ITEM",
        "orderId": "1481110515526-01",
        "itemId": "49",
        "quantity": 2,
        "warehouseId": "9029",
        "price": 500000,
        "sellingPrice": 200000,
        "note": "TEST from VTEX PROXY 3",
        "pickingOptions": {
          "onNotFound": "REPLACE",
          "alternateOptions": [
            "74"
          ]
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/order/changes - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/order/changes - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/order/changes - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/order/changes - Schema is valid", function () {
          const schema = {"required":["type","orderId","itemId","quantity","warehouseId","price","sellingPrice","note","pickingOptions"],"type":"object","properties":{"type":{"type":"string","description":"Action type (`ADD_ITEM`)."},"orderId":{"type":"string","description":"Unique identifier of the order."},"itemId":{"type":"string","description":"Unique identifier of the item."},"quantity":{"type":"integer","description":"Quantity of items to add."},"warehouseId":{"type":"string","description":"Unique identifier of the warehouse."},"price":{"type":"integer","description":"Price of the item."},"sellingPrice":{"type":"integer","description":"Selling price of the item."},"note":{"type":"string","description":"Note to add to the item."},"pickingOptions":{"required":["onNotFound","alternateOptions"],"type":"object","description":"Items picking options.","properties":{"onNotFound":{"type":"string","description":"List of alternate options."},"alternateOptions":{"type":"array","items":{"type":"string","description":"ID of alternative items."},"description":"List of IDs of alternative items."}}}},"example":{"type":"ADD_ITEM","orderId":"1481110515526-01","itemId":"49","quantity":2,"warehouseId":"9029","price":500000,"sellingPrice":200000,"note":"TEST from VTEX PROXY 3","pickingOptions":{"onNotFound":"REPLACE","alternateOptions":["74"]}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Modifies an order by adding, updating, or removing items. The endpoint supports actions like adding items, modifying quantities, rejecting or replacing items, and updating item details, adding notes and suggest product replacements.

  >ℹ️ This endpoint is currently in beta and subject to changes. Use with caution in production environments.

  >⚠️ Before using this endpoint, you must make a request with the [Cart simulation](https://developers.vtex.com/docs/api-reference/checkout-api#post-/api/checkout/pub/orderForms/simulation) endpoint to check inventory availability. For more information of how to simulate a cart, check the [Simulate a shopping cart](https://developers.vtex.com/docs/guides/simulate-a-shopping-cart) guide.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | OMS | OMS access | **View order** |
  | OMS | OMS access | **Only show orders created by the user (via call center)** |
  | Catalog | Telesales | **Assisted Sales** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "message": "Error requesting picking action"
  }
  ```
