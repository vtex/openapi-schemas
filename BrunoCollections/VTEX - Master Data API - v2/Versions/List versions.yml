info:
  name: List versions
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/dataentities/:dataEntityName/documents/:id/versions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: load
      value: "true"
      type: query
      disabled: true
    - name: fields
      value: id,dataEntityId,isNewsletterOptIn,createdBy
      type: query
      disabled: true
    - name: dataEntityName
      value: Newsletter
      type: path
    - name: id
      value: b818cbda-e489-11e6-94f4-0ac138d2d42e
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/dataentities/:dataEntityName/documents/:id/versions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/dataentities/:dataEntityName/documents/:id/versions - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/dataentities/:dataEntityName/documents/:id/versions - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/dataentities/:dataEntityName/documents/:id/versions - Schema is valid", function () {
          const schema = {"type":"array","items":{"title":"Listversion","required":["id","date"],"type":"object","description":"Version information.","properties":{"id":{"type":"string","description":"Version ID."},"date":{"type":"string","description":"Date when the version was created in ISO 8601 format."},"document":{"type":"object","description":"Information about the document.","properties":{"id":{"type":"string","description":"Document ID."},"dataEntityId":{"type":"string","description":"Data entity name."},"isNewsletterOptIn":{"type":["boolean","null"],"description":"Indicates whether client otped to receive the store newsletter (`true`) or not (`false`)."},"createdBy":{"type":"string","description":"ID of the user who created the document."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists the versions of a document. 

  >ℹ Master Data documents are versioned. This means that, for each change, a new version is generated. 

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Dynamic Storage | Dynamic storage generic resources | **Read only documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Insert or update document (not remove)** |
  | Dynamic Storage | Dynamic storage generic resources | **Full access to all documents** |
  | Dynamic Storage | Dynamic storage generic resources | **Master Data administrator** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `dataEntityName` | path | (Required) Name of the data entity. |
  | `id` | path | (Required) ID of the Document. |
  | `load` | query | If true, return all the fields in each version of the document. |
  | `fields` | query | If `load` is true, the response will return only these specific fields. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "id": "_EAR0cJ7XB5k5grnmm0zeKGlVvVM9WCPy_",
      "date": "2016-10-18T16:53:32+00:00",
      "document": {
        "id": "72e7f8dd-1168-23ec-82ac-0e2b61663eb4",
        "dataEntityId": "Newsletter",
        "isNewsletterOptIn": true,
        "createdBy": "81fc8b10-25b7-48de-b425-7b93554002cc"
      }
    },
    {
      "id": "_E5SH9WXVvhPBNnbQtYAAGqrIysIeNYhV_",
      "date": "2016-09-08T20:11:42+00:00",
      "document": {
        "id": "72e7f8dd-1168-23ec-82ac-0e2b61663eb4",
        "dataEntityId": "Newsletter",
        "isNewsletterOptIn": true,
        "createdBy": "81fc8b10-25b7-48de-b425-7b93554002cc"
      }
    }
  ]
  ```
