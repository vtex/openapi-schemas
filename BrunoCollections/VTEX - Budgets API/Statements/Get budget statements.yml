info:
  name: Get budget statements
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/budgets/:contextType/:contextId/:budgetId/statements"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: pageSize
      value: "20"
      type: query
      disabled: true
    - name: contextType
      value: UNIT
      type: path
    - name: contextId
      value: 093f29ac-7a1b-4d6b-a79a-48f89cf73d14
      type: path
    - name: budgetId
      value: 019833db-27ad-7264-b104-dfed7c0fcbac
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/statements - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/statements - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/statements - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/statements - Schema is valid", function () {
          const schema = {"type":"object","properties":{"pagination":{"type":"object","description":"Pagination information.","properties":{"current":{"type":"integer","description":"Current page number."},"pages":{"type":"integer","description":"Total number of pages available."},"results":{"type":"integer","description":"Total number of results across all pages."}}},"transactions":{"type":"array","description":"List of transaction entries.","items":{"type":"object","description":"Transaction entry.","properties":{"id":{"type":"string","description":"Identifier of the transaction."},"budgetId":{"type":"string","description":"Identifier of the budget."},"allocationId":{"type":"string","description":"Identifier of the associated allocation."},"type":{"type":"string","enum":["DEBIT","CREDIT"],"description":"Type of transaction (`DEBIT`, meaning a regular transaction or `CREDIT` indicating a refund)."},"amount":{"type":"number","description":"Amount involved in the transaction."},"date":{"type":"string","format":"date-time","description":"ISO timestamp when the transaction occurred (format: YYYY-MM-DDThh:mm:ssZ)."},"contextType":{"type":"string","description":"Defines the context type associated with the budget which must be `UNIT` in B2B context."},"contextId":{"type":"string","description":"Identifier of the context type."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the list of transactions (statement) for a specific budget within the VTEX Budgets API.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | B2B | Budget | **ViewBudget** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `contextType` | path | (Required) Type of context for the budget (e.g., `UNIT`). This field can't be updated, it is used for validation. You must send the original value. |
  | `contextId` | path | (Required) Identifier of the corresponding Unit. This field can't be updated, it is used for validation. You must send the original value. |
  | `budgetId` | path | (Required) Identifier of the budget. |
  | `page` | query | Page number of the results. |
  | `pageSize` | query | Number of items per page. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "pagination": {
      "current": 1,
      "pages": 1,
      "results": 1
    },
    "transactions": [
      {
        "id": "b0e55425-a981-4d00-b6a2-9c7294d3d2b3",
        "budgetId": "019833db-27ad-7264-b104-dfed7c0fcbac",
        "allocationId": "324b5750-c827-4a6b-a670-c9297c832f4e",
        "type": "DEBIT",
        "amount": 528,
        "date": "2025-05-17T07:01:44.0196090Z",
        "contextType": "UNIT",
        "contextId": "093f29ac-7a1b-4d6b-a79a-48f89cf73d14"
      }
    ]
  }
  ```
