        addFormats(ajv);

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/allocations - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/allocations - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/allocations - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/budgets/:contextType/:contextId/:budgetId/allocations - Schema is valid", function () {
          const schema = {"type":"object","properties":{"pagination":{"type":"object","description":"Pagination information.","properties":{"current":{"type":"integer","description":"Current page number."},"pages":{"type":"integer","description":"Total number of pages available."},"results":{"type":"integer","description":"Total number of results across all pages."}}},"items":{"type":"array","description":"List of budget allocations.","items":{"type":"object","description":"Allocation object.","properties":{"id":{"type":"string","description":"Identifier of the allocation."},"budgetId":{"type":"string","description":"Identifier of the budget to which the allocation belongs."},"linkedEntity":{"type":"object","description":"Linked entity information.","properties":{"id":{"type":"string","description":"Identifier of the entity linked to the allocation. If `type` is `User` or `Address`, this should be the identifier of the user or address, respectively. If `type` is an Accounting Field ([Custom Field](https://developers.vtex.com/docs/guides/custom-fields-integration)), this should be the **value** of that Accounting Field."},"type":{"type":"string","description":"Type of the linked entity. Currently, the accepted entity types are: `User`, `Address`, and Accounting Fields ([Custom Fields](https://developers.vtex.com/docs/guides/custom-fields-integration))."}}},"balance":{"type":"object","description":"Budget balance information.","properties":{"amount":{"type":"number","description":"Total amount allocated."},"balanceAdjustment":{"type":"number","description":"Total amount used."},"remaining":{"type":"number","description":"Current balance left for this allocation."}}},"status":{"type":"string","description":"Status of the allocation (e.g., `ACTIVE`, `INACTIVE` or `DELETE`).","enum":["ACTIVE","INACTIVE","DELETED"]},"contextType":{"type":"string","description":"Defines the context type associated with the budget which must be `UNIT` in B2B context."},"contextId":{"type":"string","description":"Identifier of the context type."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
