info:
  name: Query allocations
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/budgets/:contextType/:contextId/allocations/query"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: contextType
      value: UNIT
      type: path
    - name: contextId
      value: 093f29ac-7a1b-4d6b-a79a-48f89cf73d14
      type: path
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "id": "41b9ec1e-af0a-45f6-b3fb-351f700a63aa",
            "type": "CostCenter"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/budgets/:contextType/:contextId/allocations/query - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/budgets/:contextType/:contextId/allocations/query - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/budgets/:contextType/:contextId/allocations/query - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/budgets/:contextType/:contextId/allocations/query - Schema is valid", function () {
          const schema = {"type":"object","properties":{"items":{"type":"array","description":"List of matching allocation entries.","items":{"type":"object","description":"Allocation query result.","properties":{"budgetId":{"type":"string","description":"Identifier of the budget to which the allocation belongs."},"allocationId":{"type":"string","description":"Identifier of the specific allocation."},"linkedEntity":{"type":"object","description":"Linked entity object containing `id` and `type`.","properties":{"id":{"type":"string","description":"Identifier of the entity linked to the allocation. If `type` is `User` or `Address`, this should be the identifier of the user or address, respectively. If `type` is an Accounting Field ([Custom Field](https://developers.vtex.com/docs/guides/custom-fields-integration)), this should be the **value** of that Accounting Field."},"type":{"type":"string","description":"Type of the linked entity. Currently, the accepted entity types are: `User`, `Address`, and Accounting Fields ([Custom Fields](https://developers.vtex.com/docs/guides/custom-fields-integration))."}}},"budgetBalance":{"type":"object","description":"Budget balance information.","properties":{"amount":{"type":"number","description":"Total budget amount."},"balanceAdjustment":{"type":"number","description":"Total amount utilized from the budget."},"remaining":{"type":"number","description":"Remaining amount in the budget."}}},"cycleConfiguration":{"type":"object","description":"Configuration for budget cycle.","required":["startDate","autoResetOnPeriodEnd","carryOverBalance"],"properties":{"startDate":{"type":"string","format":"date-time","description":"Start date of the budget cycle (ISO format: YYYY-MM-DDThh:mm:ssZ)."},"endDate":{"type":"string","format":"date-time","description":"End date of the budget cycle (ISO format: YYYY-MM-DDThh:mm:ssZ)."},"autoResetOnPeriodEnd":{"type":"boolean","description":"Enable (`true`) or disable (`false`) the autoreset period."},"carryOverBalance":{"type":"boolean","description":"Defines wether to carry over balance (`true`) or not (`false`)."}}},"allocationBalance":{"type":"object","description":"Allocation balance information.","properties":{"amount":{"type":"number","description":"Total allocation amount."},"balanceAdjustment":{"type":"number","description":"Total amount utilized from the allocation."},"remaining":{"type":"number","description":"Remaining amount in the allocation."}}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Queries budget allocations by context and linked entities.

  >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | B2B | Budget | **ManageBudgets** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `contextType` | path | (Required) Type of context for the budget (e.g., `UNIT`). This field can't be updated, it is used for validation. You must send the original value. |
  | `contextId` | path | (Required) Identifier of the corresponding Unit. This field can't be updated, it is used for validation. You must send the original value. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "items": [
      {
        "budgetId": "0197c65f-a1d3-71e8-ab11-013cc2f7f023",
        "allocationId": "0197c65f-bfb3-7452-8ae2-edf9f83624ae",
        "linkedEntity": {
          "id": "41b9ec1e-af0a-45f6-b3fb-351f700a63aa",
          "type": "CostCenter"
        },
        "budgetBalance": {
          "amount": 1000,
          "balanceAdjustment": 0,
          "remaining": 1000
        },
        "cycleConfiguration": {
          "startDate": "2025-04-01T00:00:00.0000000Z",
          "endDate": "2025-04-08T00:00:00.0000000Z",
          "autoResetOnPeriodEnd": true,
          "carryOverBalance": true
        },
        "allocationBalance": {
          "amount": 13,
          "balanceAdjustment": 0,
          "remaining": 13
        }
      }
    ]
  }
  ```
