info:
  name: Get product search of suggestions
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/products/crossselling/suggestions/:productId"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: productId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/api/catalog_system/pub/products/crossselling/suggestions/:productId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves general information about other product suggestions related to the product.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Product's unique identifier |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
