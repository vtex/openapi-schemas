info:
  name: Get product search of show together
  type: http
  seq: 4

http:
  method: GET
  url: https://entelperu.{{environment}}.com.br/api/catalog_system/pub/products/crossselling/accessories/api/catalog_system/pub/products/crossselling/showtogether/:productId
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: productId
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves general information about the products that are show together with the product in question.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Product's unique identifier |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
