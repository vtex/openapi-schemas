opencollection: 1.0.0

info:
  name: VTEX - Search API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    >ℹ️ This reference documents the Legacy Search API. For how that search system works (result prioritization, indexing, ranking, and field weights), see [How does VTEX search work?](https://help.vtex.com/docs/tutorials/how-does-vtex-search-work).

    This API lets you search and sort products in the Catalog using Fulltext, Category and Brand search terms.

    Retrieve product data to create custom searches and product shelves.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
