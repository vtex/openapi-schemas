info:
  name: Search by store facets
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/facets/search/:term?map=c"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: map
      value: c
      type: query
    - name: term
      value: "2"
      type: path
  auth: inherit

