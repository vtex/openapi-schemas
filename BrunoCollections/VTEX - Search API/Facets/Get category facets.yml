info:
  name: Get category facets
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/facets/category/:categoryId"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: _from
      value: "1"
      type: query
      disabled: true
    - name: _to
      value: "50"
      type: query
      disabled: true
    - name: categoryId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pub/facets/category/:categoryId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pub/facets/category/:categoryId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pub/facets/category/:categoryId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pub/facets/category/:categoryId - Schema is valid", function () {
          const schema = {"type":"array","items":{"type":"object","description":"Object with name and ID of the category's facet.","required":["Name","Id"],"properties":{"Name":{"type":"string","description":"Category's facet name."},"Id":{"type":"integer","description":"Category's facet ID."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the names and IDs of the categories facets. 
  >⚠️ This endpoint returns a maximum of 50 items per response, so the difference between `_from` and `_to` should not exceed this number. The result order is descending, from the highest product ID to the lowest.

  ## Response body example:

  ```json
  [
  	[
      {
        "Name":"Tamanho Global",
        "Id":45
  		},
  		{
        "Name":"Percentuals",
        "Id":25
  		}
  	]
  ]
  ```

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `categoryId` | path | (Required) Category unique number identifier. |
  | `_from` | query | Starter page range. These parameters allow the API to be paginated. Take into account that the initial and final pages cannot have a separation superior to 50 pages. Thus, it will be displayed 50 items per page. |
  | `_to` | query | Finisher page range. These parameters allow the API to be paginated. Take into account that the initial and final pages cannot have a separation superior to 50 pages. Thus, it will be displayed 50 items per page. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |

  ## Example response (`200`)

  ```json
  [
    {
      "Name": "Tamanho Global",
      "Id": 45
    },
    {
      "Name": "Percentuals",
      "Id": 25
    }
  ]
  ```
