info:
  name: Search product by product URL
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/products/search/:product-text-link/p"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: product-text-link
      value: blue-shirt
      type: path
  auth: inherit

