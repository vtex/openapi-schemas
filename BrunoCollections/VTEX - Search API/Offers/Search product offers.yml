info:
  name: Search product offers
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog_system/pub/products/offers/:productId"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: productId
      value: "3"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog_system/pub/products/offers/:productId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog_system/pub/products/offers/:productId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog_system/pub/products/offers/:productId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog_system/pub/products/offers/:productId - Schema is valid", function () {
          const schema = {"type":"array","example":[{"SkuId":"5","EanId":"272727","RefId":"BIGHEROBML","Name":"Llf","NameComplete":"Cacilds Llf","IsActive":true,"MainImage":{"ImageId":"172754","ImageLabel":null,"ImageTag":"<img src=\"~/arquivos/ids/172754-#width#-#height#/Diablo.jpg\" width=\"#width#\" height=\"#height#\" alt=\"\" id=\"\" />","ImagePath":"~/arquivos/ids/172754-#width#-#height#/Diablo.jpg","IsMain":true,"IsZoomSize":false,"ImageText":null,"LastModified":"2021-03-24T15:37:24.877"},"Offers":[{"SellerId":"1","SellerSkuId":"5","OffersPerSalesChannel":[{"AvailableQuantity":0,"SaleChannel":1,"Price":200,"ListPrice":200,"PriceWithoutDiscount":200,"IsAvailable":false},{"AvailableQuantity":0,"SaleChannel":2,"Price":200,"ListPrice":200,"PriceWithoutDiscount":200,"IsAvailable":false}],"AvailableSalesChannels":null}],"LastModified":"2021-07-06T19:13:45.831483","ProductId":"3"}],"items":{"type":"object","required":["SkuId","EanId","RefId","Name","NameComplete","IsActive","MainImage","Offers","LastModified","ProductId"],"properties":{"SkuId":{"type":"string","description":"SKU ID."},"EanId":{"type":"string","description":"SKU unique identification code (barcode), accepts up to 13 numerical characters."},"RefId":{"type":"string","description":"Unique reference code used internally for organizational purposes."},"Name":{"type":"string","description":"SKU name."},"NameComplete":{"type":"string","description":"SKU complete name."},"IsActive":{"type":"boolean","description":"If the SKU is active or not."},"MainImage":{"type":"object","description":"General information of the main image of the SKU.","required":["ImageId","ImageLabel","ImageTag","ImagePath","IsMain","IsZoomSize","ImageText","LastModified"],"properties":{"ImageId":{"type":"string","description":"Unique identifier of the association of the Image to the SKU."},"ImageLabel":{"type":["string","null"],"description":"Image Label."},"ImageTag":{"type":"string","description":"Image HTML tag."},"ImagePath":{"type":"string","description":"Image file path."},"IsMain":{"type":"boolean","description":"If the image is the main image of the SKU or not."},"IsZoomSize":{"type":"boolean","description":"If the image has zoom applied."},"ImageText":{"type":["string","null"],"description":"General text of the image."},"LastModified":{"type":"string","description":"Time that the image was last modified."}}},"Offers":{"type":"array","description":"AKA Commertial Condition.","items":{"type":"object","required":["SellerId","SellerSkuId","OffersPerSalesChannel","AvailableSalesChannels"],"properties":{"SellerId":{"type":"string","description":"Seller ID."},"SellerSkuId":{"type":"string","description":"ID of the association of the SKU with the seller."},"OffersPerSalesChannel":{"type":"array","description":"Offers per trade policy.","items":{"type":"object","required":["AvailableQuantity","SaleChannel","Price","ListPrice","PriceWithoutDiscount","IsAvailable"],"properties":{"AvailableQuantity":{"type":"integer","description":"SKU available quantity."},"SaleChannel":{"type":"integer","description":"SKU trade policy."},"Price":{"type":"number","description":"SKU price."},"ListPrice":{"type":"number","description":"SKU list price."},"PriceWithoutDiscount":{"type":"number","description":"SKU precie without discount."},"IsAvailable":{"type":"boolean","description":"If the SKU is available or not."}}}},"AvailableSalesChannels":{"type":["string","null"],"description":"Trade policy that the SKU in contained."}}}},"LastModified":{"type":"string","description":"Time that the offer was last modified."},"ProductId":{"type":"string","description":"Product ID."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves existing offers of a specific product.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Product unique number identifier. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |

  ## Example response (`200`)

  ```json
  [
    {
      "SkuId": "5",
      "EanId": "272727",
      "RefId": "BIGHEROBML",
      "Name": "Llf",
      "NameComplete": "Cacilds Llf",
      "IsActive": true,
      "MainImage": {
        "ImageId": "172754",
        "ImageLabel": null,
        "ImageTag": "<img src=\"~/arquivos/ids/172754-#width#-#height#/Diablo.jpg\" width=\"#width#\" height=\"#height#\" alt=\"\" id=\"\" />",
        "ImagePath": "~/arquivos/ids/172754-#width#-#height#/Diablo.jpg",
        "IsMain": true,
        "IsZoomSize": false,
        "ImageText": null,
        "LastModified": "2021-03-24T15:37:24.877"
      },
      "Offers": [
        {
          "SellerId": "1",
          "SellerSkuId": "5",
          "OffersPerSalesChannel": [
            {
              "AvailableQuantity": 0,
              "SaleChannel": 1,
              "Price": 200,
              "ListPrice": 200,
              "PriceWithoutDiscount": 200,
              "IsAvailable": false
            },
            {
              "AvailableQuantity": 0,
              "SaleChannel": 2,
              "Price": 200,
              "ListPrice": 200,
              "PriceWithoutDiscount": 200,
              "IsAvailable": false
            }
          ],
          "AvailableSalesChannels": null
        }
      ],
      "LastModified": "2021-07-06T19:13:45.831483",
      "ProductId": "3"
    }
  ]
  ```
