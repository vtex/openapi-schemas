info:
  name: Get product by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalog-seller-portal/products/:productId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: productId
      value: "189371"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/catalog-seller-portal/products/:productId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/catalog-seller-portal/products/:productId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/catalog-seller-portal/products/:productId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/catalog-seller-portal/products/:productId - Schema is valid", function () {
          const schema = {"type":"object","required":["status","name","brandId","brandName","categoryIds","categoryNames","specs","attributes","slug","images","skus","origin","createdAt","updatedAt"],"properties":{"id":{"type":"string","description":"Product's unique identifier number."},"externalId":{"type":"string","description":"Product reference unique identifier number in the store."},"status":{"type":"string","description":"Status of the product. Its values can be `active` or `inactive`."},"name":{"type":"string","description":"Product name. Use simple words and avoid other languages or complex writing. This field is essential for SEO and must respect the 150 character limit."},"brandId":{"type":"string","description":"Product's brand unique identifier number."},"description":{"type":"string","description":"Description data for product."},"brandName":{"type":"string","description":"Name of the brand associated with the product."},"categoryIds":{"type":"array","description":"Product's categories unique identifier numbers. It can have multiples IDs for each category and subcategories.","items":{"type":"string","description":"Product's category unique identifier number."}},"categoryNames":{"type":"array","description":"Names of the product's categories, displayed in a path format.","items":{"type":"string","description":"Name of the product's category."}},"specs":{"type":"array","description":"Specifications that will differentiate the possible product SKUs.","items":{"type":"object","description":"SKU specifications.","required":["name","values"],"properties":{"name":{"type":"string","description":"Specification name."},"values":{"type":"array","description":"Specification values.","items":{"type":"string","description":"Specification value."}}}}},"attributes":{"type":"array","description":"Attributes of the product. Attributes are additional properties used to create site browsing filters.","items":{"type":"object","description":"Product attribute.","required":["name","value"],"properties":{"name":{"type":"string","description":"Attribute name."},"value":{"type":"string","description":"Attribute value."}}}},"slug":{"type":"string","description":"Reference of the product in the URL of the store."},"images":{"type":"array","description":"Information of the images of the product.","items":{"type":"object","description":"Information of the images of the product.","required":["id","url"],"properties":{"id":{"type":"string","description":"Image ID."},"url":{"type":"string","description":"Image URL, which must be in the following format: `https://{accountName}.vtexassets.com/assets/{path}`, saved using the [Catalog Images app](https://developers.vtex.com/vtex-developer-docs/docs/vtex-catalog-images)."},"alt":{"type":"string","description":"Image alternative description."}}}},"skus":{"type":"array","description":"SKUs of the product.","items":{"type":"object","description":"Informations about an SKU.","required":["id","isActive","weight","dimensions","specs","images"],"properties":{"id":{"type":"string","description":"SKU unique identifier number."},"externalId":{"type":"string","description":"Unique reference code created to improve the store's organization."},"ean":{"type":"string","description":"Unique SKU identification code (barcode), composed of up to 13 numeric characters."},"manufacturerCode":{"type":"string","description":"SKU reference code in the store."},"isActive":{"type":"boolean","description":"If the SKU is active (`true`) or inactive (`false`)."},"weight":{"type":"integer","description":"SKU weight. It can be lighter than 1000 g."},"dimensions":{"type":"object","description":"SKU dimensions.","required":["width","height","length"],"properties":{"width":{"type":"number","description":"SKU width."},"height":{"type":"number","description":"SKU height."},"length":{"type":"number","description":"SKU length."}}},"RealWeight":{"type":"number","description":"The product's real weight."},"RealDimensions":{"type":"object","description":"The product's real dimensions.","required":["width","height","length"],"properties":{"width":{"type":"number","description":"The product's real width."},"height":{"type":"number","description":"The product's real height."},"length":{"type":"number","description":"The product's real length."}}},"specs":{"type":["array","null"],"description":"SKU specifications. This field is mandatory, but nullable if there is only one SKU.","items":{"type":"object","description":"SKU specification.","required":["name","value"],"properties":{"name":{"type":"string","description":"SKU's specification name."},"value":{"type":"string","description":"SKU's specification values."}}}},"images":{"type":"array","description":"SKU's images IDs.","items":{"description":"SKU image ID.","type":"string"}}}}},"transportModal":{"type":["string","null"],"description":"Transport modal of the product."},"taxCode":{"type":["string","null"],"description":"Product tax code."},"origin":{"type":"string","description":"Origin account of the product. It is not possible to alter products where the origin is `marketplace`."},"createdAt":{"type":"string","description":"Date when the product was created."},"updatedAt":{"type":"string","description":"Last date when the product was updated."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >📘 This API is part of the [Seller Portal Catalog](https://help.vtex.com/en/tutorial/how-the-seller-portal-catalog-works--7pMB6YOt6YQDQQbzFB4Pxp). This functionality is in the beta stage and can be discontinued at any moment at VTEX's discretion. VTEX will not be responsible for any instabilities caused by its use or discontinuity. If you have any questions, please contact [our Support Center](https://support.vtex.com/hc/en-us/requests). 

   Retrieves general information about a product by its ID. The response also has information about the product's SKUs.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | CatalogV2 | Management | **Product Read** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `productId` | path | (Required) Product unique identifier number. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

