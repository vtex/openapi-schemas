info:
  name: Create category
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/catalog-seller-portal/category-tree/categories"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "parentId": "567",
        "Name": "Beauty"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/catalog-seller-portal/category-tree/categories - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/catalog-seller-portal/category-tree/categories - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/catalog-seller-portal/category-tree/categories - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/catalog-seller-portal/category-tree/categories - Schema is valid", function () {
          const schema = {"type":"object","required":["value","children"],"properties":{"value":{"type":"object","description":"Object with values of a category.","required":["id","name","isActive"],"properties":{"id":{"type":"string","description":"Category unique identifier number."},"name":{"type":"string","description":"Category name."},"isActive":{"type":"boolean","description":"The condition defines if the category is active (`true`) or inactive (`false`)."}}},"children":{"type":"array","description":"List of all children categories of the parent category.","items":{"type":"object","description":"Category information.","required":["value"],"properties":{"value":{"type":"object","description":"Object with values of a child category.","required":["id","name","isActive"],"properties":{"id":{"type":"string","description":"Child category unique identifier number."},"name":{"type":"string","description":"Child category name."},"isActive":{"type":"boolean","description":"The condition defines if the child category is active (`true`) or inactive (`false`)."}}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  >📘 This API is part of the [Seller Portal Catalog](https://help.vtex.com/en/tutorial/how-the-seller-portal-catalog-works--7pMB6YOt6YQDQQbzFB4Pxp). This functionality is in the Beta stage and can be discontinued at any moment at VTEX's discretion. VTEX will not be responsible for any instabilities caused by its use or discontinuity. If you have any questions, please contact [our Support Center](https://support.vtex.com/hc/en-us/requests). 

   Creates a new category.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | CatalogV2 | Management | **Category Write** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "value": {
      "id": "1",
      "name": "Beauty",
      "isActive": false
    },
    "children": [
      {
        "value": {
          "id": "2",
          "name": "Perfumes",
          "isActive": false
        }
      }
    ]
  }
  ```
