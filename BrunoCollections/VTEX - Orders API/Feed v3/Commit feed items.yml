info:
  name: Commit feed items
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/orders/feed"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "handles": [
          ""
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/api/orders/feed - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Commit items in the [feed](https://developers.vtex.com/docs/guides/orders-feed) queue.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
