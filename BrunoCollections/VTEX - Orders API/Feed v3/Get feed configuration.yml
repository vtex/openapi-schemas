info:
  name: Get feed configuration
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/orders/feed/config"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/orders/feed/config - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/orders/feed/config - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/orders/feed/config - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/orders/feed/config - Schema is valid", function () {
          const schema = {"type":"object","properties":{"filter":{"type":"object","description":"Information on how orders are filtered to show on the feed.","properties":{"type":{"type":"string","description":"Determines what orders appear in the feed and how they are filtered. If a feed has the `FromWorkflow` type configuration, it will receive order updates only when order's statuses change and orders can be filtered by status, using the `status` field. A feed with the `FromOrders` type configuration gets updates whenever any change is made to an order. in this case, orders can be filtered by any property, according to JSONata expressions set in the `expression` field."},"status":{"type":"array","description":"List of order statuses that should be included in the feed. This should only be used in case `type` is `FromWorkflow`.","items":{"type":"string","description":"Order status to be filtered in the feed."}},"expression":{"type":"string","description":"JSONata query expression that defines what conditions must be met for an order to be included in the feed. This should only be used in case `type` is `FromOrders`."},"disableSingleFire":{"type":"boolean","description":"Sets a limit to how many times a specific order shows on the feed, after it first meets filtering conditions. Using the `FromOrders` type configuration with JSONata filtering expressions might cause orders to appear more than once on a feed, whenever changes are made to that order. If this field is `false` orders will appear in the feed only once."}}},"queue":{"type":"object","description":"Information that define the functioning of the queue.","properties":{"visibilityTimeoutInSeconds":{"type":"integer","description":"Period of time for which an item is not visible in the feed after it has been retrieved with the Get feed items request. Measured in seconds."},"MessageRetentionPeriodInSeconds":{"type":"integer","description":"Maximum life span of an order update after it gets to the feed. When a feed item is on the feed for this period of time, it is removed from the feed. Measured in seconds. The maximum number accepted in this field is `1209600` seconds."}}},"quantity":{"type":"integer","description":"Current number of messages in the feed, including messages that may not be visible due to time out after retrieval."},"approximateAgeOfOldestMessageInSeconds":{"type":"number","description":"Aproximate age of the oldest message in the feed, measured in seconds."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The Orders Feed v3 is the best way to create order integrations. Below you can find details on the configuration API specification, and to know more see our [Feed v3 guide](https://developers.vtex.com/vtex-rest-api/docs/orders-feed) and our [order integration guide](https://developers.vtex.com/vtex-rest-api/docs/erp-integration-set-up-order-integration).

  > 📘 Onboarding guide 
  >
  > Check the new [Orders onboarding guide](https://developers.vtex.com/vtex-rest-api/docs/orders-overview). We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Orders and is organized by focusing on the developer's journey.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | OMS | OMS Access | **Feed v3 and Hook view only** |
  | OMS | OMS Access | **Feed v3 and Hook Admin** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "filter": {
      "type": "FromOrders",
      "expression": "status = \"payment-pending\"",
      "disableSingleFire": false
    },
    "queue": {
      "visibilityTimeoutInSeconds": 240,
      "messageRetentionPeriodInSeconds": 345600
    },
    "quantity": 127,
    "approximateAgeOfOldestMessageInSeconds": 78.91597222222222
  }
  ```
