info:
  name: Retrieve feed items
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/orders/feed?maxlot={{maxLot}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: maxlot
      value: "{{maxLot}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/orders/feed - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/orders/feed - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/orders/feed - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/orders/feed - Schema is valid", function () {
          const schema = {"type":"array","items":{"title":"Getfeedorderstatus","required":["eventId","handle","domain","state","lastState","orderId","lastChange","currentChange"],"type":"object","properties":{"eventId":{"type":"string"},"handle":{"type":"string"},"domain":{"type":"string"},"state":{"type":"string"},"lastState":{"type":"string"},"orderId":{"type":"string"},"lastChange":{"type":"string"},"currentChange":{"type":"string"}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieve items from [feed](https://developers.vtex.com/docs/guides/orders-feed) queue. 

  The event will be removed if the message `send retry` is equal to, or greater than the maximum retention period.

  > This API will return `404 Not Found` if there is no [Feed Configuration](https://developers.vtex.com/docs/guides/orders-feed) available for the given X-VTEX-API-AppKey.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `maxlot` | query | (Required) Lot quantity to retrieve. Maximum accepted value is 10. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

  ## Example response (`200`)

  ```json
  [
    {
      "eventId": "ED423DDED4C1AE580CADAC1A4D02DA3F",
      "handle": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..7RQBZQb6pHhFhA_jMKTiSoJbDck7awgD3Xx7sdJcW6w",
      "domain": "Fulfillment",
      "state": "ready-for-handling",
      "lastState": "window-to-cancel",
      "orderId": "953712004126-01",
      "lastChange": "2019-08-12T20:54:01.134057Z",
      "currentChange": "2019-08-12T20:54:23.7153839Z"
    }
  ]
  ```
