info:
  name: Create order modifications
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/order-system/orders/:changeOrderId/changes?accountName=storeName"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: accountName
      value: storeName
      type: query
    - name: changeOrderId
      value: v12772213qst-02
      type: path
  body:
    type: json
    data: |-
      {
        "reason": "The client wants to change a weighable product.",
        "replace": [
          {
            "from": {
              "items": [
                {
                  "id": "1",
                  "quantity": 1,
                  "uniqueId": "1D6A12BD177140B2BAF0C042D2FAEE54",
                  "price": 2499
                }
              ],
              "customData": {
                "customFields": [
                  {
                    "linkedEntity": {
                      "type": "item",
                      "id": "B2949D0A45244825B177D2F9F96DC711"
                    },
                    "fields": [
                      {
                        "name": "desktop",
                        "value": "DSK-OLD"
                      }
                    ]
                  }
                ]
              }
            },
            "to": {
              "items": [
                {
                  "id": "2",
                  "quantity": 1,
                  "uniqueId": "1D6A12BD177140B2BAF0C042D2FAEE54",
                  "measurementUnit": "kg",
                  "unitMultiplier": 3,
                  "manualDiscountValue": 0,
                  "manualIncrementValue": 0,
                  "clientProfileData": [
                    {
                      "firstName": "Jane",
                      "lastName": "Earhart",
                      "documentType": "cpf",
                      "document": "123456789",
                      "phone": "55110988887777",
                      "corporateName": null,
                      "tradeName": null,
                      "corporateDocument": null,
                      "stateInscription": null,
                      "corporatePhone": null,
                      "isCorporate": false
                    }
                  ]
                }
              ],
              "customData": {
                "customFields": [
                  {
                    "linkedEntity": {
                      "type": "item",
                      "id": "B2949D0A45244825B133D2F9F96DC713"
                    },
                    "fields": [
                      {
                        "name": "desktop",
                        "value": "DSK-NEW"
                      }
                    ]
                  }
                ]
              },
              "shippingData": {
                "logisticsInfo": [
                  {
                    "itemIndex": 0,
                    "selectedSla": "Normal",
                    "selectedDeliveryChannel": "delivery",
                    "addressId": "9ec276fd3a604eb1aa151b5333ca5db6",
                    "price": 1000
                  }
                ]
              }
            }
          }
        ],
        "settings": {
          "paymentConfiguration": {
            "customPaymentSystemsAllowed": [
              "201"
            ]
          },
          "rolloutConfiguration": {
            "enableApi": true,
            "enableAdminOrders": {
              "enabledWorkspaces": [
                "*"
              ]
            },
            "enableMyOrders": {
              "enabledWorkspaces": [
                "storename"
              ]
            }
          },
          "pipelineConfiguration": {
            "enableTaxHubRecalculation": false,
            "compensateShippingChanges": true,
            "enablePromotionRecalculation": true,
            "enableNativeTaxRecalculation": true
          }
        }
      }
  auth: inherit

