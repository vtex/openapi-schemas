info:
  name: Get order modifications history
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/order-system/orders/:changeOrderId/changes?an=storeName"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: an
      value: storeName
      type: query
    - name: changeOrderId
      value: v12772213qst-02
      type: path
  auth: inherit

