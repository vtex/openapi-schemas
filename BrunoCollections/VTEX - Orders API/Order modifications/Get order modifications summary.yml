docs: |-
  This endpoint retrieves a summary of modifications of every successful [Create order modifications request](https://developers.vtex.com/docs/api-reference/orders-api#patch-/api/order-system/orders/-changeOrderId-/changes) made to an order and provides an overview of each request.
   > ⚠️ If you want information about all the modifications made to an order, use the [Get order modifications history endpoint](https://developers.vtex.com/docs/api-reference/orders-api#get-/api/order-system/orders/-changeOrderId-/changes).
  ## Permissions
  Any user or API key must have the appropriate License Manager resource to successfully run this request:
  | Product | Category | Resource |
  |---------|----------|----------|
  | OMS | OMS access | **OMS Viewer** |
  You can create a custom role with this resource or use one of the following predefined roles:
  - **OMS - Full access** (OMS Viewer)
  - **Checkout Admin** (OMS Viewer)
  - **IntegrationProfile - Fulfillment Oms** (OMS Viewer)
  For more information about security, see [Best practices for using application keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `orderId` | path | (Required) Order ID. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

