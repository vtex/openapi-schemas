info:
  name: Create or update hook configuration
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/orders/hook/config"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "filter": {
          "type": "FromOrders",
          "expression": "value > 100",
          "disableSingleFire": false
        },
        "hook": {
          "url": "https://endpoint.example/path",
          "headers": {
            "key": "value"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/orders/hook/config - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/orders/hook/config - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/orders/hook/config - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/orders/hook/config - Schema is valid", function () {
          const schema = {"title":"HookConfiguration","required":["Domain","OrderId","State","LastState","LastChange","CurrentChange","Origin"],"type":"object","properties":{"Domain":{"type":"string"},"OrderId":{"type":"string"},"State":{"type":"string"},"LastState":{"type":"string"},"LastChange":{"type":"string"},"CurrentChange":{"type":"string"},"Origin":{"title":"Origin2","required":["Account","Key"],"type":"object","properties":{"Account":{"type":"string"},"Key":{"type":"string"}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Configures filtering rules applied to orders hook. Learn more with the [orders hook guide](https://developers.vtex.com/vtex-rest-api/docs/orders-feed#hook).


  There are two types of filtering that can be used: 


   - `FromWorkflow`: filters orders by status.


   - `FromOrders`: uses JSONata expressions to filter orders according to any property in the orders JSON document.


   This enables stores to filter delivered orders and orders in which products have been added or removed, for example.


  To learn more, access the [JSONata documentation](https://docs.jsonata.org/overview.html) and test filtering JSONata expressions with our [expressions API](https://developers.vtex.com/docs/api-reference/orders-api#post-/api/orders/expressions/jsonata).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "Domain": "Fulfillment",
    "OrderId": "v52277740atmc-01",
    "State": "ready-for-handling",
    "LastState": "window-to-cancel",
    "LastChange": "2019-08-14T17:11:39.2550122Z",
    "CurrentChange": "2019-08-14T17:12:48.0965893Z",
    "Origin": {
      "Account": "automacaoqa",
      "Key": "vtexappkey-appvtex"
    }
  }
  ```
