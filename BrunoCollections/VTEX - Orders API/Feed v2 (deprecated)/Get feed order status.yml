info:
  name: Get feed order status
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/oms/pvt/feed/orders/status?maxLot={{maxLot}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: maxLot
      value: "{{maxLot}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/api/oms/pvt/feed/orders/status - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Get feed order status (deprecated)

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `maxLot` | query | (Required) Maximum lot. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
