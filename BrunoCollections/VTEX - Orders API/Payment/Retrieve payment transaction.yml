info:
  name: Retrieve payment transaction
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/oms/pvt/orders/:orderId/payment-transaction"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: orderId
      value: 1172452900788-01
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/oms/pvt/orders/:orderId/payment-transaction - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/oms/pvt/orders/:orderId/payment-transaction - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/oms/pvt/orders/:orderId/payment-transaction - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/oms/pvt/orders/:orderId/payment-transaction - Schema is valid", function () {
          const schema = {"required":["status","isActive","transactionId","merchantName","payments"],"type":"object","properties":{"status":{"type":"string","description":"Transaction status."},"isActive":{"type":"boolean","description":"If it is an active transaction (`true`) or not (`false`)."},"transactionId":{"type":"string","description":"Transaction ID."},"merchantName":{"type":"string","description":"Transaction merchant's name."},"payments":{"type":"array","items":{"title":"Payment1","required":["id","paymentSystem","paymentSystemName","value","installments","referenceValue","cardHolder","cardNumber","firstDigits","lastDigits","cvv2","expireMonth","expireYear","url","giftCardId","giftCardName","giftCardCaption","redemptionCode","group","tid","dueDate","connectorResponses"],"type":"object","properties":{"id":{"type":"string","description":"Payment ID."},"paymentSystem":{"type":"string","description":"Payment system ID."},"paymentSystemName":{"type":"string","description":"Payment system name."},"value":{"type":"integer","description":"Payment value."},"installments":{"type":"integer","description":"Payment Installments quantity."},"referenceValue":{"type":"integer","description":"Payment reference Value."},"cardHolder":{"type":["string","null"],"description":"Payment card holder."},"cardNumber":{"type":["string","null"],"description":"Payment card number."},"firstDigits":{"type":"string","description":"Payment card first digits."},"lastDigits":{"type":"string","description":"Payment card last digits."},"cvv2":{"type":["string","null"],"description":"Card Verification Value (CVV2) is a security code used by payment processors to reduce fraudulent credit and debit card transactions."},"expireMonth":{"type":["string","null"],"description":"Payment card expire month."},"expireYear":{"type":["string","null"],"description":"Payment card expire year."},"url":{"type":["string","null"],"description":"Payment URL."},"giftCardId":{"type":["string","null"],"description":"Gift Card ID."},"giftCardName":{"type":["string","null"],"description":"Gift Card name."},"giftCardCaption":{"type":["string","null"],"description":"Gift Card caption."},"redemptionCode":{"type":["string","null"],"description":"Code for the customer to use the Gift Card."},"group":{"type":"string","description":"It represents the payment method. For each method, it can have the following values: \n\r\n- **Credit card:** `creditCard` \r\n\r\n- **Debid card:** `debitCard`\r\n\r\n- **Bank invoice:** `bankInvoice`\r\n\r\n- **Promissory:** `promissory` \r\n\r\n- **Gift card:** `giftCard` \n\r\n- **Pix:** `instantPayment`."},"tid":{"type":"string","description":"Payment transaction ID."},"dueDate":{"type":["string","null"],"description":"Payment due date."},"connectorResponses":{"title":"ConnectorResponses","required":["Tid","ReturnCode","Message","authId"],"type":"object","properties":{"Tid":{"type":"string","description":"Connector transaction ID."},"ReturnCode":{"type":["string","null"],"description":"Connector return code."},"Message":{"type":["string","null"],"description":"Information about the connector's responses."},"authId":{"type":"string","description":"Connector authorization ID."}}}}},"description":"Payments' details object."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves transaction details by order ID. All events in the transaction will be registered in this call's response body. 

  In scenarios of [order changes](https://developers.vtex.com/vtex-rest-api/reference/registerchange), it is possible to insert a [Partial invoice](https://help.vtex.com/en/tracks/orders--2xkTisx4SXOWXQel8Jg8sa/q9GPspTb9cHlMeAZfdEUe). The total value of the order will be updated after the insertion of the invoice, even when there is a [Partial invoice](https://help.vtex.com/en/tracks/orders--2xkTisx4SXOWXQel8Jg8sa/q9GPspTb9cHlMeAZfdEUe) scenario. The updated value is settled by VTEX's Payment Gateway. The reimbursement for the shopper is automatic. 

  >⚠️ At this time, this route does not support Fulfillment payment queries, only Marketplace orders. 

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | OMS | OMS access | **View order** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | View order | View order |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users or API keys usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm). To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `orderId` | path | (Required) Order ID is a unique code that identifies an order. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "status": "Finished",
    "isActive": true,
    "transactionId": "CB452D77E7D04099A4DB0479087B1D2C",
    "merchantName": "LUXSTORE",
    "payments": [
      {
        "id": "721CBE1090324D12ABE301FE33DE775A",
        "paymentSystem": "4",
        "paymentSystemName": "Mastercard",
        "value": 10150,
        "installments": 1,
        "referenceValue": 10150,
        "cardHolder": null,
        "cardNumber": null,
        "firstDigits": "412341",
        "lastDigits": "4123",
        "url": null,
        "giftCardId": null,
        "giftCardName": null,
        "cvv2": null,
        "expireMonth": null,
        "expireYear": null,
        "giftCardCaption": null,
        "redemptionCode": null,
        "group": "creditCard",
        "tid": "101770752",
        "dueDate": null,
        "connectorResponses": {
          "Tid": "101770752",
          "ReturnCode": "200",
          "Message": "logMessage",
          "authId": "170852"
        }
      }
    ]
  }
  ```
