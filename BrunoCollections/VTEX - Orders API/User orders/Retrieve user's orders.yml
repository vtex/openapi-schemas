info:
  name: Retrieve user's orders
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/oms/user/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: clientEmail
      value: customer@mail.com
      type: query
      disabled: true
    - name: page
      value: "15"
      type: query
      disabled: true
    - name: per_page
      value: "15"
      type: query
      disabled: true
    - name: text
      value: PO24893
      type: query
      disabled: true
    - name: status
      value: ready-for-handling
      type: query
      disabled: true
    - name: creation_date
      value: "[2025-01-01T02:00:00.000Z TO 2025-04-08T23:59:59.999Z]"
      type: query
      disabled: true
    - name: purchase_agent_id
      value: 848a994a-1b6b-4dbd-5555-0455af24e0f2
      type: query
      disabled: true
    - name: my_pending_approvals
      value: "false"
      type: query
      disabled: true
  auth: inherit

