tion":"Order [status](https://help.vtex.com/en/tutorial/order-flow-and-status--tutorials_196)."},"statusDescription":{"type":"string","description":"Status description which is displayed on the Admin panel. This field is deprecated and may not return any value."},"marketPlaceOrderId":{"type":["string","null"],"description":"Marketplace order ID."},"sequence":{"type":"string","description":"Six-digit string that follows the order ID. For example, in order `1268540501456-01 (501456)`, the sequence is `501456`."},"salesChannel":{"type":"string","description":"Sales channel (or [trade policy](https://help.vtex.com/tutorial/how-trade-policies-work--6Xef8PZiFm40kg2STrMkMV)) ID related to the order."},"affiliateId":{"type":"string","description":"Corresponds to the three-digits [affiliate](https://help.vtex.com/en/tutorial/configuring-affiliates--tutorials_187) identification code of the seller responsible for the order."},"origin":{"type":"string","description":"Order's [origin in the order flow](https://developers.vtex.com/docs/guides/orders-overview#understanding-order-flow-types), which can be `Marketplace`, `Fulfillment` or `Chain`."},"workflowInErrorState":{"type":"boolean","description":"If there is a work flow error (`true`) or not (`false`)."},"workflowInRetry":{"type":"boolean","description":"If the order is in a work flow retry (`true`) or not (`false`)."},"lastMessageUnread":{"type":["string","null"],"description":"Last sent transactional message."},"ShippingEstimatedDate":{"type":["string","null"],"description":"Estimate shipping date."},"ShippingEstimatedDateMax":{"type":["string","null"],"description":"The most extended shipping estimation possible."},"ShippingEstimatedDateMin":{"type":["string","null"],"description":"The least extended shipping estimation possible."},"orderIsComplete":{"type":"boolean","description":"If it is a completed order (`true`) or not (`false`). For more information, see [Order flow and status](https://help.vtex.com/en/tutorial/orde