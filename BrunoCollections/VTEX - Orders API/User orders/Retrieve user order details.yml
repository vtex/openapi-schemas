info:
  name: Retrieve user order details
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/oms/user/orders/:orderId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: clientEmail
      value: customer@mail.com
      type: query
      disabled: true
    - name: text
      value: Rio de Janeiro
      type: query
      disabled: true
    - name: status
      value: ready-for-handling
      type: query
      disabled: true
    - name: creation_date
      value: "[2025-01-01T02:00:00.000Z TO 2025-04-08T23:59:59.999Z]"
      type: query
      disabled: true
    - name: purchase_agent_id
      value: 848a994a-1b6b-4dbd-5555-0455af24e0f2
      type: query
      disabled: true
    - name: my_pending_approvals
      value: "false"
      type: query
      disabled: true
    - name: orderId
      value: 1172452900788-01
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/oms/user/orders/:orderId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/oms/user/orders/:orderId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

