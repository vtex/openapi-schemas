info:
  name: Get information about account
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/vlm/account"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
