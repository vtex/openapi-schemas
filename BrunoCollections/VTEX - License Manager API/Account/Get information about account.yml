null"]},"postalCode":{"description":"Zip code of the person assigned as main contact of the store.","type":["string","null"]},"state":{"description":"State or province of the person assigned as main contact of the store.","type":["string","null"]},"telephone":{"description":"Telephone number of the person assigned as main contact of the store.","type":"string"},"tradingName":{"description":"Trading name.","type":"string"},"licenses":{"description":"Licenses of the account.","type":"array","items":{"description":"Object representing licenses.","type":"object","properties":{"expiration":{"type":["string","null"],"format":"date-time","description":"Expiration date."},"id":{"description":"ID of the category of the license.","type":"number"},"isPurchased":{"description":"Defines if the license is purchased (`true`) or not (`false`).","type":"boolean"},"products":{"description":"Array of products.","type":"array","items":{"description":"Object representing products of licenses.","type":"object","properties":{"id":{"description":"ID of the product.","type":"number"},"name":{"description":"Name of the product.","type":"string"},"domains":{"description":"List of domains of the product.","type":"array","items":{"type":"string","description":"Domain of the product."}},"endpoints":{"type":"object","description":"Endpoints.","properties":{"webApiUrl":{"type":["string","null"],"description":"Web API URL."},"consoleUrl":{"type":["string","null"],"description":"Console URL."}}}}}},"name":{"description":"Name of the category of the license.","type":"string"}}}},"sponsor":{"description":"Object with information about the sponsor user.","type":"object","properties":{"name":{"description":"Name of the sponsor user.","type":"string"},"email":{"description":"Email of the sponsor user.","type":"string"},"phone":{"description":"Phone of the sponsor user.","type":"string"}}},"contact":{"type":"object","description":"Information about the person assigned as main contact of the store.","properties":{"name":{"description":"Name of the person assigned as main contact of the store.","type":"string"},"email":{"description":"Email of the person assigned as main contact of the store.","type":"string"},"phone":{"description":"Telephone number of the person assigned as main contact of the store.","type":"string"}}},"operationDate":{"description":"Date when the account went into production.","type":["string","null"],"format":"date-time"},"inactivationDate":{"description":"Date when the account was deactivated.","type":["string","null"],"format":"date-time"},"creationDate":{"description":"Date when the account was created.","type":"string","format":"date-time"},"hosts":{"description":"Hosts of all stores.","type":"array","items":{"type":"string","description":"Host address."}},"sites":{"description":"Array of objects representing each store.","type":"array","items":{"description":"Object containing complete information from a store.","type":"object","properties":{"id":{"description":"ID of the store.","type":"number"},"name":{"description":"Store name.","type":"string"},"tradingName":{"description":"Trading name of the store.","type":"string"},"LV":{"type":["string","null"],"description":"Level."},"logo":{"type":["string","null"],"description":"Logo."},"monetaryUnitId":{"type":"number","description":"Monetary unit ID."},"domains":{"type":["array","null"],"description":"List of domains.","items":{"type":"string","description":"Domain."}},"hosts":{"description":"Hosts associated to the store.","type":"array","items":{"type":"string","description":"Host address."}},"aliases":{"type":"array","description":"Aliases.","items":{"type":"string","description":"Alias."}}}}},"appKey":{"description":"Deprecated. Check the `appKeys` object for all API keys.","type":"object","properties":{"token":{"type":["string","null"],"description":"Token."},"name":{"type":["string","null"],"description":"Token name."}}},"appKeys":{"description":"Array of application keys.","type":"array",