        test("[GET]::/api/license-manager/site/pvt/logins/list/paged - Schema is valid", function () {
          const schema = {"description":"Response body for listing all users.","type":"object","properties":{"items":{"description":"Array of user objects.","type":"array","items":{"description":"Object with information about an user.","type":"object","properties":{"id":{"description":"ID of the user.","type":"string"},"email":{"description":"Email of the user.","type":"string"},"isAdmin":{"description":"Defines if the user has administrative access (`true`) or not (`false`).","type":"boolean"},"isReliable":{"description":"For internal use only.","type":"boolean"},"isBlocked":{"description":"Defines if the user is blocked (`true`) or not (`false`).","type":"boolean"},"roles":{"type":"array","description":"Array of user roles. This field is deprecated and should always be empty.","items":{"type":"string","description":"Role ID."}},"accountNames":{"type":"array","description":"Array of account names.","items":{"type":"string","description":"Account names."}},"name":{"description":"Name of the user.","type":"string"}}}},"paging":{"description":"Paging object.","required":["page","perPage","total","pages"],"type":"object","properties":{"page":{"description":"Current page number.","type":"integer"},"perPage":{"description":"Items per page.","type":"integer"},"total":{"description":"Total of items.","type":"integer"},"pages":{"description":"Total of pages.","type":"integer"}}}}};
