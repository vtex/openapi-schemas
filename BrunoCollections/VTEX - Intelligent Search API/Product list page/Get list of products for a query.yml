info:
  name: Get list of products for a query
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/product_search/:facets"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: query
      value: shirt
      type: query
      disabled: true
    - name: count
      value: "24"
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: sort
      value: ""
      type: query
      disabled: true
    - name: locale
      value: en-US
      type: query
      disabled: true
    - name: hideUnavailableItems
      value: "false"
      type: query
      disabled: true
    - name: simulationBehavior
      value: default
      type: query
      disabled: true
    - name: showSponsored
      value: "false"
      type: query
      disabled: true
    - name: sponsoredCount
      value: "5"
      type: query
      disabled: true
    - name: advertisementPlacement
      value: top_search
      type: query
      disabled: true
    - name: repeatSponsoredProducts
      value: "true"
      type: query
      disabled: true
    - name: facets
      value: category-1/clothing/category-2/shirt/category-3/man
      type: path

