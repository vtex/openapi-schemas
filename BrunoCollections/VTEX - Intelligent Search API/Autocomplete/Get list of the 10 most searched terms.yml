info:
  name: Get list of the 10 most searched terms
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/top_searches"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: locale
      value: en-US
      type: query
      disabled: true

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/top_searches - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/top_searches - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/top_searches - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/top_searches - Schema is valid", function () {
          const schema = {"type":"object","description":"Response body object.","properties":{"searches":{"type":"array","description":"List of the 10 most searched terms in the past 14 days.","minItems":10,"maxItems":10,"items":{"type":"object","description":"Term information.","properties":{"term":{"type":"string","description":"Search term."},"count":{"type":"number","description":"Number of times the term was searched."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists the 10 most searched terms in the past 14 days.

  For more information, check the Intelligent Search [Autocomplete](https://help.vtex.com/en/tracks/vtex-intelligent-search--19wrbB7nEQcmwzDPl1l4Cb/4gXFsEWjF7QF7UtI2GAvhL) guide.

  >ℹ️ Migrate to [Intelligent Search API v1](https://developers.vtex.com/docs/api-reference/intelligent-search-api-v1) for HTTP caching, lower latency, and a simpler URL structure. The new endpoint is: `GET` [Get list of the 10 most searched terms](https://developers.vtex.com/docs/api-reference/intelligent-search-api-v1#get-/top-searches). See the [migration guide](https://developers.vtex.com/docs/guides/migrating-to-intelligent-search-api-v1).

  ## Permissions

  This endpoint does not require [authentication](https://developers.vtex.com/docs/guides/authentication) or [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `locale` | query | Indicates the target language as a BCP 47 language code. The Intelligent Search must have indexed the account in the target language. |

  ## Example response (`200`)

  ```json
  {
    "searches": [
      {
        "term": "home",
        "count": 14
      },
      {
        "term": "shirt",
        "count": 10
      },
      {
        "term": "top",
        "count": 9
      },
      {
        "term": "tops",
        "count": 6
      },
      {
        "term": "camera",
        "count": 5
      },
      {
        "term": "kit",
        "count": 5
      },
      {
        "term": "work shirt",
        "count": 2
      },
      {
        "term": "shirts",
        "count": 2
      },
      {
        "term": "clothing",
        "count": 2
      },
      {
        "term": "classic shoes",
        "count": 1
      }
    ]
  }
  ```
