info:
  name: VTEX - Intelligent Search API

docs:
  content: |-
    >ℹ️ **A new version of this API is available.** The [Intelligent Search API v1](https://developers.vtex.com/docs/api-reference/intelligent-search-api-v1) replaces this API. It adds HTTP caching (`Cache-Control: public, max-age=600`) for faster storefronts, lower latency, explicit regionalization without relying on the segment cookie, and a new `GET` [Get product](https://developers.vtex.com/docs/api-reference/intelligent-search-api-v1#get-/products) endpoint for product detail pages. All new headless integrations must use Intelligent Search API v1. The endpoints listed here will be deprecated in a future announcement. Each endpoint below includes a callout with the equivalent Intelligent Search API v1 route.

    >ℹ️ Onboarding guide
    >
    > Check the new [Search onboarding guide](https://developers.vtex.com/docs/guides/search-overview). We created this guide to improve the onboarding experience for developers at VTEX. It assembles all documentation on our Developer Portal about Search and is organized by focusing on the developer's journey.

    [VTEX Intelligent Search](https://help.vtex.com/en/tracks/vtex-intelligent-search--19wrbB7nEQcmwzDPl1l4Cb/3qgT47zY08biLP3d5os3DG) is a search solution for digital commerce that simply and intuitively displays relevant results based on the catalog from the user's first interaction with the store through the search bar, browsing categories, or even through the window displays.

     The tool also offers features such as autocomplete, displaying search and product suggestions based on the shopper's context, and filters that help when searching for the desired product.

     ## Common parameters 

    | **Parameter name** | **Description**   |
    | --------------- | ----------------- | 
    | `{{accountName}}` | Name of the VTEX account. Used as part of the URL. |  
    | ` {{environment}}` | Environment to use. Used as part of the URL. |
  type: text/markdown
