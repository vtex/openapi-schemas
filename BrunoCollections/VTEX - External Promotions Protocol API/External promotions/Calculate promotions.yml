          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Calculates the promotions and discounts applicable to a given shopping cart. VTEX calls this endpoint during the cart calculation process, sending the shopping cart data including items, coupon codes, UTM parameters, and sales channel information. The external promotions provider must return the calculated discounts for each item, along with a summary of all promotions considered.

  This endpoint supports **hybrid** orchestration (protocol v1.1). When an account combines native VTEX promotions with an external provider, VTEX sends the cart **after** native evaluation: see `items[].price` (post-native per-unit price) and the optional per-line `items[].nativePromotionLayer`. The provider may also return `allPromotions[].qualificationProgress` describing promotions the shopper has **not yet unlocked**.

  In hybrid mode, the provider can optionally return `nativePromotionRemovals` to ask VTEX to drop specific applied native promotions (by the ids exposed in `items[].nativePromotionLayer.appliedPromotions[].id`) from the merged result — either cart-wide or for selected lines — instead of only stacking discounts on top of them. Absent or empty `nativePromotionRemovals` is a no-op.

  ## How VTEX derives the discount

  This is the single most important rule of the response contract:

  - The money VTEX applies comes **only** from `items[].promotions[].discount`, multiplied by `items[].quantity`.
  - A promotion produces a discount **only** if its `id` is also listed in `allPromotions`. VTEX builds the result by iterating `allPromotions` and matching each entry against `items[].promotions`.
  - `originalPrice`, `discountedPrice` and `externalPromotionLayer` are **informational**. They are used for tracing and diagnostics and never produce a discount on their own. Returning `externalPromotionLayer` without the matching `items[].promotions` entries results in **no discount being applied at all**.

  ## Response requirements

  VTEX validates the body before merging it and discards the **entire** response when it is malformed. Specifically:

  - `items` must be present and must not contain `null` entries.
  - If any `items[].promotions` is present and non-empty, then `allPromotions` must also be present and non-empty. Item-level promotions without a catalog are rejected.
  - Every `allPromotions[].id` and every `items[].promotions[].id` must be a non-empty string.
  - Every `items[].id` must match an item id sent in the request.
  - Quantity fields under `qualificationProgress` must be whole numbers. A fractional value fails deserialization and discards the response.

  An applied promotion id that is not listed in `allPromotions` is tolerated and does not fail the response, but no discount is produced for it.

  ## Authentication

  VTEX authenticates with an API key sent in a header whose name is configured per account and defaults to `Authorization`, optionally with a prefix such as `Bearer `. VTEX does not send HTTP Basic credentials, and it does not send an `Accept` header. The provider should reject unauthenticated requests with `401 Unauthorized`.

  ## Timeout

  The call times out after 5000 ms by default (configurable per account) and is **not** retried.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. VTEX always sends `application/json; charset=utf-8`. |

  ## Example response (`200`)

  ```json
  {
    "items": [
      {
        "id": "792",
        "quantity": 3,
        "promotions": [
          {
            "id": "promo-1",
            "discount": 0.25,
            "type": "Nominal"
          }
        ],
        "originalPrice": 2,
        "discountedPrice": 1.75,
        "externalPromotionLayer": {
          "priceBeforeLayer": 2,
          "priceAfterLayer": 1.75,
          "appliedPromotions": [
            {
              "id": "promo-1",
              "discount": 0.25,
              "type": "Nominal"
            }
          ]
        }
      }
    ],
    "allPromotions": [
      {
        "id": "promo-1",
        "name": "25 cents off on cokes",
        "description": "Buy at least 3 cokes and get 25 cents off on each",
        "couponCode": "25offCoke"
      },
      {
        "id": "promo-2",
        "name": "Free shipping over $50",
        "description": "Spend $50 or more to unlock free shipping",
        "couponCode": null,
        "qualificationProgress": {
          "remainingCartWideAmount": 44,
          "orderSubtotalMustExceed": 50,
          "teaserStyleHints": [
            "UpPrice"
          ]
        }
      }
    ]
  }
  ```
