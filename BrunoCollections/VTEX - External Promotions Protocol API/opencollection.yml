opencollection: 1.0.0

info:
  name: VTEX - External Promotions Protocol API

request:
  auth:
    type: apikey
    key: "{{apiKeyHeaderName}}"
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The External Promotions Protocol API is a set of definitions that allows merchants to integrate their own external promotions engine with the VTEX platform. This is a protocol, which means the merchant must implement the endpoints described in this documentation as a web API (REST) on their own infrastructure.

    ⚠️ In this release the protocol targets accounts using Headless Checkout. Store Framework checkout is out of scope and may adopt the same APIs later.

    VTEX will call these endpoints during the shopping cart calculation and order lifecycle to:

    - Calculate promotions and discounts for a given shopping cart.
    - Notify the external promotions provider when an order is created or cancelled, reporting which promotions and coupons were applied.

    ## Promotion sources

    Accounts configure promotions with one of these sources:

    - **Native** — VTEX promotions only (no external provider).
    - **Hybrid** — native VTEX promotions run first, then VTEX calls the external provider with the post-native cart so both engines can apply.

    There is no external-only source. When an account integrates an external promotions provider, it always uses the **hybrid** orchestration model.

    >⚠️ This feature is in a closed beta testing phase. If you are interested in participating, open a ticket with the [VTEX Support](https://help.vtex.com/en/support) team.

    ## Authentication

    VTEX authenticates to the provider with an API key sent in an HTTP request header. The header name is configured per account and defaults to `Authorization`; an optional prefix (for example `Bearer `) can be prepended to the key value. Because both the header name and the prefix are configurable, agree on them with VTEX during onboarding.

    VTEX does not send HTTP Basic credentials. The provider should reject unauthenticated requests with `401 Unauthorized`.

    In this collection, set the `apiKey` variable to your key and, if your account uses a header other than `Authorization`, adjust the `apiKeyHeaderName` variable.

    ## Request headers

    VTEX sends `Content-Type: application/json; charset=utf-8` on every call. VTEX does **not** send an `Accept` header, so the provider must not require one.

    ## Timeouts, retries and error handling

    | Endpoint | Timeout | Retries |
    | --- | --- | --- |
    | `calculatePromotion` | 5000 ms by default, configurable per account. | None. The call is issued once. |
    | `notifyUsage` | 5000 ms by default, configurable per account. | Up to 3 by default, with exponential backoff. |

    Because `notifyUsage` is retried, the provider may receive the same notification more than once and must process it idempotently, keyed by `orderId` and `type`.

    When a `calculatePromotion` call fails — timeout, non-2xx status, or a body VTEX cannot validate — the account's error treatment setting decides the outcome: `nativeOnly` keeps the native result and silently drops the external one, `acceptPartial` merges the fragments that validated, and `raiseError` surfaces an error to the caller. Providers should fail fast within the timeout rather than returning a partially built body.

    ## Index

    ### External promotions

    - `POST` [Calculate promotions](https://developers.vtex.com/docs/api-reference/external-promotions-protocol-api#post-/calculatePromotion): calculates the promotions and discounts for a given shopping cart.
    - `POST` [Notify promotion usage](https://developers.vtex.com/docs/api-reference/external-promotions-protocol-api#post-/notifyUsage): receives a notification when an order is created or cancelled, informing which promotions and coupons were applied.

    ## Common parameters

    | Parameter name | Description | Type |
    | --- | --- | --- |
    | `{{providerApiEndpoint}}` | External promotions provider endpoint URL. | Server variable. |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
