nt ID."},"parentAccountId":{"type":["string","null"],"description":"Retrieves the main account ID if the payment was made in a subaccount."},"referenceValue":{"type":["integer","null"],"format":"int64","description":"Payment reference value in cents."},"value":{"type":["integer","null"],"format":"int64","description":"Payment value in cents."},"installments":{"type":["integer","null"],"description":"Number of installments."},"url":{"type":["string","null"],"description":"Payment URL."},"cardNumber":{"type":["string","null"],"description":"Card number information."},"fields":{"type":["array","null"],"description":"Payment parameters names and values.","items":{"type":"object","description":"Information about a given payment parameter.","properties":{"name":{"type":["string","null"],"description":"Payment parameter name."},"value":{"type":["string","null"],"description":"Payment parameter value."}}}},"paymentSystemName":{"type":["string","null"],"description":"Payment system name."}}}},"transactions":{"type":["array","null"],"description":"Financial transactions information. This array returns empty in the simulation.","items":{"type":["object","null"],"description":"Financial transactions details.","properties":{"isActive":{"type":["boolean","null"],"description":"Defines if the subscription order payment is active (`true`) or inactive (`false`)."}}}}}},"country":{"type":["string","null"],"description":"Subscription order simulation three-digit country code in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format."},"postalCode":{"type":["string","null"],"description":"Subscription order simulation postal code."},"messages":{"type":["array","null"],"description":"Simulation messages information.","items":{"type":["object","null"],"description":"Simulation message details.","properties":{"code":{"type":["string","null"],"description":"Message code."},"status":{"type":["string","null"],"description":"Message status."},"text":{"type":["string","null"],"descripti