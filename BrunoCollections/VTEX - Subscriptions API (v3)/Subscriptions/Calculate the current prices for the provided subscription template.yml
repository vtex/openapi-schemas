info:
  name: Calculate the current prices for the provided subscription template
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/rns/pub/subscriptions/simulate"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "customerEmail": "customer@email.com",
        "items": [
          {
            "skuId": "12",
            "quantity": 5,
            "manualPrice": 400
          },
          {
            "skuId": "12",
            "quantity": 5,
            "manualPrice": 400
          }
        ],
        "plan": {
          "id": "subscription.clothes",
          "frequency": {
            "interval": 3,
            "periodicity": "MONTHLY"
          },
          "validity": {
            "begin": "2024-08-21T00:00:00Z",
            "end": "2025-08-21T00:00:00Z"
          },
          "purchaseDay": "3"
        },
        "purchaseSettings": {
          "paymentMethod": {
            "paymentSystem": "4",
            "paymentAccountId": "340357032569595",
            "installments": 3,
            "paymentSystemName": "creditCard",
            "paymentSystemGroup": "creditCard"
          },
          "salesChannel": "1",
          "currencyCode": "BRL",
          "selectedSla": "Normal",
          "seller": "1"
        },
        "shippingAddress": {
          "addressId": "5028945524109",
          "addressType": "residential"
        },
        "title": "fashionBasic",
        "status": "ACTIVE",
        "nextPurchaseDate": "2024-09-21T00:00:00Z",
        "catalogAttachment": "vtex.subscription.tshirt-collection"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
