info:
  name: Update subscription by ID
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/rns/pub/subscriptions/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: 1E7886FC8E45FF38C527897D749584F4
      type: path
  body:
    type: json
    data: |-
      {
        "customerEmail": "customer@email.com",
        "title": "catFood",
        "status": "ACTIVE",
        "nextPurchaseDate": "2024-09-21T00:00:00Z",
        "isSkipped": false,
        "plan": {
          "id": "subscription.clothes",
          "frequency": {
            "interval": 3,
            "periodicity": "MONTHLY"
          },
          "validity": {
            "begin": "2024-08-21T00:00:00Z",
            "end": "2025-08-21T00:00:00Z"
          },
          "purchaseDay": "3"
        },
        "shippingAddress": {
          "addressId": "5028945524109",
          "addressType": "residential"
        },
        "purchaseSettings": {
          "paymentMethod": {
            "paymentSystem": "4",
            "paymentAccountId": "340357032569595",
            "installments": 3,
