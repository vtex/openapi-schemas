docs: |-
  Lists subscriptions from your store. If you wish, you can use query parameters. By default, this request returns the query parameter `page` value `1`, and `size` value `15`.

  >⚠️ The status code response `200 OK` is limited to 15 results. You can get different values by combining pagination query parameters.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `customerEmail` | query | Email of a customer that subscrived to your store. |
  | `status` | query | Subscription status. The acceptable values are: - ACTIVE - PAUSED - CANCELED - EXPIRED - MISSING |
  | `addressId` | query | Subscription shipping address ID. |
  | `paymentId` | query | [Payment method](https://help.vtex.com/en/tutorial/difference-between-payment-methods-and-payment-conditions--3azJenhGFyUy2gsocms42Q) ID. It corresponds to the `paymentAccountId` field. |
  | `planId` | query | [Subscription plan](https://help.vtex.com/en/tutorial/subscription-plans-beta--5kczKRqHEsrs1tYtRcY8wR) ID. |
  | `nextPurchaseDate` | query | Subscription next purchase date in the format `YYYY-MM-DD`. |
  | `originalOrderId` | query | Order ID of when the customer subscribed. |
  | `page` | query | Number of the starting page of the response. When no value is sent, it starts in page `1`. |
  | `size` | query | Determines the number of subscriptions in the response. The maximum is equal to the default value, which is `15`. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

