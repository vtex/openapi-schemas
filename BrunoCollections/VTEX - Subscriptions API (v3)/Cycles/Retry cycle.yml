info:
  name: Retry cycle
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/rns/pub/cycles/:cycleId/retry"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: cycleId
      value: occaecat Lorem officia ut ullamco
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("[POST]::/api/rns/pub/cycles/:cycleId/retry - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Every subscription order has an execution count called cycle, which determines the position of an order counting from when the shopper subscribed. This endpoint reruns a cycle that is currently in error state.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `cycleId` | path | (Required) ID from the subscription cycle that will be retried. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
