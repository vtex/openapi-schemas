opencollection: 1.0.0

info:
  name: VTEX - Legacy CMS Portal API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    [CMS (Content Management System)](https://help.vtex.com/en/tracks/cms--2YcpgIljVaLVQYMzxQbc3z/1oN446gRGcR2s70RvBCAmj) is a feature dedicated to manage content in a constant and practical manner. With the Legacy CMS Portal API, you will be able to update your website internet communication protocol.

    **Server**
    - `https://{accountName}.vtexcommercestable.com.br/`

    ### Common parameters

    | **Parameter name** | **Description** | **Type** |
    | --------------- | ----------------- | ----------------- |
    | {{accountName}} | Name of the VTEX account. Used as part of the URL. | Server variable. |
    | {{protocol}} | Internet communication protocol, it can be `HTTP` or `HTTPS`. | Path variable. |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
