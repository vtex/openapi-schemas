info:
  name: List all gift card transactions settlements
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/giftcards/:giftCardId/transactions/:tId/settlements"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: giftCardId
      value: "7"
      type: path
    - name: tId
      value: 3146f46162f042f483cd3979ba4e8317
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/giftcards/:giftCardId/transactions/:tId/settlements - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/giftcards/:giftCardId/transactions/:tId/settlements - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/giftcards/:giftCardId/transactions/:tId/settlements - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/giftcards/:giftCardId/transactions/:tId/settlements - Schema is valid", function () {
          const schema = {"required":["oid","value","date"],"type":"array","description":"Array containing gift card transactions settlements information.","items":{"type":"object","description":"Payment rules information.","properties":{"oid":{"type":"string","description":"Operation identification."},"value":{"type":"number","description":"Value information."},"date":{"type":"string","description":"Date of the transaction in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format (`YYYY-MM-DDThh:mm:ss.fff`)."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns all transactions settlements for a specific gift card from a gift card provider.

  > ℹ️ This request is made from VTEX to the gift card payment provider.

  ## Permissions

  Check with your service provider to know what permissions are needed.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `giftCardId` | path | (Required) Gift card identification. |
  | `tId` | path | (Required) Transaction ID generated by the provider. It is different from the `transactionId` generated by VTEX. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "oid": "faa6831230634c4b8fb897e02ba9c5a1",
      "value": 15,
      "date": "2023-06-02T18:24:49.252855Z"
    },
    {
      "oid": "hbar6832580652c4b8fb653f15ba9c5a7",
      "value": 40,
      "date": "2023-06-04T15:00:35.252855Z"
    }
  ]
  ```
