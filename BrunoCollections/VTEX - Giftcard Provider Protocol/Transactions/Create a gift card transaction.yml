runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/giftcards/:giftCardId/transactions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/giftcards/:giftCardId/transactions - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/giftcards/:giftCardId/transactions - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/giftcards/:giftCardId/transactions - Schema is valid", function () {
          const schema = {"description":"Gift card transaction response information.","required":["cardId","id","_self"],"type":"object","properties":{"cardId":{"type":"string","description":"Gift card identification."},"id":{"type":"string","description":"Transaction identification."},"_self":{"required":["href"],"type":"object","description":"It is an object that carries an auto reference from the provider at the Hub (on its API).","properties":{"href":{"type":"string","description":"This is one of the fields inside the `_self`. It is exactly the route that identifies this provider on the Hub's API, but it is not the same thing as the `serviceURL`."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a transaction (credit or debit) for a gift card in a gift card provider and authorizes the item reservation.

  > ℹ️ This request is made from VTEX to the gift card payment provider.

  ## Permissions

  Check with your service provider to know what permissions are needed.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `giftCardId` | path | (Required) Gift card identification. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "cardId": "24",
    "id": "68347b311ce5407c90fa5316975d047a",
    "_self": {
      "href": "gatewayqa/giftcards/24/transactions/68347b311ce5407c90fa5316975d047a"
    }
  }
  ```
