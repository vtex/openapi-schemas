opencollection: 1.0.0

info:
  name: VTEX - B2B Contact Information API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The B2B Contact Information API allows you to create, retrieve, update, and delete contact information documents stored in the `contact_information` data entity.

    >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

    ## Index

    ### Contact information
    - `POST` [Create new contact information](https://developers.vtex.com/docs/api-reference/b2b-contact-information-api#post-/api/dataentities/contact_information/documents)
    - `GET` [Search contact information](https://developers.vtex.com/docs/api-reference/b2b-contact-information-api#get-/api/dataentities/contact_information/search)
    - `GET` [Get contact information by ID](https://developers.vtex.com/docs/api-reference/b2b-contact-information-api#get-/api/dataentities/contact_information/documents/-id-)
    - `PATCH` [Update contact information](https://developers.vtex.com/docs/api-reference/b2b-contact-information-api#patch-/api/dataentities/contact_information/documents/-id-)
    - `DELETE` [Delete contact information](https://developers.vtex.com/docs/api-reference/b2b-contact-information-api#delete-/api/dataentities/contact_information/documents/-id-)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
