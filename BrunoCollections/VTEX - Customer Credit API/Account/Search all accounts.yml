info:
  name: Search all accounts
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/creditcontrol/accounts"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: from
      value: "1"
      type: query
      disabled: true
    - name: to
      value: "40"
      type: query
      disabled: true
    - name: status
      value: Paid
      type: query
      disabled: true
    - name: email
      value: test@test.com
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/creditcontrol/accounts - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/creditcontrol/accounts - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/creditcontrol/accounts - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/creditcontrol/accounts - Schema is valid", function () {
          const schema = {"required":["data","summary"],"type":"object","properties":{"data":{"type":"array","description":"Data information.","items":{"type":"object","description":"Object with information about each account.","required":["id","balance","document","status","documentType","creditLimit","updatedAt","createdAt","availableCredit","preAuthorizedCredit","email","tolerance","availableBalance"],"properties":{"id":{"type":"string","description":"Credit customer account identification."},"balance":{"type":"number","description":"Account balance value. If this number is negative, it means that the account has a debit instead of a credit to be used."},"document":{"type":"string","description":"Account owner document."},"status":{"type":"string","description":"Credit customer account status. This value will always come as `Open`. If an account is closed (`Closed`), it will not be displayed in the response body of this endpoint.","enum":["Open","Closed"]},"documentType":{"type":"string","description":"Document type.","enum":["CPF","CNPJ","Other"]},"creditLimit":{"type":"number","description":"Maximum credit amount on the account."},"updatedAt":{"type":"string","description":"Date of the last update made to the account."},"createdAt":{"type":"string","description":"Account creation date."},"description":{"type":"string","description":"This field is deprecated."},"availableCredit":{"type":"number","description":"Credit amount available on the account."},"preAuthorizedCredit":{"type":"number","description":"Credit value that can only be used by the account owner after the merchant releases a specific purchase transaction."},"email":{"type":"string","description":"Account owner email."},"tolerance":{"type":"number","description":"Account credit tolerance (in decimals). This value represents the increase in credit on an account. For example, a value of `0.30` indicates that the account owner can use up to 30% above the account's original maximum credit amount."},"availableBalance":{"type":"number","description":"Balance available for use on the account."}}}},"summary":{"required":["count"],"type":"object","description":"Summary information.","properties":{"count":{"type":"integer","description":"Number of customer credit accounts in the store."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a list of all [customer credit accounts](https://help.vtex.com/en/tracks/customer-credit-getting-started--1hCRg21lXYy2seOKgqQ2CC/7FHLd0cmxqqGeEUuc8uioU) in the store.

  >ℹ️ You can use the queries below (individually or combined) to obtain a more accurate search result. If your store has more than 20 customer credit accounts and you do not use any queries in the call, only the first 20 account records will appear in the response body.

  >ℹ️ Query params can be used individually or combined.

  ### Queries to filter results

  - **By the location of the accounts in the list (quantity of accounts)**: `?from={int}&to={int}`
  - **By status**: `?status={Open, Closed or Cancelled}`
  - **By email**: `?email={string}`

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Credit Control | Main | **Main Access** |
  | Credit Control | Checking Accounts | **Read Checking Accounts** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `from` | query | Indicates the starting position of the credit customer account to be searched in the account list. Example, value `1` indicates that the first account in the list will be returned. |
  | `to` | query | Indicates the final position of the credit customer account to be searched in the account list. Example, if the value of `from` is equal to `1` and `to` is `40`, information from 40 accounts will be displayed in the response body of the request. |
  | `status` | query | Indicates the status of the accounts to be searched for. |
  | `email` | query | Indicates the email registered to the account to be searched. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

