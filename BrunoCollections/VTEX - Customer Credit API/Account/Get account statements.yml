info:
  name: Get account statements
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/creditcontrol/accounts/:creditAccountId/statements"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: creditAccountId
      value: 01bce461-9g03-12ds-8217-b3d39271e15b
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/statements - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/statements - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/statements - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/statements - Schema is valid", function () {
          const schema = {"required":["statements","currentBalance","intervalBalance","previousBalance"],"type":"object","properties":{"statements":{"type":"array","description":"Statements information.","items":{"required":["value","date","origin"],"type":"object","description":"Object with information about each statement.","properties":{"value":{"type":"number","description":"Operation value."},"date":{"type":"string","description":"Operation date."},"doneby":{"type":"string","description":"Email of the person responsible for the operation."},"origin":{"type":"string","description":"Operation origin.","enum":["Credit","Invoice","Payment","Statement"]},"metadata":{"type":"object","description":"Metadata information.","properties":{"transactionId":{"type":"string","description":"Transaction identification."},"numberOfInstallments":{"type":"number","description":"Number of installments."}}}}}},"currentBalance":{"type":"number","description":"Current balance value."},"intervalBalance":{"type":"number","description":"Interval balance. Indicates the balance between debits and credits made since the account was opened. Negative values ​​indicate that there were more debits than new credits in the account."},"previousBalance":{"type":"number","description":"Current balance value."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the [customer credit account](https://help.vtex.com/en/tracks/customer-credit-getting-started--1hCRg21lXYy2seOKgqQ2CC/7FHLd0cmxqqGeEUuc8uioU) statements.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Credit Control | Main | **Main Access** |
  | Credit Control | Statements | **Read Statements** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `creditAccountId` | path | (Required) Credit account identification. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "statements": [
      {
        "value": -5.01,
        "date": "2023-11-09T18:26:43.3361896Z",
        "origin": "Invoice",
        "metadata": {
          "transactionId": "A424887D0F2D45028FE5C96E9B0E1A2D",
          "numberOfInstallments": 1
        }
      },
      {
        "value": -15,
        "date": "2023-11-09T18:48:32.1436064Z",
        "doneBy": "ricardo.silva@vtex.com.br",
        "origin": "Statement"
      },
      {
        "value": -500,
        "date": "2023-11-09T19:38:04.3798157Z",
        "origin": "Credit"
      },
      {
        "value": -200,
        "date": "2023-11-09T19:40:08.9716204Z",
        "origin": "Credit"
      },
      {
        "value": 200,
        "date": "2023-11-09T19:40:14.5497445Z",
        "origin": "Credit"
      },
      {
