info:
  name: Retrieve invoices by Customer Credit account ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/creditcontrol/accounts/:creditAccountId/invoices"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: creditAccountId
      value: 01bce461-9g03-12ds-8217-b3d39271e15b
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/invoices - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/invoices - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/invoices - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/creditcontrol/accounts/:creditAccountId/invoices - Schema is valid", function () {
          const schema = {"required":["data","summary"],"type":"object","properties":{"data":{"type":"array","description":"Data information.","items":{"required":["id","friendlyId","status","value","accountId","creditValue","createdAt","updatedAt","originalDueDate","dueDate","installment","orderId","transactionId","numberOfInstallments","creditAccountId"],"type":"object","description":"Object with information about each invoice.","properties":{"id":{"type":"string","description":"Invoice identification."},"friendlyId":{"type":"string","description":"Simplified identification of an invoice. This code is created automatically, always associated with an existing invoice. It consists of an 8-digit random ID (of numbers and letters) and the installment."},"status":{"type":"string","description":"Invoice status.","enum":["Opened","Paid","Cancelled"]},"value":{"type":"number","description":"Invoice value."},"accountId":{"type":"string","description":"Account identification. It is the same `checkingAccountId` parameter used in other Customer Credit API endpoints."},"creditValue":{"type":"number","description":"Credit value."},"createdAt":{"type":"string","description":"Invoice creation date."},"updatedAt":{"type":"string","description":"Date of the last update made to the invoice."},"originalDueDate":{"type":"string","description":"Original invoice expiration date."},"dueDate":{"type":"string","description":"Modified invoice expiration date."},"installment":{"type":"number","description":"Identification of installment number."},"orderId":{"type":"string","description":"Identification of the order that generated the invoice."},"transactionId":{"type":"string","description":"Identification of the invoice transaction. This is the same number as the `id` field, removing the last three characters."},"numberOfInstallments":{"type":"number","description":"Number of installments."},"creditAccountId":{"type":"string","description":"Credit account identification. It is the same `accountId` parameter used in other Customer Credit API endpoints."}}}},"summary":{"required":["total","count"],"type":"object","description":"Summary information.","properties":{"total":{"type":"number","description":"Total amount payable (sum of invoices listed with status `Open`)."},"count":{"type":"integer","description":"Number of invoices listed."},"totalPaid":{"type":"integer","description":"Total amount paid (sum of invoices listed with status `Paid`)."},"totalCancelled":{"type":"integer","description":"Total amount canceled (sum of invoices listed with status `Cancelled`)."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns associated invoices given a specific `creditAccountId`.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Credit Control | Main | **Main Access** |
  | Credit Control | Invoices | **Read Invoices** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `creditAccountId` | path | (Required) Credit account identification. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

