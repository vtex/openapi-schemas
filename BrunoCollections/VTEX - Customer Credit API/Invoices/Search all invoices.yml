        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/creditcontrol/invoices - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/creditcontrol/invoices - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/creditcontrol/invoices - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/creditcontrol/invoices - Schema is valid", function () {
          const schema = {"required":["data","summary"],"type":"object","properties":{"data":{"type":"array","description":"Data information.","items":{"required":["id","friendlyId","status","value","accountId","creditValue","createdAt","updatedAt","originalDueDate","dueDate","installment","orderId","transactionId","numberOfInstallments","creditAccountId"],"type":"object","description":"Object with information about each invoice.","properties":{"id":{"type":"string","description":"Invoice identification."},"friendlyId":{"type":"string","description":"Simplified identification of an invoice. This code is created automatically, always associated with an existing invoice. It consists of an 8-digit random ID (of numbers and letters) and the installment."},"status":{"type":"string","description":"Invoice status.","enum":["Opened","Paid","Cancelled"]},"value":{"type":"number","description":"Invoice value."},"accountId":{"type":"string","description":"Account identification. It is the same `creditAccountId` parameter used in other Customer Credit API endpoints."},"creditValue":{"type":"number","description":"Credit value."},"createdAt":{"type":"string","description":"Invoice creation date."},"resolvedAt":{"type":["string","null"],"description":"Invoice closing date."},"updatedAt":{"type":"string","description":"Date of the last update made to the invoice."},"paymentLink":{"type":["string","null"],"description":"Link (URL) created to direct the customer to an invoice payment environment (optional)."},"originalDueDate":{"type":"string","description":"Original invoice expiration date."},"dueDate":{"type":"string","description":"Modified invoice expiration date."},"installment":{"type":"number","description":"Identification of installment number."},"orderId":{"type":"string","description":"Identification of the order that generated the invoice."},"observation":{"type":["string","null"],"description":"Observation notes about the invoice."},"transactionId":{"type":"string","description":"Identification of the invoice transaction. This is the same number as the `id` field, removing the last three characters."},"numberOfInstallments":{"type":"number","description":"Number of installments."},"creditAccountId":{"type":"string","description":"Credit account identification. It is the same `accountId` parameter used in other Customer Credit API endpoints."}}}},"summary":{"required":["total","count"],"type":"object","description":"Summary information.","properties":{"total":{"type":"number","description":"Total amount payable (sum of invoices listed with status `Open`)."},"count":{"type":"integer","description":"Number of invoices listed."},"totalPaid":{"type":"number","description":"Total amount paid (sum of invoices listed with status `Paid`)."},"totalCancelled":{"type":"number","description":"Total amount canceled (sum of invoices listed with status `Cancelled`)."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

