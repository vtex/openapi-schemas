":{"type":"string","description":"Notification sending time."}}}},"daysAfter":{"type":"array","description":"Notification information sent after invoice payment date.","items":{"required":["days","timeOfDay"],"type":"object","description":"Object with information about the moment when the notification is sent.","properties":{"days":{"type":"integer","description":"How many days after the invoice payment date is the notification sent."},"timeOfDay":{"type":"string","description":"Notification sending time."}}}}}}}};
          const validate = ajv.compile(schema);
