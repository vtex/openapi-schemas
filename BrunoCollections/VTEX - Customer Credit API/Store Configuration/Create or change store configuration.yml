info:
  name: Create or change store configuration
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/creditcontrol/storeconfig"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "dailyInterestRate": 0.01,
        "invoicePostponementLimit": 2,
        "taxRate": 0.4,
        "maxPostponementDays": 3,
        "defaultCreditValue": 150,
        "maxPreAuthorizationGrowthRate": 0.1,
        "myCreditsEnabled": true,
        "toleranceEnabled": true,
        "automaticCheckingAccountCreationEnabled": true,
        "postponementEnabled": true,
        "notificationsSettings": {
          "daysPrior": [
            {
              "days": 1,
              "timeOfDay": "16:00:00"
            },
            {
              "days": 1,
              "timeOfDay": "16:00:00"
            }
          ],
          "daysAfter": [
            {
              "days": 0,
              "timeOfDay": "12:00:00"
            },
            {
              "days": 0,
              "timeOfDay": "12:00:00"
            }
          ]
        }
      }
  auth: inherit

