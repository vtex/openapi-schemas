info:
  name: Add coupons to the cart
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/checkout/pub/orderForm/:orderFormId/coupons"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: individualShippingEstimates
      value: "true"
      type: query
      disabled: true
    - name: orderFormId
      value: ede846222cd44046ba6c638442c3505a
      type: path
  body:
    type: json
    data: |-
      {
        "text": "freeshipping"
      }
  auth: inherit

runtime:
