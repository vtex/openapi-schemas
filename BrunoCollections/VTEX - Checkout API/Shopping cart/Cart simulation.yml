info:
  name: Cart simulation
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/checkout/pub/orderForms/simulation"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: RnbBehavior
      value: "0"
      type: query
      disabled: true
    - name: sc
      value: "1"
      type: query
      disabled: true
    - name: individualShippingEstimates
      value: "true"
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "id": "12345",
            "quantity": 2,
            "seller": "1"
          },
          {
            "id": "67890",
            "quantity": 1,
            "seller": "2"
          }
        ],
        "country": "BRA",
        "postalCode": "12345-000",
        "geoCoordinates": [
          -47.924747,
          -15.832582
        ],
        "allowedOutdatedData": [
          "inventoryData",
          "promotionData",
          "paymentData"
        ]
      }
  auth: inherit

