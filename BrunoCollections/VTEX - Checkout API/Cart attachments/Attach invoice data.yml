info:
  name: Attach invoice data
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/checkout/pub/orderForm/:orderFormId/attachments/invoiceData"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: orderFormId
      value: 29154e27383145cc8ce1f7a1df0d99c4
      type: path
  body:
    type: json
    data: |-
      {
        "address": {
          "addressType": "residential",
          "city": "New York",
          "complement": "101",
          "country": "USA",
          "geoCoordinates": [
            40.7986877,
            -73.9534529
          ],
          "neighborhood": "Manhattan",
          "number": "52",
          "postalCode": "10019",
          "reference": "Between the Upper West Side and Upper East Side",
          "state": "NY",
          "street": "North 110th Street"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
