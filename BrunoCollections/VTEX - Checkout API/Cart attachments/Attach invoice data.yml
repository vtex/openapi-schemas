        addFormats(ajv);

        test("[POST]::/api/checkout/pub/orderForm/:orderFormId/attachments/invoiceData - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/checkout/pub/orderForm/:orderFormId/attachments/invoiceData - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/checkout/pub/orderForm/:orderFormId/attachments/invoiceData - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

