info:
  name: Place order
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/checkout/pub/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: sc
      value: "1"
      type: query
      disabled: true
    - name: individualShippingEstimates
      value: "true"
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "id": "123456789",
            "quantity": 1,
            "seller": "1",
            "price": 2499,
            "commission": 10,
            "freightCommission": 5,
            "measurementUnit": "g",
            "unitMultiplier": 1,
            "isGift": false,
