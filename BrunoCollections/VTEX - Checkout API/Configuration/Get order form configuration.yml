info:
  name: Get order form configuration
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/checkout/pvt/configuration/orderForm"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: individualShippingEstimates
      value: "true"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/checkout/pvt/configuration/orderForm - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/checkout/pvt/configuration/orderForm - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/checkout/pvt/configuration/orderForm - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/checkout/pvt/configuration/orderForm - Schema is valid", function () {
          const schema = {"type":"object","properties":{"paymentConfiguration":{"type":"object","description":"Payment configuration information.","properties":{"requiresAuthenticationForPreAuthorizedPaymentOption":{"type":"boolean","description":"Determines whether pre-authorized payments require authentication."},"allowInstallmentsMerge":{"type":"boolean","description":"By default (when `false`), on a multi-seller purchase is on the run, a simple intersection with installment options configured by every seller will be available. When indicated as `true`, this option allows a more complex but flexible installment option, since it considers max installments of every seller configuration, even if those do not match. Installment values may not be equal in this case."}}},"taxConfiguration":{"type":["object","null"],"description":"External tax service configuration information.","properties":{"url":{"type":["string","null"],"description":"Endpoint URL."},"authorizationHeader":{"type":["string","null"],"description":"Authorization header."},"appId":{"type":"string","description":"Custom data ID sent to the tax system."},"isMarketplaceResponsibleForTaxes":{"type":"boolean","description":"Indicates whether the marketplace is responsible for the products taxes."}}},"minimumQuantityAccumulatedForItems":{"type":"integer","description":"Minimum SKU quantity by cart."},"decimalDigitsPrecision":{"type":"integer","description":"Number of price digits."},"minimumValueAccumulated":{"type":["integer","null"],"description":"Minimum cart value."},"apps":{"type":["array","null"],"description":"Array of objects containing Apps configuration information.","items":{"description":"App configuration information.","type":"object","properties":{"id":{"type":"string","description":"App ID."},"fields":{"type":"array","description":"Array of fields available to the app.","items":{"type":"string","description":"Available fieldValue name."}},"major":{"type":"integer","description":"App major version."}}}},"allowMultipleDeliveries":{"type":["boolean","null"],"description":"On the same purchase, allows the selection of items from multiple delivery channels."},"allowManualPrice":{"type":["boolean","null"],"description":"Allows the editing of SKU prices right in the cart."},"savePersonalDataAsOptIn":{"type":["boolean","null"],"description":"Allows users to select whether they want the store to keep their personal and payment data saved."},"maxNumberOfWhiteLabelSellers":{"type":["integer","null"],"description":"Allows the input of a limit of white label sellers involved on the cart."},"maskFirstPurchaseData":{"type":["boolean","null"],"description":"Allows, on a first purchase, masking client's data. It could be useful when a shared cart is used and the client does not want to share its data."},"recaptchaValidation":{"type":"string","description":"Configures reCAPTCHA validation for the account, defining in which situations the shopper will be prompted to validate a purchase with reCAPTCHA. Learn more about [reCAPTCHA validation for VTEX stores](https://help.vtex.com/en/tutorial/using-recaptcha-at-checkout--18Te3oDd7f4qcjKu9jhNzP)\n\r\n\rPossible values are:\n\r- `\"never\"`: no purchases are validated with reCAPTCHA.\n\r- `\"always\"`: every purchase is validated with reCAPTCHA.\n\r- `\"vtexCriteria\"`: only some purchases are validated with reCAPTCHA in order to minimize friction and improve shopping experience. VTEX's algorithm determines which sessions are trustworthy and which should be validated with reCAPTCHA. This is the recommended option."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the settings that are currently applied to every orderForm in the account.


  These settings are defined by the request [Update orderForm configuration](https://developers.vtex.com/docs/api-reference/checkout-api#post-/api/checkout/pvt/configuration/orderForm).


  Always use this request to retrieve the current configuration before performing an update. By doing so you ensure that you are modifying only the properties you want.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Checkout | CheckoutResources | **Save OrderForm Configuration** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `individualShippingEstimates` | query | Shows the product's estimated shipping date in the `shippingEstimate` field from the `orderForm`. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "paymentConfiguration": {
      "requiresAuthenticationForPreAuthorizedPaymentOption": false,
      "allowInstallmentsMerge": false,
      "blockPaymentSession": null
    },
    "taxConfiguration": null,
    "minimumQuantityAccumulatedForItems": 1,
    "decimalDigitsPrecision": 2,
    "minimumValueAccumulated": null,
    "apps": [
      {
        "fields": [
          "name",
          "age"
        ],
        "id": "abcd",
        "major": 1
      }
    ],
    "allowMultipleDeliveries": false,
    "allowManualPrice": true,
    "savePersonalDataAsOptIn": false,
    "maxNumberOfWhiteLabelSellers": null,
    "maskFirstPurchaseData": null,
    "recaptchaValidation": "vtexCriteria"
  }
  ```
