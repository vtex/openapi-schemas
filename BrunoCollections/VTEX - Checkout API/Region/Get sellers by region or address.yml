info:
  name: Get sellers by region or address
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/checkout/pub/regions/:regionId?country=BRA"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: country
      value: BRA
      type: query
    - name: postalCode
      value: "1234000"
      type: query
      disabled: true
    - name: geoCoordinates
      value: "-47.924747467041016"
      type: query
      disabled: true
    - name: individualShippingEstimates
      value: "true"
      type: query
      disabled: true
    - name: regionId
      value: v2.1BB18CE648B5111D0933734ED83EC783
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/checkout/pub/regions/:regionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/checkout/pub/regions/:regionId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/checkout/pub/regions/:regionId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/checkout/pub/regions/:regionId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"id":{"type":"string","description":"Region ID."},"sellers":{"type":"array","description":"Array with information on each seller retrieved for the given region.","items":{"description":"Seller information.","type":"object","properties":{"id":{"type":"string","description":"Seller ID."},"name":{"type":"string","description":"Seller name."},"logo":{"type":["string","null"],"description":"Seller logo."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a list of sellers that cater to a specific region or address, according to your setup of our [regionalization feature](https://help.vtex.com/en/tutorial/setting-up-price-and-availability-of-skus-by-region--12ne58BmvYsYuGsimmugoc#). Learn more about [Region v2](https://developers.vtex.com/docs/guides/region-v2-release).


  To access the list of sellers, you must choose one of the following methods:


  1. Send the identification of the list of sellers (`regionId`) as a path parameter through the URL. Or;

  2. Send the `country` (3-digit ISO code) and at least one of the two values (`postal Code` or `geo Coordinates`) as query parameters through the URL. For this method, it is also allowed to send both values (`postalCode` or `geoCoordinates`) in the same request.


  > The `regionId` and `country` parameters are indicated as required in this documentation. However, only one of them should be sent in the request according to one of the methods mentioned above.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Checkout | CheckoutResources | **Shopping Cart Full Access** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `regionId` | path | (Required) ID of the region corresponding to the shopper's location. |
  | `country` | query | (Required) Three letter country code refering to the `postalCode` field. |
  | `postalCode` | query | Postal code corresponding to the shopper's location. |
  | `geoCoordinates` | query | Geocoordinates (first longitude, semicolon, then latitude) corresponding to the shopper's location. |
  | `geoCoordinates` | query | Geocoordinates (first longitude, semicolon, then latitude) corresponding to the shopper's location. |
  | `individualShippingEstimates` | query | Shows the product's estimated shipping date in the `shippingEstimate` field from the `orderForm`. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "v2.1BB18CE648B5111D0933734ED83EC783",
    "sellers": [
      {
        "id": "abacaba",
        "name": "Abacaba Store",
        "logo": null
      },
      {
        "id": "abacaba2",
        "name": "Abacaba VTEX Outlet",
        "logo": null
      },
      {
        "id": "abacaba3",
        "name": "Abacaba VTEX Mall",
        "logo": null
      }
    ]
  }
  ```
