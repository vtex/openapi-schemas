info:
  name: Search pickup points
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/logistics-shipping/pickuppoints/_search"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: maxDistance
      value: "10"
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
        "zipCode": "01310930",
        "country": "BRA",
        "coordinate": {
          "latitude": -23.555404663085938,
          "longitude": -46.6456413269043
        }
      }
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/logistics-shipping/pickuppoints/_search - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/logistics-shipping/pickuppoints/_search - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/logistics-shipping/pickuppoints/_search - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/logistics-shipping/pickuppoints/_search - Schema is valid", function () {
          const schema = {"type":"object","description":"Response containing available pickup points for the specified location.","properties":{"pickupPointDistances":{"type":"array","description":"Array of pickup points available near the location.","items":{"type":"object","description":"Pickup point information.","properties":{"pickupId":{"type":"string","description":"Unique identifier of the pickup point."},"pickupName":{"type":"string","description":"Human-readable name of the pickup point."},"distance":{"type":"number","description":"Distance from the searched location in kilometers."},"isActive":{"type":"boolean","description":"Indicates if the pickup point is active."},"address":{"type":"object","description":"Physical address of the pickup point.","properties":{"street":{"type":"string","description":"Street name."},"number":{"type":"string","description":"Street number."},"postalCode":{"type":"string","description":"Postal code."},"city":{"type":"string","description":"City name."},"state":{"type":"string","description":"State or province code."},"neighborhood":{"type":"string","description":"Neighborhood name."}}},"businessHours":{"type":"array","description":"Business hours of the pickup point from Monday to Friday.","items":{"type":"object","description":"Business hours of the pickup point in a specific day of the week.","properties":{"dayOfWeek":{"type":"integer","description":"Day of the week identification, as in `0` = Sunday, `1` = Monday, `2` = Tuesday, `3` = Wednesday, `4` = Thursday, `5` = Friday, and `6` = Saturday.","enum":[0,1,2,3,4,5,6]},"openingTime":{"type":"string","description":"Opening time of the pickup point in `HH:MM:SS` format."},"closingTime":{"type":"string","description":"Closing time of the pickup point in `HH:MM:SS` format."}}}}}}},"pickupPointsHash":{"type":"string","description":"Hash representing the pickup points context. This hash is required and used in the `pickupsHash` field of the [Get delivery suggestions](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestionss-api#get-/api/delivery-promise-suggestions) and the [Search delivery suggestions](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestionss-api#post-/api/delivery-promise-suggestions/_search) endpoints."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves available pickup points based on location information and distance constraints. This endpoint helps find pickup locations near a given address, using postal code, geographic coordinates, country, and optional maximum distance.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Logistics | Logistics access | **Logistics full access** |
  | Logistics | Logistics access | **Logistics shipping full access** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--sjGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | Logistics - Full access | Logistics full access |
  | Logistics - Full access | Logistics shipping full access |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users or API keys usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm).

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `maxDistance` | query | Maximum distance in kilometers from the specified location to search for pickup points. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

