opencollection: 1.0.0

info:
  name: VTEX - Delivery Promise Suggestions API

docs:
  content: |-
    The Delivery Promise Suggestions API provides real-time suggestions for delivery and pickup options based on product availability, user location, and fulfillment context for stores that use  [Delivery Promise](https://help.vtex.com/docs/tutorials/delivery-promise-beta) and [Delivery Options](https://help.vtex.com/en/docs/tutorials/delivery-options-beta). It helps optimize the customer shopping experience by suggesting the best fulfillment options for each product. 

    >ℹ️ This API is in beta, which means that we are working to improve it. If you have any questions, please contact our [Support Center](https://support.vtex.com/hc/en-us/requests).

    ## Index

    ### Logistics Shipping

    - `POST` [Search delivery zones](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestionss-api#post-/api/logistics-shipping/delivery-zones/_search/v2)
    - `POST` [Search pickup points](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestionss-api#post-/api/logistics-shipping/pickuppoints/_search)

    ### Delivery Promise Suggestions

    - `POST` [Search delivery suggestions](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestionss-api#post-/api/delivery-promise-suggestions/_search)
    - `GET` [Get delivery suggestions](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestionss-api#get-/api/delivery-promise-suggestions)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
