        test("[GET]::/api/delivery-promise-suggestions - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/delivery-promise-suggestions - Schema is valid", function () {
          const schema = {"type":"object","description":"Response containing delivery suggestions for requested products.","properties":{"suggestions":{"type":"array","description":"Array of delivery suggestions, with one entry corresponding to each product in the request.","minItems":1,"maxItems":20,"items":{"type":"object","description":"Delivery suggestion for a single product.","required":["productId","suggestions"],"properties":{"productId":{"type":"string","description":"The unique identifier of the product.","nullable":false},"suggestions":{"type":"object","description":"Object containing delivery and pickup options suggestions.","required":["delivery","pickup"],"properties":{"delivery":{"type":"array","description":"Array of delivery option suggestions. An empty array indicates no delivery options are available for the current context.","items":{"type":"object","description":"Delivery option suggestion.","properties":{"id":{"type":"string","description":"The unique identifier for the specific delivery option (SLA)."},"name":{"type":"string","description":"A human-readable name for the delivery option (e.g., \"Express Delivery\")."},"slaTimeTarget":{"type":"object","description":"Object defining the time window for fulfillment.","properties":{"from":{"type":"number","description":"Minimum time for fulfillment."},"to":{"type":"number","description":"Maximum time for fulfillment."},"unit":{"type":"string","description":"Time unit: `h` for hours or `d` for days.","enum":["h","d"]}}},"conditions":{"type":"array","description":"Tags indicating why the option was selected (e.g., `fastest`, `nearest`).","items":{"type":"string","description":"Condition tag (e.g., `fastest`, `nearest`)."}}}}},"pickup":{"type":"array","description":"Array of pickup option suggestions. An empty array indicates no pickup options are available for the current context.","items":{"type":"object","description":"Pickup option suggestion.","properties":{"id":{"type":"string","description":"The unique identifier for the specific pickup option (Store)."},"name":{"type":"string","description":"A human-readable name for the pickup option (e.g., \"Downtown Store\")."},"slaTimeTarget":{"type":"object","description":"Object defining the time window for fulfillment.","properties":{"from":{"type":"number","description":"Minimum time for fulfillment."},"to":{"type":"number","description":"Maximum time for fulfillment."},"unit":{"type":"string","description":"Time unit: `h` for hours or `d` for days.","enum":["h","d"]}}},"conditions":{"type":"array","description":"Tags indicating why the option was selected (e.g., `fastest`, `nearest`).","items":{"type":"string","description":"Condition tag (e.g., `fastest`, `nearest`)."}}}}}}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
