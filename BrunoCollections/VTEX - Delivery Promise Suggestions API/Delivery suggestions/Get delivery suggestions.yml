settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves delivery and pickup suggestions for products using query parameters. This method supports caching, bookmarking, and browser optimizations. The response contains suggestions for each requested product, including [available delivery and pickup options](https://help.vtex.com/docs/tutorials/delivery-options-beta#creating-delivery-options) with timing information and selection criteria tags (e.g., fastest, nearest).

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Logistics | Logistics access | **Logistics viewer** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | Logistics - Read only | Logistics viewer |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users or API keys usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm).

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `products[0].productId` | query | (Required) The unique identifier of the first product. Use index notation for multiple products (e.g., `products[0].productId`, `products[1].productId`). |
  | `products[0].itemId` | query | The specific SKU ID for the first product. If omitted, all SKUs for the product are evaluated. Use index notation for multiple SKUs (e.g., `products[0].itemId`, `products[1].itemId`). |
  | `deliveryZonesHash` | query | (Required) Hash representing the user's delivery context, which is a part of the fulfillment context. |
  | `pickupsHash` | query | (Required) Hash representing the user's pickup context, which is a part of the fulfillment context. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "suggestions": [
      {
        "productId": "123",
        "suggestions": {
          "delivery": [
            {
              "id": "express-delivery",
              "name": "Express Delivery",
              "slaTimeTarget": {
                "from": 0,
                "to": 4,
                "unit": "h"
              },
              "conditions": [
                "fastest"
              ]
            },
            {
              "id": "standard-delivery",
              "name": "Standard Delivery",
              "slaTimeTarget": {
                "from": 1,
                "to": 3,
                "unit": "d"
              },
              "conditions": []
            }
          ],
          "pickup": [
            {
              "id": "store-downtown",
              "name": "Downtown Store",
              "slaTimeTarget": {
                "from": 0,
                "to": 2,
                "unit": "h"
              },
              "conditions": [
                "nearest"
              ]
            }
          ]
        }
      },
      {
        "productId": "456",
        "itemId": "456-1",
        "suggestions": {
          "delivery": [
            {
              "id": "standard-delivery",
              "name": "Standard Delivery",
              "slaTimeTarget": {
                "from": 2,
                "to": 5,
                "unit": "d"
              },
              "conditions": [
                "fastest"
              ]
            }
          ],
          "pickup": []
        }
      }
    ]
  }
  ```
