info:
  name: Get delivery suggestions
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/delivery-promise-suggestions?products[0].productId=123&deliveryZonesHash=abc123def456&pickupsHash=xyz789uvw012"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: products[0].productId
      value: "123"
      type: query
    - name: products[0].itemId
      value: 123-1
      type: query
      disabled: true
    - name: deliveryZonesHash
      value: abc123def456
      type: query
    - name: pickupsHash
      value: xyz789uvw012
      type: query
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

