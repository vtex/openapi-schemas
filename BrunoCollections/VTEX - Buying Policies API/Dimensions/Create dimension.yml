http:
  method: POST
  url: "{{baseUrl}}/:accountName/authorization-dimensions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: accountName
      value: apiexamples
      type: path
  body:
    type: json
    data: |-
      {
        "name": "default",
        "requireAllRulesAcceptance": false,
        "priority": 9999,
        "unitId": "654c12d6-6b22-4483-bd83-eb086c42888e",
        "ruleCollection": [
          {
            "name": "Approve title",
            "priority": 1,
            "trigger": {
              "condition": {
                "conditionType": 2,
                "description": "Approve condition description",
                "expression": "openTextField.value = 'approved'"
              },
              "effect": {
                "description": "Approve condition description",
                "effectType": 0
              }
            },
            "scoreInterval": {
              "accept": 10,
              "deny": 5
            }
          },
          {
            "name": "Deny title",
            "priority": 2,
            "trigger": {
              "condition": {
                "conditionType": 2,
                "description": "Deny condition description",
                "expression": "openTextField.value = 'denied'"
              },
              "effect": {
                "description": "Deny condition description",
                "effectType": 1
              }
            },
            "scoreInterval": {
              "accept": 10,
              "deny": 5
            }
          },
          {
            "name": "Pending title",
            "authorizationData": {
              "authorizers": [
                {
                  "type": "unit",
                  "id": "0aac12d6-6b22-4483-bd83-eb086c42888e"
                }
              ]
            },
            "priority": 3,
            "trigger": {
              "condition": {
                "conditionType": 2,
                "description": "Pending condition description",
                "expression": "openTextField.value = 'pending'"
              },
              "effect": {
                "description": "Pending condition description",
                "effectType": 2
              }
            },
            "scoreInterval": {
              "accept": 10,
              "deny": 5
            }
          },
          {
            "name": "Sequential approval title",
            "priority": 3,
            "trigger": {
              "condition": {
                "conditionType": 2,
                "description": "Sequential approval condition description",
                "expression": "openTextField.value = 'sequential-approval'"
              },
              "effect": {
                "description": "Sequential approval condition description",
                "effectType": 2
              }
            },
            "scoreInterval": {
              "accept": 10,
              "deny": 5
            },
            "authorizationData": {
              "requireAllApprovals": true,
              "authorizers": [
                {
                  "id": "0aac12d6-6b22-4483-bd83-eb086c42888e",
                  "type": "unit"
                },
                {
                  "id": "5c969024-5c87-40f6-a89a-01172c5ae363",
                  "type": "unit"
                }
              ]
            }
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/:accountName/authorization-dimensions - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/:accountName/authorization-dimensions - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/:accountName/authorization-dimensions - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/:accountName/authorization-dimensions - Schema is valid", function () {
          const schema = {"type":"object","description":"Response object for an authorization dimension.","properties":{"id":{"type":"string","description":"Unique identifier of the dimension."},"name":{"type":"string","description":"Name of the authorization dimension."},"unitId":{"type":"string","description":"Identifier of the business unit this dimension belongs to. If this field is not provided in the request body, the value will default to the business unit associated with the user token from the `VtexIdclientAutCookie`."},"status":{"type":["string","null"],"description":"Current status of the dimension.","enum":[null,"accepted","denied","pending","ignored"]},"priority":{"type":"integer","description":"Execution priority of the dimension. Lower numbers are evaluated first."},"requireAllRulesAcceptance":{"type":"boolean","description":"Whether all listed rules must be accepted for the dimension to be approved."},"ruleCollection":{"type":"array","description":"Collection of rules contained in this dimension.","items":{"type":"object","description":"Rule object in the response containing conditions and actions for authorization.","properties":{"id":{"type":"string","description":"Unique identifier of the rule."},"name":{"type":"string","description":"Name of the rule."},"status":{"type":["string","null"],"description":"Current status of the rule.","enum":[null,"accepted","denied","pending"]},"priority":{"type":"integer","description":"Evaluation priority for the rule."},"trigger":{"type":"object","description":"Contains the trigger condition and effect logic.","properties":{"condition":{"type":"object","description":"Condition that must be met to trigger the rule.","properties":{"conditionType":{"type":"integer","description":"Type of condition, which can be `0` (bypass), `1` (deny) or `2` (sequential workflow). Type `2` defines that the rule condition is set by an expression (see field `expression`).","enum":[0,1,2]},"description":{"type":"string","description":"Description of the condition."},"expression":{"type":"string","description":"JSONata expression that defines the condition logic."}}},"effect":{"type":"object","description":"Effect to apply when the condition is met.","properties":{"description":{"type":"string","description":"Description of the effect."},"effectType":{"type":"integer","description":"Type of effect: `0` (approve), `1` (deny), or `2` (pending).","enum":[0,1,2]}}}}},"scoreInterval":{"type":"object","description":"Score range for accepting or denying the rule.","properties":{"accept":{"type":"number","description":"Minimum score required to accept the rule."},"deny":{"type":"number","description":"Maximum score to deny the rule."}}},"authorizationData":{"type":"object","description":"Defines required authorizers and whether all must approve (only present for rules with `effectType: 2`).","properties":{"requireAllApprovals":{"type":"boolean","description":"Whether all authorizers must approve."},"authorizers":{"type":"array","description":"List of entities that can authorize the action.","items":{"type":"object","description":"Entity that can authorize an action.","required":["type","id"],"properties":{"type":{"type":"string","description":"Type of authorizer. For Organization Account, it's always `unit`."},"id":{"type":"string","description":"Unique identifier of the authorizer."}}}}}}}}},"creationDate":{"type":"string","format":"date-time","description":"Date and time of dimension creation in the format `YYYY-MM-DDThh:mm:ssZ`."},"creationVersion":{"type":"string","description":"Version of the system that created the dimension."},"creationEnvironment":{"type":"string","description":"Environment where the dimension was created (e.g., `stable`, `beta`)."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new authorization dimension with its associated rules.

  Dimensions contain a `unitId` field that allows grouping of dimensions by units or business areas, enabling more granular authorization control. This field is automatically filled based on the unit relative to the user creating the dimension.

  If you make this request using an appKey/appToken pair, you must explicitly send the `unitId` field in the request body root.

  >❗ While the API supports creating multiple dimensions per unit, the Buyer's Portal frontend limits each unit to one dimension. It is recommended to maintain this structure (one dimension per unit) for consistency with the portal's design.

  ## Approval dynamic

  Rules are evaluated based on their `effectType`:

  - `effectType: 0` → Automatic approval when the expression is `true`.
  - `effectType: 1` → Automatic denial when the expression is `true`.
  - `effectType: 2` → Pending, requires manual authorization using the [Accept or deny rule](https://developers.vtex.com/docs/api-reference/buying-policies-api#post-/commercial-authorizations/-orderAuthId-/callback) endpoint.

  For pending rules, the `scoreInterval` defines thresholds used during manual authorization. When calling the callback endpoints with a score value, the system compares it against these thresholds:
  - Scores ≥ `scoreInterval.accept` accept the rule.
  - Scores ≤ `scoreInterval.deny` deny it.
  - Scores in between bypass it.

  ## Hierarchical configuration

  Each organization unit has one dimension. To enforce policies from lowest to highest hierarchy levels.

  ## Dimension priority

  Controls org unit evaluation order:

  - Assign descending values by hierarchy level: top unit = 9999, child units = 9998, grandchild units = 9997.
  - Sibling units share the same priority.
  - System evaluates in ascending order, so lower hierarchy units are checked first.

  ## Rule priority

  Within each dimension (org unit), rules are evaluated in ascending priority order (lower numbers first). Rules must be organized in the following order, with sequential priority values:

  1. **Bypass rules** (`effectType: 0`) — checked first, approve and stop evaluation.
  2. **Deny rules** (`effectType: 1`) — checked after all bypass rules, deny and stop evaluation.
  3. **Sequential workflow rules** (`effectType: 2`) — checked last, require manual approval.

  Priority values are not fixed to specific numbers. They must be assigned sequentially across all rules, keeping the group order above. For example, with 2 bypass rules, 3 deny rules, and 2 approval rules, priorities would be: `1` and `2` for bypass, `3`, `4`, and `5` for deny, `6` and `7` for approval.

  >❗ Set `requireAllRulesAcceptance: false` so the first matching rule executes and stops further evaluation. This enables bypass rules to immediately approve orders without checking deny or approval rules.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Manage Buying Policies | OMS | **ManageBuyingPolicies** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | (Required) Name of the VTEX account. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

