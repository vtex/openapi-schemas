info:
  name: Create dimension rule
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/:accountName/authorization-dimensions/:dimensionId/rules"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: accountName
      value: apiexamples
      type: path
    - name: dimensionId
      value: c20ececf-660f-4656-a802-9ba607e3585b
      type: path
  body:
    type: json
    data: |-
      {
        "name": "User Approval - Many approvers",
        "priority": 1,
        "trigger": {
          "condition": {
            "conditionType": 2,
            "description": "Users 8f6b3712-4c05-4ce5-8057-63fd0d69a587 and 8f6b3712-4c05-4ce5-8057-63fd0d69a588 need to approve orders above $150",
            "expression": "$.openTextField.value = 'ODP use cases' and $.value > 30000"
          },
          "effect": {
            "description": "Orders with value above $150 must be approved",
            "effectType": 2
          }
        },
        "authorizationData": {
          "requireAllApprovals": true,
          "authorizers": [
            {
              "id": "8f6b3712-4c05-4ce5-8057-63fd0d69a587",
              "type": "unit"
            },
            {
              "id": "8f6b3712-4c05-4ce5-8057-63fd0d69a588",
              "type": "unit"
            }
          ]
        },
        "scoreInterval": {
          "accept": 10,
          "deny": 5
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/:accountName/authorization-dimensions/:dimensionId/rules - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/:accountName/authorization-dimensions/:dimensionId/rules - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/:accountName/authorization-dimensions/:dimensionId/rules - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/:accountName/authorization-dimensions/:dimensionId/rules - Schema is valid", function () {
          const schema = {"type":"object","description":"Rule object in the response containing conditions and actions for authorization.","properties":{"id":{"type":"string","description":"Unique identifier of the rule."},"name":{"type":"string","description":"Name of the rule."},"status":{"type":["string","null"],"description":"Current status of the rule.","enum":[null,"accepted","denied","pending"]},"priority":{"type":"integer","description":"Evaluation priority for the rule."},"trigger":{"type":"object","description":"Contains the trigger condition and effect logic.","properties":{"condition":{"type":"object","description":"Condition that must be met to trigger the rule.","properties":{"conditionType":{"type":"integer","description":"Type of condition, which can be `0` (bypass), `1` (deny) or `2` (sequential workflow). Type `2` defines that the rule condition is set by an expression (see field `expression`).","enum":[0,1,2]},"description":{"type":"string","description":"Description of the condition."},"expression":{"type":"string","description":"JSONata expression that defines the condition logic."}}},"effect":{"type":"object","description":"Effect to apply when the condition is met.","properties":{"description":{"type":"string","description":"Description of the effect."},"effectType":{"type":"integer","description":"Type of effect: `0` (approve), `1` (deny), or `2` (pending).","enum":[0,1,2]}}}}},"scoreInterval":{"type":"object","description":"Score range for accepting or denying the rule.","properties":{"accept":{"type":"number","description":"Minimum score required to accept the rule."},"deny":{"type":"number","description":"Maximum score to deny the rule."}}},"authorizationData":{"type":"object","description":"Defines required authorizers and whether all must approve (only present for rules with `effectType: 2`).","properties":{"requireAllApprovals":{"type":"boolean","description":"Whether all authorizers must approve."},"authorizers":{"type":"array","description":"List of entities that can authorize the action.","items":{"type":"object","description":"Entity that can authorize an action.","required":["type","id"],"properties":{"type":{"type":"string","description":"Type of authorizer. For Organization Account, it's always `unit`."},"id":{"type":"string","description":"Unique identifier of the authorizer."}}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Registers a new dimension rule.

  >ℹ️ For more information about approval dynamic, and dimension and rule priorities, see the [Buying Policies API overview](https://developers.vtex.com/docs/api-reference/buying-policies-api).

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Manage Buying Policies | OMS | **ManageBuyingPolicies** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | (Required) Name of the VTEX account. |
  | `dimensionId` | path | (Required) Unique identifier for the authorization dimension. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "202cd02c-e36f-4f79-85f4-91210fac8b98",
    "name": "User Approval - Many approvers",
    "status": null,
    "priority": 1,
    "trigger": {
      "condition": {
        "conditionType": 2,
        "description": "Users 8f6b3712-4c05-4ce5-8057-63fd0d69a587 and 8f6b3712-4c05-4ce5-8057-63fd0d69a588 need to approve orders above $150",
        "expression": "$.openTextField.value = 'ODP use cases' and $.value > 30000"
      },
      "effect": {
        "description": "Orders with value above $150 must be approved",
        "effectType": 2
      }
    },
    "scoreInterval": {
      "accept": 10,
      "deny": 5
    },
    "authorizationData": {
      "requireAllApprovals": true,
      "authorizers": [
        {
          "id": "8f6b3712-4c05-4ce5-8057-63fd0d69a587",
          "type": "unit"
        },
        {
          "id": "8f6b3712-4c05-4ce5-8057-63fd0d69a588",
          "type": "unit"
        }
      ]
    }
  }
  ```
