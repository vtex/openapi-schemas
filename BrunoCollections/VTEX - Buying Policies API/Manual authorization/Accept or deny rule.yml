http:
  method: POST
  url: "{{baseUrl}}/commercial-authorizations/:orderAuthId/callback"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: orderAuthId
      value: 6f6d7472-e4d0-4004-a1d2-6d4ccc7e696a
      type: path
  body:
    type: json
    data: |-
      {
        "params": {
          "score": 10,
          "dimensionId": "d88e44b1-2791-4770-a9e3-d0fdc1a1c1fd",
          "ruleId": "2448612d-bbbf-4bc5-8b8c-b1c3f4f638e3"
        }
      }
  auth: inherit

