t."}}},"dimensionStatus":{"type":"array","description":"Approval status details per dimension.","items":{"type":"object","description":"Approval status details for a dimension.","properties":{"id":{"type":"string","description":"Unique identifier of the dimension status record."},"name":{"type":"string","description":"Dimension name."},"unitId":{"type":"string","description":"Unit identifier related to this dimension."},"userProfileId":{"type":"string","description":"User profile identifier related to this dimension."},"status":{"type":["string","null"],"description":"Current status of the dimension.","enum":[null,"accepted","denied","pending"]},"score":{"type":"integer","description":"Score assigned to the dimension."},"priority":{"type":"integer","description":"Priority of this dimension (lower = higher priority)."},"shouldSimulate":{"type":"boolean","description":"Indicates if this dimension should be simulated before application."},"ruleCollection":{"type":"array","description":"Rules applied to this dimension.","items":{"type":"object","description":"Information about a rule within a dimension.","properties":{"id":{"type":"string","description":"Unique identifier of the rule."},"name":{"type":"string","description":"Rule name."},"status":{"type":["string","null"],"description":"Current status of the rule.","enum":[null,"accepted","denied","pending"]},"doId":{"type":["string","null"],"description":"Optional decision object identifier."},"score":{"type":"integer","description":"Score assigned to the rule."},"priority":{"type":"integer","description":"Sequential evaluation priority for the rule. Lower numbers are evaluated first. Rules must be ordered: bypass, then deny, then sequential workflow."},"trigger":{"type":"object","description":"Trigger condition and effect for the rule.","properties":{"condition":{"type":"object","description":"Condition that triggers the rule.","properties":{"conditionType":{"type":"integer","description":"Type of condition, which can