info:
  name: List storefront resources
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/license-manager/storefront/resource?an=apiexamples"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: an
      value: apiexamples
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/license-manager/storefront/resource - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/license-manager/storefront/resource - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/license-manager/storefront/resource - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/license-manager/storefront/resource - Schema is valid", function () {
          const schema = {"type":"array","description":"List of all resources visible to the account.","items":{"type":"object","description":"Resource information.","properties":{"Id":{"type":"integer","description":"Resource identifier. Use this value when building custom roles."},"Key":{"type":"string","description":"Stable permission key checked at runtime."},"Name":{"type":["string","null"],"description":"Human-readable label. May be `null` for native resources."},"Description":{"type":["string","null"],"description":"Optional description."},"IsCustom":{"type":"boolean","description":"Set to `true` when the resource belongs to the account or `false` for native VTEX resources."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns every storefront resource visible to the account, including native VTEX resources and the account's own custom resources.

  > ⚠️ This feature is available only for stores using B2B Buyer Portal, currently available for select accounts.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | License Manager | Services access control | **View Storefront User Permissions** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `an` | query | (Required) VTEX account name. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    {
      "Id": 1,
      "Key": "ViewUsers",
      "Name": "View Users",
      "Description": null,
      "IsCustom": false
    },
    {
      "Id": 42,
      "Key": "report_viewer",
      "Name": "Report Viewer",
      "Description": "Allows access to reporting",
      "IsCustom": true
    }
  ]
  ```
