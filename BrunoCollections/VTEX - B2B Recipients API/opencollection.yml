opencollection: 1.0.0

info:
  name: VTEX - B2B Recipients API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The B2B Recipients API allows you to create, retrieve, update, and delete recipient documents stored in the `contact_information` [Master Data](https://developers.vtex.com/docs/guides/master-data-introduction) data entity.

    >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

    ## Index

    ### Recipients
    - `POST` [Create new recipient](https://developers.vtex.com/docs/api-reference/b2b-recipients-api#post-/api/dataentities/contact_information/documents)
    - `GET` [Search recipients](https://developers.vtex.com/docs/api-reference/b2b-recipients-api#get-/api/dataentities/contact_information/search)
    - `GET` [Get recipient by ID](https://developers.vtex.com/docs/api-reference/b2b-recipients-api#get-/api/dataentities/contact_information/documents/-id-)
    - `PATCH` [Update recipient](https://developers.vtex.com/docs/api-reference/b2b-recipients-api#patch-/api/dataentities/contact_information/documents/-id-)
    - `DELETE` [Delete recipient](https://developers.vtex.com/docs/api-reference/b2b-recipients-api#delete-/api/dataentities/contact_information/documents/-id-)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
