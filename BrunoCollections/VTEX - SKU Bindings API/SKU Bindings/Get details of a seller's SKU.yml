info:
  name: Get details of a seller's SKU
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/sku-binding/pvt/skuseller/:sellerId/:sellerSkuId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: sellerId
      value: fashionstore
      type: path
    - name: sellerSkuId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/sku-binding/pvt/skuseller/:sellerId/:sellerSkuId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/sku-binding/pvt/skuseller/:sellerId/:sellerSkuId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/sku-binding/pvt/skuseller/:sellerId/:sellerSkuId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/sku-binding/pvt/skuseller/:sellerId/:sellerSkuId - Schema is valid", function () {
          const schema = {"type":"object","required":["IsPersisted","IsRemoved","SkuSellerId","SellerId","StockKeepingUnitId","SellerStockKeepingUnitId","IsActive","UpdateDate","RequestedUpdateDate"],"properties":{"IsPersisted":{"type":"boolean","description":"Defines if the seller is persisted."},"IsRemoved":{"type":"boolean","description":"Defines if the seller is removed."},"SkuSellerId":{"type":"integer","description":"SKU ID in the seller's store."},"UpdateDate":{"type":"string","description":"Date when the SKU binding was updated for the last time, in UTC format."},"RequestedUpdateDate":{"type":["string","null"],"description":"Date when an SKU binding update was requested for the last time, in UTC format."},"SellerStockKeepingUnitId":{"type":"string","description":"SKU seller ID."},"SellerId":{"type":"string","description":"ID that identifies the seller in the marketplace. It can be the same as the seller name or a unique number. Check the **Sellers management** section in the Admin to get the correct ID."},"StockKeepingUnitId":{"type":"integer","description":"SKU ID in the VTEX marketplace."},"IsActive":{"type":"boolean","description":"Defines if the SKU binding is active."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a seller SKU details, given a seller ID and the SKU ID in the seller's store.

   > ℹ This path is an updated version of `/api/catalog_system/pvt/skuseller/{sellerId}/{sellerSkuId}`.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Catalog API | General | **View Product** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `sellerId` | path | (Required) ID that identifies the seller in the marketplace. It can be the same as the seller name or a unique number. Check the **Sellers management** section in the VTEX Admin to get the correct ID. |
  | `sellerSkuId` | path | (Required) SKU ID in the seller's store. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "IsPersisted": true,
    "IsRemoved": false,
    "SkuSellerId": 799,
    "UpdateDate": "2025-10-11T04:52:42.1",
    "RequestedUpdateDate": null,
    "SellerStockKeepingUnitId": "502",
    "SellerId": "fashionstore",
    "StockKeepingUnitId": 50,
    "IsActive": true
  }
  ```
