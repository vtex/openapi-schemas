opencollection: 1.0.0

info:
  name: VTEX - Card Token Vault API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The Card Token Vault API allows VTEX merchants to manage card tokens, including creation, updates, retrieval, deletion, and bulk imports. Card tokens are unique identifiers that represent securely stored credit card data.

    > ⚠️ This feature is in closed beta, meaning only specific customers can access it now. If you want to implement it in the future, please contact [our Support](https://support.vtex.com/hc/en-us/).

    >ℹ️ The endpoints of this API can be used for personal cards (cards associated with a single buyer) and shared cards (cards used by more than one person and associated with a specific contract). However, in a scenario of operations with personal cards, the `shopperId` must be additionally sent on the **Created card token** or **Updated card token** endpoints.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
