info:
  name: Order invoice notification
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/orders/pvt/document/:orderId/invoices"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: orderId
      value: v71021948str-01
      type: path
  body:
    type: json
    data: |-
      {
        "type": "Output",
        "issuedDate": "2024-09-20",
        "invoiceNumber": "000059579",
        "invoiceValue": 2499,
        "items": [
          {
            "itemIndex": 0,
            "price": 2499,
            "quantity": 3
          },
          {
            "itemIndex": 0,
            "price": 2499,
            "quantity": 3
          }
        ],
        "extraValue": 100,
        "invoiceKey": "33240945242914001845550010004817221546274961",
        "invoiceUrl": "https://ecommerce.str.com/logged/nf/v71021948str-01",
        "courier": "OSAPLAG_EXPRESS",
