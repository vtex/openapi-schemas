info:
  name: Get installments options
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/pvt/installments?request.value=10"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: request.value
      value: "10"
      type: query
    - name: request.salesChannel
      value: "1"
      type: query
      disabled: true
    - name: request.paymentDetails[0].id
      value: "2"
      type: query
      disabled: true
    - name: request.paymentDetails[0].value
      value: "10"
      type: query
      disabled: true
    - name: request.paymentDetails[0].bin
      value: "411111"
      type: query
      disabled: true
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

