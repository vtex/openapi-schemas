http:
  method: GET
  url: "{{baseUrl}}/api/pvt/transactions/:transactionId/payments/:paymentId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: transactionId
      value: A3BDE325F76B4B758B398D900DF06150
      type: path
    - name: paymentId
      value: B2E754DCD7304D22866CB6F221CF0FEB
      type: path
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

