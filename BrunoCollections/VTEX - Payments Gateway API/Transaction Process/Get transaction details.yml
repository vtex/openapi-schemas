        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/pvt/transactions/:transactionId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/pvt/transactions/:transactionId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/pvt/transactions/:transactionId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/pvt/transactions/:transactionId - Schema is valid", function () {
          const schema = {"required":["id","transactionId","referenceKey","interactions","settlements","payments","refunds","cancellations","capabilities","timeoutStatus","totalRefunds","status","value","receiverUri","startDate","authorizationToken","authorizationDate","commitmentToken","commitmentDate","refundingToken","refundingDate","cancelationToken","cancelationDate","fields","shopperInteraction","ipAddress","sessionId","macId","vtexFingerprint","chargeback","whiteSignature","owner","orderId","userAgent","acceptHeader","antifraudTid","antifraudResponse","antifraudReference","antifraudAffiliationId","channel","salesChannel","urn","softDescriptor","markedForRecurrence","buyer"],"type":"object","description":"Transaction details response body information.","properties":{"id":{"type":"string","description":"Transaction identification."},"transactionId":{"type":"string","description":"Transaction identification (same value of the `id` field)."},"referenceKey":{"type":"string","description":"Field used for anti-fraud to identify the transaction."},"interactions":{"required":["href"],"type":"object","description":"Object containing the reference route of transaction interactions.","properties":{"href":{"type":"string","description":"Transaction interaction reference route."}}},"settlements":{"required":["href"],"type":"object","description":"Object containing the reference route of transaction settlements.","properties":{"href":{"type":"string","description":"Transaction settlement reference route."}}},"payments":{"required":["href"],"type":"object","description":"Object containing the reference route of transaction payments.","properties":{"href":{"type":"string","description":"Transaction payment reference route."}}},"refunds":{"required":["href"],"type":"object","description":"Object containing the reference route of transaction refunds.","properties":{"href":{"type":"string","description":"Transaction refund reference route."}}},"cancellations":{"required":["href"],"type":"object","description":"Object containing the reference route of transaction cancellations.","properties":{"href":{"type":"string","description":"Transaction cancellation reference route."}}},"capabilities":{"required":["href"],"type":"object","description":"Object containing the reference route of transaction capabilities.","properties":{"href":{"type":"string","description":"Transaction capabilities reference route."}}},"timeoutStatus":{"type":"number","description":"Field that represents the possible transaction timeout statuses. Possible statuses and meanings: `0` = NotStarted, `1` = CancellingOrFinishing, `2` = CancellingOrFinishingByTimeout, `3` = CancelledOrFinished and `4` = TriesExceeded.","enum":[0,1,2,3,4]},"totalRefunds":{"type":"number","description":"Total refunded transaction amount."},"status":{"type":"string","description":"Transaction status."},"value":{"type":"number","description":"Transaction value."},"receiverUri":{"type":["string","null"],"description":"Receiver [URI](https://en.wikipedia.org/wiki/Uniform_Resource_Identifier) information."},"startDate":{"type":"string","description":"Transaction start date."},"authorizationToken":{"type":["string","null"],"description":"Transaction authorization token."},"authorizationDate":{"type":["string","null"],"description":"Transaction authorization date."},"commitmentToken":{"type":["string","null"],"description":"Transaction completion token."},"commitmentDate":{"type":["string","null"],"description":"Transaction completion date."},"refundingToken":{"type":["string","null"],"description":"Transaction refund token."},"refundingDate":{"type":["string","null"],"description":"Transaction refund date."},"cancelationToken":{"type":["string","null"],"description":"Transaction cancellation token."},"cancelationDate":{"type":["string","null"],"description":"Transaction cancellation date."},"fields":{"type":"array","items":{"required":["name","value"],"type":"object","description":"Payment parameters information.","properties":{"name":{"type":"string","description":"Payment parameter name."},"value":{"type":"string","description":"Payment parameter value."}}},"description":"Field containing information and values of payment parameters."},"shopperInteraction":{"type":"string","description":"Transaction origin."},"ipAddress":{"type":["string","null"],"description":"Ip address information."},"sessionId":{"type":["string","null"],"description":"Session identification."},"macId":{"type":"string","description":"Random [UUID](https://en.wikipedia.org/wiki/Universally_unique_identifier) V4 generated when the Request Capture receives a session that does not contain the macID already set. This value is set to the cookie `VtexRCMacIdv7`. The cookie has 1 year of expiration."},"vtexFingerprint":{"type":["string","null"],"description":"VTEX fingerprint information."},"chargeback":{"type":["string","null"],"description":"Chargeback information."},"whiteSignature":{"type":["string","null"],"description":"White signature (anti-fraud list) information."},"owner":{"type":"string","description":"Responsible for transaction request."},"orderId":{"type":["string","null"],"description":"Order identitication."},"userAgent":{"type":"string","description":"HTTP client used in the transaction."},"acceptHeader":{"type":"string","description":"Type of content accepted in the transaction request header."},"antifraudTid":{"type":["string","null"],"description":"Anti-fraud transaction identification."},"antifraudResponse":{"type":["string","null"],"description":"Anti-fraud response information."},"antifraudReference":{"type":["string","null"],"description":"Anti-fraud reference information."},"antifraudAffiliationId":{"type":["string","null"],"description":"Anti-fraud affiliation identification."},"channel":{"type":"string","description":"Store where the transaction was initiated."},"salesChannel":{"type":"string","description":"Sales channel information."},"urn":{"type":["string","null"],"description":"[URN](https://en.wikipedia.org/wiki/Uniform_Resource_Name) information."},"softDescriptor":{"type":["string","null"],"description":"Custom field for a transaction that can be displayed on the customer's invoice."},"markedForRecurrence":{"type":"boolean","description":"Indicates whether the payment transaction should be recurring."},"buyer":{"type":["object","null"],"description":"Buyer information.","properties":{"firstName":{"type":"string","description":"Buyer first name."},"lastName":{"type":"string","description":"Buyer last name."},"documentType":{"type":"string","description":"Type of the document informed by the buyer."},"document":{"type":"string","description":"Document informed by the buyer."},"email":{"type":"string","description":"Buyer email address."},"address":{"type":"string","description":"Buyer address."},"phone":{"type":"string","description":"Buyer phone number."}}}}};
