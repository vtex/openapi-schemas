info:
  name: Get transaction details
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/pvt/transactions/:transactionId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: transactionId
      value: A3BDE325F76B4B758B398D900DF06150
      type: path
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

runtime:
