info:
  name: Get card data
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/payments/pvt/account/:cardId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: cardId
      value: 719f3698-d8cb-41af-13a7-41f63982bcd2
      type: path

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/payments/pvt/account/:cardId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/payments/pvt/account/:cardId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/payments/pvt/account/:cardId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/payments/pvt/account/:cardId - Schema is valid", function () {
          const schema = {"type":"object","properties":{"bin":{"type":"string","description":"First six digits of the card number."},"lastDigits":{"type":"string","description":"Last four digits of the card."},"expiryMonth":{"type":"string","description":"Card expiration month (2-digits)."},"expiryYear":{"type":"string","description":"Card expiration year (4-digits)."},"mask":{"type":"string","description":"Masked card number."},"paymentSystem":{"type":"integer","description":"Payment system ID in the Payment Gateway."},"paymentSystemName":{"type":"string","description":"Payment system name (card brand)."},"address":{"type":"object","description":"Card address (optional).","properties":{"addressType":{"type":"string","description":"Address type.","enum":["Residential","Commercial"]},"addressId":{"type":"string","description":"Address ID."},"postalCode":{"type":"string","description":"Postal code."},"street":{"type":"string","description":"Street name."},"neighborhood":{"type":"string","description":"Neighborhood name."},"city":{"type":"string","description":"City name."},"state":{"type":"string","description":"State or province."},"country":{"type":"string","description":"Country code."},"number":{"type":"string","description":"Street number."},"complement":{"type":"string","description":"Address complement."}}},"document":{"type":"string","description":"Card holder's document."},"tokens":{"type":"object","description":"Card tokens information (optional).","properties":{"providerId":{"type":"string","description":"Name of the connector's owner account (`accountName`) used to create the token."},"type":{"type":"string","description":"Token type stored in the vault.","enum":["FILE","TOKEN_CLIENT_ID","TOKEN_VALUE"]},"value":{"type":"string","description":"Token value."},"expiration":{"type":"string","description":"Token expiration date in `YYYY-MM` format."},"label":{"type":"string","description":"Token alias (an alternative name to simplify token identification)."},"href":{"type":"string","description":"URL of the token file stored by the provider."},"providerCardTokenId":{"type":"string","description":"Client ID used to retrieve the token from the provider."},"useCvvForAuthorization":{"type":"boolean","description":"Flag indicating if CVV is required (`true`) or not (`false`)."},"extraData":{"type":"object","description":"Additional metadata stored with the token.","properties":{"customField1":{"type":"string","description":"Custom field information."}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves the public data of a specific credit card stored in the store.

  Before consulting the card details, consider the following information:
  - Sensitive data such as full card number and CVV are not returned.
  - The `tokens` field is optional. It is included in the response only if the card you are retrieving has already been tokenized.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/authentication-overview#api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise, they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | PCI Gateway | Payment-ViewPaymentData | **View Payment Data** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint.

  To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication-overview#machine-authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `cardId` | path | (Required) Card identification. This is the `accountId` associated with the client's profile, which can be viewed by accessing [Profile System](https://developers.vtex.com/docs/guides/profile-system#profile-system-api-reference). As a client can have more than one card registered in their profile, check the desired `accountId` and send it in this request. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "bin": "370176",
    "lastDigits": "3550",
    "expiryMonth": "12",
    "expiryYear": "2025",
    "mask": "XXXX-XXXX-XXXX-1111",
    "paymentSystem": 2,
    "paymentSystemName": "Visa",
    "address": {
      "addressType": "Residential",
      "addressId": "address-id",
      "postalCode": "00000-000",
      "street": "Av. Example",
      "neighborhood": "Centro",
      "city": "Example City",
      "state": "SP",
      "country": "BRA",
      "number": "1000",
      "complement": "Apt 1"
    },
    "document": "12345678900",
    "tokens": {
      "providerId": "cosmetics2",
      "type": "TOKEN_VALUE",
      "value": "token-value",
      "expiration": "2025-12",
      "label": "Primary card",
      "href": "https://provider.example/token-file",
      "providerCardTokenId": "provider-token-id",
      "useCvvForAuthorization": false,
      "extraData": {
        "customField1": "value1",
        "customField2": "value2"
      }
    }
  }
  ```
