n connector (anti-fraud provider) identification."}}},"installmentOptions":{"required":["dueDateType","interestRateMethod","minimumInstallmentValue","installments"],"type":["object","null"],"description":"Installment options information.","properties":{"dueDateType":{"type":"number","description":"Indicates whether the billing date will be at the end (0) or beginning of the period (1).","enum":[0,1]},"interestRateMethod":{"type":["number","null"],"description":"Indicates the type of interest to calculate the value of the installments (Compound Interest = `null` or `0`, Simple Interest Rate with Tax = `1` and Single Interest = `2`).","enum":[null,0,1,2]},"minimumInstallmentValue":{"type":"number","description":"Minimum value of each installment."},"installments":{"type":"array","description":"Array containing installments information.","items":{"required":["ruleId","quantity","value","interestRate","isExternalInstallmentService","interestTax"],"type":"object","description":"Installments information.","properties":{"ruleId":{"type":["string","null"],"description":"Rule identification."},"quantity":{"type":"integer","description":"Number of installments."},"value":{"type":"number","description":"Value of each installment."},"interestRate":{"type":"number","description":"Interest rate (percent 0.1 = 10%)."},"isExternalInstallmentService":{"type":["number","null"],"description":"Indicates the external installment system (if applicable)."},"interestTax":{"type":["number","null"],"description":"Interest tax (percent 0.1 = 10%)."}}}}}},"isSelfAuthorized":{"type":["boolean","null"],"description":"Indicates whether the payment is automatically authorized."},"requiresAuthentication":{"type":["boolean","null"],"description":"Indicates whether it is necessary to log in to make the payment."},"enabled":{"type":"boolean","description":"Indicates whether the rule is enabled in the store."},"installmentsService":{"type":"boolean","description":"Indicates whether any specific type of