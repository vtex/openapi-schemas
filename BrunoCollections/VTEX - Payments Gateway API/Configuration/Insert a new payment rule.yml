description":"Time, days of the week and GMT time zone in which the rule is deactivated. This data is available in [CRON format](https://en.wikipedia.org/wiki/Cron)."}}}},"externalInterest":{"type":"boolean","description":"Indicates whether interest can be calculated externally."},"minimumValue":{"type":["number","null"],"description":"Minimum payment transaction amount for the rule to be applied."},"deadlines":{"type":"array","description":"Array containing information about the payment deadlines (applicable for credit payment method).","items":{"type":"object","description":"Payment deadlines information.","required":["paymentOptions"],"properties":{"paymentOptions":{"type":"array","description":"Array containing payment options information.","items":{"required":["days","interestRate"],"type":"object","description":"Payment options information.","properties":{"days":{"type":"number","description":"Deadline in days to make payment."},"interestRate":{"type":"number","description":"Interest rate applied (in percentage, e.g. `3.0` means 3%)."}}}}}}},"cobrand":{"required":["name"],"type":"object","description":"Information about the cobranded card.","properties":{"name":{"type":["string","null"],"description":"Card name."}}},"cardLevel":{"required":["name"],"type":"object","description":"Information about the card category.","properties":{"name":{"type":["string","null"],"description":"Card category name (e.g. standard, gold, premium)."}}},"excludedBinsRanges":{"type":["number","null"],"description":"Range of card bins excluded from application of this rule."}}};
