runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[PUT]::/api/pvt/affiliations/:affiliationId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/api/pvt/affiliations/:affiliationId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[PUT]::/api/pvt/affiliations/:affiliationId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[PUT]::/api/pvt/affiliations/:affiliationId - Schema is valid", function () {
          const schema = {"type":"object","description":"Affiliation by ID response body information.","required":["id","implementation","name","configuration","isdelivered","isConfigured"],"properties":{"id":{"type":"string","description":"Provider identification."},"implementation":{"type":"string","description":"Provider implementation class name."},"name":{"type":"string","description":"Provider name."},"configuration":{"type":"array","description":"Array containing provider configuration information.","items":{"type":"object","description":"Provider configuration information.","required":["name","value","valueKey"],"properties":{"name":{"type":"string","description":"Configuration parameter name."},"value":{"type":"string","description":"Configuration parameter value."},"valueKey":{"type":["string","null"],"description":"Value key information."}}}},"isdelivered":{"type":"boolean","description":"Indicates whether the provider is published and available for use."},"isConfigured":{"type":"boolean","description":"Indicates whether the provider is configured."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates information about an affiliation (payment or anti-fraud provider) configured in your store.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | PCI Gateway | Payment-ManageStore | **Manage Store** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `affiliationId` | path | (Required) Affiliation (payment or anti-fraud provider) identification. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "fg8b4ea5-0b24-47dc-971e-2f6635ea1f14",
    "implementation": "Vtex.PaymentGateway.Connectors.CieloV3Connector",
    "name": "CieloV3 - Test",
    "configuration": [
      {
        "name": "HowTo",
        "value": "https://developercielo.github.io/payment-method-enablement/",
        "valueKey": null
      },
      {
        "name": "MerchantId",
        "value": "sampleData_2",
        "valueKey": null
      },
      {
        "name": "MerchantKey",
        "value": "**********",
        "valueKey": null
      },
      {
        "name": "softDescriptor",
        "value": "teste_update",
        "valueKey": null
      },
      {
        "name": "bankInvoiceProvider",
        "value": "Disabled",
        "valueKey": null
      },
      {
        "name": "bankIDebitProvider",
        "value": "Disabled",
        "valueKey": null
      },
      {
        "name": "useEarlySecurityCapture",
        "value": "0",
        "valueKey": null
      },
      {
        "name": "isProduction",
        "value": "false",
        "valueKey": null
      },
      {
        "name": "bankDebitProvider",
        "value": "Disabled",
        "valueKey": null
      },
      {
        "name": "Registered",
        "value": "false",
        "valueKey": null
      }
    ],
    "isdelivered": true,
    "isConfigured": true
  }
  ```
