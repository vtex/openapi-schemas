info:
  name: List all available payment methods
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/pvt/merchants/payment-systems"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: salesChannel
      value: "1"
      type: query
      disabled: true
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/pvt/merchants/payment-systems - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/pvt/merchants/payment-systems - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/pvt/merchants/payment-systems - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/pvt/merchants/payment-systems - Schema is valid", function () {
          const schema = {"type":"array","description":"Payment methods information.","items":{"required":["id","name","requiresDocument","implementation","connectorImplementation","antifraudConnectorImplementation","groupName","redirect","isCustom","isSelfAuthorized","requiresAuthentication","allowInstallments","allowBinExclusion","allowMultiple","allowIssuer","allowCountry","allowCommercialPolicy","allowCommercialCondition","allowPeriod","isAvailable","description","supportRecurrence","validator","appDependencies","displayDocument","dueDate","allowNotification","affiliationId","availablePayments","dueDateMinutes"],"type":"object","description":"Available payment methods response body information.","properties":{"id":{"type":"number","description":"Payment method identification."},"name":{"type":"string","description":"Payment method name."},"requiresDocument":{"type":"boolean","description":"Indicates whether a document is required."},"implementation":{"type":"string","description":"Payment method implementation class name."},"connectorImplementation":{"type":"string","description":"Connector (payment provider) implementation class name."},"antifraudConnectorImplementation":{"type":["string","null"],"description":"Connector (anti-fraud provider) implementation class name."},"groupName":{"type":"string","description":"Payment group name."},"redirect":{"type":"boolean","description":"Indicates whether the payment method allows redirection."},"isCustom":{"type":"boolean","description":"Indicates whether it is custom."},"isSelfAuthorized":{"type":"boolean","description":"Indicates whether the payment is automatically authorized."},"requiresAuthentication":{"type":"boolean","description":"Indicates whether it is necessary to log in to make the payment."},"allowInstallments":{"type":"boolean","description":"Indicates whether the payment method allows installments."},"allowBinExclusion":{"type":"boolean","description":"Indicates whether it is possible to restrict the use of specific BIN codes (only applicable for cards)."},"allowMultiple":{"type":"boolean","description":"Indicates whether the method allows multiple payments. Example of `false`: debit card."},"allowIssuer":{"type":"boolean","description":"Indicates whether it is possible to identify the name of the bank responsible for issuing the card."},"allowCountry":{"type":"boolean","description":"Indicates whether it is possible to restrict a payment rule by the country where the purchase is made."},"allowCommercialPolicy":{"type":"boolean","description":"Indicates whether to restrict a payment rule by commercial policy type."},"allowCommercialCondition":{"type":"boolean","description":"Indicates whether to restrict a payment rule by commercial condition type."},"allowPeriod":{"type":"boolean","description":"Indicates whether it is possible to restrict a period for making the payment."},"isAvailable":{"type":"boolean","description":"Indicates whether the payment method is available for use."},"description":{"type":["string","null"],"description":"Description of the payment method."},"supportRecurrence":{"type":"boolean","description":"Indicates whether the payment method supports recurrence."},"validator":{"required":["regex","mask","cardCodeMask","cardCodeRegex","weights","useCvv","useExpirationDate","useCardHolderName","useBillingAddress","validCardLengths"],"type":"object","description":"Validator information.","properties":{"regex":{"type":["string","null"],"description":"[Regex](https://regexr.com/) information."},"mask":{"type":["string","null"],"description":"Validator mask."},"cardCodeMask":{"type":["string","null"],"description":"Card code regular mask."},"cardCodeRegex":{"type":["string","null"],"description":"Card code regular expression."},"weights":{"type":["array","null"],"description":"Array containing weigths information.","items":{"type":"integer","description":"Weigths information."}},"useCvv":{"type":"boolean","description":"Indicates whether it is necessary to use the CVV code to complete a transaction with payment made by card."},"useExpirationDate":{"type":"boolean","description":"Indicates whether it is necessary to use the expiration date to complete a card payment transaction."},"useCardHolderName":{"type":"boolean","description":"Indicates whether it is necessary to use the card holder name to complete a payment transaction made by card."},"useBillingAddress":{"type":"boolean","description":"Indicates whether it is necessary to use the billing address to complete a card payment transaction."},"validCardLengths":{"type":["string","null"],"description":"Information about valid card lengths."}}},"appDependencies":{"type":["string","null"],"description":"App dependencies information."},"displayDocument":{"type":"boolean","description":"Indicates whether a document is shown."},"dueDate":{"type":"string","description":"Payment due date."},"allowNotification":{"type":"boolean","description":"Indicates the possibility of payment notification (used by bank invoices and notes payable)."},"affiliationId":{"type":["string","null"],"description":"Affiliation connector (payment provider) identification."},"availablePayments":{"type":["string","null"],"description":"Information about payment availability."},"dueDateMinutes":{"type":"number","description":"Amount of time (in minutes) until the payment date (`dueDate`)."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns all payment methods (such as Visa, Master, among others) that can be used in your store.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | PCI Gateway | Payment-Make Payments | **View Payment Data** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `salesChannel` | query | Sales channel ([trade policy](https://help.vtex.com/en/tutorial/how-trade-policies-work--6Xef8PZiFm40kg2STrMkMV)) identification. This parameter must be filled in if you wish to obtain information on payment methods available in a specific store sales channel. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

