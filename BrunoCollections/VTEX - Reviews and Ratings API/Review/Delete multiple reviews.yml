info:
  name: Delete multiple reviews
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/reviews-and-ratings/api/reviews"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      [
        "babefcf4-e0f7-11ec-835d-16c4e59c4351",
        "c123def5-e0f7-11ec-835d-16c4e59c4352"
      ]
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[DELETE]::/reviews-and-ratings/api/reviews - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[DELETE]::/reviews-and-ratings/api/reviews - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[DELETE]::/reviews-and-ratings/api/reviews - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[DELETE]::/reviews-and-ratings/api/reviews - Schema is valid", function () {
          const schema = {"description":"Indicates if the review was deleted (`true`) or not (`false`).","type":"boolean"};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Deletes multiple reviews at once. 

   ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  true
  ```
