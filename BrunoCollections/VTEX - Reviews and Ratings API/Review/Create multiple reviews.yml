info:
  name: Create multiple reviews
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/reviews-and-ratings/api/reviews"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      [
        {
          "id": "1",
          "productId": "65444",
          "rating": 4,
          "title": "Great product",
          "text": "Great product!",
          "reviewerName": "Arturo",
          "approved": true
        },
        {
          "id": "2",
          "productId": "65444",
          "rating": 4,
          "title": "Great product",
          "text": "Great product!",
          "reviewerName": "Arturo",
          "approved": true
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/reviews-and-ratings/api/reviews - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/reviews-and-ratings/api/reviews - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/reviews-and-ratings/api/reviews - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/reviews-and-ratings/api/reviews - Schema is valid", function () {
          const schema = {"description":"List of review IDs.","type":"array","items":{"description":"Review ID.","type":"string"}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates multiple reviews for more than one product in a single operation.
  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). 
   For authentication, you must generate and use only the API key and the Application Token to work with this endpoint. Refer to the [API authentication using application keys](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) and [Generating internal application keys](https://help.vtex.com/en/tutorial/api-keys--2iffYzlvvz4BDMr6WGUtet#generating-internal-api-keys) guide for more information.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  [
    "8e1a5e11-c0c9-11ec-835d-0a591b8a3ec1",
    "9257c203-c0c9-11ec-835d-0e02dd207951"
  ]
  ```
