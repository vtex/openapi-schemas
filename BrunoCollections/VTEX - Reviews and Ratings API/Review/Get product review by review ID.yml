info:
  name: Get product review by review ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/reviews-and-ratings/api/review/:reviewId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reviewId
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/reviews-and-ratings/api/review/:reviewId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/reviews-and-ratings/api/review/:reviewId - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/reviews-and-ratings/api/review/:reviewId - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/reviews-and-ratings/api/review/:reviewId - Schema is valid", function () {
          const schema = {"description":"Response body object.","type":"object","properties":{"id":{"description":"Review ID.","type":"string"},"productId":{"description":"Product ID.","type":"string"},"rating":{"description":"Customer rating.","type":"number"},"title":{"description":"Review's title.","type":"string"},"text":{"description":"Review's text.","type":"string"},"reviewerName":{"description":"Reviewer name.","type":"string"},"shopperId":{"description":"Shopper email.","type":"string"},"reviewDateTime":{"description":"Review's date and time.","type":"string"},"searchDate":{"description":"Review's search date.","type":"string"},"verifiedPurchaser":{"description":"Indicates if the reviewer is a verified purchaser (`true`) or not (`false`).","type":"boolean"},"sku":{"description":"SKU ID.","type":["string","null"]},"approved":{"description":"Indicates if the review was approved (`true`) or not (`false`).","type":"boolean"},"location":{"description":"Review's origin location.","type":["string","null"]},"locale":{"description":"Review's locale.","type":["string","null"]},"pastReviews":{"description":"Past reviews of the same product.","type":["string","null"]}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves information of a product review based on the review's ID.

   ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `reviewId` | path | (Required) Review ID. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "id": "5323fdaa-c012-11ec-835d-0ebee58edbb3",
    "productId": "1",
    "rating": 5,
    "title": "Great product",
    "text": "Great product.",
    "reviewerName": "Arturo",
    "shopperId": "user@email.com",
    "reviewDateTime": "04/19/2022 18:55:58",
    "searchDate": "2022-04-19T18:55:58Z",
    "verifiedPurchaser": false,
    "sku": "2",
    "approved": false,
    "location": null,
    "locale": "en-US",
    "pastReviews": null
  }
  ```
