info:
  name: Get order
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/orders/pvt/document/:orderId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reason
      value: data-validation
      type: query
      disabled: true
    - name: orderId
      value: v71021948str-01
      type: path
  auth: inherit

