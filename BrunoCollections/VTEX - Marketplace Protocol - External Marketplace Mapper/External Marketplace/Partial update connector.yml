info:
  name: Partial update connector
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/api/channel-manager/connector/:connectorId?an=apiexemple"
  headers:
    - name: Accept
      value: application/json
    - name: Content-type
      value: application/json-patch+json
  params:
    - name: an
      value: apiexemple
      type: query
    - name: environment
      value: "{{environment}}"
      type: path
    - name: connectorId
      value: "46"
      type: path
  body:
    type: json
    data: |-
      {
        "path": "/segment",
        "op": "replace",
        "value": "DEPARTMENT_STORES"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Partially updates the connector's information. The payload follows the format defined by RFC 6902, where a list of operations is informed, including the path of the field inside the object and its value./n/nThis action can only be executed by the account name that owns the connector's registration.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `connectorId` | path | (Required) Connector's ID in Channel Manager, available through the list all connectors route, or in the response of the registration. |
  | `an` | query | (Required) VTEX's account name owned by the connector/partner, ex. `apiexemple`. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-type` | header | (Required) Required header to indicate the request is a PATCH. |
