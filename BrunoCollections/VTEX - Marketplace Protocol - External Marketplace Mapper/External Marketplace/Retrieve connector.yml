info:
  name: Retrieve connector
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/channel-manager/connector/:connectorId?an=apiexemple"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  params:
    - name: an
      value: apiexemple
      type: query
    - name: environment
      value: "{{environment}}"
      type: path
    - name: connectorId
      value: "46"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieve a specific connector registered in VTEX platform.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `connectorId` | path | (Required) Connector's ID in Channel Manager, available through the List all connectors, or in the response of the registration. |
  | `an` | query | (Required) VTEX's account name owned by the connector/partner. |
  | `accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `content-type` | header | (Required) Describes the type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "id": 46,
    "name": "B2W",
    "website": "https://venda.americanasmarketplace.com.br/cadastre-sua-loja/",
    "logo": "https://s3.amazonaws.com/Marketplace-Integration/Bridge/logos/skyhub.png",
