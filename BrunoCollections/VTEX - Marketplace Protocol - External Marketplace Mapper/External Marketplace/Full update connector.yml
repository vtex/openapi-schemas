info:
  name: Full update connector
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/channel-manager/connector/:connectorId?an=apiexemple"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: an
      value: apiexemple
      type: query
    - name: environment
      value: "{{environment}}"
      type: path
    - name: connectorId
      value: "46"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Mercado Livre Classic",
        "website": "mercadolivre.com.br",
        "logo": "https://g.foolcdn.com/art/companylogos/square/meli.png",
        "description": "Mercado Libre operates online commerce platforms in Latin America. It operates Mercado Libre Marketplace, an automated online commerce platform that enables businesses, merchants, and individuals to list merchandise and conduct sales and purchases online.",
        "segment": "OTHERS",
        "availableCountries": [
          "BRA",
          "ARG"
        ],
        "connectorVtexAdminPath": "/bridge/#/settings?openConfig=mercadolivre",
        "connectorApiEndpoint": "portal.vtexcommercestable.com/api/meliintegration/notifications"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Fully updates the connector's information. All required fields must be sent in the body of the request./n/nThis action can only be executed by the account name that owns the connector's registration.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `connectorId` | path | (Required) Connector's ID in Channel Manager, available through the list all connectors route, or in the response of the registration. |
  | `an` | query | (Required) VTEX's account name owned by the connector or partner, ex. `apiexemple`. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
