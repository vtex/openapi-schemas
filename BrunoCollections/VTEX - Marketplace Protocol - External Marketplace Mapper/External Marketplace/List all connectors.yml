info:
  name: List all connectors
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/channel-manager/connector/all?an=apiexemple&pageSize=15"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  params:
    - name: an
      value: apiexemple
      type: query
    - name: segment
      value: department_stores
      type: query
      disabled: true
    - name: orderByConnectorType
      value: "true"
      type: query
      disabled: true
    - name: active
      value: "true"
      type: query
      disabled: true
    - name: name
      value: Dafiti
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: pageSize
      value: "15"
      type: query
    - name: country
      value: bra
      type: query
      disabled: true
    - name: type
      value: vtex
      type: query
      disabled: true
    - name: account
      value: cea
      type: query
      disabled: true
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

