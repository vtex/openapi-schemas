          const schema = {"description":"Expected success response from List all connector API.","type":"object","properties":{"metadata":{"title":"metadata","description":"Summary of data returned by the query.","type":"object","properties":{"totalCount":{"description":"Total data returned.","type":"number"},"currentPage":{"description":"Current result page.","type":"number"},"pageSize":{"description":"How many results will be displayed per page.","type":"number"},"totalPages":{"description":"Total pages the query returned.","type":"number"}}},"results":{"description":"Query result with information for each connector.","type":"array","items":{"description":"Connector information.","type":"object","properties":{"id":{"description":"Connector Id.","type":"number"},"name":{"description":"Connector name.","type":"string"},"website":{"description":"Connector website.","type":"string"},"logo":{"description":"URL of the logo used by the connector.","type":"string"},"description":{"description":"Connector presentation.","type":"string"},"helpUrl":{"description":"URL of connector integration documentation page.","type":"string"},"segment":{"description":"Market segment.","type":"string"},"availableCountries":{"description":"List of countries where connector is available for integration.","type":"array","items":{"description":"Country code.","type":"string"}},"availableStates":{"description":"States in which the connector operates, valid only for connectors that have area restriction.","type":"array","items":{"type":"string","description":"State code."}},"type":{"description":"What type of connector, if it is native, VTEX or partner.","type":"string"},"connectorPageUrl":{"description":"URL where the merchant will be redirected to start the onboarding process.","type":"string"},"connectorVtexAdminPath":{"description":"Admin VTEX URL, where the merchant will be redirected to manage and view his connections after integration.","type":"string"},"connectorApiEndpoint":{"description":"Partner Connector API base URL.","type":"string"},"channelId":{"description":"ID of the channel that a connector joins to.","type":"string"},"isGloballyAvailable":{"description":"In which version the connector is available.","type":"boolean"},"ownerVtexAccount":{"description":"Connector account name in VTEX.","type":"string"},"isActive":{"description":"Indicates whether the connector is active (`true`) or not (`false`).","type":"boolean"},"isCertified":{"description":"Indicates whether the connector is certified (`true`) or not (`false`).","type":"boolean"},"contactInfo":{"description":"Seller contact information.","type":"object","properties":{"name":{"description":"Name of the person responsible for the marketplace account interested in connecting to the merchant.","type":"string"},"email":{"description":"Email address of the person responsible for the marketplace account interested in connecting to the merchant.","type":"string"},"phone":{"description":"Phone of the person responsible for the marketplace account interested in connecting to the merchant.","type":"string"},"defaultMessage":{"description":"Introduction message and information of interest in the partnership with the merchant.","type":"string"}}},"isConnectionActive":{"description":"Indicates whether the connection is active (`true`) or not (`false`).","type":"boolean"},"affiliateId":{"description":"Affiliate ID corresponding to the connector.","type":"string"}}}}}};
