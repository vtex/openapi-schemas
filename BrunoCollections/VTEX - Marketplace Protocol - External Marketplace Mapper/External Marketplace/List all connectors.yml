settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns a paginated list of all connectors' registered in Channel Manager, taking into consideration the filters informed in the query string of the request.


  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `an` | query | (Required) Merchant's account name in VTEX, ex. `apiexemple`. |
  | `segment` | query | Filter data by connector's segment. |
  | `orderByConnectorType` | query | Order data using a custom logic by connector's' type, and not alphabetically. |
  | `active` | query | Filter data by the connector's status. |
  | `name` | query | Filter data by the connector's name. |
  | `page` | query | Current page to load data from. |
  | `pageSize` | query | (Required) Page size to define number of results returned. |
  | `country` | query | Filter by connector's country. |
  | `type` | query | Filter by connector's type. |
  | `account` | query | Filter by connector's owner account. |
  | `accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `content-type` | header | (Required) Describes the type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "metadata": {
      "totalCount": 513,
      "currentPage": 1,
      "pageSize": 15,
      "totalPages": 35
    },
    "results": [
      {
        "id": 59,
        "name": "4R Comercial Sao Paulo",
        "website": "www.comercialsaopaulo.com",
        "logo": "https://comercialsaopaulo.vtexassets.com/assets/vtex.file-manager-graphql/logo/619f6f7f-bf67-4ed1-a15a-282b51f81e06___cd0426736f2550559c8688de3378681f.jpg",
        "description": "Somos uma empresa sedeada em Barreiras - BA, decidimos entrar no mundo do E Commerce e marketplace há alguns anos, pois já estávamos estabelecidos e sólidos com a nossa loja física em nossa cidade.\nHoje trabalhamos com um portfólio bem diversificado de produtos, que são eles:\n- Linha à bateria\n- Lazer e esporte\n- Camping\n- Ferramentas elétricas\n- Maquinários leves e pesados\n- Ferramentas manuais\n- E muitos outros segmentos\nSua ",
        "helpUrl": "help.vtex.com/helpurl",
        "segment": "DEPARTMENT_STORES",
