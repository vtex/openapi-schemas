info:
  name: Upsert merchant connection
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/channel-manager/connector/:connectorId?an=apiexemple"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: an
      value: apiexemple
      type: query
    - name: environment
      value: "{{environment}}"
      type: path
    - name: connectorId
      value: "46"
      type: path
  body:
    type: json
    data: |-
      {
        "isActive": false,
        "affiliateId": "AFT"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Receives an event describing a connection update between the connector with the specified ID and the merchant specified in the query string./n/rThis information is used in the list all connectors route: the account name will be used to return the `isConnectionActive` and `affiliateId` fields.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `connectorId` | path | (Required) Connector's ID in Channel Manager, available through the list all connectors route, or in the response of the registration. |
  | `an` | query | (Required) Merchant's account name in VTEX, ex. `apiexemple`. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Describes the type of the content being sent. |
