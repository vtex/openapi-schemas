info:
  name: Retrieve channel
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/channel-manager/channel/:channelId?an=accountName"
  headers:
    - name: Accept
      value: application/json
    - name: Content-type
      value: application/json
  params:
    - name: an
      value: accountName
      type: query
    - name: enviroment
      value: portal.vtexcommercestable.com.br
      type: path
    - name: channelId
      value: "1"
      type: path
    - name: environment
      value: "{{environment}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a specific channel that already exists in Channel Manager.


  ## Permissions

  This endpoint does not require [permissions](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `enviroment` | path | (Required) Environment used as part of the URL. |
  | `channelId` | path | (Required) Channel's ID in Channel Manager, available through the List All Channels endpoint. |
  | `environment` | path | Environment to use. Used as part of the URL. (This can only be one of vtexcommercestable) |
  | `an` | query | (Required) VTEX's account name owned by the connector/partner. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |
  | `Content-type` | header | (Required) Describes the type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "id": 1,
    "name": "Mercado Livre"
  }
  ```
