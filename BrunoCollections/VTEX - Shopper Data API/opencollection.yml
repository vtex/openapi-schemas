opencollection: 1.0.0

info:
  name: VTEX - Shopper Data API

docs:
  content: |-
    The Shopper Data API allows you to create, update, and retrieve shopper personal information stored in a Master Data entity. 

    The shopper schema supports `additionalProperties: true`, allowing clients to send and persist additional properties beyond the defined schema properties (e.g., `phone2`, `marketingOptIn`, or any business-specific fields).

    Learn more about [Master Data schema lifecycle](https://developers.vtex.com/docs/guides/master-data-schema-lifecycle).

    ### Shopper Data

    - `GET` [Get shopper schema](https://developers.vtex.com/docs/api-reference/shopper-data-api#get-/api/dataentities/shopper/schemas/v1)

    - `POST` [Create shopper document](https://developers.vtex.com/docs/api-reference/shopper-data-api#post-/api/dataentities/shopper/documents)

    - `GET` [Get shopper document by User ID](https://developers.vtex.com/docs/api-reference/shopper-data-api#get-/api/dataentities/shopper/documents/-userId-)

    - `GET` [Search shopper document by User ID](https://developers.vtex.com/docs/api-reference/shopper-data-api#get-/api/dataentities/shopper/search)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
