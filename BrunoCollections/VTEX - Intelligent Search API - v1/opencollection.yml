opencollection: 1.0.0

info:
  name: VTEX - Intelligent Search API - v1

docs:
  content: |-
    [VTEX Intelligent Search](https://help.vtex.com/docs/tracks/overview-intelligent-search) is search solution for digital commerce that delivers relevant product results, autocomplete suggestions, and personalized experiences based on the catalog from the user's first interaction with the store. This API enables headless implementations to integrate VTEX Intelligent Search capabilities into custom storefronts.

    This reference documents **Intelligent Search API v1**, which replaces the [Intelligent Search API (Legacy)](https://developers.vtex.com/docs/api-reference/intelligent-search-api) at `/api/io/_v/api/intelligent-search/*`.

    >ℹ️ If you are migrating from the legacy API, see [Migrating to Intelligent Search API v1](https://developers.vtex.com/docs/guides/migrating-to-intelligent-search-api-v1).

    ## Common Parameters

    | Parameter | Description |
    | --- | --- |
    | `{{accountName}}` | Name of your VTEX account. Used in the base URL. |
    | `{{environment}}` | Environment to use. Typically `vtexcommercestable` for production. |
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
