settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a single product by a known identifier. Use this endpoint for product detail pages (PDP) when you have a specific product ID, slug, EAN, SKU ID, or reference.

  >⚠️ Use this endpoint when you need data for one specific product whose identifier is already known (for example, rendering a PDP from a URL slug). Don't use it to fetch multiple products or to run a search query. Use `GET` [Search products](https://developers.vtex.com/docs/api-reference/intelligent-search-api-v1#get-/product-search/-facets-) for those cases. Misusing this endpoint for listings or search bypasses Intelligent Search ranking and impairs the shopper experience.

  When called with `field=id` (the default), the product is looked up directly, **skipping the search pipeline**, resulting in lower latency and higher cache-hit likelihood than product search.

  >ℹ️ **Caching:** Responses are cached for public sales channels. Private sales-channel responses are not cached. Always read the `Cache-Control` response header at runtime to determine cacheability.

  >ℹ️ **Segment context:** Several parameters on this endpoint replace values previously read from the VTEX segment cookie. See [Migrating from segment](#migrating-from-segment) below.

  ## Migrating from segment

  Intelligent Search API (Legacy) reads the following values from the VTEX segment cookie. In v1, pass each one directly as a query parameter:

  | v1 parameter | Segment source |
  |:---|:---|
  | `locale` | `segment.cultureInfo` |
  | `sc` | `segment.channel` |
  | `regionId` | `segment.regionId` |
  | `country` | `segment.countryCode` or `country` key in `segment.facets` |
  | `zip-code` | `zip-code` key in `segment.facets` |
  | `coordinates` | `coordinates` key in `segment.facets` |
  | `pickupPoint` | `pickupPoint` key in `segment.facets` |
  | `deliveryZonesHash` | `deliveryZonesHash` key in `segment.facets` |
  | `pickupPointsHash` | `pickupPointsHash` key in `segment.facets` |
  | `utmSource` | `segment.utm_source` |
  | `utmCampaign` | `segment.utm_campaign` |
  | `utmiCampaign` | `segment.utmi_campaign` |
  | `campaigns` | `segment.campaigns` |
  | `priceTables` | `segment.priceTables` |

  <details>
  <summary>TypeScript reference implementation</summary>

  The following TypeScript snippet shows the full translation:

  ```typescript
  type Segment = {
    channel?: string | number
    regionId?: string
    countryCode?: string
    cultureInfo?: string
    // Semicolon-separated "key=value" string, e.g. "zip-code=22250-040;country=BRA"
    facets?: string
    utm_source?: string
    utm_campaign?: string
    utmi_campaign?: string
    campaigns?: string
    priceTables?: string
  }

  const SHIPPING_KEYS = new Set([
    'zip-code', 'coordinates', 'country', 'pickupPoint',
    'deliveryZonesHash', 'pickupPointsHash',
  ])

  function segmentToProductsV1(segment: Segment, identifier: string): string {
    const shipping: Record<string, string> = {}

    for (const pair of (segment.facets ?? '').split(';')) {
      const eq = pair.indexOf('=')
      if (eq < 0) continue
      const key = pair.slice(0, eq)
      const value = pair.slice(eq + 1)
      if (!key || !value) continue
      if (SHIPPING_KEYS.has(key)) shipping[key] = value
    }

    const params: Record<string, string> = {}
    const set = (name: string, value?: string | number) => {
      if (value !== undefined && value !== null && value !== '') {
        params[name] = String(value)
      }
    }

    set('sc', segment.channel)
    set('locale', segment.cultureInfo)
    set('regionId', segment.regionId)
    set('country', segment.countryCode ?? shipping.country)
    set('zip-code', shipping['zip-code'])
    set('coordinates', shipping.coordinates)
    set('pickupPoint', shipping.pickupPoint)
    set('deliveryZonesHash', shipping.deliveryZonesHash)
    set('pickupPointsHash', shipping.pickupPointsHash)
    set('utmSource', segment.utm_source)
    set('utmCampaign', segment.utm_campaign)
    set('utmiCampaign', segment.utmi_campaign)
    set('campaigns', segment.campaigns)
    set('priceTables', segment.priceTables)

    params.identifier = identifier

    const search = new URLSearchParams(params).toString()

    return `https://{accountName}.vtexcommercestable.com.br/api/intelligent-search/v1/products?${search}`
  }
  ```

  </details>

  ## Permissions

  This endpoint does not require [authentication](https://developers.vtex.com/docs/guides/authentication) or [permissions](https://help.vtex.com/docs/tutorials/license-manager-resources) for public sales channels.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `sc` | query | (Required) Sales channel (trade policy) ID. Required for this endpoint to resolve pricing and availability. Intelligent Search API (Legacy) previously read this from `segment.channel`. In v1, pass the value directly as a query parameter. |
  | `value` | query | (Required) The identifier value to look up, interpreted according to the `field` parameter. |
  | `field` | query | Which identifier type `value` represents. - `id` (default): product ID. Fastest: skips the search pipeline entirely. - `slug`: product slug (link text). - `ean`: SKU EAN. - `sku`: SKU ID. - `reference`: SKU reference ID (not the product reference). |
  | `locale` | query | Indicates the target language as a BCP 47 language code. The Intelligent Search must have indexed the account in the target language. Intelligent Search API (Legacy) previously read this from `segment.cultureInfo`. In v1, pass the value directly as a query parameter. |
  | `simulationBehavior` | query | Defines the pricing and availability simulation behavior. - `default`: Calls the simulation for every single seller. - `skip`: Never calls the simulation. Use for the fastest response when live pricing is not required. - `only1P`: Only calls the simulation for first-party sellers. - `only3P`: Only calls the simulation for third-party sellers. - `regionalize1p`: Calls regionalized simulation for first-party sellers only. |
  | `hideUnavailableItems` | query | Defines whether the result should hide unavailable items (`true`) or not (`false`). When set to `true`, only products with stock are returned. |
  | `productClusterId` | query | Restrict to a cluster. Returns `404` if the product is not in this cluster. |
  | `productOriginVtex` | query | When `true`, returns the product in Catalog (portal) format instead of Intelligent Search format. |
  | `show-invisible-items` | query | When `true`, skips the catalog visibility (`isVisible`) check. Useful for preview and admin flows. |
  | `regionId` | query | Region ID for regionalized results. Intelligent Search API (Legacy) previously read this from `segment.regionId`. In v1, pass the value directly as a query parameter. |
  | `country` | query | Three-letter country code in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format. Intelligent Search API (Legacy) previously read this from `segment.countryCode` or the `country` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `zip-code` | query | ZIP or postal code. Intelligent Search API (Legacy) previously read this from the `zip-code` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `coordinates` | query | Geographic coordinates in the format `longitude,latitude`. Intelligent Search API (Legacy) previously read this from the `coordinates` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `pickupPoint` | query | Pickup point ID for pickup-in-point delivery context. Intelligent Search API (Legacy) previously read this from the `pickupPoint` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `deliveryZonesHash` | query | Pre-computed delivery zones hash for faster regionalization lookup. Obtain this value from the `POST` [Search delivery zones](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestions-api#post-/api/logistics-shipping/delivery-zones/_search/v2) endpoint of the Delivery Promise Suggestions API. Intelligent Search API (Legacy) previously read this from the `deliveryZonesHash` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `pickupPointsHash` | query | Pre-computed pickup points hash for faster regionalization lookup. Obtain this value from the `POST` [Search pickup points](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestions-api#post-/api/logistics-shipping/pickuppoints/_search) endpoint of the Delivery Promise Suggestions API. Intelligent Search API (Legacy) previously read this from the `pickupPointsHash` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `utmSource` | query | UTM source value, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.utm_source`. In v1, pass the value directly as a query parameter. |
  | `utmCampaign` | query | UTM campaign value, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.utm_campaign`. In v1, pass the value directly as a query parameter. |
  | `utmiCampaign` | query | UTMi campaign value, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.utmi_campaign`. In v1, pass the value directly as a query parameter. |
  | `campaigns` | query | Campaign identifier, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.campaigns`. In v1, pass the value directly as a query parameter. |
  | `priceTables` | query | Price table(s) to apply during simulation. Intelligent Search API (Legacy) previously read this from `segment.priceTables`. In v1, pass the value directly as a query parameter. |

