        test("[GET]::/facets/:facets - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/facets/:facets - Schema is valid", function () {
          const schema = {"type":"object","description":"Response body object.","properties":{"facets":{"type":"array","description":"List of facets.","items":{"type":"object","description":"Facet information.","properties":{"values":{"type":"array","description":"Possible values.","items":{"type":"object","properties":{"id":{"type":"string","description":"Value ID."},"quantity":{"type":"number","description":"Number of resulting products."},"name":{"type":"string","description":"Human-readable format of the facet value."},"key":{"type":"string","description":"Facet key."},"value":{"type":"string","description":"Facet value."},"selected":{"type":"boolean","description":"Defines whether the value is selected (`true`) or not (`false`)."},"href":{"type":"string","description":"Query URL."}}}},"type":{"type":"string","description":"Facet type, which can be:\r\n\r\n- `TEXT`: The value is a simple text.\r\n- `PRICERANGE`: The value contains the property `range` representing the minimum and the maximum price for the query.\r\n- `DELIVERY`: The value represents a delivery option. Only appears in searches using [Delivery Promise](https://help.vtex.com/docs/tutorials/delivery-promise-beta).","enum":["TEXT","PRICERANGE","DELIVERY"]},"name":{"type":"string","description":"Human-readable format of the facet key."},"hidden":{"type":"boolean","description":"Defines whether the client-side should hide the facet (`true`) or not (`false`)."},"key":{"type":"string","description":"Facet key."},"quantity":{"type":"number","description":"Number of possible values."}}}},"sampling":{"type":"boolean","description":"Indicates whether there was sampling in the aggregation of facets. In search results with many products, only the first 30000 are aggregated to avoid performance issues."},"breadcrumb":{"type":"array","description":"Generated breadcrumb for the given query.","items":{"type":"object","properties":{"name":{"type":"string","description":"Breadcrumb label."},"href":{"type":"string","description":"Breadcrumb link."}}}},"queryArgs":{"type":"object","description":"Term and facets used in the query.","properties":{"query":{"type":"string","description":"Search term used in the query."},"selectedFacets":{"type":"array","description":"Facets used in the query.","items":{"type":"object","properties":{"key":{"type":"string","description":"Facet key."},"value":{"type":"string","description":"Facet value."}}}}}},"translated":{"type":"boolean","description":"Defines whether the facets were translated by Intelligent Search (`true`) or not (`false`)."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
