`true`) or not (`false`)."},"pagination":{"type":"object","description":"Pagination information.","properties":{"count":{"description":"Page count.","type":"number"},"current":{"description":"Information about the current page.","type":"object","properties":{"index":{"description":"Page index.","type":"number"}}},"before":{"description":"Information about the previous pages.","type":"array","items":{"type":"object","properties":{"index":{"description":"Page index.","type":"number"}}}},"after":{"description":"Information about the following pages.","type":"array","items":{"type":"object","properties":{"index":{"description":"Page index.","type":"number"}}}},"perPage":{"description":"Amount of results per page.","type":"number"},"next":{"description":"Information about the next page.","type":"object","properties":{"index":{"description":"Page index.","type":"number"}}},"previous":{"description":"Information about the previous page.","type":"object","properties":{"index":{"description":"Page index.","type":"number"}}},"first":{"description":"Information about the first page.","type":"object","properties":{"index":{"description":"Page index.","type":"number"}}},"last":{"description":"Information about the last page.","type":"object","properties":{"index":{"description":"Page index.","type":"number"}}}}},"options":{"type":"object","description":"Search options available for the query.","properties":{"sorts":{"type":"array","description":"Available sort options.","items":{"type":"object","additionalProperties":true}},"counts":{"type":"array","description":"Available product count options.","items":{"type":"object","additionalProperties":true}},"deliveryPromisesEnabled":{"type":"boolean","description":"Whether Delivery Promise features are enabled for this query."}}},"searchId":{"type":"string","description":"Unique identifier for the search session. Use this value when sending search analytics events."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
