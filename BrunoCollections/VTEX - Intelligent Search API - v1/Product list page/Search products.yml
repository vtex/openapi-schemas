docs: |-
  Lists the active products for a given query.

  >⚠️ **Fetching a single known product?** Use `GET` [Get product](https://developers.vtex.com/docs/api-reference/intelligent-search-api-v1#get-/products) instead. It skips the search pipeline (lower latency) and caches better.

  >ℹ️ **Caching:** Responses are cached for public sales channels. Always read the `Cache-Control` response header at runtime to determine cacheability. Responses containing sponsored products are not cached.

  >ℹ️ **Segment context:** Several parameters on this endpoint replace values previously read from the VTEX segment cookie. See [Migrating from segment](#migrating-from-segment) below.

  ## Migrating from segment

  Intelligent Search API (Legacy) reads the following values from the VTEX segment cookie. In v1, pass each one directly as a query parameter:

  | v1 parameter | Segment source |
  |:---|:---|
  | `locale` | `segment.cultureInfo` |
  | `sc` | `segment.channel` |
  | `regionId` | `segment.regionId` |
  | `country` | `segment.countryCode` or `country` key in `segment.facets` |
  | `zip-code` | `zip-code` key in `segment.facets` |
  | `coordinates` | `coordinates` key in `segment.facets` |
  | `pickupPoint` | `pickupPoint` key in `segment.facets` |
  | `deliveryZonesHash` | `deliveryZonesHash` key in `segment.facets` |
  | `pickupPointsHash` | `pickupPointsHash` key in `segment.facets` |
  | `utmSource` | `segment.utm_source` |
  | `utmCampaign` | `segment.utm_campaign` |
  | `utmiCampaign` | `segment.utmi_campaign` |
  | `campaigns` | `segment.campaigns` |
  | `priceTables` | `segment.priceTables` |

  All other keys in `segment.facets` must be appended to the URL path as `key/value` pairs.

  <details>
  <summary>TypeScript reference implementation</summary>

  The following TypeScript snippet shows the full translation:

  ```typescript
  type Segment = {
    channel?: string | number
    regionId?: string
    countryCode?: string
    cultureInfo?: string
    // Semicolon-separated "key=value" string, e.g. "zip-code=22250-040;country=BRA"
    facets?: string
    utm_source?: string
    utm_campaign?: string
    utmi_campaign?: string
    campaigns?: string
    priceTables?: string
  }

  const SHIPPING_KEYS = new Set([
    'zip-code', 'coordinates', 'country', 'pickupPoint',
    'deliveryZonesHash', 'pickupPointsHash',
  ])

  function segmentToProductSearchV1(segment: Segment, query?: string): string {
    const shipping: Record<string, string> = {}
    const pathFacets: Array<{ key: string; value: string }> = []

    for (const pair of (segment.facets ?? '').split(';')) {
      const eq = pair.indexOf('=')
      if (eq < 0) continue
      const key = pair.slice(0, eq)
      const value = pair.slice(eq + 1)
      if (!key || !value) continue

      if (SHIPPING_KEYS.has(key)) {
        shipping[key] = value
      } else {
        pathFacets.push({ key, value })
      }
    }

    const params: Record<string, string> = {}
    const set = (name: string, value?: string | number) => {
      if (value !== undefined && value !== null && value !== '') {
        params[name] = String(value)
      }
    }

    set('sc', segment.channel)
    set('locale', segment.cultureInfo)
    set('regionId', segment.regionId)
    set('country', segment.countryCode ?? shipping.country)
    set('zip-code', shipping['zip-code'])
    set('coordinates', shipping.coordinates)
    set('pickupPoint', shipping.pickupPoint)
    set('deliveryZonesHash', shipping.deliveryZonesHash)
    set('pickupPointsHash', shipping.pickupPointsHash)
    set('utmSource', segment.utm_source)
    set('utmCampaign', segment.utm_campaign)
    set('utmiCampaign', segment.utmi_campaign)
    set('campaigns', segment.campaigns)
    set('priceTables', segment.priceTables)

    if (query) params.query = query

    const facetPath = pathFacets.map(f => `${f.key}/${f.value}`).join('/')
    const search = new URLSearchParams(params).toString()

    return `https://{accountName}.vtexcommercestable.com.br/api/intelligent-search/v1/product-search${facetPath ? `/${facetPath}` : ''}?${search}`
  }
  ```

  </details>

  ## Sponsored products (VTEX Ads)

  The query parameters **`showSponsored`**, **`sponsoredCount`**, **`advertisementPlacement`**, and **`repeatSponsoredProducts`** apply only to stores using [VTEX Ads](https://developers.vtex.com/docs/guides/vtex-ads). Sponsored products are merged into the `products` array.

  ## Permissions

  This endpoint does not require [authentication](https://developers.vtex.com/docs/guides/authentication) or [permissions](https://help.vtex.com/docs/tutorials/license-manager-resources).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `facets` | path | (Required) ## Format The `facets` parameter follows the format: `/${facetKey1}/${facetValue1}/${facetKey2}/${facetValue2}/.../${facetKeyN}/${facetValueN}`. The order in which the terms appear is not relevant to the search. You can also repeat the same `facetKey` several times for different values. For example: `category-1/shoes/color/blue/color/red`. ## Filter combinations - **Facets of the same type → OR (union):** When multiple values of the same facet are applied, the API returns the union of all products matching any of those values. - **Facets of different types → AND (intersection):** When different facet types are combined, the API returns only products that satisfy all conditions simultaneously. ## Negative filters (NOT operator) To exclude a facet value, prefix the value with **`not:`** in the path segment: `/{facetKey}/not:{facetValue}/`. For example, `color/blue/size/not:42` keeps color blue and excludes size 42. ## Available filters \| `facetKey` \| Description \| Example \| \| - \| - \| - \| \| `trade-policy` *(optional)* \| Sales channel filter. Supported for backward compatibility; prefer the `sc` query parameter instead. \| `trade-policy/2` \| \| `category-${n}` *(optional)* \| Filter by category level (1 = department, 2 = category, 3 = subcategory, etc.). \| `category-1/clothing/category-2/shirts` \| \| `brand` *(optional)* \| Filter by brand slug. \| `brand/acme` \| \| `{specificationName}` *(optional)* \| Filter by catalog specification. \| `color/blue` \| \| `productClusterIds` *(optional)* \| Filter by collection ID. \| `productClusterIds/262` \| \| `price` *(optional)* \| Filter by price range `${minPrice}:${maxPrice}`. \| `price/100:500` \| |
  | `query` | query | Search term. It can contain any character. This parameter is named `query` in the API. The short form **`q`** is an alias for `query` and has the same semantics. You can search for products or SKUs using specific ID types by adding search parameters at the end of the store URL: - **Single item search:** `?query=[id type]:[id_1]`. Example: `?query=product:98765` - **Multiple items search:** `?query=[id type]:[id_1];[id_2];[id_3]`. Example: `?query=product:98765;98743` >⚠️ All searched IDs should be of the same type. ## Supported ID types \| ID Type \| Query format \| Example \| \| - \| - \| - \| \| Product ID \| `?query=product:<id>` or `?query=product.id:<id>` \| `?query=product:98765` \| \| SKU ID \| `?query=sku:<id>` or `?query=sku.id:<id>` \| `?query=sku.id:12345` \| \| Reference ID \| `?query=sku.reference:<id>` \| `?query=sku.reference:REF123` \| \| EAN \| `?query=sku.ean:<id>` \| `?query=sku.ean:7891234567890` \| \| Slug \| `?query=product.link:<link>` \| `?query=product.link:blue-shirt` \| |
  | `count` | query | Number of products per page. |
  | `page` | query | Current search page. |
  | `sort` | query | Defines how results are sorted. Relevance is the **default** sorting type, applied when this parameter is omitted, null, or empty. Allowed values: - **Omitted, empty, or null** (default): Results are sorted by relevance. - `price:desc`: Results are sorted by price in descending order. - `price:asc`: Results are sorted by price in ascending order. - `orders:desc`: Results are sorted by the amount of orders in the past 90 days, in descending order. - `name:desc`: Results are sorted by name in descending alphabetical order. - `name:asc`: Results are sorted by name in ascending alphabetical order. - `release:desc`: Results are sorted by release date in descending order. - `discount:desc`: Results are sorted by discount percentage in descending order. |
  | `locale` | query | Indicates the target language as a BCP 47 language code. The Intelligent Search must have indexed the account in the target language. Intelligent Search API (Legacy) previously read this from `segment.cultureInfo`. In v1, pass the value directly as a query parameter. |
  | `hideUnavailableItems` | query | Defines whether the result should hide unavailable items (`true`) or not (`false`). When set to `true`, only products with stock are returned. |
  | `simulationBehavior` | query | Defines the pricing and availability simulation behavior. - `default`: Calls the simulation for every single seller. - `skip`: Never calls the simulation. Use for the fastest response when live pricing is not required. - `only1P`: Only calls the simulation for first-party sellers. - `only3P`: Only calls the simulation for third-party sellers. - `regionalize1p`: Calls regionalized simulation for first-party sellers only. |
  | `sc` | query | Sales channel (trade policy) ID. Alternative to including `trade-policy/{id}` in the facets path. Intelligent Search API (Legacy) previously read this from `segment.channel`. In v1, pass the value directly as a query parameter. |
  | `regionId` | query | Region ID for regionalized results. Intelligent Search API (Legacy) previously read this from `segment.regionId`. In v1, pass the value directly as a query parameter. |
  | `country` | query | Three-letter country code in [ISO 3166 ALPHA-3](https://www.iban.com/country-codes) format. Intelligent Search API (Legacy) previously read this from `segment.countryCode` or the `country` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `zip-code` | query | ZIP or postal code. Intelligent Search API (Legacy) previously read this from the `zip-code` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `coordinates` | query | Geographic coordinates in the format `longitude,latitude`. Intelligent Search API (Legacy) previously read this from the `coordinates` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `pickupPoint` | query | Pickup point ID for pickup-in-point delivery context. Intelligent Search API (Legacy) previously read this from the `pickupPoint` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `deliveryZonesHash` | query | Pre-computed delivery zones hash for faster regionalization lookup. Obtain this value from the `POST` [Search delivery zones](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestions-api#post-/api/logistics-shipping/delivery-zones/_search/v2) endpoint of the Delivery Promise Suggestions API. Intelligent Search API (Legacy) previously read this from the `deliveryZonesHash` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `pickupPointsHash` | query | Pre-computed pickup points hash for faster regionalization lookup. Obtain this value from the `POST` [Search pickup points](https://developers.vtex.com/docs/api-reference/delivery-promise-suggestions-api#post-/api/logistics-shipping/pickuppoints/_search) endpoint of the Delivery Promise Suggestions API. Intelligent Search API (Legacy) previously read this from the `pickupPointsHash` key in `segment.facets`. In v1, pass the value directly as a query parameter. |
  | `dpPreview` | query | Previews [Delivery Promise](https://developers.vtex.com/docs/guides/delivery-promise) behavior on accounts still in the `DpReady` activation state, without affecting production search requests. When set to `true`, the response returns `deliveryPromiseEnabled: false`. Once the account is promoted to `DpLive`, remove this parameter, since Delivery Promise is applied in production and the response returns `deliveryPromiseEnabled: true`. |
  | `utmSource` | query | UTM source value, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.utm_source`. In v1, pass the value directly as a query parameter. |
  | `utmCampaign` | query | UTM campaign value, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.utm_campaign`. In v1, pass the value directly as a query parameter. |
  | `utmiCampaign` | query | UTMi campaign value, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.utmi_campaign`. In v1, pass the value directly as a query parameter. |
  | `campaigns` | query | Campaign identifier, forwarded to the pricing and availability simulation. Intelligent Search API (Legacy) previously read this from `segment.campaigns`. In v1, pass the value directly as a query parameter. |
  | `priceTables` | query | Price table(s) to apply during simulation. Intelligent Search API (Legacy) previously read this from `segment.priceTables`. In v1, pass the value directly as a query parameter. |
  | `showSponsored` | query | Defines if sponsored products are listed (`true`) or not (`false`). Applicable to stores using [VTEX Ads](https://developers.vtex.com/docs/guides/vtex-ads) to offer ad space. |
  | `sponsoredCount` | query | Amount of sponsored products to be returned. Applicable only to merchants using [VTEX Ads](https://developers.vtex.com/docs/guides/vtex-ads). |
  | `advertisementPlacement` | query | Advertisement placement. Applicable only to merchants using [VTEX Ads](https://developers.vtex.com/docs/guides/vtex-ads). |
  | `repeatSponsoredProducts` | query | When `true`, the same product can appear as both sponsored and organic. When `false`, sponsored products are removed from the organic list. Applicable only to merchants using [VTEX Ads](https://developers.vtex.com/docs/guides/vtex-ads). |

