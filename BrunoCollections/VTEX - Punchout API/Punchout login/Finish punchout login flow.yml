info:
  name: Finish punchout login flow
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/authenticator/v1/punchout/finish?ott=xyz123"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: ott
      value: xyz123
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("[GET]::/api/authenticator/v1/punchout/finish - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Exchanges the one-time token (OTT) for VTEX session cookies and completes the authentication process.

  In browser-based integrations, this flow happens automatically when the user's browser accesses the URL returned by the start endpoint.

  For headless operations where no browser is involved, integrators must explicitly call this endpoint to obtain the necessary authentication cookies.

  This endpoint:
  - Validates the OTT (checks existence, expiration, and single-use status)
  - Creates a VTEX session (based on VTEX user or pre-authenticated user info)
  - Sets authentication cookies (returned in response headers)

  The created session includes `authMethod: "Punchout"` to track the login source. 

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `ott` | query | (Required) One-time token obtained from the start endpoint. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
