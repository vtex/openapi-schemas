opencollection: 1.0.0

info:
  name: VTEX - Checkout Configuration API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    Checkout Configuration API is responsible for managing the checkout configurations of a store. The API provides endpoints for creating, retrieving, updating, and deleting checkout configurations, allowing clients to customize and optimize the checkout process according to their specific requirements.

    - `GET` [Get checkout configuration](https://developers.vtex.com/docs/api-reference/checkout-configuration-api#get-/api/checkout/configuration/ui)
    - `POST` [Create a new checkout configuration](https://developers.vtex.com/docs/api-reference/checkout-configuration-api#post-/api/checkout/configuration/ui)
    - `PUT` [Update a checkout configuration](https://developers.vtex.com/docs/api-reference/checkout-configuration-api#put-/api/checkout/configuration/ui)
    - `DELETE` [Delete checkout configuration](https://developers.vtex.com/docs/api-reference/checkout-configuration-api#delete-/api/checkout/configuration/ui)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
