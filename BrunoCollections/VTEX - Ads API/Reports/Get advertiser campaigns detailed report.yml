runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/report/advertisers/campaigns-detailed - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/report/advertisers/campaigns-detailed - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/report/advertisers/campaigns-detailed - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/report/advertisers/campaigns-detailed - Schema is valid", function () {
          const schema = {"type":"object","properties":{"total":{"type":"integer","description":"Total number of campaigns."},"pages":{"type":"integer","description":"Total number of pages for pagination."},"currentPage":{"type":"integer","description":"Current page number."},"data":{"type":"array","description":"Array of detailed campaign objects.","items":{"type":"object","description":"Detailed campaign object.","properties":{"id":{"type":"string","description":"Unique campaign identifier."},"advertiser_id":{"type":"string","description":"Advertiser identifier."},"name":{"type":"string","description":"Campaign name."},"status":{"type":"string","description":"Campaign status."},"type":{"type":"string","description":"Campaign type."},"publisher_id":{"type":"string","description":"Publisher identifier."},"publisher_name":{"type":"string","description":"Publisher name."},"advertiser_name":{"type":"string","description":"Advertiser name."},"sub_publisher_id":{"type":["string","null"],"description":"Subpublisher identifier (only present for network campaigns)."},"sub_publisher_name":{"type":["string","null"],"description":"Subpublisher name (only present for network campaigns)."},"active":{"type":"boolean","description":"Whether the campaign is active."},"daily_budget":{"type":"string","description":"Daily budget amount."},"consumed_budget":{"type":"string","description":"Amount of budget consumed."},"pending":{"type":"array","description":"Pending operations awaiting review for this campaign/ad. Empty when there is nothing pending.","items":{"type":"object","description":"Pending operation entry, grouping a `label` with its `quantity`.","properties":{"label":{"type":"string","description":"Type of pending operation. Currently, only `ads` is returned, indicating ads awaiting review.","enum":["ads"]},"quantity":{"type":"integer","description":"Number of pending items of the given `label`."}}}},"metrics":{"type":"object","description":"Performance metrics object. All metric values are returned as strings regardless of their numeric nature.","properties":{"clicks":{"type":"integer","description":"Total number of clicks."},"conversions":{"type":"integer","description":"Total number of conversions."},"total_conversions_items_quantity":{"type":"integer","description":"Total quantity of converted items."},"impressions":{"type":"integer","description":"Total number of impressions."},"views":{"type":"integer","description":"Total number of views."},"conversions_click":{"type":"string","description":"Number of conversions attributed to clicks."},"conversions_view":{"type":"string","description":"Number of conversions attributed to views."},"conversion_rate":{"type":"string","description":"Consolidated conversion rate percentage, calculated as total conversions divided by the sum of clicks and views (`total_conversions / (total_clicks + total_views)`). This is the default conversion rate and considers both click- and view-attributed conversions."},"conversion_rate_click":{"type":"string","description":"Conversion rate percentage considering click-attributed conversions only, calculated as `conversions_click / total_clicks`."},"conversion_rate_view":{"type":"string","description":"Conversion rate percentage considering view-attributed conversions only, calculated as `conversions_view / total_views`."},"ctr":{"type":"string","description":"Click-through rate percentage."},"roas":{"type":"string","description":"Consolidated return on ad spend, combining click- and view-attributed revenue across all ad formats."},"roas_click":{"type":"string","description":"Return on ad spend calculated using click-attributed revenue only."},"roas_view":{"type":"string","description":"Return on ad spend calculated using view-attributed revenue only."},"roas_halo":{"type":"string","description":"Halo return on ad spend: incremental revenue from non-advertised products purchased in the same order as advertised products (the halo effect), divided by ad spend."},"roas_overall":{"type":"string","description":"Total return on ad spend, combining direct revenue from the advertised product with halo revenue from other products in the same order, divided by the ad investment. Measures the campaign's total impact on the whole order."},"adcost":{"type":"string","description":"Ad cost percentage."},"income":{"type":"string","description":"Total income generated."},"total_spent":{"type":"string","description":"Total amount spent."},"ecpm":{"type":"string","description":"Effective cost per mille (CPM)."},"cpa":{"type":"string","description":"Cost per acquisition."},"avg_cpc":{"type":"string","description":"Average cost per click."},"avg_cpm":{"type":"string","description":"Average cost per mille."},"halo_revenue":{"type":"string","description":"Incremental revenue from non-advertised products that were purchased in the same order as an advertised product, attributed to the ad's spillover (halo) effect."},"halo_orders":{"type":"string","description":"Number of orders with at least one halo item."},"halo_items":{"type":"string","description":"Quantity of halo items sold."}}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Exports a mixed campaign report for advertiser accounts, including both regular campaigns and subpublisher information for network campaigns. The data is returned in JSON format by default, but can be exported as an XLSX file by setting `download=true`.

  >ℹ️ This route is intended for advertiser accounts. For non white-label accounts, only non-private publisher rows are returned.

  >⚠️ This endpoint is limited to 100 requests per minute per account. Exceeding the limit returns `429 Too Many Requests`.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/docs/tutorials/license-manager-resources).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `start_date` | query | (Required) Start date for metrics in `YYYY-MM-DD` format. |
  | `end_date` | query | (Required) End date for metrics in `YYYY-MM-DD` format. |
  | `campaign_id` | query | Filters by campaign ID. |
  | `campaign_status` | query | Filters by campaign status. |
  | `publisher_id` | query | Filters by publisher ID. |
  | `publisher_name` | query | Filters by publisher name. |
  | `ad_type` | query | Filters by ad type. |
  | `ad_status` | query | Filters by ad status. |
  | `seller_id` | query | Filters by seller ID. |
  | `tag_id` | query | Filters by advertiser tag ID. |
  | `targeting_type` | query | Filters by targeting type. |
  | `sub_publisher_id` | query | Filters network rows by subpublisher ID. |
  | `sub_publisher_name` | query | Filters network rows by subpublisher name. |
  | `page` | query | Page number of the results. |
  | `quantity` | query | Number of items per page. When `download=true`, the BFF requests up to `20000` rows for XLSX generation. |
  | `count` | query | If `true`, returns pagination metadata. |
  | `order_by` | query | Field used to sort results. |
  | `order_direction` | query | Sort direction. |
  | `download` | query | If `true`, returns an XLSX file buffer for download instead of JSON. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "total": 1,
    "pages": 1,
    "currentPage": 1,
    "data": [
      {
        "id": "campaign-id",
        "advertiser_id": "advertiser-id",
        "name": "Campaign Name",
        "status": "partial_running",
        "type": "on_site",
        "publisher_id": "publisher-id",
        "publisher_name": "Publisher Name",
        "advertiser_name": "Advertiser Name",
        "sub_publisher_id": "subpublisher-id",
        "sub_publisher_name": "Subpublisher Name",
        "active": true,
        "daily_budget": "10000.00",
        "consumed_budget": "1750.0000",
        "pending": [],
        "metrics": {
          "clicks": 39,
          "conversions": 4,
          "total_conversions_items_quantity": 7,
          "impressions": 7603,
          "views": 51,
          "conversions_click": "3",
          "conversions_view": "1",
          "conversion_rate": "4.44",
          "conversion_rate_click": "7.69",
          "conversion_rate_view": "1.96",
          "ctr": ".51",
          "roas": "2.64",
          "roas_click": "1.80",
          "roas_view": "0.84",
          "roas_halo": "0.95",
          "roas_overall": "3.59",
          "adcost": "37.87",
          "income": "25747.00",
          "total_spent": "9750.00",
          "ecpm": "3.3864",
          "cpa": "2437.50",
          "avg_cpc": "250.00",
          "avg_cpm": "1282.39",
          "halo_revenue": "9260.00",
          "halo_orders": "2",
          "halo_items": "5"
        }
      }
    ]
  }
  ```
