      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: start_date
      value: 2025-01-01
      type: query
    - name: end_date
      value: 2025-01-31
      type: query
    - name: campaign_name
      value: Holiday Sale
      type: query
      disabled: true
    - name: campaign_id
      value: campaign-id
      type: query
      disabled: true
    - name: advertiser_id
      value: advertiser-id
      type: query
      disabled: true
    - name: product_sku
      value: SKU-123
      type: query
      disabled: true
    - name: ad_status
      value: enabled
      type: query
      disabled: true
    - name: ad_type
      value: banner
      type: query
      disabled: true
    - name: targeting_type
      value: category
      type: query
      disabled: true
    - name: show_inactive
      value: "false"
      type: query
      disabled: true
    - name: account_info
      value: "false"
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: quantity
      value: "100"
      type: query
      disabled: true
    - name: count
      value: "false"
      type: query
