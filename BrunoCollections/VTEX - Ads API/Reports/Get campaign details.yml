settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves detailed information about a campaign, such as the products associated with the campaign, status history, ads, and metrics. The data is returned only in JSON format.

  >⚠️ This endpoint is limited to 100 requests per minute per account. Exceeding the limit returns `429 Too Many Requests`.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/docs/tutorials/license-manager-resources).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `campaign_id` | path | (Required) Unique identifier of the campaign to fetch. |
  | `start_date` | query | (Required) Start date for metrics in `YYYY-MM-DD` format. |
  | `end_date` | query | (Required) End date for metrics in `YYYY-MM-DD` format. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

