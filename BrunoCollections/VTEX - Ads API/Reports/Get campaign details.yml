info:
  name: Get campaign details
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/campaign/:campaign_id?start_date=2025-01-01&end_date=2025-01-31"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: start_date
      value: 2025-01-01
      type: query
    - name: end_date
      value: 2025-01-31
      type: query
    - name: campaign_id
      value: ab90a43b-582e-4be9-b126-2067dd8f30a3
      type: path
  auth: inherit

runtime:
