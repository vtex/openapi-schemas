runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/report/advertisers/ads-detailed - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/report/advertisers/ads-detailed - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/report/advertisers/ads-detailed - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/report/advertisers/ads-detailed - Schema is valid", function () {
          const schema = {"type":"object","properties":{"total":{"type":"integer","description":"Total number of ads."},"pages":{"type":"integer","description":"Total number of pages for pagination."},"currentPage":{"type":"integer","description":"Current page number."},"data":{"type":"array","description":"Array of detailed ad objects.","items":{"type":"object","description":"Detailed ad object.","properties":{"id":{"type":"string","description":"Unique ad identifier."},"campaign_id":{"type":"string","description":"Associated campaign identifier."},"url":{"type":"string","description":"Ad destination URL."},"status":{"type":"string","description":"Ad status."},"active":{"type":"boolean","description":"Whether the ad is active."},"product_sku":{"type":["string","null"],"description":"Associated product SKU (when applicable)."},"campaign_name":{"type":"string","description":"Associated campaign name."},"campaign_status":{"type":"string","description":"Associated campaign status."},"ad_type":{"type":"string","description":"Advertisement type."},"publisher_id":{"type":"string","description":"Publisher identifier."},"publisher_name":{"type":"string","description":"Publisher name."},"publisher_account_id":{"type":"string","description":"Publisher account identifier."},"advertiser_id":{"type":"string","description":"Advertiser identifier."},"advertiser_name":{"type":"string","description":"Advertiser name."},"advertiser_account_id":{"type":"string","description":"Advertiser account identifier."},"sub_publisher_id":{"type":["string","null"],"description":"Subpublisher identifier (only present for network campaigns)."},"sub_publisher_name":{"type":["string","null"],"description":"Subpublisher name (only present for network campaigns)."},"sub_publisher_account_id":{"type":["string","null"],"description":"Subpublisher account identifier (only present for network campaigns)."},"metrics":{"type":"object","description":"Ad performance metrics object. All metric values are returned as strings regardless of their numeric nature.","properties":{"clicks":{"type":"string","description":"Total number of clicks."},"conversions":{"type":"string","description":"Total number of conversions."},"total_conversions_items_quantity":{"type":"string","description":"Total quantity of items across all ad-driven conversions. Sums the quantities of every item in each conversion event (for example, if a shopper buys two units of a product after clicking an ad, this metric increases by 2)."},"impressions":{"type":"string","description":"Total number of impressions."},"views":{"type":"string","description":"Total number of views."},"conversion_rate":{"type":"string","description":"Conversion rate percentage."},"ctr":{"type":"string","description":"Click-through rate percentage."},"roas":{"type":"string","description":"Return on ad spend."},"adcost":{"type":"string","description":"Ad cost percentage."},"income":{"type":"string","description":"Total income generated."},"total_spent":{"type":"string","description":"Total amount spent."},"ecpm":{"type":"string","description":"Effective cost per mille (CPM)."},"cpa":{"type":"string","description":"Cost per acquisition."},"avg_cpc":{"type":"string","description":"Average cost per click."},"avg_cpm":{"type":"string","description":"Average cost per mille."}}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

