docs: |-
  Exports a detailed ad report for advertiser accounts, including subpublisher breakdown for network campaigns. The data is returned in JSON format by default, but can be exported as an XLSX file by setting `download=true`.

  >ℹ️ This route is intended for advertiser accounts. Non-network campaigns return one row per ad, while network campaigns return one row per `ad + subpublisher`. For non white-label accounts, only non-private publisher rows are returned.

  >⚠️ This endpoint is limited to 100 requests per minute per account. Exceeding the limit returns `429 Too Many Requests`.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/docs/tutorials/license-manager-resources).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `start_date` | query | (Required) Start date for metrics in `YYYY-MM-DD` format. |
  | `end_date` | query | (Required) End date for metrics in `YYYY-MM-DD` format. |
  | `campaign_name` | query | Filters ads by campaign name. |
  | `campaign_id` | query | Filters ads by campaign ID. |
  | `publisher_id` | query | Filters ads by publisher ID. |
  | `advertiser_id` | query | Filters ads by advertiser ID. In the BFF flow, this value is derived from the authenticated advertiser context. |
  | `product_sku` | query | Filters ads by product SKU. |
  | `ad_status` | query | Filters ads by status. |
  | `ad_type` | query | Filters by ad type. |
  | `targeting_type` | query | Filters by targeting type. |
  | `tag_id` | query | Filters by advertiser tag ID. |
  | `sub_publisher_id` | query | Filters network rows by subpublisher ID. |
  | `sub_publisher_name` | query | Filters network rows by subpublisher name. |
  | `show_inactive` | query | If `true`, includes paused ads. |
  | `hide_pending_rejected` | query | If `true`, excludes `pending_review` and `rejected` rows when `ad_status` is not provided. |
  | `page` | query | Page number of the results. |
  | `quantity` | query | Number of items per page. When `download=true`, the BFF requests up to `20000` rows for XLSX generation. |
  | `count` | query | If `true`, returns pagination metadata. |
  | `order_by` | query | Field used to sort results. |
  | `order_direction` | query | Sort direction. |
  | `download` | query | If `true`, returns an XLSX file buffer for download instead of JSON. |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "total": 1,
    "pages": 1,
    "currentPage": 1,
    "data": [
      {
        "id": "ad-id",
        "campaign_id": "campaign-id",
        "url": "https://example.com/product",
        "status": "enabled",
        "active": true,
        "product_sku": "SKU-123",
        "campaign_name": "Campaign Name",
        "campaign_status": "running",
        "ad_type": "product",
        "publisher_id": "publisher-id",
        "publisher_name": "Publisher Name",
        "publisher_account_id": "publisher-account-id",
        "advertiser_id": "advertiser-id",
        "advertiser_name": "Advertiser Name",
        "advertiser_account_id": "advertiser-account-id",
        "sub_publisher_id": "subpublisher-id",
        "sub_publisher_name": "Subpublisher Name",
        "sub_publisher_account_id": "subpublisher-account-id",
        "metrics": {
          "clicks": "3",
          "conversions": "1",
          "total_conversions_items_quantity": "2",
          "impressions": "10691",
          "views": "0",
          "conversion_rate": "33.33",
          "ctr": "0.03",
          "roas": "2.64",
          "adcost": "37.87",
          "income": "818.00",
          "total_spent": "309.82000000",
          "ecpm": "28.98",
          "cpa": "309.82",
          "avg_cpc": "103.27",
          "avg_cpm": "28.98"
        }
      }
    ]
  }
  ```
