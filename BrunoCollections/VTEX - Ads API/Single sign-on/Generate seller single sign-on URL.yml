info:
  name: Generate seller single sign-on URL
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/sso/marketplace"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "sso_token": "sso-token-12345",
        "email": "seller@example.com",
        "user_id": "seller123",
        "name": "Seller Name",
        "marketplace_name": "My Marketplace"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/sso/marketplace - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/sso/marketplace - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/sso/marketplace - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/sso/marketplace - Schema is valid", function () {
          const schema = {"type":"object","properties":{"redirect_url":{"type":"string","description":"Redirect URL the seller user must follow to access the VTEX Ads platform."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Generates a redirect URL that allows a seller user to access the VTEX Ads platform without needing to log in again. Use this endpoint to enable a unified login experience for marketplace sellers.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/docs/tutorials/license-manager-resources).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "redirect_url": "https://app.ads.vtex.com/sso/auth?token=GENERATED_TOKEN"
  }
  ```
