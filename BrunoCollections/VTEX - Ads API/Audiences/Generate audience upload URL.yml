info:
  name: Generate audience upload URL
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/audience/upload-url"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/audience/upload-url - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/audience/upload-url - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/audience/upload-url - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/audience/upload-url - Schema is valid", function () {
          const schema = {"type":"object","properties":{"url":{"type":"string","description":"Amazon S3 endpoint the publisher must send the multipart upload request to."},"fields":{"type":"object","description":"Signed Amazon S3 form fields that must be included in the upload request, before the `file` field.","additionalProperties":{"type":"string","description":"Value of a signed Amazon S3 form field (for example, policy, signature, or credential)."}},"key":{"type":"string","description":"Object key the file will be stored under. Generated by the backend from the authenticated publisher."},"bucket":{"type":"string","description":"Name of the Amazon S3 bucket that receives the upload."},"expires_in":{"type":"integer","description":"Number of seconds the pre-signed `POST` remains valid.","default":900},"max_bytes":{"type":"integer","description":"Maximum file size, in bytes, accepted by Amazon S3. Larger files are rejected.","default":2147483648},"upload":{"type":"object","description":"Hints describing how to perform the follow-up upload request.","properties":{"method":{"type":"string","description":"HTTP method to use for the upload request."},"enctype":{"type":"string","description":"Encoding type to use for the upload request."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns a short-lived pre-signed Amazon S3 `POST` that lets a publisher upload an audience file without long-lived credentials. The response carries the destination `url` and the signed `fields` that must accompany the upload.

  The backend builds the object `key` from the authenticated publisher, so a publisher cannot write to another publisher's path. The pre-signed `POST` is valid for `expires_in` seconds (900 by default) and Amazon S3 rejects files larger than `max_bytes` (2 GiB by default).

  >ℹ️ The file upload itself is a separate multipart `POST` request sent directly to Amazon S3 with the returned `url` and `fields`. It is not part of this API. See [Integrating audiences](https://developers.vtex.com/docs/guides/integrating-audiences) for the full flow, file format, and PII hashing rules.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/docs/tutorials/license-manager-resources).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "url": "https://newtail-data-clean-room.s3.amazonaws.com/",
    "fields": {
      "key": "0d675bf6-03f6-4b81-9617-e79dffddc3ab/audiences/2026/06/03/14/1717340000.parquet.snappy",
      "Content-Type": "application/octet-stream",
      "Policy": "eyJleHBpcmF0aW9uIjoiMjAyNi0wNi0wM1QxNDoxNTowMFoiLCJjb25kaXRpb25zIjpbXX0=",
      "X-Amz-Signature": "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
    },
    "key": "0d675bf6-03f6-4b81-9617-e79dffddc3ab/audiences/2026/06/03/14/1717340000.parquet.snappy",
    "bucket": "newtail-data-clean-room",
    "expires_in": 900,
    "max_bytes": 2147483648,
    "upload": {
      "method": "POST",
      "enctype": "multipart/form-data"
    }
  }
  ```
