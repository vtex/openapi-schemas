info:
  name: Synchronize inventory information
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/product/bulk/inventories"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      [
        {
          "product_sku": "120210",
          "store_id": "1",
          "price": 18.2,
          "promotional_price": 16.32,
          "is_available": true
        },
        {
          "product_sku": "120212",
          "price": 18.2,
          "promotional_price": 0,
          "is_available": true
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/product/bulk/inventories - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/product/bulk/inventories - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/product/bulk/inventories - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/product/bulk/inventories - Schema is valid", function () {
          const schema = {"type":"object","properties":{"messages":{"type":"array","description":"List of messages from the server.","items":{"type":"string","description":"Message from the server."}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Update inventory information, which defines the price, promotional price, and product availability.

  >⚠️ For each batch insert/update, a maximum of 500 objects per request and three simultaneous requests are allowed.

  ## Permissions

  This endpoint does not require [License Manager resources](https://help.vtex.com/docs/tutorials/license-manager-resources).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `Content-Type` | header | (Required) Type of the content being sent. |
  | `Accept` | header | (Required) HTTP Client Negotiation Accept Header. Indicates the types of responses the client can understand. |

  ## Example response (`202`)

  ```json
  {
    "messages": [
      "inventory will be processed soon"
    ]
  }
  ```
