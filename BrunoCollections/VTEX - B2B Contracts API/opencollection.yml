opencollection: 1.0.0

info:
  name: VTEX - B2B Contracts API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    The B2B Contracts API allows you to create, retrieve, update, and delete contract documents stored in the `CL` data entity. Contracts represent B2B buyer accounts and carry restriction settings that control catalog visibility, checkout payment methods, and allowed payment systems.

    >⚠️ This feature is only available for stores using B2B Buyer Portal, which is currently available to select accounts.

    > ⚠️ When creating or updating contracts you must send each field according to the specifications provided. Otherwise, the Checkout module will not be able to autofill data during the shopping flow, which can block the purchase. Learn more about [SmartCheckout - Customer information automatic fill-in](https://help.vtex.com/en/tutorial/smartcheckout-preenchimento-automatico-de-dados-do-cliente--2Nuu3xAFzdhIzJIldAdtan#).
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
