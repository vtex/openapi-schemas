runtime:
  scripts:
    - type: tests
      code: |-
        test("[PATCH]::/api/dataentities/CL/documents/:contractId - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PATCH]::/api/dataentities/CL/documents/:contractId - Response has empty Body", function () {
          const data = res.getBody();
          expect(data === undefined || data === null || data === "").to.be.true;
        });

settings:
