info:
  name: VTEX - Recommendations BFF API

docs:
  content: |-
    The Recommendations BFF API allows VTEX stores, integrators, and partners to fetch product recommendations, record user/product events, and manage recommendation sessions for headless, FastStore, and mobile storefronts.

    This API powers personalized and contextual product recommendations, tracks user interactions, and enables advanced analytics. It supports multiple recommendation strategies including best sellers, personalized recommendations, similar products, cross-sell, and visually similar items.

    > ℹ️ This feature is in beta. For questions about enablement, account configuration, or campaigns, contact [VTEX Support](https://help.vtex.com/en/support).

    ## Integration guides

    - [Integrating product recommendations in headless or FastStore web stores](https://developers.vtex.com/docs/guides/integrating-product-recommendations-in-headless-or-faststore-web-stores)
    - [Integrating product recommendations in mobile stores](https://developers.vtex.com/docs/guides/integrating-product-recommendations-in-mobile-stores)

    ## Event tracking

    **Web storefronts (headless or FastStore)**: Recommendation shelf view and click events are automatically captured through [Activity Flow](https://developers.vtex.com/docs/guides/activity-flow) when proper data attributes are rendered on shelf elements. Cart and order events are also automatically captured. Product view events must be sent via this API.

    **Mobile apps**: All events (recommendation view, recommendation click, and product view) must be sent via this API. Cart and order events require [Activity Flow integration for mobile apps](https://developers.vtex.com/docs/guides/installing-activity-flow-in-mobile-apps).
