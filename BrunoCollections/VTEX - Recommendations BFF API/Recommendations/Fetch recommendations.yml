info:
  name: Fetch recommendations
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/recommend-bff/v2/recommendations?an=apiexamples&campaignVrn=vrn:recommendations:apiexamples:rec-top-items-v2:123e4567-e89b-12d3-a456-426614174000"
  headers:
    - name: x-vtex-rec-origin
      value: apiexamples/storefront/vtex.recommendation-shelf@2.x
    - name: Accept
      value: application/json
  params:
    - name: an
      value: apiexamples
      type: query
    - name: campaignVrn
      value: vrn:recommendations:apiexamples:rec-top-items-v2:123e4567-e89b-12d3-a456-426614174000
      type: query
    - name: userId
      value: 198e0f50-acf8-42f7-998a-5cd125464749
      type: query
      disabled: true
    - name: products
      value: product-id-1,product-id-2,product-id-3
      type: query
      disabled: true
    - name: salesChannel
      value: "1"
      type: query
      disabled: true
    - name: locale
      value: en-US
      type: query
      disabled: true
    - name: zipCode
      value: "90210"
      type: query
      disabled: true
    - name: pickupPoint
      value: pickup-1234
      type: query
      disabled: true
    - name: regionId
      value: southeast-1
      type: query
      disabled: true

