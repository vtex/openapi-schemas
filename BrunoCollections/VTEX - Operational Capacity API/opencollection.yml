opencollection: 1.0.0

info:
  name: VTEX - Operational Capacity API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: |-
    This API allows management of fulfillment locations and their capacities for VTEX logistics operations. It supports retrieving capacities by parent account, configuring capacity settings per location, listing capacity details, retrieving a paginated list of locations, and updating location status.

    ## Capacity

    - `PUT` [Get locations capacities by account]()

    ## Capacity configuration

    - `PUT` [Configure location capacity]()

    ## Capacity details

    - `GET` [List location capacities]()

    ## Locations

    - `GET` [List locations]()

    ## Location status

    - `PUT` [Update location status]()
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
