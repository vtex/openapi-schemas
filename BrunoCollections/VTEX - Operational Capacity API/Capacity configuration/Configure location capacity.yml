info:
  name: Configure location capacity
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/api/fulfillment-locations/location/:locationId/capacities/:code"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: locationId
      value: "71"
      type: path
    - name: code
      value: fulfill_orders
      type: path
  body:
    type: json
    data: |-
      {
        "capacityType": "FIXED",
        "capacityUnit": "ORDERS",
        "fullCapacityAction": "PAUSE",
        "maxIncreasePromise": {
          "amount": 18
        },
        "dayCapacity": {
          "MONDAY": 11,
          "TUESDAY": 3,
          "WEDNESDAY": 1,
          "THURSDAY": 8,
          "FRIDAY": 4,
          "SATURDAY": 10,
          "SUNDAY": 7,
          "HOLIDAYS_AND_EXCEPTIONS": 5
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[PUT]::/api/fulfillment-locations/location/:locationId/capacities/:code - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[PUT]::/api/fulfillment-locations/location/:locationId/capacities/:code - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[PUT]::/api/fulfillment-locations/location/:locationId/capacities/:code - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[PUT]::/api/fulfillment-locations/location/:locationId/capacities/:code - Schema is valid", function () {
          const schema = {"type":"object","properties":{"id":{"description":"Unique identifier of the location.","type":"integer"},"capacityType":{"type":"string","enum":["FIXED","UNLIMITED"],"description":"Type of capacity."},"capacityUnit":{"type":"string","enum":["ORDERS","ORDER_ITEMS"],"description":"Unit of capacity."},"fullCapacityAction":{"type":"string","enum":["PAUSE","MOVE_TO_NEXT_SHIFT"],"description":"Action to take when full capacity is reached."},"taskId":{"description":"Unique identifier of the task.","type":"integer"},"locationTask":{"description":"Object containing information of the task associated with the location.","type":["object","null"]},"capacityShifts":{"description":"List of capacity shifts of the location.","type":"array","items":{"description":"Object cointainf capacity shift information.","type":"object","properties":{"id":{"description":"Unique identifier of the capacity shift.","type":"integer"},"capacityAmount":{"description":"Amount of product avaiable in the capacity shift.","type":"integer"},"capacityRuleId":{"description":"Unique identifier of the capacity shift rule.","type":"integer"},"timeStart":{"description":"Start time for the capacity period in the format `HH:MM:SS`.","type":"string"},"timeEnd":{"description":"time for the capacity period in the format `HH:MM:SS`.","type":"string"},"weekDay":{"description":"Day of the week .","type":"string"}}}},"additionalInfo":{"description":"Additional information of the capacity shifts.","type":"object","properties":{"maxIncreasePromise":{"type":"object","description":"Defines the maximum allowed increase in the delivery promise.","properties":{"amount":{"type":"integer","maximum":18,"description":"Maximum number of additional capacity units allowed."},"unit":{"type":"string","description":"Unit of the amount.","enum":["DAYS","WEEKS"]}}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates the capacity settings of a specific location for a given task type (`code`). The API allows configuration of capacity parameters (such as capacity type, unit, and actions) that control the operational capacity of the location. If a field is omitted, the current values will be preserved.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Logistics | Logistics access | **Logistics full access** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `locationId` | path | (Required) Unique identifier of the location. |
  | `code` | path | (Required) The type of task to update. Currently, the only supported value is `fulfill_orders`. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "id": 71,
    "capacityType": "FIXED",
    "capacityUnit": "ORDERS",
    "fullCapacityAction": "PAUSE",
    "taskId": 1,
    "locationTask": null,
    "capacityShifts": [
      {
        "id": 607,
        "capacityAmount": 11,
        "capacityRuleId": 71,
        "timeStart": "00:00:00",
        "timeEnd": "23:59:59",
        "weekDay": "MONDAY"
      },
      {
        "id": 608,
        "capacityAmount": 3,
        "capacityRuleId": 71,
        "timeStart": "00:00:00",
        "timeEnd": "23:59:59",
        "weekDay": "TUESDAY"
      }
    ],
    "additionalInfo": {
      "maxIncreasePromise": {
        "amount": 18,
        "unit": "DAYS"
      }
    }
  }
  ```
