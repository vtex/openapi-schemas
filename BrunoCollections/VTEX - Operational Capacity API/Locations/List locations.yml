info:
  name: List locations
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/fulfillment-locations/location"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "0"
      type: query
      disabled: true
    - name: pageSize
      value: "30"
      type: query
      disabled: true
    - name: status
      value: ACTIVE
      type: query
      disabled: true
    - name: search
      value: seller_2
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/fulfillment-locations/location - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/fulfillment-locations/location - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/fulfillment-locations/location - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/fulfillment-locations/location - Schema is valid", function () {
          const schema = {"type":"object","properties":{"hasNextPage":{"type":"boolean","description":"Indicates if there is another page of results."},"data":{"type":"array","description":"List of fulfillment locations.","items":{"type":"object","description":"Represents a fulfillment location with its details, including identifier, name, status, time zone, account information, associated tasks, and address.","properties":{"id":{"type":"string","description":"Unique identifier of the location."},"name":{"type":"string","description":"Name of the location."},"status":{"type":"string","enum":["ACTIVE","MANUALLY_PAUSED","PAUSED"],"description":"Current status of the location."},"timeZone":{"type":"string","description":"Time zone of the location."},"vtexAccountName":{"type":"string","description":"VTEX account name associated with the location."}}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves a paginated list of fulfillment locations that match the given search criteria and status filter. Pagination is controlled via `page` and `pageSize` parameters.

  ## Permissions

  Any user or [API key](https://developers.vtex.com/docs/guides/api-authentication-using-api-keys) must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | Logistics | Logistics access | **Logistics full access** |

  There are no applicable [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) for this resource list. You must [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) and add at least one of the resources above in order to use this endpoint. To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  >❗ To prevent integrations from having excessive permissions, consider the [best practices for managing API keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm) when assigning License Manager roles to integrations.

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `page` | query | Page number, starting from `0`. Defaults to `0` if not provided. |
  | `pageSize` | query | Number of results per page (maximum: `30`). Defaults to `30` if not provided. |
  | `status` | query | Filter by location status. Multiple statuses can be separated by commas. |
  | `search` | query | Search for locations by name. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |
  | `Content-Type` | header | (Required) Type of the content being sent. |

  ## Example response (`200`)

  ```json
  {
    "hasNextPage": false,
    "data": [
      {
        "id": "locationId_1",
        "name": "Location A",
        "status": "ACTIVE",
        "timeZone": "America/Bahia",
        "vtexAccountName": ""
      },
      {
        "id": "locationId_3",
        "name": "seller_2",
        "status": "ACTIVE",
        "timeZone": "America/Bahia",
        "vtexAccountName": ""
      }
    ]
  }
  ```
