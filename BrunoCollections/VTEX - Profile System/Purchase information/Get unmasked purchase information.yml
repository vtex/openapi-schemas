http:
  method: GET
  url: "{{baseUrl}}/api/storage/profile-system/profiles/:profileId/purchase-info/unmask?reason=data-validation"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reason
      value: data-validation
      type: query
    - name: profileId
      value: 70caf394-8534-447e-a0ca-1803c669c771
      type: path
  auth: inherit

