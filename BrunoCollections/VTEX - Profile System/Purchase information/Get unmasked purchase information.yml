ueDate":{"type":"string","description":"Due date."},"connectorResponses":{"type":"object","description":"Connector responses."}}}}}}},"giftCards":{"type":"array","description":"Gift card IDs.","items":{"type":"string","description":"Gift card ID."}},"giftCardMessages":{"type":"array","description":"Gift card messages.","items":{"type":"string","description":"Gift card message."}},"numberOfPaymentErrors":{"type":"number","description":"Amount of payment errors."},"numberOfDeniedTransactions":{"type":"number","description":"Amount of denied transactions."},"lastDeniedTransaction":{"type":["string","null"],"description":"Last denied transaction."}}},"clientPreferences":{"type":"object","description":"Client preferences.","properties":{}},"isToSavePersonalData":{"type":"boolean","description":"Defines if personal data will be saved (`true`) or not (`false`)."},"lastUserPurchases":{"type":"array","description":"Array with latest purchases from the client.","items":{"type":"object","description":"Purchase information.","properties":{"creationDate":{"type":"string","description":"Purchase date in the ISO 8601 format."},"orderId":{"type":"string","description":"Unique identifier of the order."},"orderGroup":{"type":"string","description":"Unique identifier of the order group."},"value":{"type":"number","description":"Purchase value."}}}},"lastPurchasesAddressId":{"type":"string","description":"Unique identifier of the client address."}}},"meta":{"title":"Purchase information metadata.","type":"object","description":"Purchase information metadata.","required":["version","author","creationDate","lastUpdateDate"],"properties":{"version":{"type":"string","description":"Unique identifier of the purchase information version."},"author":{"type":"string","description":"Unique identifier of the user who created the purchase information."},"creationDate":{"type":"string","description":"Date when the purchase information was created in ISO 8601 format."},"lastUpdateDate":{"type":"stri