  [
    {
      "id": "d9b946b8-9524-4b2d-96ec-b35d0625c0a7",
      "document": {
        "paymentData": {
          "availableAccounts": [
            {
              "accountId": "D09F5E3F01054C959CFC4CB357961ADE",
