info:
  name: Get unmasked address by version
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/storage/profile-system/profiles/:profileId/addresses/:addressId/versions/:addressVersionId/unmask?reason=data-validation"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reason
      value: data-validation
      type: query
    - name: alternativeKey
      value: email
      type: query
      disabled: true
    - name: profileId
      value: 70caf394-8534-447e-a0ca-1803c669c771
      type: path
    - name: addressId
      value: bf82180e-cf9e-4089-9af6-ae1518555992
      type: path
    - name: addressVersionId
      value: 86dfae79-1d23-43f2-a643-2fc8f1839461
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[GET]::/api/storage/profile-system/profiles/:profileId/addresses/:addressId/versions/:addressVersionId/unmask - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[GET]::/api/storage/profile-system/profiles/:profileId/addresses/:addressId/versions/:addressVersionId/unmask - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[GET]::/api/storage/profile-system/profiles/:profileId/addresses/:addressId/versions/:addressVersionId/unmask - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[GET]::/api/storage/profile-system/profiles/:profileId/addresses/:addressId/versions/:addressVersionId/unmask - Schema is valid", function () {
          const schema = {"title":"Unmasked address response","type":"object","description":"Unmasked address information.","properties":{"id":{"title":"id","type":"string","description":"ID of a client's address."},"document":{"title":"Address","type":"object","description":"Address information.","required":["postalCode","countryName","administrativeAreaLevel1","locality","localityAreaLevel1","route","streetNumber","profileId"],"properties":{"postalCode":{"type":"string","description":"Address postal code."},"countryName":{"type":"string","description":"Name of the address country."},"countryCode":{"type":"string","description":"Two letter country code."},"administrativeAreaLevel1":{"type":"string","description":"Name of administrative area, such as the state or province."},"locality":{"type":"string","description":"Name of address locality, such as the city."},"localityAreaLevel1":{"type":"string","description":"Name of the address locality area, such as the neighborhood or district."},"route":{"type":"string","description":"Address route or street name."},"streetNumber":{"type":"string","description":"Address street number."},"profileId":{"title":"id","type":"string","description":"ID of the client's profile."},"contactId":{"type":"string","description":"Contact unique identifier."}}},"meta":{"title":"Address metadata","type":"object","description":"Address metadata.","required":["version","author","creationDate","lastUpdateDate"],"properties":{"version":{"type":"string","description":"Unique identifier of the address version."},"author":{"type":"string","description":"Unique identifier of the user who created the address."},"creationDate":{"type":"string","description":"Date when the address was created in ISO 8601 format."},"lastUpdateDate":{"type":"string","description":"Date when the address was last updated in ISO 8601 format."}}}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
