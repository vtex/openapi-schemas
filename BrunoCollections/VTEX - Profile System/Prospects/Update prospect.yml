","description":"List of available addresses.","items":{"type":"string","description":"Available address ID."}},"expirationDate":{"type":"string","description":"Card expiration date, in `MM/YYYY` format."},"isExpired":{"type":"boolean","description":"Defines if the card is expired (`true`) or not (`false`)."},"accountStatus":{"type":["string","null"],"description":"Account status."}}}},"availableTokens":{"type":"array","description":"Available tokens.","items":{"type":"string","description":"Available token."}},"transactions":{"type":["array","null"],"description":"List of transactions.","items":{"type":"object","description":"Transaction information.","required":["isActive","transactionId","merchantName","payments"],"properties":{"isActive":{"type":"boolean","description":"Indicates whether the transaction is active (`true`) or not (`false`)."},"transactionId":{"type":"string","description":"Transaction ID."},"merchantName":{"type":"string","description":"Merchant name."},"payments":{"type":"array","description":"List of payments information.","items":{"title":"Payment","required":["id","paymentSystem","paymentSystemName","value","installments","referenceValue","cardHolder","cardNumber","firstDigits","lastDigits","cvv2","expireMonth","expireYear","url","giftCardId","giftCardName","giftCardCaption","redemptionCode","group","tid","dueDate","connectorResponses"],"type":"object","description":"Payment information.","properties":{"id":{"type":"string","description":"Payment ID."},"paymentSystem":{"type":"string","description":"Payment system."},"paymentSystemName":{"type":"string","description":"Payment system name."},"value":{"type":"integer","format":"int32","description":"Payment value in cents."},"installments":{"type":"integer","format":"int32","description":"Payment installments."},"referenceValue":{"type":"integer","format":"int32","description":"Reference value for interest calculation in cents."},"cardHolder":{"type":["string","null"],"description":"Card holder