info:
  name: Get unmasked prospects
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/storage/profile-system/prospects/unmask"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit

