opencollection: 1.0.0

info:
  name: VTEX - Shopee Integration API

request:
  auth:
    type: apikey
    key: X-VTEX-API-AppKey
    value: "{{apiKey}}"
    placement: header

docs:
  content: The VTEX Shopee Integration API provides endpoints for handling Shopee order webhooks, reprocessing order synchronization workflows, querying Shopee order data, and receiving VTEX marketplace order callbacks.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
