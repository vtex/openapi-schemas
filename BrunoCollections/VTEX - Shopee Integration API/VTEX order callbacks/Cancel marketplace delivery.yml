info:
  name: Cancel marketplace delivery
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/shopeeintegration/:accountName/pub/orders/:mktplaceOrderId/cancelDelivery"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: accountName
      value: store01
      type: path
    - name: mktplaceOrderId
      value: MKT-123456
      type: path
  auth:
    type: apikey
    key: VtexIdclientAutCookie
    value: "{{apiKey}}"
    placement: header

runtime:
  scripts:
    - type: tests
      code: |-
        const Ajv = require("ajv");
        const addFormats = require("ajv-formats");
        const ajv = new Ajv({ allErrors: true, strict: false });
        addFormats(ajv);

        test("[POST]::/api/shopeeintegration/:accountName/pub/orders/:mktplaceOrderId/cancelDelivery - Status code is 2xx", function () {
          expect(res.getStatus()).to.be.at.least(200);
          expect(res.getStatus()).to.be.below(300);
        });

        test("[POST]::/api/shopeeintegration/:accountName/pub/orders/:mktplaceOrderId/cancelDelivery - Content-Type is application/json", function () {
          expect(String(res.getHeader("content-type"))).to.include("application/json");
        });

        test("[POST]::/api/shopeeintegration/:accountName/pub/orders/:mktplaceOrderId/cancelDelivery - Response has JSON Body", function () {
          const data = res.getBody();
          expect(data).to.not.be.undefined;
          expect(data).to.not.be.null;
        });

        test("[POST]::/api/shopeeintegration/:accountName/pub/orders/:mktplaceOrderId/cancelDelivery - Schema is valid", function () {
          const schema = {"type":"object","description":"Generic success response payload.","properties":{"message":{"type":"string","description":"Result message."}}};
          const validate = ajv.compile(schema);
          const valid = validate(res.getBody());
          expect(valid, JSON.stringify(validate.errors)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cancels delivery for a marketplace order received through VTEX callback.

  ## Authentication

  This endpoint requires the store admin [user token](https://developers.vtex.com/docs/guides/api-authentication-using-user-tokens) in the `VtexIdclientAutCookie` header (session from Admin VTEX login). API keys (`X-VTEX-API-AppKey` / `X-VTEX-API-AppToken`) are not used for this operation.

  ## Permissions

  The authenticated store user must have at least one of the appropriate [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3) to be able to successfully run this request. Otherwise they will receive a status code `403` error. These are the applicable resources for this endpoint:

  | **Product** | **Category** | **Resource** |
  | --------------- | ----------------- | ----------------- |
  | OMS | OMS access | **View order** |
  | Checkout         | CheckoutResources | **Orders Full Access** |

  You can [create a custom role](https://help.vtex.com/en/tutorial/roles--7HKK5Uau2H6wxE1rH5oRbc#creating-a-role) with that resource or use one of the following [predefined roles](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy):

  | **Role** | **Resource** | 
  | --------------- | ----------------- | 
  | OMS - Full access | View order |
  | Checkout Admin | View order |
  | IntegrationProfile - Fulfillment Oms | View order |
  | OMS - Full access | Orders Full Access |
  | Checkout Admin | Orders Full Access |
  | IntegrationProfile - Fulfillment Oms | Orders Full Access |

  >❗ Assigning a [predefined role](https://help.vtex.com/en/tutorial/predefined-roles--jGDurZKJHvHJS13LnO7Dy) to users usually grants permission to multiple [License Manager resources](https://help.vtex.com/en/tutorial/license-manager-resources--3q6ztrC8YynQf6rdc6euk3). If some of these permissions are not necessary, consider creating a custom role instead. For more information regarding security, see [Best practices for using application keys](https://help.vtex.com/en/tutorial/best-practices-api-keys--7b6nD1VMHa49aI5brlOvJm). To learn more about machine authentication at VTEX, see [Authentication overview](https://developers.vtex.com/docs/guides/authentication).

  ## Parameters

  | Name | In | Description |
  | --- | --- | --- |
  | `accountName` | path | (Required) VTEX account name. |
  | `mktplaceOrderId` | path | (Required) Marketplace order identifier. |
  | `Accept` | header | (Required) HTTP Client Negotiation _Accept_ Header. Indicates the types of responses the client can understand. |

  ## Example response (`200`)

  ```json
  {
    "message": "Delivery cancellation completed successfully."
  }
  ```
